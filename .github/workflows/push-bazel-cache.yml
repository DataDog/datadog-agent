---
name: "Push Bazel Cache"
on:
  push:
    branches: [main]
    paths: ["**/*MODULE.bazel*"]
  workflow_dispatch:
permissions: {}
jobs:
  push_bazel_cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bazel-cache
      - name: Fetch Bazel module dependencies
        run: bazel mod deps
