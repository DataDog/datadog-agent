name: "CWS Go runtime offsets sync"

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch to target'
        required: false
        default: 'main'
        type: string
  schedule:
    - cron: '30 4 * * 2' # at 4:30 UTC on Tuesday

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # This is required for getting the required OIDC token from GitHub
    steps:
      - name: Checkout datadog-agent repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_branch || 'main' }}
          persist-credentials: false

      - name: Install dda
        uses: ./.github/actions/install-dda
        with:
          features: legacy-tasks

      - name: Install go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'

      - name: Generate Go runtime offsets
        run: dda inv -- -e system-probe.generate-gooffsets

      - uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          policy: self.cws-gooffsets-sync.create-pr

      # Opens no PR when the generated table is unchanged.
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        name: Create pull request
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          base: ${{ inputs.base_branch || 'main' }}
          add-paths: pkg/security/resolvers/process/gooffsets/goruntime_offsets.go
          commit-message: "CWS: sync Go runtime offsets"
          branch: cws/gooffsets-sync
          branch-suffix: timestamp
          sign-commits: true
          title: "CWS: sync Go runtime offsets"
          body: |
              ### What does this PR do?
              This PR regenerates the Go runtime offsets lookup table used by CWS to read Go pprof labels
              (`dda inv system-probe.generate-gooffsets`), picking up Go releases published since the last sync.
              _This PR was autogenerated_
          milestone: 22 # triage
          labels: changelog/no-changelog, qa/no-code-change, team/agent-security
