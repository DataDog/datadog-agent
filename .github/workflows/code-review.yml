---
name: "Code review"

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches:
      - main
      - "[0-9]+.[0-9]+.x"
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false || !contains(github.event.pull_request.labels.*.name, 'no-draft-review') }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: DataDog/code-review-action/.github/workflows/code-review.yml@56d6862711348b11ec2603edfb29c52c09f4b84c # v1.1.0
    with:
      provider: codex
      # Review PRs when they are opened or transition out of draft. Use on_demand for issue_comments
      trigger_mode: ${{ github.event_name == 'pull_request' && 'always' || 'on_demand' }}
      # Root-level files apply to every PR.
      # Sub-directory files apply only when the PR touches files under that prefix.
      prompt_file_pattern: "**/codereview_guideline.md"
      review_event: COMMENT_ONLY
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
