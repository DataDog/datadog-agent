---
name: "Tidy Dependencies"
on:
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}

jobs:
  tidy:
    if: >-
      github.repository == 'DataDog/datadog-agent' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      (contains(github.event.pull_request.labels.*.name, 'dependencies-go') ||
       contains(github.event.pull_request.labels.*.name, 'dependencies-cargo') ||
       contains(github.event.pull_request.labels.*.name, 'dependencies-bazel-native') ||
       contains(github.event.pull_request.labels.*.name, 'dependencies-bazel'))
    # One checkout and one writer for all generators prevents tidy jobs from feeding each other.
    concurrency:
      group: deps-tidy-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write # Required for dd-octo-sts OIDC token
      pull-requests: write # Required to auto-close PRs that bump the root go directive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Test dependency publication guards
        run: python3 -m unittest discover -s .github/actions/deps-tidy-push -p '*_tests.py' -v
      - uses: ./.github/actions/deps-tidy-setup
        id: setup
      - name: Install dda
        if: contains(github.event.pull_request.labels.*.name, 'dependencies-go') || contains(github.event.pull_request.labels.*.name, 'dependencies-bazel-native')
        uses: ./.github/actions/install-dda
        with:
          features: legacy-tasks
      - name: Go mod tidy
        if: contains(github.event.pull_request.labels.*.name, 'dependencies-go')
        run: dda inv -- -e tidy
      - name: Close PR if root go directive was bumped
        if: contains(github.event.pull_request.labels.*.name, 'dependencies-go')
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          base_directive="$(git show "origin/$BASE_REF:go.mod" | grep -E '^go [0-9]' | head -1)"
          current_directive="$(grep -E '^go [0-9]' go.mod | head -1)"
          if [ "$base_directive" != "$current_directive" ]; then
            echo "::warning::Root go.mod 'go' directive changed from '$base_directive' to '$current_directive'. Auto-closing this PR — a dependency requires a newer Go version than the repo."
            gh pr comment "$PR_NUMBER" --body "Auto-closing: this update bumps the root \`go.mod\` \`go\` directive from \`$base_directive\` to \`$current_directive\`. Hold this dependency update until we bump the repository's Go version."
            gh pr close "$PR_NUMBER"
            exit 1
          fi
      - name: Update LICENSE-3rdparty.csv
        if: contains(github.event.pull_request.labels.*.name, 'dependencies-go') && !contains(github.event.pull_request.labels.*.name, 'dependencies-go-tools')
        run: dda inv -- -e generate-licenses
      - name: Update mocks
        if: contains(github.event.pull_request.labels.*.name, 'dependencies-go') && !contains(github.event.pull_request.labels.*.name, 'dependencies-go-tools')
        run: dda inv -- -e security-agent.gen-mocks
      - name: Install Rust toolchain
        if: contains(github.event.pull_request.labels.*.name, 'dependencies-cargo')
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Repin Bazel Rust lockfile
        if: contains(github.event.pull_request.labels.*.name, 'dependencies-cargo')
        run: |
          bazel mod tidy
          bazel mod deps
      - name: Generate Rust licenses
        if: contains(github.event.pull_request.labels.*.name, 'dependencies-cargo')
        run: |
          cargo install dd-rust-license-tool@1.0.6 --locked
          cd rust && dd-rust-license-tool --manifest-path ../Cargo.toml write
      - name: Refresh http_archive sha256 for changed deps
        if: contains(github.event.pull_request.labels.*.name, 'dependencies-bazel-native')
        env:
          BRANCH: ${{ github.event.pull_request.base.ref }}
        run: dda inv -- renovate.refresh-archive-hashes --base-ref=origin/${BRANCH}
      - name: Repin Bazel module lockfile
        if: contains(github.event.pull_request.labels.*.name, 'dependencies-bazel')
        run: |
          bazel mod tidy
          bazel mod deps
      - uses: ./.github/actions/deps-tidy-push
        with:
          token: ${{ steps.setup.outputs.token }}
          commit-message: "[renovate skip] Tidy generated dependency files"
