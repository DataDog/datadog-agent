name: Restricted Shell Analysis Review

on:
  pull_request_target:
    branches: [main, "[0-9]+.[0-9]+.x"]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: Restricted Shell Analysis Review
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Run trusted base-branch code; only inspect the PR's diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch origin "refs/pull/${PR_NUMBER}/head"
      - name: Require human approval for analysis changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            pkg/rshell/analysis/ .github/workflows/rshell-analysis.yml; then
            exit 0
          fi
          if ! jq -e 'index("verified/analysis") // index("verified/allowed_symbols")' <<< "$PR_LABELS" >/dev/null; then
            echo "::error::A human must review the rshell analysis changes and add the verified/analysis label."
            exit 1
          fi
