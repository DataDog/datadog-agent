name: Restricted Shell Analysis Review

on:
  pull_request_target:
    branches: [main, "[0-9]+.[0-9]+.x"]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: Restricted Shell Analysis Review
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No checkout: the PR's changed files come from the API, so no PR code or file is ever on disk.
      - name: Require human approval for analysis changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -o pipefail
          # The files API lists at most 3000 files: for bigger PRs, assume the analysis changed.
          if [ "$CHANGED_FILES" -le 3000 ]; then
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' > changed-files.txt
            if ! grep -qE '^(pkg/rshell/analysis/|\.github/workflows/rshell-analysis\.yml$)' changed-files.txt; then
              exit 0
            fi
          fi
          if ! jq -e 'index("verified/analysis") // index("verified/allowed_symbols")' <<< "$PR_LABELS" >/dev/null; then
            echo "::error::A human must review the rshell analysis changes and add the verified/analysis label."
            exit 1
          fi
