name: "Serverless Perf"

on:
  pull_request:
    paths:
      - 'cmd/serverless-init/**'
      - 'pkg/config/schema/**'
      - 'pkg/config/setup/**'
      - 'test/integration/serverless_perf/**'
      - '.github/workflows/serverless-perf.yml'

concurrency:
  group: ${{ github.workflow }}/PR#${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  current:
    name: Current
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: stable

      - name: Install dda
        uses: ./.github/actions/install-dda
        with:
          features: legacy-tasks

      - name: Prepare working tree
        id: prepare
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          dda inv -- -e schema.codegen

      - name: Build serverless-init
        run: go build -tags "serverless otlp zlib zstd" -o /tmp/serverless-init ./cmd/serverless-init

      - name: Measure config load
        env:
          TEMP_RUNNER: ${{runner.temp}}
        run: ./test/integration/serverless_perf/compute.sh /tmp/serverless-init > "$TEMP_RUNNER"/perf.log

      - name: Upload result artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: current.log
          path: ${{runner.temp}}/perf.log
          if-no-files-found: error

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [current]
    permissions:
      pull-requests: write
    steps:
      - name: Install Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: stable
          cache: false

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Download current artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: current.log
          path: current

      # Single-sided: benchstat on one file reports the median with a confidence
      # interval, which is what we want while there is nothing to compare
      # against. A base-branch job can only work once the debug line that
      # produces these samples exists on the base branch.
      - name: Analyze results
        id: analyze
        run: |
          benchstat current/perf.log | tee analyze.txt
          echo "analyze<<EOF" >> $GITHUB_OUTPUT
          cat analyze.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: serverless-perf
          recreate: true
          message: |
            ## Serverless Init Config Load

            Time serverless-init spends initializing its configuration, measured at
            ${{ needs.current.outputs.sha }}.

            The `±` is the confidence interval over the samples, not a comparison —
            there is no base-branch run yet. For context, config load is roughly 40%
            of serverless-init's total startup, and each declared config setting
            costs about 6µs, so a setting declared in `pkg/config/schema/yaml`
            without the `full-agent-only:true` tag lands here.

            This is an insight tool, not a test.

            ```
            ${{ steps.analyze.outputs.analyze }}
            ```
