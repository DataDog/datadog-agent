name: "Serverless Perf"

on:
  pull_request:
    paths:
      - 'cmd/serverless-init/**'
      - 'pkg/config/schema/**'
      - 'pkg/config/setup/**'
      - 'test/integration/serverless_perf/**'
      - '.github/workflows/serverless-perf.yml'

concurrency:
  group: ${{ github.workflow }}/PR#${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  baseline:
    name: Baseline
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - name: Checkout ${{ github.base_ref }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: stable

      - name: Install dda
        uses: ./.github/actions/install-dda
        with:
          features: legacy-tasks

      - name: Prepare working tree
        id: prepare
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          # all_settings.go is generated and gitignored, so codegen must run
          # before the build.
          dda inv -- -e schema.codegen

      - name: Build serverless-init
        run: go build -tags "serverless otlp zlib zstd" -o /tmp/serverless-init ./cmd/serverless-init

      - name: Measure config load
        env:
          TEMP_RUNNER: ${{runner.temp}}
        run: ./test/integration/serverless_perf/compute.sh /tmp/serverless-init > "$TEMP_RUNNER"/perf.log

      - name: Upload result artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: baseline.log
          path: ${{runner.temp}}/perf.log
          if-no-files-found: error

  current:
    name: Current
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: stable

      - name: Install dda
        uses: ./.github/actions/install-dda
        with:
          features: legacy-tasks

      - name: Prepare working tree
        id: prepare
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          dda inv -- -e schema.codegen

      - name: Build serverless-init
        run: go build -tags "serverless otlp zlib zstd" -o /tmp/serverless-init ./cmd/serverless-init

      - name: Measure config load
        env:
          TEMP_RUNNER: ${{runner.temp}}
        run: ./test/integration/serverless_perf/compute.sh /tmp/serverless-init > "$TEMP_RUNNER"/perf.log

      - name: Upload result artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: current.log
          path: ${{runner.temp}}/perf.log
          if-no-files-found: error

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [baseline, current]
    permissions:
      pull-requests: write
    steps:
      - name: Install Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: stable
          cache: false

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Download baseline artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: baseline.log
          path: baseline
      - name: Download current artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: current.log
          path: current

      - name: Analyze results
        id: analyze
        run: |
          benchstat baseline/perf.log current/perf.log | tee analyze.txt
          echo "analyze<<EOF" >> $GITHUB_OUTPUT
          cat analyze.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: serverless-perf
          recreate: true
          message: |
            ## Serverless Init Config Load

            Time serverless-init spends initializing its configuration, comparing
            ${{ needs.baseline.outputs.sha }} against ${{ needs.current.outputs.sha }}.

            A `~` under `vs base` means no statistically significant change. Anything
            else is worth a look: the usual cause is new config settings reaching
            serverless-init, which happens when a setting is declared in
            `pkg/config/schema/yaml` without the `full-agent-only:true` tag.

            This is an insight tool, not a test. Baseline and current run on
            different runners, so treat a small change as noise until it reproduces.

            ```
            ${{ steps.analyze.outputs.analyze }}
            ```
