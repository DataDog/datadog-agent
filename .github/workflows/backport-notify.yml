name: Backport notify

# When a PR is merged, DM the author on Slack with buttons (or plain instructions)
# to create backports to the active release branches.
# Clicking a button calls the backport-label workflow through the endpoint configured
# in the BACKPORT_LABEL_ENDPOINT repo variable, which adds the backport/<branch> label
# to the merged PR and lets the 'Backport PR' workflow create the backport.

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  notify:
    name: Notify PR owner about backport options
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # This is required to read the PR owner's commits
    steps:
      - name: Get active backport branches
        id: branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          # Active backport branches are the 'backport/<branch>' labels whose description
          # says they automatically create a backport PR (see doc/guidelines/contributing.md).
          labels=$(mktemp)
          page=1
          while :; do
            curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/labels?per_page=100&page=${page}" > "${labels}.${page}"
            count=$(jq 'length' < "${labels}.${page}")
            [[ "$count" -lt 100 ]] && break
            page=$((page + 1))
          done
          jq -s 'add' "${labels}".* > "$labels"

          # Keep only active backport branches that are not already on the PR
          branches=$(jq -cn --slurpfile labels "$labels" --argjson pr_labels "$PR_LABELS_JSON" '
            [$labels[][] | select(
              (.name | test("^backport/([0-9]+\\.[0-9]+\\.x|main)$"))
              and ((.description // "") | test("automatically create"; "i"))
            ) | .name | sub("^backport/"; "")] - ($pr_labels | map(sub("^backport/"; "")))')

          echo "branches=$branches" >> "$GITHUB_OUTPUT"

      - name: Send Slack message to PR owner
        if: steps.branches.outputs.branches != '[]'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_DATADOG_AGENT_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENDPOINT: ${{ vars.BACKPORT_LABEL_ENDPOINT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BRANCHES: ${{ steps.branches.outputs.branches }}
        run: |
          # Resolve the PR owner's email from the original PR's commits (the last commit's
          # author is the PR owner; the author is preserved even on suggested-change commits).
          owner_email=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            | jq -r '.[-1] | .commit.author.email // empty')
          if [[ -z "$owner_email" ]]; then
            echo "Could not resolve the PR owner's email, skipping notification"
            exit 0
          fi

          # Look up the Slack user by email (same approach as tasks/pipeline.py changelog)
          user_id=$(curl -sf -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            "https://slack.com/api/users.lookupByEmail?email=$(jq -rn --arg v "$owner_email" '$v|@uri')" \
            | jq -r 'if .ok then .user.id else empty end')
          if [[ -z "$user_id" ]]; then
            echo "No Slack user found for $owner_email, skipping notification"
            exit 0
          fi

          header=":white_check_mark: <${PR_URL}|#${PR_NUMBER} (${PR_TITLE})> was merged. Need a backport?"
          if [[ -n "$ENDPOINT" ]]; then
            # One link button per branch; clicking it asks the endpoint to add the
            # backport/<branch> label to the PR through the Backport label workflow.
            buttons=$(jq -cn --argjson branches "$BRANCHES" --arg endpoint "$ENDPOINT" --arg pr "$PR_NUMBER" \
              '$branches | map({type: "button", style: "primary", text: {type: "plain_text", text: .}, url: ($endpoint + "?pr=" + $pr + "&branch=" + .)})')
            body=$(jq -cn --arg header "$header" --argjson buttons "$buttons" \
              '{type: "actions", elements: $buttons}')
          else
            # No endpoint configured yet: fall back to plain instructions
            list=$(jq -rn --argjson branches "$BRANCHES" '$branches | map("`backport/" + . + "`") | join(", ")')
            header="${header}
            Add one of these labels to the PR to backport it: ${list}"
            body=''
          fi

          if [[ -n "$body" ]]; then
            payload=$(jq -cn --arg channel "$user_id" --arg text "$header" --argjson blocks "[$body]" \
              '{channel: $channel, text: $text, blocks: [$blocks[]]}')
          else
            payload=$(jq -cn --arg channel "$user_id" --arg text "$header" '{channel: $channel, text: $text}')
          fi

          curl -sf -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-Type: application/json' \
            -X POST https://slack.com/api/chat.postMessage -d "$payload" \
            | jq -e '.ok' > /dev/null
