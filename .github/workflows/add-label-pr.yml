---
name: "Add labels to PR"

on:
  # Run the workflow from the PR's target branch, so that it labels PRs from forks and PRs
  # with merge conflicts, and so that no code from the PR runs with the token.
  # Never check out or run code from the PR in this workflow.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  add-labels:
    if: github.triggering_actor != 'dd-devflow[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Get GitHub token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/datadog-agent
          policy: self.add-labels-pr.label-pr
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            .gitlab-ci.yml
            .github/CODEOWNERS
            .github/actions
            .github/labeler.yml
            .ddqa/config.toml
            tasks
          persist-credentials: false
      - name: Add the internal or community label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        with:
          github-token: ${{ steps.octo-sts.outputs.token }}
          script: |
            // A deleted head repository can only be a fork
            const label = process.env.HEAD_REPO === `${context.repo.owner}/${context.repo.repo}` ? 'internal' : 'community';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              labels: [label]
            });
      - name: Add component labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ steps.octo-sts.outputs.token }}
          sync-labels: true
      - name: Install dda
        uses: ./.github/actions/install-dda
        with:
          features: legacy-tasks
      - name: Assign team label
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: dda inv -- -e github.assign-team-label --pr-id="${PR_NUMBER}"
