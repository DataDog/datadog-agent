name: Backport PR
on:
  pull_request:
    types:
      - closed
      - labeled

jobs:
  get-backport-targets:
    name: Get backport targets
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged
    outputs:
      targets: ${{ steps.get-targets.outputs.targets }}
    steps:
      - name: Get backport targets
        id: get-targets
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL_NAME: ${{ github.event.label.name }}
          PR_LABEL_NAMES_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          # For 'labeled' event, use just the added label
          # For 'closed' event, use all backport labels
          if [[ "$EVENT_ACTION" == "labeled" ]]; then
            if [[ "$EVENT_LABEL_NAME" =~ ^backport/([0-9]+\.[0-9]+\.x|main)$ ]]; then
              targets=$(jq -cn --arg label "$EVENT_LABEL_NAME" '[$label]')
              echo "targets=$targets" >> "$GITHUB_OUTPUT"
            else
              echo "targets=[]" >> "$GITHUB_OUTPUT"
            fi
          else
            # Extract all well-formed backport/* labels as JSON array
            targets=$(jq -c '[.[] | select(test("^backport/([0-9]+\\.[0-9]+\\.x|main)$"))]' <<< "$PR_LABEL_NAMES_JSON")
            echo "targets=$targets" >> "$GITHUB_OUTPUT"
          fi

  backport:
    name: Backport PR to ${{ matrix.target }}
    needs: get-backport-targets
    if: needs.get-backport-targets.outputs.targets != '[]' && needs.get-backport-targets.outputs.targets != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.get-backport-targets.outputs.targets) }}
    permissions:
      id-token: write # This is required for getting the required OIDC token from GitHub
      contents: write # This is required for pushing the backport branch
      pull-requests: write # This is required for creating the backport PR
    steps:
      - name: Compute target branch
        id: target
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          target="$MATRIX_TARGET"
          target_branch="${target/backport\//}"
          echo "target_branch=$target_branch" >> "$GITHUB_OUTPUT"

      - uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          policy: self.backport-pr.create-pr
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed to get the full history of the PR

      - name: Install dda
        uses: ./.github/actions/install-dda
        with:
          features: github

      - name: Run cherry-pick script
        id: cherry-pick
        continue-on-error: true
        env:
            GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
            GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: dda gh cherry-pick-pr --target-branch "${{ steps.target.outputs.target_branch }}"

      - name: Comment on backport failure
        if: steps.cherry-pick.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ steps.octo-sts.outputs.token }}
          script: |
            const targetBranch = process.env.TARGET_BRANCH;
            const mergeCommitSHA = process.env.MERGE_COMMIT_SHA;
            const runUrl = process.env.RUN_URL;
            const commentBody = `⚠️ Automatic backport to \`${targetBranch}\` failed.

            This usually happens when the cherry-pick has merge conflicts and needs manual resolution.

            To backport manually, run:
            \`\`\`bash
            git fetch
            git worktree add .worktrees/backport-${targetBranch} ${targetBranch}
            cd .worktrees/backport-${targetBranch}
            git switch --create backport-${context.payload.pull_request.number}-to-${targetBranch}
            git cherry-pick -x --mainline 1 ${mergeCommitSHA}
            git push --set-upstream origin backport-${context.payload.pull_request.number}-to-${targetBranch}
            \`\`\`

            Workflow logs: ${runUrl}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody,
            });

      - name: Fail workflow when cherry-pick failed
        if: steps.cherry-pick.outcome == 'failure'
        run: exit 1

      - name: Reset cherry-pick
        if: steps.cherry-pick.outputs.base != ''
        run: git reset HEAD~1

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.cherry-pick.outputs.base != ''
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          base: ${{ steps.cherry-pick.outputs.base }}
          branch: backport-${{steps.cherry-pick.outputs.original_pr_number}}-to-${{steps.cherry-pick.outputs.base}}
          sign-commits: true
          title: "[Backport ${{steps.cherry-pick.outputs.base}}]  ${{steps.cherry-pick.outputs.original_title}}"
          body: |
            Backport ${{steps.cherry-pick.outputs.merge_commit_sha}} from #${{steps.cherry-pick.outputs.original_pr_number}}.

             ___

            ${{ steps.cherry-pick.outputs.original_body }}

          labels: ${{ steps.cherry-pick.outputs.original_labels }},backport,bot
          commit-message: |
            ${{ steps.cherry-pick.outputs.message }}

            ___

            Co-authored-by: ${{ steps.cherry-pick.outputs.author }}

  notify-backport-slack:
    name: Notify PR owner on Slack
    needs: [get-backport-targets, backport]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # This is required to look up which backport PRs were actually created
    steps:
      - name: Get created backport PRs
        id: backports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_BRANCHES: ${{ needs.get-backport-targets.outputs.targets }}
        run: |
          # List the backport PRs that were actually created (a failed cherry-pick leg creates none),
          # so we only notify about real backports. Each entry is 'branch|url', space-separated.
          created=""
          for target in $(jq -r '.[]' <<< "$TARGET_BRANCHES"); do
            branch="${target/backport\//}" # strip the 'backport/' prefix
            head="backport-${PR_NUMBER}-to-${branch}"
            # Use the pulls endpoint filtered by head branch, not the search API: GitHub's search
            # index updates asynchronously, so a just-created PR can be missing from search results.
            url=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY%%/*}:${head}&state=all&per_page=1" \
              | jq -r '.[0] | .html_url // empty')
            if [[ -n "$url" ]]; then
              created+="${branch}|${url} "
            fi
          done

          echo "created=${created% }" >> "$GITHUB_OUTPUT"

          # Resolve the PR owner's email from the original PR's commits.
          # We deliberately don't use the cherry-picked merge commit's author: for PRs merged
          # with a merge commit, that identifies the merger instead of the PR owner.
          # The last commit's author is the PR owner (the commit author is preserved even when
          # a commit is the result of a reviewer's suggested change).
          owner_email=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            | jq -r '.[-1] | .commit.author.email // empty')
          echo "owner_email=${owner_email}" >> "$GITHUB_OUTPUT"

      - name: Send Slack DM to PR owner
        if: steps.backports.outputs.created != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_DATADOG_AGENT_BOT_TOKEN }}
          AUTHOR_EMAIL: ${{ steps.backports.outputs.owner_email }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CREATED_BACKPORTS: ${{ steps.backports.outputs.created }}
        run: |
          if [[ -n "$AUTHOR_EMAIL" ]]; then
            # Look up the Slack user by email (same approach as tasks/pipeline.py changelog)
            user_id=$(curl -sf -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              "https://slack.com/api/users.lookupByEmail?email=$(jq -rn --arg v "$AUTHOR_EMAIL" '$v|@uri')" \
              | jq -r 'if .ok then .user.id else empty end')
          else
            user_id=""
          fi

          # Build the list of created backports as Slack links, e.g. '<url|7.64.x>'
          links=$(tr ' ' '\n' <<< "$CREATED_BACKPORTS" | jq -Rr 'split("|") as [$branch, $url] | "<\($url)|\($branch)>"' | jq -sRr 'split("\n") | map(select(length > 0)) | join(", ")')
          message=":rewind: A backport of <${PR_URL}|#${PR_NUMBER} (${PR_TITLE})> to ${links} was just created. Keep an eye on it in case it needs attention."

          if [[ -n "$user_id" ]]; then
            # DM the PR owner
            channel="$user_id"
          else
            # PR owner has no resolvable email or no Slack account (e.g. external contributor); notify agent-devx-ops instead
            echo "No Slack user found for $AUTHOR_EMAIL, notifying #agent-devx-ops instead"
            message="${message}\n:warning: Could not DM the PR owner (no Slack user for ${AUTHOR_EMAIL}). Please reach out to them if needed."
            channel="#agent-devx-ops"
          fi

          curl -sf -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-Type: application/json' \
            -X POST https://slack.com/api/chat.postMessage \
            -d "$(jq -n --arg channel "$channel" --arg text "$message" '{channel: $channel, text: $text}')" \
            | jq -e '.ok' > /dev/null
