name: Check values kept in sync

on:
  pull_request:

permissions: {}

jobs:
  blockwatch:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install blockwatch
      run: pip install blockwatch-cli==0.16.1
    - name: Run blockwatch
      run: blockwatch
