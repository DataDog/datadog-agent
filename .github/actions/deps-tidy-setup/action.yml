---
name: Deps Tidy Setup
description: Acquire push token and warm Bazel cache for dependency tidying
outputs:
  token:
    description: octo-sts token for use by deps-tidy-push
    value: ${{ steps.octo-sts.outputs.token }}
runs:
  using: composite
  steps:
    - uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
      id: octo-sts
      with:
        scope: DataDog/datadog-agent
        policy: self.deps-tidy.push-branch
    - uses: ./.github/actions/bazel-cache
