---
name: Bazel Cache
description: Pull or push Bazel-related cache(s)
runs:
  using: composite
  steps:
    - name: Disable ADMS on GitHub-hosted runners
      if: runner.environment == 'github-hosted'
      shell: bash
      # GitHub-hosted runners cannot access the Datadog intranet.
      run: printf '\ncommon --downloader_config=\n' >> user.bazelrc
    - shell: bash
      run: echo "XDG_CACHE_HOME=$GITHUB_WORKSPACE/.cache" >>"$GITHUB_ENV"
    - name: Pull or push Bazel installation cache(s)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: bazelversion-${{ hashFiles('.bazelversion') }}
        path: |
          .cache/bazelisk
          .cache/bazel/*/install
    - name: Pull or push Bazel-managed repository cache(s)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: bazel-${{ hashFiles('MODULE.bazel.lock') }}
        path: |
          .cache/bazel/*/cache
          .cache/go/mod/cache
          .cache/golangci-lint
          .cache/pip
