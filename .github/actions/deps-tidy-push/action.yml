---
name: Deps Tidy Push
description: Publish at most one generated dependency update per input revision
inputs:
  token:
    description: octo-sts token from deps-tidy-setup
    required: true
  commit-message:
    description: "Commit message; include the appropriate skip token ([renovate skip])"
    required: true
runs:
  using: composite
  steps:
    - name: Validate changes and prepare signed publication
      id: commit
      shell: bash
      env:
        SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REF: ${{ github.head_ref }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        REPOSITORY: ${{ github.repository }}
        PUBLICATION_FILE: ${{ runner.temp }}/deps-tidy-publication.json
      run: python3 "$GITHUB_ACTION_PATH/prepare.py"
    - name: Push signed commits
      if: steps.commit.outputs.has_changes == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PUBLICATION_FILE: ${{ runner.temp }}/deps-tidy-publication.json
      # GitHub signs the commit. expectedHeadOid rejects concurrent branch updates
      # atomically, rather than applying generated files to a newer revision.
      run: gh api graphql --input "$PUBLICATION_FILE" --jq '.data.createCommitOnBranch.commit.oid'
    - name: Verify published tree
      if: steps.commit.outputs.has_changes == 'true'
      shell: bash
      env:
        EXPECTED_TREE: ${{ steps.commit.outputs.expected_tree }}
        HEAD_REF: ${{ github.head_ref }}
      run: |
        git fetch origin "refs/heads/$HEAD_REF"
        if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" != "$EXPECTED_TREE" ]; then
          echo "::error::Published dependency update differs from the generated tree (or the branch advanced)."
          exit 1
        fi
