# Atlas production validation reads source to prepare reviewed GPU test runs.
# Bind both subject and email to the single us1.ddbuild.io service account;
# the anchored, escaped email pattern rejects other workers and datacenters.
issuer: https://ticino.identity.local-cluster.local-dc.fabric.dog:8443/v1/issuer/sycamore

subject: rapid-cloud-platform-new-workloads.gpu-monitoring-validation-worker@kubernetes.us1.ddbuild.io

claim_pattern:
  email: '^rapid-cloud-platform-new-workloads\.gpu-monitoring-validation-worker@kubernetes\.us1\.ddbuild\.io$'

permissions:
  contents: read
