---
issuer: https://token.actions.githubusercontent.com

subject: repo:DataDog/datadog-agent:pull_request

# Only the add-label-pr workflow as merged on main can get this token: it runs on
# pull_request_target, so a pull request cannot change the code that uses it.
claim_pattern:
  event_name: pull_request_target
  ref: refs/heads/main
  job_workflow_ref: DataDog/datadog-agent/\.github/workflows/add-label-pr\.yml@refs/heads/main

permissions:
  contents: read
  issues: write
  pull_requests: read
