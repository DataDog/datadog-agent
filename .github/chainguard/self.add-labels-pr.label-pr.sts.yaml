---
issuer: https://token.actions.githubusercontent.com

subject: repo:DataDog/datadog-agent:pull_request

# Keep pull_request_target only: on pull_request, a PR could edit the workflow and get the token.
claim_pattern:
  event_name: pull_request_target
  ref: refs/heads/main
  job_workflow_ref: DataDog/datadog-agent/\.github/workflows/add-label-pr\.yml@refs/heads/main

permissions:
  contents: read
  issues: write
  # Setting labels on a pull request requires pull_requests: write, issues: write is not enough.
  pull_requests: write
