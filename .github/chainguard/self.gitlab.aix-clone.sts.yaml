issuer: https://gitlab.ddbuild.io

subject_pattern: "project_path:ddoghq/datadog-agent:.*"

# AIX CI jobs (.gitlab/aix/common/aix_git_setup.sh) clone the private
# ddoghq/datadog-agent embargo mirror on the remote AIX host. dd-octo-sts reads
# this policy from the mirror's default branch, which mirrors this repository.
claim_pattern:
  project_path: "ddoghq/datadog-agent"
  project_id: "14012"
  ref: ".+"
permissions:
  contents: read
