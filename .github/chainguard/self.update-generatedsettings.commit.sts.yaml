issuer: https://token.actions.githubusercontent.com

subject: repo:DataDog/datadog-agent:environment:main

claim_pattern:
  event_name: workflow_dispatch
  ref: (refs/heads/main|refs/heads/test_release/.*)
  job_workflow_ref: DataDog/datadog-agent/\.github/workflows/update-generatedsettings\.yml@refs/heads/(main|test_release/.*)

permissions:
  # Commit the regenerated snapshot to the release PR branch
  contents: write
