# DaemonSet in the DaemonSet+Gateway setup (Helm/Operator default): metrics go to the
# Gateway over otlphttp. cumulativetodelta is injected into the metrics pipeline only.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
exporters:
  otlphttp:
    endpoint: http://datadog-otel-agent-gateway:4318
    tls:
      insecure: true
processors:
  infraattributes:
    cardinality: 2
connectors:
  datadog/connector:
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [infraattributes]
      exporters: [otlphttp, datadog/connector]
    metrics:
      receivers: [otlp, datadog/connector]
      processors: [infraattributes]
      exporters: [otlphttp]
    logs:
      receivers: [otlp]
      processors: [infraattributes]
      exporters: [otlphttp]
