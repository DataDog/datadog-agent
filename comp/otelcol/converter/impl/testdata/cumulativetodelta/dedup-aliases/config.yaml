# Each pipeline but metrics/none already has the processor, under its current
# name, its deprecated alias, a named instance of either, or the instance this
# converter (or an older one, under the alias) injected: they are left alone.
# Only metrics/none gets the injected processor.
processors:
  cumulative_to_delta/custom:
  cumulativetodelta/custom:
  cumulativetodelta/dd-autoconfigured:
  cumulative_to_delta/dd-autoconfigured:

service:
  pipelines:
    metrics/new-named:
      receivers: [otlp]
      processors: [cumulative_to_delta/custom]
      exporters: [datadog]
    metrics/old-named:
      receivers: [otlp]
      processors: [cumulativetodelta/custom]
      exporters: [datadog]
    metrics/old-autoconfigured:
      receivers: [otlp]
      processors: [cumulativetodelta/dd-autoconfigured]
      exporters: [datadog]
    metrics/new-autoconfigured:
      receivers: [otlp]
      processors: [cumulative_to_delta/dd-autoconfigured]
      exporters: [datadog]
    metrics/none:
      receivers: [otlp]
      exporters: [datadog]
