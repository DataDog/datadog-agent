# Every Gateway exporter type (incl. deprecated aliases and named instances) gets
# cumulative_to_delta; debug-only and user-c2d pipelines (processor declared under
# its deprecated or current name) are left alone.
processors:
  cumulativetodelta/custom:
  cumulative_to_delta/custom:
service:
  pipelines:
    metrics/otlp:
      receivers: [otlp]
      exporters: [otlp]
    metrics/otlp_grpc:
      receivers: [otlp]
      exporters: [otlp_grpc/gw]
    metrics/otlp_http:
      receivers: [otlp]
      exporters: [otlp_http]
    metrics/loadbalancing:
      receivers: [otlp]
      exporters: [loadbalancing]
    metrics/load_balancing:
      receivers: [otlp]
      exporters: [load_balancing]
    metrics/debug:
      receivers: [otlp]
      exporters: [debug]
    metrics/user-c2d:
      receivers: [otlp]
      processors: [cumulativetodelta/custom]
      exporters: [otlphttp]
    metrics/user-c2d-new:
      receivers: [otlp]
      processors: [cumulative_to_delta/custom]
      exporters: [otlp_http]
