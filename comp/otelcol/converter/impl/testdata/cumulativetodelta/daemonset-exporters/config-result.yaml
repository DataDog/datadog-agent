processors:
  cumulativetodelta/custom:
  cumulative_to_delta/custom:
  cumulative_to_delta/dd-autoconfigured:
service:
  pipelines:
    metrics/otlp:
      receivers: [otlp]
      processors: [cumulative_to_delta/dd-autoconfigured]
      exporters: [otlp]
    metrics/otlp_grpc:
      receivers: [otlp]
      processors: [cumulative_to_delta/dd-autoconfigured]
      exporters: [otlp_grpc/gw]
    metrics/otlp_http:
      receivers: [otlp]
      processors: [cumulative_to_delta/dd-autoconfigured]
      exporters: [otlp_http]
    metrics/loadbalancing:
      receivers: [otlp]
      processors: [cumulative_to_delta/dd-autoconfigured]
      exporters: [loadbalancing]
    metrics/load_balancing:
      receivers: [otlp]
      processors: [cumulative_to_delta/dd-autoconfigured]
      exporters: [load_balancing]
    metrics/debug:
      receivers: [otlp]
      exporters: [debug]
    metrics/user-c2d:
      receivers: [otlp]
      processors: [cumulativetodelta/custom]
      exporters: [otlphttp]
    metrics/user-c2d-new:
      receivers: [otlp]
      processors: [cumulative_to_delta/custom]
      exporters: [otlp_http]
