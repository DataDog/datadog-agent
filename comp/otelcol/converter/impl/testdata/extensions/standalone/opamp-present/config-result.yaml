receivers:
  otlp:

exporters:
  nop:

extensions:
  opamp:
    server:
      ws:
        endpoint: wss://opamp.example.internal/v1/opamp
  pprof/dd-autoconfigured:
  health_check/dd-autoconfigured:
  zpages/dd-autoconfigured:
    endpoint: "localhost:55679"
  dogtel/dd-autoconfigured:

service:
  extensions:
    [
      pprof/dd-autoconfigured,
      zpages/dd-autoconfigured,
      health_check/dd-autoconfigured,
      opamp,
      dogtel/dd-autoconfigured,
    ]
  pipelines:
    traces:
      receivers: [nop]
      exporters: [nop]
    metrics:
      receivers: [nop]
      exporters: [nop]
    logs:
      receivers: [nop]
      exporters: [nop]
