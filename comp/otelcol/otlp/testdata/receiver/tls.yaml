otlp_config:
  receiver:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
        max_recv_msg_size_mib: 10
        tls:
          cert_file: /etc/datadog-agent/otlp/cert.pem
          key_file: /etc/datadog-agent/otlp/key.pem
          client_ca_file: /etc/datadog-agent/otlp/ca.pem
      http:
        endpoint: "0.0.0.0:4318"
        cors:
          allowed_origins:
            - https://example.com
        tls:
          cert_file: /etc/datadog-agent/otlp/cert.pem
          key_file: /etc/datadog-agent/otlp/key.pem
