receivers:
  profiling:
    symbol_uploader:
      enabled: true
      symbol_endpoints:
      - api_key: 11111
  profiling/custom:
    symbol_uploader:
      enabled: true
      symbol_endpoints:
      - api_key: 33333
service:
  pipelines:
    profiles:
      processors: []
      receivers:
      - profiling
      - profiling/custom
      exporters:
      - otlp_http
exporters:
  otlp_http:
    headers:
      dd-api-key: test-api-key
