exporters:
    otlp_http/datadoghq.com_0:
        compression: zstd
        endpoint: https://otlp.datadoghq.com
        headers:
            dd-api-key: additional_api_key
            dd-evp-origin: host-profiler-bundled
            dd-evp-origin-version: 7.0.0-test
            dd-otel-metric-config: '{"resource_attributes_as_tags": true}'
    otlp_http/datadoghq.com_1:
        compression: zstd
        endpoint: https://otlp.datadoghq.com
        headers:
            dd-api-key: main_api_key
            dd-evp-origin: host-profiler-bundled
            dd-evp-origin-version: 7.0.0-test
            dd-otel-metric-config: '{"resource_attributes_as_tags": true}'
extensions:
    hpflare:
        endpoint: localhost:7778
    oom: {}
processors:
    infraattributes:
        allow_hostname_override: true
        cardinality: 2
    resource/dd-profiler-internal-metadata:
        attributes:
            - action: upsert
              key: profiler_name
              value: host-profiler-bundled
            - action: upsert
              key: profiler_version
              value: 7.0.0-test
receivers:
    profiling:
        filter_min_process_age: 0s
        reporter_interval: 1m0s
        send_error_frames: false
        symbol_uploader:
            enabled: true
            report:
                interval: 300
                max_paths_per_report: 100
            symbol_endpoints:
                - api_key: additional_api_key
                  site: datadoghq.com
                - api_key: main_api_key
                  site: datadoghq.com
service:
    extensions:
        - hpflare
        - oom
    pipelines:
        profiles:
            exporters:
                - otlp_http/datadoghq.com_0
                - otlp_http/datadoghq.com_1
            processors:
                - infraattributes
                - resource/dd-profiler-internal-metadata
            receivers:
                - profiling
    telemetry:
        metrics:
            level: none
