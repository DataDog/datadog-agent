# Example of conf.d/snmp.d/snmp_credentials.yaml, the file Fleet Automation
# writes. It is a valid snmp check configuration, so the file config provider
# accepts it, and every instance is inert: network_address is a /32 whose only
# address is ignored.
#
# The NDM Remote Configuration provider reads the same file and indexes the
# instances by name. An instance delivered by Remote Configuration with
# "cred_id": "cred-v2c-public" gets the credentials of the instance named
# cred-v2c-public below.

init_config:

instances:
  - name: cred-v2c-public
    network_address: 1.2.3.4/32
    ignored_ip_addresses:
      - 1.2.3.4
    snmp_version: "2c"
    community_string: public

  - name: cred-v3-full
    network_address: 1.2.3.4/32
    ignored_ip_addresses:
      - 1.2.3.4
    snmp_version: "3"
    user: test-user
    authProtocol: SHA
    authKey: test-auth-key
    privProtocol: AES
    privKey: test-priv-key
