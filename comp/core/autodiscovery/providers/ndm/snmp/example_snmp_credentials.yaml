# Example of conf.d/snmp.d/snmp_credentials.yaml, the file Fleet Automation
# writes. It is a valid snmp check configuration, so the file config provider
# accepts it, and every instance is inert: network_address is a /32 whose only
# address is ignored.
#
# The NDM Remote Configuration provider reads the same file and indexes the
# instances by the id their credential-name tag carries. An instance delivered
# by Remote Configuration with "cred_id": "core-switches" gets the credentials
# of the first instance below.

instances:
- community_string: public
  ignored_ip_addresses:
  - 1.2.3.4
  network_address: 1.2.3.4/32
  snmp_version: 2
  tags:
  - credential-name:core-switches
- community_string: public
  ignored_ip_addresses:
  - 1.2.3.4
  network_address: 1.2.3.4/32
  snmp_version: 1
  tags:
  - credential-name:legacy-v1
- authKey: test-auth-key
  authProtocol: SHA256
  ignored_ip_addresses:
  - 1.2.3.4
  network_address: 1.2.3.4/32
  privKey: test-priv-key
  privProtocol: AES256
  snmp_version: 3
  tags:
  - credential-name:datacenter-v3
  user: datadog-ro
