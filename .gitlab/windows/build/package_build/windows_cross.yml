---
windows_agent_cross_build_x64-a7:
  stage: package_build
  extends: .bazel:runner:linux-amd64
  rules:
    - when: on_success
  script:
    - bazel build --remote_download_outputs=toplevel //packages/agent/windows:msi_payload_windows
    - mkdir -p omnibus/msi-payload
    - cp "$(bazel info execution_root)/$(bazel cquery --output=files //packages/agent/windows:msi_payload_windows)" omnibus/msi-payload/
  artifacts:
    expire_in: 2 weeks
    paths:
      - omnibus/msi-payload

windows_msi_cross_x64-a7:
  extends: .windows_msi_base
  rules:
    - when: on_success
  needs:
    - job: windows_agent_cross_build_x64-a7
      artifacts: true
