---
.windows_msi_base:
  stage: packaging
  extends: [.windows_docker_default, .bazel:defs:cache:windows]
  script:
    - $ErrorActionPreference = 'Stop'
    - Invoke-Expression "$S3_CP_CMD $S3_ARTIFACTS_URI/agent-version.cache ."
    - If ($lastExitCode -ne "0") { throw "Previous command returned $lastExitCode" }
    - >
      .\tools\ci\docker-run-with-bazel-cache.ps1
      -m 16384M
      -v "$(Get-Location):c:\mnt"
      -e DDA_FEATURE_FLAGS_CI_SSM_KEY_WINDOWS="${DDA_FEATURE_FLAGS_CI_SSM_KEY_WINDOWS}"
      -e GITLAB_CI
      -e CI_JOB_ID
      -e CI_PIPELINE_ID
      -e CI_PROJECT_NAME
      -e CI_COMMIT_BRANCH
      -e CI_JOB_NAME_SLUG
      -e CI_COMMIT_REF_NAME
      -e WINDOWS_BUILDER=true
      -e AWS_NETWORKING=true
      -e SIGN_WINDOWS_DD_WCS=true
      -e WINDOWS_SIGNING_CERT
      -e WINDOWS_SIGNING_CONFIG
      -e TARGET_ARCH="$ARCH"
      -e DEBUG_CUSTOMACTION
      -e BUCKET_BRANCH
      -e PIP_INDEX_URL
      -e AGENT_FLAVOR
      -e PYTHONUTF8=1
      -e CI_JOB_TOKEN
      -e CI_IDENTITIES_GITLAB_ID_TOKEN
      ${WINBUILDIMAGE}
      powershell -C "c:\mnt\tasks\winbuildscripts\Build-AgentMsi.ps1 -BuildOutOfSource 1 -InstallDeps 1 -BuildUpgrade 1"
    - If ($lastExitCode -ne "0") { throw "Previous command returned $lastExitCode" }
    - get-childitem omnibus\pkg\pipeline-$CI_PIPELINE_ID
  artifacts:
    expire_in: 2 weeks
    paths:
      - omnibus/pkg/pipeline-$CI_PIPELINE_ID
  variables:
    ARCH: "x64"
  timeout: 1h

windows_msi_and_bosh_zip_x64-a7:
  extends: .windows_msi_base
  rules:
    - when: on_success
  needs:
    - job: windows_agent_build_x64-a7
      artifacts: true

windows_msi_and_bosh_zip_x64-a7-fips:
  extends: .windows_msi_base
  rules:
    - !reference [.except_light_pipeline]
    - when: on_success
  needs:
    - job: windows_agent_build_x64-a7-fips
      artifacts: true
  variables:
    AGENT_FLAVOR: fips
