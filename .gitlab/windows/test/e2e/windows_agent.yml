---
# Windows e2e agent owned jobs.

new-e2e-agent-configuration-windows:
  extends: .new_e2e_template_needs_windows_x64
  rules:
    - !reference [.on_acfg_or_e2e_changes]
    - !reference [.dynamic_tests] # The job will always be created on any Go code modification, tests are skipped dynamically in the job
    - !reference [.manual]
  variables:
    TARGETS: ./tests/agent-configuration
    TEAM: fleet-automation
    EXTRA_PARAMS: --run "Windows"

new-e2e-agent-runtimes-windows:
  extends: .new_e2e_template_needs_windows_x64
  rules:
    - !reference [.on_e2e_main_release_or_rc]
    - changes:
        paths:
          # This job owns the procmgr suite, the only end-to-end coverage of the Windows
          # cutovers: dd-procmgr supervising a workload while the legacy SCM service it
          # replaced stays stopped. Listing only the test directory meant a change to
          # dd-procmgr itself, to the processes.d definitions the MSI writes, or to the core
          # Agent's decision to skip a service ran none of it.
          - pkg/procmgr/**/*
          - comp/procmgr/**/*
          - pkg/fleet/installer/packages/embedded/tmpl/gen/windows/**/*
          - pkg/fleet/installer/packages/processmanager/*_windows.go
          - cmd/agent/subcommands/run/dependent_services_windows.go
          - test/new-e2e/tests/agent-runtimes/**/*
        compare_to: $COMPARE_TO_BRANCH
    - !reference [.manual]
  variables:
    TARGETS: ./tests/agent-runtimes
    TEAM: agent-runtimes
    EXTRA_PARAMS: --run "Windows"
    ON_NIGHTLY_FIPS: "true"

new-e2e-agent-subcommands-windows:
  extends: .new_e2e_template_needs_windows_x64
  rules:
    - !reference [.on_e2e_main_release_or_rc]
    - changes:
        paths:
          - pkg/config/schema/**/* # DataDog/datadog-agent#52358
          - test/new-e2e/tests/agent-subcommands/**/*
        compare_to: $COMPARE_TO_BRANCH
    - !reference [.manual]
  variables:
    TARGETS: ./tests/agent-subcommands
    TEAM: fleet-remediation
    ON_NIGHTLY_FIPS: "true"
    EXTRA_PARAMS: --run "Windows"

new-e2e-privateactionrunner-windows:
  extends: .new_e2e_template_needs_windows_x64
  rules:
    - !reference [.except_disable_e2e_tests]
    - !reference [.except_light_pipeline]
    - !reference [.on_privateactionrunner_or_e2e_changes]
    - !reference [.manual]
  variables:
    TARGETS: ./tests/privateactionrunner
    TEAM: action-platform
    EXTRA_PARAMS: --run "Windows"
