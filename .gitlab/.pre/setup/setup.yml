---
setup_agent_version:
  stage: setup
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  script:
    - |
      if ! dda inv -- -e agent.version --cache-version > build.env; then
        echo "Failed to get agent version"
        exit 1
      fi
    - sed -i 's/^/AGENT_VERSION=/' build.env
    - |
      if ! $S3_CP_CMD $CI_PROJECT_DIR/agent-version.cache $S3_ARTIFACTS_URI/agent-version.cache; then
        echo "Failed to upload agent version cache"
        exit 1
      fi
    - echo "Agent version:"
    - cat agent-version.cache
  needs: []
  artifacts:
    reports:
      dotenv: build.env
  variables:
    DISABLE_GIT_CACHE: true
    GIT_DEPTH: 0  # git describe --tags needs reachable tags

cancel-prev-pipelines:
  stage: .pre
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /.*\[skip cancel\].*/
      when: never
    - if: $CI_COMMIT_REF_NAME =~ /.*-skip-cancel$/
      when: never
    - !reference [.on_dev_branches]
    - when: on_success
  script:
    - dda inv -- pipeline.auto-cancel-previous-pipelines

# Disallow [skip ci] in commit messages
skip-ci-check:
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  needs: []
  stage: setup
  tags: ["arch:amd64", "specific:true"]
  rules:
    - !reference [.on_light_pipeline]
  script:
    - commit_message="$(git log --format=%B -n 1 $CI_COMMIT_SHA)"
    # https://docs.github.com/en/actions/managing-workflow-runs/skipping-workflow-runs
    - |
      if [[ "$commit_message" =~ *"[ci skip]"*|*"[skip ci]"*|*"[actions skip]"*|*"[skip actions]"*|*"[no ci]"*|*"skip-checks: true"*|*"skip-checks:true"* ]]; then
            echo "error: The commit message of this PR contains ci skip tags. Do not skip checks when merging PRs, please change the description of the merge commit" >& 2
            exit 1
      fi
    - "echo 'success: No check skip found'"

prebuild-workspace-image-check:
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  needs: []
  stage: setup
  tags: ["arch:amd64", "specific:true"]
  rules:
    - !reference [.except_main_release_or_mq]
    - changes:
        paths:
          - .devcontainer/datadog/default/**/*
        compare_to: $COMPARE_TO_BRANCH
  variables:
    GIT_DEPTH: 0  # Full history: three-dot diff is from merge-base to HEAD
  script:
    - git fetch origin "$COMPARE_TO_BRANCH"
    - export SOURCE_REF="origin/$COMPARE_TO_BRANCH"
    - bash tools/prebuild-devcontainer-check.sh
