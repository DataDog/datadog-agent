---
# This is the scripts to be executed on the Gitlab macOS runners before every job.
# We don't have virtualization now so we need to clean the environment and install the proper dependencies before every job.
.macos_runner_maintenance:
  - DD_API_KEY="$("$CI_PROJECT_DIR"/tools/ci/fetch_secret.sh "$AGENT_API_KEY_ORG2" token)" || exit $?; export DD_API_KEY
  - DD_APP_KEY="$("$CI_PROJECT_DIR"/tools/ci/fetch_secret.sh "$AGENT_APP_KEY_ORG2" token)" || exit $?; export DD_APP_KEY
  # Report runner ID to Datadog, see this document for AWS meta data retrieval: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-retrieval.html
  - |
    AWS_TOKEN="$(curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")"
    RUNNER_ID="$(curl -s http://169.254.169.254/latest/meta-data/instance-id -H "X-aws-ec2-metadata-token: $AWS_TOKEN" || hostname)"
    datadog-ci tag --level job --tags macos_runner:"$RUNNER_ID"
    echo "Reported runner ID to Datadog: $RUNNER_ID"
  # Report current version to datadog if main / release branch
  - |
    if [ "$CI_COMMIT_BRANCH" = "main" ] || [[ "$CI_COMMIT_BRANCH" =~ ^[0-9]+\.[0-9]+\.(x|[0-9]+)$ ]]; then
      dda inv -- -e macos.report-versions -l all || true
    fi
  # Remove inactive versions
  - |
    if [ "$((RANDOM%20))" -eq 0 ]; then
      echo Trying to remove inactive versions
      dda inv -- -e macos.remove-inactive-versions -l python -t "$PYTHON_VERSION" || true
      dda inv -- -e macos.remove-inactive-versions -l go -t "$(cat .go-version)" || true
    fi
  # Create custom temporary folder to isolate jobs from each other
  # We have to symlink it to /tmp/gitlabci to avoid some path length issues (sockets should be <= 104 characters on MacOS)
  - |
    export TMPDIR=/tmp/gitlabci
    NEWTMPDIR="$RUNNER_TEMP_PROJECT_DIR/gitlabci"
    sudo rm -fr "$(realpath $TMPDIR)" "$NEWTMPDIR"
    mkdir "$NEWTMPDIR"
    sudo ln -fs "$NEWTMPDIR" $TMPDIR
    echo "Temporary folder created, TMPDIR=$TMPDIR -> $NEWTMPDIR"

# Installation must precede .macos_runner_maintenance so it derives the same per-job root as
# after_script, which starts with the runner's original TMPDIR.
.macos_dda_root:
  - export DDA_ROOT="$TMPDIR/dda-${CI_JOB_ID}"

.install_python_dependencies:
  - |
    if [ -z "$TMPDIR" ]; then
      echo "TMPDIR must be set" >& 2
      exit 1
    fi
  - !reference [.macos_dda_root]
  # Concurrent jobs share uv and use separate virtual environments to prevent dependency conflicts.
  # Export these settings on every invocation because after_script runs in a fresh shell.
  - export PATH="$DDA_ROOT/dda/bin:$DDA_ROOT/awscli/bin:$PATH"
  - export DDA_NO_DYNAMIC_DEPS=1
  - |
    # The completion marker prevents after_script from reusing a partially installed environment.
    if [ ! -f "$DDA_ROOT/.installed" ]; then
      rm -rf "$DDA_ROOT"
      robust_curl="curl -fsSL --retry 4 --fail-early"
      # Build image tags have the form vPIPELINE_ID-COMMIT.
      buildimages_raw="https://raw.githubusercontent.com/DataDog/datadog-agent-buildimages/${CI_IMAGE_LINUX#*-}"
      # Fetching both pins together lets curl reuse its connection.
      buildimages_pins="$($robust_curl "${buildimages_raw}/dda.env" "${buildimages_raw}/python-packages-versions.txt")"
      dda_version="$(echo "$buildimages_pins" | awk -F= '/^DDA_VERSION=/ {print $2}')"
      uv_version="$(echo "$buildimages_pins" | awk -F= '/^DD_UV_VERSION=/ {print $2}')"
      uv="$(python3 "$CI_PROJECT_DIR/tools/ci/install-uv.py" "$uv_version")"
      "$uv" venv --python "$(cat "$CI_PROJECT_DIR/.python-version")" "$DDA_ROOT/dda"
      # Installing dda from its Git tag avoids Depot's 48-hour delay for newly published packages.
      "$uv" pip install --python "$DDA_ROOT/dda/bin/python" "git+https://github.com/DataDog/datadog-agent-dev.git@${dda_version}"
      # Separate virtual environments allow awscli and dda to require incompatible botocore versions.
      "$uv" venv --python "$DDA_ROOT/dda/bin/python" "$DDA_ROOT/awscli"
      "$uv" pip install --python "$DDA_ROOT/awscli/bin/python" awscli==1.29.45
      dda self dep sync -f legacy-tasks
      touch "$DDA_ROOT/.installed"
    fi

.macos_cleanup_python_dependencies:
  - !reference [.macos_dda_root]
  - |
    # Defer cleanup until shell exit so reporting can use dda and failures still trigger cleanup.
    # Ignore removal failures to preserve the after_script's exit status.
    if [ -n "${TMPDIR:-}" ]; then
      trap 'rm -rf "$DDA_ROOT" || true' EXIT
    fi

.aws_retry_config:
  - export AWS_RETRY_MODE=standard
  - export AWS_RETRY_MAX_ATTEMPTS=5

.macos_gitlab:
  extends: [".bazel:defs:cache:macos"]
  needs: ["setup_agent_version"]
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
  variables:
    AWS_SHARED_CREDENTIALS_FILE: ${CI_PROJECT_DIR}/.aws/credentials-by-job-id/${CI_JOB_ID}
    # Forbid the AWS SDK/CLI from falling back to the EC2 instance profile via IMDS, so a
    # missing or expired CI Identities credentials file fails loudly instead of silently
    # succeeding under the runner's instance role. Only affects the AWS SDK/CLI: the raw
    # `curl 169.254.169.254` in .macos_runner_maintenance keeps working.
    AWS_EC2_METADATA_DISABLED: "true"
  before_script:
    - !reference [.aws_retry_config]
    # Drop GOPROXY entries not usable from macOS runners, before any go command.
    - !reference [.sanitize_goproxy]
    - !reference [.bazel:recover_from_canceled_job]
    # Selecting the current Go version
    - |
      eval $(gimme $(cat .go-version))
      export GOPATH=$GOROOT
    - !reference [.install_python_dependencies]
    # See there is no virtualization, we need to clean the environment regularly
    - !reference [.macos_runner_maintenance]
    # Populate AWS_SHARED_CREDENTIALS_FILE via CI Identities. macOS runners no longer
    # carry an IAM instance role, so any `aws` call made by the job (e.g. the
    # agent-version.cache download in `dda inv agent.build`) needs these credentials.
    - ci-identities-gitlab-job-client assume-role
    - export GOCACHE="$TMPDIR/go-build"
    - dda inv -- -e install-tools --verbose
  after_script:
    - !reference [.macos_cleanup_python_dependencies]

.macos_runner_make_workspace_writable:
  - |
    # GitLab Runner 18 fails the next job during clear_worktree when the
    # previous job leaves read-only files in the persistent macOS workspace.
    # Best-effort only: do not mask the job's real result if cleanup fails.
    if [ -n "$CI_PROJECT_DIR" ] && [ -d "$CI_PROJECT_DIR" ]; then
      chmod -R u+w "$CI_PROJECT_DIR" 2>/dev/null || true
    fi
