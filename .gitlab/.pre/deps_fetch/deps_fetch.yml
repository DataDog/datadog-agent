---
# deps_fetch stage
# Contains jobs which fetch go dependencies, in order
# to reuse them in further jobs that need them.

# Keep GOPROXY entries usable from the current environment; drop the rest.
.sanitize_goproxy:
  - . tools/ci/sanitize-goproxy.sh

# Windows host equivalent, for jobs that forward GOPROXY into a container.
.sanitize_goproxy_windows:
  - . ./tools/ci/sanitize-goproxy.ps1

.retrieve_linux_go_deps:
  - !reference [.sanitize_goproxy]
  - mkdir -p $GOPATH/pkg/mod/cache && zstd -dc modcache.tar.zst | tar xf - -C $GOPATH/pkg/mod/cache
  - rm -f modcache.tar.zst

.retrieve_linux_go_tools_deps:
  - |
    go_bin="$(go env GOBIN)"
    if [ -z "$go_bin" ]; then
      go_bin="$(go env GOPATH)/bin"
    fi
    mkdir -p "$go_bin" "$GOPATH/pkg/mod/cache"
    zstd -dc go_tools_bin.tar.zst | tar xf - -C "$go_bin"
    zstd -dc modcache_tools.tar.zst | tar xf - -C "$GOPATH/pkg/mod/cache"
  - rm -f go_tools_bin.tar.zst modcache_tools.tar.zst
  - export PATH=$PATH:$go_bin

.retrieve_linux_go_tools_deps_arm64:
  - |
    go_bin="$(go env GOBIN)"
    if [ -z "$go_bin" ]; then
      go_bin="$(go env GOPATH)/bin"
    fi
    mkdir -p "$go_bin" "$GOPATH/pkg/mod/cache"
    zstd -dc go_tools_bin_arm64.tar.zst | tar xf - -C "$go_bin"
    zstd -dc modcache_tools_arm64.tar.zst | tar xf - -C "$GOPATH/pkg/mod/cache"
  - rm -f go_tools_bin_arm64.tar.zst modcache_tools_arm64.tar.zst
  - export PATH=$PATH:$go_bin

.retrieve_linux_go_e2e_deps:
  - mkdir -p $GOPATH/pkg/mod/cache && zstd -dc modcache_e2e.tar.zst | tar xf - -C $GOPATH/pkg/mod/cache
  - rm -f modcache_e2e.tar.zst

.cache:
  stage: deps_fetch
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  needs: []
  variables:
    KUBERNETES_CPU_REQUEST: 16
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        POLICY: pull-push
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      variables:
        POLICY: pull
  retry: 2

# HACK: If you change the behavior of this job, change the `cache:key:prefix` value to invalidate the cache
go_deps:
  extends: .cache
  tags: ["arch:amd64", "specific:true"]
  variables:
    KUBERNETES_MEMORY_REQUEST: 12Gi
    KUBERNETES_MEMORY_LIMIT: 16Gi
  script:
    # If the cache already contains the dependencies, don't redownload them
    # but still provide the artifact that's expected for the other jobs to run
    - if [ -f modcache.tar.zst  ]; then exit 0; fi
    - dda inv -- -e deps --verbose
    - cd $GOPATH/pkg/mod/cache/ && tar c -I "zstd -T${KUBERNETES_CPU_REQUEST}" -f $CI_PROJECT_DIR/modcache.tar.zst .
  artifacts:
    expire_in: 1 day
    paths:
      - $CI_PROJECT_DIR/modcache.tar.zst
  cache:
    # The `cache:key:files` only accepts up to two paths ([docs](https://docs.gitlab.com/ee/ci/yaml/#cachekeyfiles)).
    # We should also include the file this job is defined in to invalicate the cache when this job is modified.
    - key:
        files:
          - go.mod
          - ./**/go.mod
        prefix: "go_deps_modcache_zstd"
      paths:
        - modcache.tar.zst
  timeout: 35m

go_tools_deps:
  extends: .cache
  tags: ["arch:amd64", "specific:true"]
  script:
    # ⚠ When adjusting the script's logic, please bump the `cache:key:prefix` value below to invalidate the cache!
    - if [ -f go_tools_bin.tar.zst ] && [ -f modcache_tools.tar.zst ]; then exit 0; fi
    - dda inv -- -e install-tools
    # Exclude datadog-package binary from the cache: it's already installed on all images and they don't have the same glibc version
    - |
      go_bin="$(go env GOBIN)"
      if [ -z "$go_bin" ]; then
        go_bin="$(go env GOPATH)/bin"
      fi
      tar c -C "$go_bin" -I "zstd -T${KUBERNETES_CPU_REQUEST}" -f "$CI_PROJECT_DIR/go_tools_bin.tar.zst" --exclude='./datadog-package' .
      tar c -C "$GOPATH/pkg/mod/cache" -I "zstd -T${KUBERNETES_CPU_REQUEST}" -f "$CI_PROJECT_DIR/modcache_tools.tar.zst" .
  artifacts:
    expire_in: 1 day
    paths:
      - $CI_PROJECT_DIR/go_tools_bin.tar.zst
      - $CI_PROJECT_DIR/modcache_tools.tar.zst
  cache:
    - key:
        files:
          - ./**/go.mod
          - tasks/install_tasks.py  # TOOL_LIST
        prefix: go_tools_deps_v2
      paths:
        - go_tools_bin.tar.zst
        - modcache_tools.tar.zst

go_tools_deps_arm64:
  extends: .cache
  tags: ["arch:arm64", "specific:true"]
  script:
    # ⚠ When adjusting the script's logic, please bump the `cache:key:prefix` value below to invalidate the cache!
    - if [ -f go_tools_bin_arm64.tar.zst ] && [ -f modcache_tools_arm64.tar.zst ]; then exit 0; fi
    - dda inv -- -e install-tools
    # Exclude datadog-package binary from the cache: it's already installed on all images and they don't have the same glibc version
    - |
      go_bin="$(go env GOBIN)"
      if [ -z "$go_bin" ]; then
        go_bin="$(go env GOPATH)/bin"
      fi
      tar c -C "$go_bin" -I "zstd -T${KUBERNETES_CPU_REQUEST}" -f "$CI_PROJECT_DIR/go_tools_bin_arm64.tar.zst" --exclude='./datadog-package' .
      tar c -C "$GOPATH/pkg/mod/cache" -I "zstd -T${KUBERNETES_CPU_REQUEST}" -f "$CI_PROJECT_DIR/modcache_tools_arm64.tar.zst" .
  artifacts:
    expire_in: 1 day
    paths:
      - $CI_PROJECT_DIR/go_tools_bin_arm64.tar.zst
      - $CI_PROJECT_DIR/modcache_tools_arm64.tar.zst
  cache:
    - key:
        files:
          - ./**/go.mod
          - tasks/install_tasks.py  # TOOL_LIST
        prefix: go_tools_deps_arm64_v2
      paths:
        - go_tools_bin_arm64.tar.zst
        - modcache_tools_arm64.tar.zst

go_e2e_deps:
  extends: .cache
  tags: ["arch:amd64", "specific:true"]
  script:
    - |
      if [ ! -f modcache_e2e.tar.zst ]; then
        dda inv -- -e new-e2e-tests.deps
        tar c -I "zstd -T${KUBERNETES_CPU_REQUEST}" -f $CI_PROJECT_DIR/modcache_e2e.tar.zst -C $GOPATH/pkg/mod/cache/ .
      fi
  artifacts:
    expire_in: 1 day
    paths:
      - $CI_PROJECT_DIR/modcache_e2e.tar.zst
  cache:
    - key:
        files:
          - ./test/new-e2e/go.mod
          - .gitlab/.pre/deps_fetch/deps_fetch.yml
        prefix: "go_e2e_deps_modcache_zstd"
      paths:
        - modcache_e2e.tar.zst

fetch_openjdk:
  needs: []
  tags: ["arch:amd64", "specific:true"]
  rules:
    - !reference [.manual]
  stage: deps_fetch
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  variables:
    JDK_FILENAME: OpenJDK11U-jre_x64_windows_hotspot_11.0.32.1_1.zip
    JDK_URL: https://github.com/adoptium/temurin11-binaries/releases/download/jdk-11.0.32.1%2B1
    JDK_SHA256: f8c7da672f5dba36b6f870608820b6b598cfae91296929f1b8f21ef2f1e8a0dd
  script:
    - wget "$JDK_URL/$JDK_FILENAME" -O "$JDK_FILENAME"
    - echo "$JDK_SHA256  $JDK_FILENAME" | sha256sum -c
    - $S3_CP_CMD "$JDK_FILENAME" "$S3_DD_AGENT_OMNIBUS_JAVA_URI/$JDK_FILENAME" --grants read=uri=http://acs.amazonaws.com/groups/global/AllUsers
