cancel-prev-pipelines:
  stage: .pre
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/deb_x64$DATADOG_AGENT_BUILDIMAGES_SUFFIX:$DATADOG_AGENT_BUILDIMAGES
  tags: ["arch:amd64"]
  rules: # this should only run on dev branches
    - if: $CI_PIPELINE_SOURCE =~ /^schedule.*$/
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.except_main_or_release_branch]
    - if: $CI_COMMIT_MESSAGE =~ /.*\[skip cancel\].*/
      when: never
    - if: $CI_COMMIT_REF_NAME =~ /.*-skip-cancel$/
      when: never
    - when: on_success
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
  script:
    - source /root/.bashrc
    - $CI_PROJECT_DIR/tools/ci/install_authanywhere.sh
    - GITLAB_TOKEN=$($CI_PROJECT_DIR/tools/ci/fetch_gitlab_token.sh) || exit $?; export GITLAB_TOKEN
    - inv pipeline.auto-cancel-previous-pipelines
