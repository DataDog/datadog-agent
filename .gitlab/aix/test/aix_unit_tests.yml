---
tests_aix-ppc64:
  stage: source_test
  extends: .aix_remote
  rules:
    - !reference [.except_mergequeue]
    - !reference [.on_scheduled_main]
    - when: manual
      allow_failure: true
      variables:
        EXTRA_TEST_FLAGS: "--only-modified-packages"
  variables:
    EXTRA_TEST_FLAGS: ""
  script:
    - 'echo "=== AIX: running unit tests ==="'
    - >
      ssh -tt -p $AIX_PORT $AIX_USER@$AIX_HOST
      "bash -c '
        set -eu
        cd $AIX_AGENT_SRC
        . ./packaging/aix/lib/env.sh
        python3.12 -m invoke -e test $EXTRA_TEST_FLAGS --build-exclude=python --build-cpus=1
      '"
