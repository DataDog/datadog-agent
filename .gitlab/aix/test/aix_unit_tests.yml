---
tests_aix-ppc64:
  stage: source_test
  extends: .aix_remote
  # avoid blocking nightly pipelines on errors
  allow_failure: true
  rules:
    - !reference [.except_mergequeue]
    - !reference [.on_scheduled_main]
    - changes:
        paths:
          - .gitlab/aix/aix_remote.yml
          - .gitlab/aix/test/aix_unit_tests.yml
        compare_to: $COMPARE_TO_BRANCH
      # TODO: uncomment once the job is stable enough
      # allow_failure: false
    - when: manual
      variables:
        EXTRA_TEST_FLAGS: "--only-modified-packages"
  variables:
    EXTRA_TEST_FLAGS: ""
  script:
    - 'echo "=== AIX: running unit tests ==="'
    - >
      ssh -tt -o ServerAliveInterval=20 -o ServerAliveCountMax=6 -p $AIX_PORT $AIX_USER@$AIX_HOST
      "bash -c '
        set -eu
        cd $AIX_AGENT_SRC
        . ./packaging/aix/lib/env.sh
        python3.12 -m invoke -e test $EXTRA_TEST_FLAGS --build-exclude=python --build-cpus=1
      '"
