---
# Shared template for AIX/ppc64 jobs running on a remote AIX LPAR over SSH,
# driven by a Linux GitLab runner.
#
# This template ensures the Linux runner can connect to the AIX host, that the code
# is available at the correct ref, and that the host has necessary tools and setup.
# A resource_group per VM ensures only one AIX job uses the host at a time.
#
# The SSH key is added to the ssh-agent in before_script, so script steps can
# connect with plain `ssh -p $AIX_PORT $AIX_USER@$AIX_HOST <cmd>`.
# The repository is cloned in $AIX_AGENT_SRC.

.aix_remote:
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  needs: []
  # Only one job may use the AIX host at a time.
  resource_group: aix_ci_host
  timeout: 2h
  variables:
    # Where the agent source is cloned on the AIX host.
    AIX_AGENT_SRC: "/opt/dd-build/datadog-agent"
    AIX_GIT_REMOTE: "https://github.com/DataDog/datadog-agent.git"
    GIT_DEPTH: 1
  before_script:
    # Fetch the AIX host SSH connection details and private key from Vault.
    - export AIX_HOST="$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SITEOX_AIX_CI_RUNNER hostname)"
    - export AIX_PORT="$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SITEOX_AIX_CI_RUNNER port)"
    - export AIX_USER="$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SITEOX_AIX_CI_RUNNER user)"

    # Setup to be able to connect to the host
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - touch ~/.ssh/aix_ci_key && chmod 600 ~/.ssh/aix_ci_key
    - $CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SITEOX_AIX_CI_RUNNER key > ~/.ssh/aix_ci_key || exit $?
    - chmod 600 ~/.ssh/aix_ci_key
    - ssh-keyscan -p $AIX_PORT $AIX_HOST >> ~/.ssh/known_hosts
    # Add the key to the ssh-agent so script steps don't need -i.
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/aix_ci_key

    # Ensure the agent source is cloned on the AIX host at the commit under
    # test. Reuses any existing clone (fetch + checkout) to avoid cloning from
    # scratch each run. The clone includes packaging/aix/ci/*.sh, so the host
    # has the scripts the job later runs.
    - 'echo "=== AIX: cloning agent source at $CI_COMMIT_SHA ==="'
    - |
      ssh -T -p $AIX_PORT $AIX_USER@$AIX_HOST bash -s <<EOF
      set -eu
      export PATH=/opt/freeware/bin:/usr/bin:\$PATH
      if [ ! -d "$AIX_AGENT_SRC/.git" ]; then
        git clone --progress "$AIX_GIT_REMOTE" "$AIX_AGENT_SRC"
      fi
      cd "$AIX_AGENT_SRC"
      git clean -df
      git reset --hard
      git fetch --progress origin
      # The commit under test may not be reachable from origin yet (e.g. a
      # brand-new branch push); fetch the branch ref as a fallback.
      git fetch --progress origin "$CI_COMMIT_REF_NAME" || true
      git checkout "$CI_COMMIT_SHA"
      EOF
    
    # Host setup (tools, etc)
    # -tt forces a PTY so the remote script's stdout/stderr stream live to the job log.
    - 'echo "=== AIX: provisioning host (setup-host.sh) ==="'
    - ssh -tt -p $AIX_PORT $AIX_USER@$AIX_HOST "sh $AIX_AGENT_SRC/packaging/aix/setup-host.sh"
