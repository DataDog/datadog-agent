---
# Shared template for AIX/ppc64 jobs running on a remote AIX LPAR over SSH,
# driven by a Linux GitLab runner.
#
# This template ensures the Linux runner can connect to the AIX host, that the code
# is available at the correct ref, and that the host has necessary tools and setup.
# A resource_group per VM ensures only one AIX job uses the host at a time.
#
# The repository is cloned in $AIX_AGENT_SRC, which depends on the GitLab project
# (DataDog/datadog-agent or its private embargo mirror ddoghq/datadog-agent, see
# aix_select_repo in aix_helpers.sh). A host-wide lock serializes jobs from both
# projects, since resource_group is scoped to a single project.
# Use aix_run_cmd, copy_file_from_aix, and copy_file_to_aix to connect to the host in job scripts, eg.:
## $ aix_run_cmd echo "Hello from AIX"
## $ aix_run_cmd <<EOF
##    echo a
##    echo b
##    EOF
#
# The helper functions and the git setup live in the .sh files next to this
# template (aix_helpers.sh and aix_git_setup.sh), sourced in before_script.

.aix_remote:
  extends: .dd_octo_sts
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  # Wait for the setup job that uploads the agent-version cache, which the
  # template ships to the AIX host in before_script.
  needs:
    - setup_agent_version
  # Only one job may use the AIX host at a time.
  resource_group: aix_ci_host
  timeout: 2h
  variables:
    GIT_DEPTH: 1
  before_script:
    # Fetch the AIX host SSH connection details and private key from Vault.
    - export AIX_HOST="$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SITEOX_AIX_CI_RUNNER hostname)"
    - export AIX_PORT="$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SITEOX_AIX_CI_RUNNER port)"
    - export AIX_USER="$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SITEOX_AIX_CI_RUNNER user)"

    # Setup to be able to connect to the host
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - $CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SITEOX_AIX_CI_RUNNER key > ~/.ssh/aix_ci_key || exit $?
    - chmod 600 ~/.ssh/aix_ci_key
    - ssh-keyscan -p $AIX_PORT $AIX_HOST >> ~/.ssh/known_hosts
    # Add the port and key to the config so script steps (and after_script,
    # which runs in a separate shell) don't need -p or -i.
    - echo -e "Host $AIX_HOST\n  Port $AIX_PORT\n  IdentityFile ~/.ssh/aix_ci_key" >> ~/.ssh/config
    - chmod 644 ~/.ssh/config
    # Persist the connection details for after_script.
    - echo -e "export AIX_HOST=$AIX_HOST\nexport AIX_USER=$AIX_USER" > ~/.aix_env

    # Helpers for connecting to the AIX host.
    - source $CI_PROJECT_DIR/.gitlab/aix/common/aix_helpers.sh
    - aix_select_repo
    - aix_acquire_host_lock

    # Ensure the agent source is cloned on the AIX host at the commit under test.
    - source $CI_PROJECT_DIR/.gitlab/aix/common/aix_git_setup.sh

    # Ship the pipeline's agent-version cache into the host source tree.
    # The host has no AWS credentials, so env.sh's version detection
    # (invoke agent.version) must find the cache file locally instead of
    # trying to fetch it from S3. The file is fetched on the runner, which
    # has credentials; the setup stage guarantees it was uploaded.
    - 'echo "=== AIX: shipping agent-version cache to the host ==="'
    - $S3_CP_CMD "s3://dd-ci-artefacts-build-stable/datadog-agent/$CI_PIPELINE_ID/agent-version.cache" "$CI_PROJECT_DIR/agent-version.cache"
    - copy_file_to_aix "$CI_PROJECT_DIR/agent-version.cache" "$AIX_AGENT_SRC/agent-version.cache"

    # IBM MQ Client (required by setup-host.sh for the packaging build).
    # Fetch the installp archive from MASS on the runner and transfer it to the host.
    - |
      if ! aix_run_cmd lslpp -Lq mqm.base.runtime ; then
        echo "=== AIX: fetching IBM MQ Client from MASS ==="
        curl -fSL \
          -H "$(ddtool auth token rapid-dependency-management-mass --datacenter us1.ddbuild.io --http-header)" \
          "https://mass-read.us1.ddbuild.io/internal/artifact/datadog-agent/aix/mqc/9.2.0.0/9.2.0.0-IBM-MQC-AixPPC64.tar.Z" \
          -o /tmp/mqclient.tar.Z
        echo "=== AIX: transferring IBM MQ Client to the AIX host ==="
        copy_file_to_aix /tmp/mqclient.tar.Z /opt/dd-build/mqclient.tar.Z
      else
        echo "=== AIX: IBM MQ Client already installed ==="
      fi

    # Host setup (tools, etc)
    # -tt forces a PTY so the remote script's stdout/stderr stream live to the job log.
    - 'echo "=== AIX: provisioning host (setup-host.sh) ==="'
    - aix_run_cmd "cd $AIX_AGENT_SRC && sh packaging/aix/setup-host.sh"
  after_script:
    - source ~/.aix_env 2>/dev/null || exit 0
    - source $CI_PROJECT_DIR/.gitlab/aix/common/aix_helpers.sh
    - aix_select_repo
    - aix_run_cmd "rm -f '$AIX_GIT_TOKEN_FILE'" || true
    # Don't leave build outputs of embargoed code on the shared host.
    - |
      if [ "$AIX_REPO_PRIVATE" = "true" ]; then
        aix_run_cmd "cd $AIX_AGENT_SRC/packaging/aix && sh ./clean.sh; rm -f /opt/dd-build/*.bff" || true
      fi
    - aix_release_host_lock || true
