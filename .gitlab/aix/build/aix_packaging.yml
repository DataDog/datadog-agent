---
package_aix-ppc64:
  stage: packaging
  extends: .aix_remote
  # Wait for the setup job that creates and uploads the agent-version cache,
  # which the version computation below resolves from.
  needs:
    - setup_agent_version
  # avoid blocking nightly pipelines on errors
  allow_failure: true
  rules:
    - !reference [.except_light_pipeline]
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/
    - !reference [.on_scheduled_main]
    - changes:
        paths:
          - .gitlab/aix/common/**/*
          - .gitlab/aix/build/aix_packaging.yml
        compare_to: $COMPARE_TO_BRANCH
    - !reference [.manual]
  script:
    # Compute the canonical version on the runner, from the pipeline's
    # agent-version cache, and pass it to the remote build: the BFF filename
    # then embeds the same version string (including the .pipeline.<id> suffix
    # for nightly/dev builds) as the one used by the release promotions in
    # agent-release-management, like for the deb/rpm/dmg packages.
    # Use the url-safe (dashed) form, which is the BFF filename convention:
    # the omnibus (deb) form replaces dashes with tildes, and the tilde form
    # only matches after agent-release-management converts it back to dashes.
    # Assign before exporting: a plain assignment propagates the command's
    # failure status, `export` would mask it.
    - AGENT_VERSION="$(dda inv agent.version --url-safe --include-git --pipeline-id $CI_PIPELINE_ID)" || exit $?
    - export AGENT_VERSION
    - 'echo "=== AIX: running packaging build (build.sh) ==="'
    - |
      aix_run_cmd <<EOF
      set -eux
      cd $AIX_AGENT_SRC/packaging/aix && sh ./clean.sh
      cd $AIX_AGENT_SRC
      env AGENT_BUILD=1 AGENT_VERSION="$AGENT_VERSION" sh $AIX_AGENT_SRC/packaging/aix/build.sh
      EOF
    # Retrieve the built .bff from the AIX host and expose it as a job artifact.
    - 'echo "=== AIX: retrieving .bff artifact ==="'
    - copy_file_from_aix /opt/dd-build/*.bff $CI_PROJECT_DIR/
    - aix_run_cmd 'rm -f /opt/dd-build/*.bff'
  artifacts:
    expire_in: 2 weeks
    paths:
      - "$CI_PROJECT_DIR/*.bff"
