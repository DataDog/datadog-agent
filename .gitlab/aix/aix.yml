---
# Shared template for AIX/ppc64 jobs running on a remote AIX LPAR over SSH,
# driven by a Linux GitLab runner.
#
# This template ensures the Linux runner can connect to the AIX host, that the code
# is available at the correct ref, and that the host has necessary tools and setup.
# A resource_group per VM ensures only one AIX job uses the host at a time.
#
# The repository is cloned in $AIX_AGENT_SRC.
# Use aix_run_cmd, copy_file_from_aix, and copy_file_to_aix to connect to the host in job scripts, eg.:
## $ aix_run_cmd echo "Hello from AIX"
## $ aix_run_cmd <<EOF
##    echo a
##    echo b
##    EOF
#
# The helper functions and the git setup live in the .sh files in common/
# (aix_helpers.sh and aix_git_setup.sh), sourced in before_script.

.aix_remote:
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  needs: []
  # Only one job may use the AIX host at a time.
  resource_group: aix_ci_host
  timeout: 2h
  variables:
    # Where the agent source is cloned on the AIX host.
    AIX_AGENT_SRC: "/opt/dd-build/datadog-agent"
    AIX_GIT_REMOTE: "https://github.com/DataDog/datadog-agent.git"
    GIT_DEPTH: 1
  before_script:
    # Fetch the AIX host SSH connection details and private key from Vault.
    - export AIX_HOST="$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SITEOX_AIX_CI_RUNNER hostname)"
    - export AIX_PORT="$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SITEOX_AIX_CI_RUNNER port)"
    - export AIX_USER="$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SITEOX_AIX_CI_RUNNER user)"

    # Setup to be able to connect to the host
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - $CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SITEOX_AIX_CI_RUNNER key > ~/.ssh/aix_ci_key || exit $?
    - chmod 600 ~/.ssh/aix_ci_key
    - ssh-keyscan -p $AIX_PORT $AIX_HOST >> ~/.ssh/known_hosts
    # Add the key to the ssh-agent so script steps don't need -i.
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/aix_ci_key
    # Add the port to the config so script steps don't need -p.
    - echo -e "Host $AIX_HOST\n  Port $AIX_PORT" >> ~/.ssh/config
    - chmod 644 ~/.ssh/config

    # Helpers for connecting to the AIX host.
    - source $CI_PROJECT_DIR/.gitlab/aix/common/aix_helpers.sh

    # Ensure the agent source is cloned on the AIX host at the commit under test.
    - source $CI_PROJECT_DIR/.gitlab/aix/common/aix_git_setup.sh

    # IBM MQ Client (required by setup-host.sh for the packaging build).
    # Fetch the installp archive from MASS on the runner and transfer it to the host.
    - |
      if ! aix_run_cmd lslpp -Lq mqm.base.runtime ; then
        echo "=== AIX: fetching IBM MQ Client from MASS ==="
        curl -fSL \
          -H "$(ddtool auth token rapid-dependency-management-mass --datacenter us1.ddbuild.io --http-header)" \
          "https://mass-read.us1.ddbuild.io/internal/artifact/datadog-agent/aix/mqc/9.2.0.0/9.2.0.0-IBM-MQC-AixPPC64.tar.Z" \
          -o /tmp/mqclient.tar.Z
        echo "=== AIX: transferring IBM MQ Client to the AIX host ==="
        copy_file_to_aix /tmp/mqclient.tar.Z /opt/dd-build/mqclient.tar.Z
      else
        echo "=== AIX: IBM MQ Client already installed ==="
      fi

    # Host setup (tools, etc)
    # -tt forces a PTY so the remote script's stdout/stderr stream live to the job log.
    - 'echo "=== AIX: provisioning host (setup-host.sh) ==="'
    - aix_run_cmd "cd $AIX_AGENT_SRC && sh packaging/aix/setup-host.sh"

tests_aix-ppc64:
  stage: source_test
  extends: .aix_remote
  # avoid blocking nightly pipelines on errors
  allow_failure: true
  rules:
    - !reference [.except_light_pipeline]
    - !reference [.on_scheduled_main]
    - changes:
        paths:
          - .gitlab/aix/common/**/*
          - .gitlab/aix/aix.yml
        compare_to: $COMPARE_TO_BRANCH
    - when: manual
      variables:
        EXTRA_TEST_FLAGS: "--only-modified-packages"
  variables:
    EXTRA_TEST_FLAGS: ""
  script:
    - 'echo "=== AIX: running unit tests ==="'
    - |
      aix_run_cmd <<EOF
      set -eux
      cd $AIX_AGENT_SRC
      . ./packaging/aix/lib/env.sh
      python3.12 -m invoke -e test $EXTRA_TEST_FLAGS --build-exclude=python --build-cpus=2
      EOF

package_aix-ppc64:
  stage: packaging
  extends: .aix_remote
  # Wait for the setup job that creates and uploads the agent-version cache,
  # which the version computation below resolves from.
  needs:
    - setup_agent_version
  # avoid blocking nightly pipelines on errors
  allow_failure: true
  rules:
    - !reference [.except_light_pipeline]
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/
    - !reference [.on_scheduled_main]
    - changes:
        paths:
          - .gitlab/aix/common/**/*
          - .gitlab/aix/aix.yml
        compare_to: $COMPARE_TO_BRANCH
    - !reference [.manual]
  script:
    # Compute the canonical version on the runner, from the pipeline's
    # agent-version cache, and pass it to the remote build: the BFF filename
    # then embeds the same version string (including the .pipeline.<id> suffix
    # for nightly/dev builds) as the one used by the release promotions in
    # agent-release-management, like for the deb/rpm/dmg packages.
    # Use the url-safe (dashed) form, which is the BFF filename convention:
    # the omnibus (deb) form replaces dashes with tildes, and the tilde form
    # only matches after agent-release-management converts it back to dashes.
    # Assign before exporting: a plain assignment propagates the command's
    # failure status, `export` would mask it.
    - AGENT_VERSION="$(dda inv agent.version --url-safe --include-git --pipeline-id $CI_PIPELINE_ID)" || exit $?
    - export AGENT_VERSION
    - 'echo "=== AIX: running packaging build (build.sh) ==="'
    - |
      aix_run_cmd <<EOF
      set -eux
      cd $AIX_AGENT_SRC/packaging/aix && sh ./clean.sh
      cd $AIX_AGENT_SRC
      env AGENT_BUILD=1 AGENT_VERSION="$AGENT_VERSION" sh $AIX_AGENT_SRC/packaging/aix/build.sh
      EOF
    # Retrieve the built .bff from the AIX host and expose it as a job artifact.
    - 'echo "=== AIX: retrieving .bff artifact ==="'
    - copy_file_from_aix /opt/dd-build/*.bff $CI_PROJECT_DIR/
    - aix_run_cmd 'rm -f /opt/dd-build/*.bff'
  artifacts:
    expire_in: 2 weeks
    paths:
      - "$CI_PROJECT_DIR/*.bff"

# deploy_packages stage
# Contains the job uploading the AIX BFF package to the per-pipeline
# directory of the internal dd-release-artifacts bucket. The package is
# promoted to the public dd-agent-aix bucket by agent-release-management.

deploy_packages_aix-ppc64:
  stage: deploy_packages
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/gitlab_agent_deploy$CI_IMAGE_GITLAB_AGENT_DEPLOY_SUFFIX:$CI_IMAGE_GITLAB_AGENT_DEPLOY
  tags: ["arch:amd64", "specific:true"]
  needs:
    - job: package_aix-ppc64
      artifacts: true
  rules:
    - !reference [.except_light_pipeline]
    - if: $BUCKET_BRANCH =~ /^(nightly|beta|stable)$/
      allow_failure: true
    - if: $BUCKET_BRANCH == "dev"
      when: manual
      allow_failure: true
  script:
    - |
      shopt -s nullglob
      bff_files=("$CI_PROJECT_DIR"/datadog-agent-*.aix.ppc64.bff)
      if [ "${#bff_files[@]}" -ne 1 ]; then
        echo "Expected exactly one AIX BFF artifact, found ${#bff_files[@]}" >&2
        printf '  %s\n' "${bff_files[@]}" >&2
        exit 1
      fi
      # Upload the BFF to the per-pipeline directory of the internal release
      # artifacts bucket.
      $S3_CP_CMD --content-type "application/octet-stream" "${bff_files[0]}" "${S3_RELEASE_ARTIFACTS_URI}/bff/ppc64/"
