# Child pipeline for SMP regression detection.
# Triggered from regression_detector.yml via
# trigger-single-machine-performance-regression_detector. The parent pipeline
# does not wait for this pipeline (no strategy: depend).
#
# BASELINE_SHA and PARENT_PIPELINE_ID are passed as CI variables from the
# parent trigger job. Standard GitLab variables (CI_COMMIT_SHA,
# CI_COMMIT_BRANCH, etc.) are automatically available in child pipelines.
#
# NOTE: !reference to anchors defined in .gitlab-ci.yml is not available here.
# Policies that would normally be referenced (e.g. .retry_only_infra_failure)
# are inlined below.

stages:
  - functional_test

variables:
  SMP_ALLOW_FAILURE: "true"
  GIT_DEPTH: 1
  # Repo-owned minijinja template rendered into the PR comment by
  # `smp report render`. Shared by every SMP job in this pipeline.
  #
  REPORT_TEMPLATE: test/regression/report_template.md.j2

.smp_config_only_job_submit:
  - |
    RUST_LOG="${RUST_LOG}" ./smp --team-id ${SMP_TEAM_ID} --api-base ${SMP_API} --aws-named-profile ${AWS_NAMED_PROFILE} \
    job submit-experimental-config-only \
    --target-image ${COMPARISON_IMAGE} \
    --target-sha ${CI_COMMIT_SHA} \
    --target-config-dir ${CONFIG_DIR} \
    --submission-metadata submission_metadata \
    --tags ${SMP_TAGS} || {
      exit_code=$?
      echo "smp job submit command failed with code $exit_code"
      datadog-ci tag --level job --tags smp_failure_mode:"job-submission"
      exit $exit_code
    }

.smp_job_submit:
  - |
    RUST_LOG="${RUST_LOG}" ./smp --team-id ${SMP_TEAM_ID} --api-base ${SMP_API} --aws-named-profile ${AWS_NAMED_PROFILE} \
    job submit \
    --baseline-image ${BASELINE_IMAGE} \
    --comparison-image ${COMPARISON_IMAGE} \
    --baseline-sha ${BASELINE_SHA} \
    --comparison-sha ${CI_COMMIT_SHA} \
    --target-config-dir ${CONFIG_DIR} \
    --submission-metadata submission_metadata \
    --tags ${SMP_TAGS} || {
      exit_code=$?
      echo "smp job submit command failed with code $exit_code"
      datadog-ci tag --level job --tags smp_failure_mode:"job-submission"
      exit $exit_code
    }

# Base template shared by all SMP run jobs.
# BASELINE_SHA is written to regression_detector.env in before_script so the
# script can source it the same way as if it were a job artifact.
.single-machine-performance-run_regression_detector:
  stage: functional_test
  timeout: 1h10m
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/docker_x64$CI_IMAGE_DOCKER_X64_SUFFIX:$CI_IMAGE_DOCKER_X64
  tags: ["arch:amd64", "specific:true"]
  before_script:
    - echo "BASELINE_SHA=${BASELINE_SHA}" > regression_detector.env
  artifacts:
    expire_in: 1 weeks
    paths:
      - submission_metadata # for provenance, debugging
      - outputs/report.md # rendered locally from report.json, posted as the PR comment
      - outputs/severity_report.md # rendered locally from report.json, for debugging
      - outputs/regression_signal.json # for debugging, also on S3
      - outputs/bounds_check_signal.json # for debugging, also on S3
      - outputs/junit.xml # rendered locally from report.json, uploaded to CI Visibility
      - outputs/report.json # the source of every rendered view above, also on S3
    when: always
  # The 'CI Pass/Fail Decision' section of outputs/report.md records why this job
  # passed or failed; the exit code comes from `job result --signal bounds-check`.
  # Inlined from .retry_only_infra_failure in .gitlab-ci.yml (not available in child pipelines).
  retry:
    max: 2
    exit_codes:
      - 42
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
      - api_failure
      - scheduler_failure
      - stale_schedule
      - data_integrity_failure
  script:
    # `datadog-ci` relies on `DATADOG_API_KEY` so we get that here.
    - DATADOG_API_KEY="$("$CI_PROJECT_DIR"/tools/ci/fetch_secret.sh "$AGENT_API_KEY_ORG2" token)" || exit $?; export DATADOG_API_KEY
    # Start by tagging the failure mode as `timeout`. At each smp command we will catch any failure exit codes and update this tag properly.
    # If we successfully get to the end of the script with no failures we will update the `smp_failure_mode` tag to `none` to convey this.
    #
    # Note, in situations where the job times out, this initial value is visible, hence why it defaults to `timeout`
    - datadog-ci tag --level job --tags smp_failure_mode:"timeout"
    # Ensure output files exist for artifact downloads step
    - mkdir outputs # Also needed for smp job sync step
    # Setup AWS credentials for single-machine-performance AWS account
    - AWS_NAMED_PROFILE="single-machine-performance"
    - |
      SMP_ACCOUNT_ID=$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SMP_ACCOUNT account_id) || {
        exit_code=$?
        datadog-ci tag --level job --tags smp_failure_mode:"setup-secrets"
        exit $exit_code
      }
    - SMP_ECR_URL=${SMP_ACCOUNT_ID}.dkr.ecr.us-west-2.amazonaws.com
    - |
      SMP_TEAM_ID=$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SMP_ACCOUNT "${SMP_TEAM_NAME}_team_id") || {
        exit_code=$?
        datadog-ci tag --level job --tags smp_failure_mode:"setup-secrets"
        exit $exit_code
      }
    - |
      SMP_API=$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SMP_ACCOUNT $SMP_API_URL) || {
        exit_code=$?
        datadog-ci tag --level job --tags smp_failure_mode:"setup-secrets"
        exit $exit_code
      }
    - |
      SMP_BOT_ID=$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SMP_ACCOUNT $BOT_LOGIN) || {
        exit_code=$?
        datadog-ci tag --level job --tags smp_failure_mode:"setup-secrets"
        exit $exit_code
      }
    - |
      SMP_BOT_KEY=$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SMP_ACCOUNT $BOT_TOKEN) || {
        exit_code=$?
        datadog-ci tag --level job --tags smp_failure_mode:"setup-secrets"
        exit $exit_code
      }
    - aws configure set aws_access_key_id "$SMP_BOT_ID" --profile ${AWS_NAMED_PROFILE}
    - aws configure set aws_secret_access_key "$SMP_BOT_KEY" --profile ${AWS_NAMED_PROFILE}
    - aws configure set region us-west-2 --profile ${AWS_NAMED_PROFILE}
    # Download smp binary and prepare it for use
    - |
      aws --profile single-machine-performance s3 cp s3://smp-cli-releases/${SMP_VERSION}/x86_64-unknown-linux-musl/smp smp || {
        exit_code=$?
        datadog-ci tag --level job --tags smp_failure_mode:"setup-fetch-cli"
        exit $exit_code
      }
    - chmod +x smp
    - source regression_detector.env
    - echo "Baseline SHA is ${BASELINE_SHA}"
    # Copy the baseline SHA to SMP for debugging purposes later
    - echo -n "${BASELINE_SHA}" > "${CI_COMMIT_SHA}-baseline_sha"
    - aws s3 cp --profile single-machine-performance --only-show-errors "${CI_COMMIT_SHA}-baseline_sha" "s3://${SMP_TEAM_ID}-smp-artifacts/information/"
    - BASELINE_IMAGE=${SMP_ECR_URL}/${SMP_TEAM_ID}-agent:${BASELINE_SHA}-7-full-amd64
    - echo "${BASELINE_SHA} | ${BASELINE_IMAGE}"
    - COMPARISON_IMAGE=${SMP_ECR_URL}/${SMP_TEAM_ID}-agent:${CI_COMMIT_SHA}-7-full-amd64
    - echo "${CI_COMMIT_SHA} | ${COMPARISON_IMAGE}"
    - SMP_TAGS="ci_pipeline_id=${PARENT_PIPELINE_ID},ci_job_id=${CI_JOB_ID},ci_commit_branch=${CI_COMMIT_BRANCH},purpose=agent_ci"
    - echo "Tags passed through SMP are ${SMP_TAGS}"
    - RUST_LOG="info,aws_config::profile::credentials=error"
    - RUST_LOG_DEBUG="debug,aws_config::profile::credentials=error"
    - if [ "$RUN_CONFIG_ONLY" == "true" ]; then
    - !reference [.smp_config_only_job_submit]
    - else
    - !reference [.smp_job_submit]
    - fi
    # Get the SMP Job Id from 'submission-metadata' and use 'datadog-ci'
    # to tag the gitlab job seen in CI Visibility with the SMP Job Id.
    - SMP_JOB_ID=$(jq -r '.jobId' submission_metadata)
    - echo "SMP Job Id is ${SMP_JOB_ID}"
    - datadog-ci tag --level job --tags smp_job_id:${SMP_JOB_ID}
    # Wait for job to complete.
    - |
      RUST_LOG="${RUST_LOG}" ./smp --team-id ${SMP_TEAM_ID} --api-base ${SMP_API} --aws-named-profile ${AWS_NAMED_PROFILE} \
      job status \
      --wait \
      --wait-delay-seconds 60 \
      --submission-metadata submission_metadata || {
        exit_code=$?
        echo "smp job status command failed with code $exit_code"
        datadog-ci tag --level job --tags smp_failure_mode:"job-status"
        exit $exit_code
      }
    # Now that the job is completed pull the analysis artifacts. `job sync` walks a
    # fixed list of filenames and only warns on the ones the backend did not
    # produce, so it stays green as SMP stops rendering views server-side.
    - |
      RUST_LOG="${RUST_LOG}" ./smp --team-id ${SMP_TEAM_ID} --api-base ${SMP_API} --aws-named-profile ${AWS_NAMED_PROFILE} \
      job sync \
      --submission-metadata submission_metadata \
      --output-path outputs || {
        exit_code=$?
        echo "smp job sync command failed with code $exit_code"
        datadog-ci tag --level job --tags smp_failure_mode:"job-sync"
        exit $exit_code
      }
    # `report.json` is the single source of truth for every human-readable view we
    # render below, so a missing or empty one is fatal rather than silently
    # degrading into an empty PR comment.
    - |
      if [[ ! -s outputs/report.json ]]; then
        echo "outputs/report.json is missing or empty -- cannot render reports"
        datadog-ci tag --level job --tags smp_failure_mode:"report-render"
        exit 1
      fi
    # Render the views we consume from `report.json`, client-side. These used to be
    # rendered by the SMP backend and downloaded by `job sync`; rendering them here
    # means the job keeps working once that server-side rendering is removed, and
    # lets us render a repo-owned template without waiting on an SMP release.
    #
    # `report render` is offline: it needs no --team-id/--api-base/--aws-named-profile.
    #
    # RENDER_CONFIG_DIR supplies config.yaml + each experiment.yaml so report links
    # resolve. It is empty for config-only suites, whose experiment files are named
    # `config-only-experiment.yaml` and cannot be parsed by --target-config-dir; the
    # templates then degrade to empty link cells rather than failing the render.
    #
    # `report.md` is the PR comment and uses ${REPORT_TEMPLATE}, a repo-owned
    # condensed template that collapses everything that passed and carries its own
    # CI Pass/Fail Decision section. `severity_report.md` and `junit.xml` use SMP's
    # built-ins unchanged.
    - |
      # Seeded with --report-json so the array is never empty: expanding an empty
      # array as "${arr[@]}" is an unbound-variable error under `set -u` on bash
      # older than 4.4, which would break the config-only job only.
      render_args=(--report-json outputs/report.json)
      if [[ -n "${RENDER_CONFIG_DIR}" ]]; then
        render_args+=(--target-config-dir "${RENDER_CONFIG_DIR}")
      fi
      render_view() {
        # $1: --builtin or --template-file, $2: its value, $3: output basename
        RUST_LOG="${RUST_LOG}" ./smp report render \
        "$1" "$2" \
        "${render_args[@]}" \
        --output-file "outputs/$3" || {
          exit_code=$?
          echo "smp report render $3 failed with code $exit_code"
          datadog-ci tag --level job --tags smp_failure_mode:"report-render"
          exit $exit_code
        }
      }
      render_view --template-file "${REPORT_TEMPLATE}" report.md
      render_view --builtin severity_report.md severity_report.md
      render_view --builtin junit.xml junit.xml
    # Replace empty lines in the output with lines containing various unicode
    # space characters. This avoids
    # https://gitlab.com/gitlab-org/gitlab/-/issues/217231.
    - cat outputs/report.md | sed "s/^\$/$(echo -ne '\uFEFF\u00A0\u200B')/g"
    # Upload JUnit XML outside of Agent CI's tooling because the `junit_upload`
    # invoke task has additional logic that does not seem to apply well to SMP's
    # JUnit XML. Agent CI seems to use `datadog-agent` as the service name when
    # uploading JUnit XML, so the upload command below respects that convention.
    - datadog-ci junit upload --service datadog-agent outputs/junit.xml
    # At this point if the script has not failed the `smp_failure_mode` tag should be none.
    # Although this may not be necessarily true, failures as a result of violations in optimization goals
    # bounds checks and quality gates will be signaled by their own tag.
    - datadog-ci tag --level job --tags smp_failure_mode:"none"
    # Check for failing regression detector for the purpose of tagging.
    # For consistency we start by tagging with smp_optimization_goal:passed and overwrite to failed if a failure is detected.
    - datadog-ci tag --level job --tags smp_optimization_goal:"passed"
    - |
      RUST_LOG="${RUST_LOG}" ./smp --team-id ${SMP_TEAM_ID} --api-base ${SMP_API} --aws-named-profile ${AWS_NAMED_PROFILE} \
        job result \
        --submission-metadata submission_metadata --signal regression-detector || {
        exit_code=$?
        echo "smp regression detector has detected a regression"
        datadog-ci tag --level job --tags smp_optimization_goal:"failed"
      }
    # Quality gates: this is what decides whether the job passes.
    #
    # `job result --signal bounds-check` reads the `bounds_check_signal.json`
    # artifact the backend produced for this job and exits non-zero when it says
    # regressions are present. The backend raises that flag when, for any
    # experiment: the replicate is the comparison variant (so a stale baseline
    # image cannot fail CI), the experiment is not configured `erratic: true`, and
    # any bounds check failed on any replicate.
    #
    # This replaces an inline Python reimplementation of the same rule. The
    # human-readable decision record it used to write is now a section of
    # ${REPORT_TEMPLATE}, rendered from the same report.json.
    #
    # Two tags are derived from the one exit code: `smp_bounds_check` (kept for
    # continuity of existing dashboards) and `smp_quality_gates`. Every Agent
    # bounds check lives on a `quality_gate_*` experiment, so today the two are
    # equivalent; they are reported separately in case that stops being true.
    - datadog-ci tag --level job --tags smp_bounds_check:"passed"
    - datadog-ci tag --level job --tags smp_quality_gates:"passed"
    - |
      RUST_LOG="${RUST_LOG}" ./smp --team-id ${SMP_TEAM_ID} --api-base ${SMP_API} --aws-named-profile ${AWS_NAMED_PROFILE} \
        job result \
        --submission-metadata submission_metadata --signal bounds-check || {
        exit_code=$?
        echo "smp has detected a failed bounds check -- see the CI Pass/Fail Decision section of outputs/report.md"
        datadog-ci tag --level job --tags smp_bounds_check:"failed"
        datadog-ci tag --level job --tags smp_quality_gates:"failed"
        exit $exit_code
      }

single-machine-performance-regression_detector:
  extends:
    - .single-machine-performance-run_regression_detector
  # allow_failure is driven by SMP_ALLOW_FAILURE so the parent trigger can
  # decide per-context without changing this shared child job.
  rules:
    - if: $SMP_ALLOW_FAILURE == "false"
      allow_failure: false
    - when: on_success
      allow_failure: true
  variables:
    SMP_TEAM_NAME: agent
    SMP_API_URL: api_url
    # TODO: pin a released `smp` version once DataDog/single-machine-performance#4693
    # (which introduces `smp report render`) has landed and shipped. All three jobs
    # below must move together, since the report rendering lives in the shared base.
    SMP_VERSION: dev-pr4693-16df80e63
    BOT_LOGIN: bot_login
    BOT_TOKEN: bot_token
    CONFIG_DIR: test/regression
    RENDER_CONFIG_DIR: test/regression

single-machine-performance-metal-runners-regression_detector:
  extends:
    - .single-machine-performance-run_regression_detector
  when: manual
  allow_failure: true
  variables:
    SMP_TEAM_NAME: metal-runners
    SMP_API_URL: metal-runners_api_url
    # Test version
    SMP_VERSION: dev-pr4693-16df80e63
    BOT_LOGIN: bot_login_metal-runners
    BOT_TOKEN: bot_token_metal-runners
    CONFIG_DIR: test/regression/ebpf
    RENDER_CONFIG_DIR: test/regression/ebpf

single-machine-performance-metal-runners-regression_detector_cfg:
  extends:
    - .single-machine-performance-run_regression_detector
  when: manual
  allow_failure: true
  variables:
    SMP_TEAM_NAME: metal-runners
    SMP_API_URL: metal-runners_api_url
    # For testing
    SMP_VERSION: dev-pr4693-16df80e63
    BOT_LOGIN: bot_login_metal-runners
    BOT_TOKEN: bot_token_metal-runners
    RUN_CONFIG_ONLY: "true"
    CONFIG_DIR: test/regression/ebpf/config-only
    # Deliberately empty: `smp report render --target-config-dir` expects
    # `cases/*/experiment.yaml`, but config-only suites use
    # `config-only-experiment.yaml`, so passing the dir would abort the render.
    # Report links are omitted for this job as a result.
    RENDER_CONFIG_DIR: ""


# Shamelessly adapted from golang_deps_commenter job config in
# golang_deps_diff.yml at commit 01da274032e510d617161cf4e264a53292f44e55.
single-machine-performance-regression_detector-pr-comment:
  stage: functional_test
  image:
    name: "486234852809.dkr.ecr.us-east-1.amazonaws.com/pr-commenter:3-jammy"
    entrypoint: [""] # disable entrypoint script for the pr-commenter image
  tags: ["arch:amd64", "specific:true"]
  needs:
    - job: single-machine-performance-regression_detector
  artifacts:
    expire_in: 1 weeks
    paths:
      - report_as_json_string.txt # for debugging transform to valid JSON string
      - pr_comment_payload.json # for debugging PR commenter JSON payload bugs
  variables:
    # Not using the entrypoint script for the pr-commenter image
    FF_KUBERNETES_HONOR_ENTRYPOINT: false
  allow_failure: true # allow_failure here should have same setting as in job above
  script: # ignore error message about no PR, because it happens for dev branches without PRs
    # Prevent posting empty Regression Detector report if Markdown report is not found or
    # has zero size.
    - |
      if [[ ! -s "outputs/report.md" ]]
      then
          echo "ERROR: Regression Detector report not found -- no PR comment posted"
          exit 1
      fi
    # We need to transform the Markdown report into a valid JSON string (without
    # quotes) in order to pass a well-formed payload to the PR commenting
    # service. Note that on macOS, the "-z" flag is invalid for `sed` (but
    # should be fine for GNU `sed`). We need to use `sed` to escape newlines
    # because JSON does not permit (raw) newlines in strings. We use the "-z"
    # option with `sed` because that option treats its input as
    # NUL-character-separated (i.e., '\0'-separated, the zero-byte character),
    # so `sed` does not interpret its input as newline-delimited. We also need
    # to escape double quotes to distinguish literal quotes in the report from
    # the double quotes that delimit the value of the "message" field in the
    # payload.
    # report.md already contains the CI Pass/Fail Decision section, rendered from
    # report.json by the detector job, so nothing needs appending here.
    - cat outputs/report.md | sed -z 's/\n/\\n/g' | sed -z 's/"/\\"/g' > report_as_json_string.txt
    - cat report_as_json_string.txt
    # Transforming the Markdown report to a valid JSON string is easy to foul
    # up, so to make debugging easier, we store the payload in a variable to
    # help debugging.
    - PR_COMMENT_JSON_PAYLOAD='{"org":"DataDog", "repo":"datadog-agent", "commit":"'"${CI_COMMIT_SHA}"'", "header":"Regression Detector", "message":"'"$(cat report_as_json_string.txt)"'"}'
    - printf "%s\n" "PR comment JSON payload:${PR_COMMENT_JSON_PAYLOAD}"
    - printf "%s\n" "${PR_COMMENT_JSON_PAYLOAD}" > pr_comment_payload.json
    # Craft an HTTPS request to pr-commenter service to post Markdown report to
    # GitHub, per
    # https://github.com/DataDog/dd-source/tree/7c941f527fb9c44a73433c7dd0a090d92be7deb4/domains/devex/codex/apps/apis/pr-commenter
    # and gracefully handle the case when the commit being tested is not a PR
    - |
      set +e
      out=$(curl https://pr-commenter.us1.ddbuild.io/internal/cit/pr-comment \
          -H "$(authanywhere)" \
          -H "X-DdOrigin: curl" \
          -X PATCH \
          -d "${PR_COMMENT_JSON_PAYLOAD}")
      exitcode=$?
      set -e
      if [ -n "${out}" ]; then
        if [ $exitcode -eq 0 ]; then
          echo $out
        else
          echo $out >&2
        fi
      fi
      if [ "${out}" != "${out/invalid request: no pr found for this commit}" ]; then
        exit 0
      fi
      exit $exitcode
