# AI Gateway CI smoke test
#
# Verifies that AI Gateway can be called from the GitLab CI runners, following
# https://datadoghq.atlassian.net/wiki/spaces/AIP/pages/5402296601/AI+Gateway+FAQs#How-to-call-AI-Gateway-from-CI
#
# How to run:
#   1. Push a branch containing this change
#   2. In GitLab: Build -> Pipelines -> Run pipeline, add the variable
#      AI_GATEWAY_SMOKE_TEST=true
#   All other jobs/includes are skipped when this variable is set (see the
#   `rules` on the includes in .gitlab-ci.yml), so the pipeline only contains
#   this job.
#
# Notes:
#   - The token for internal service authentication is generated with
#     authanywhere (https://datadoghq.atlassian.net/wiki/spaces/DEVX/pages/3733193227/Authanywhere),
#     audience `rapid-ai-platform`, following what the mcnulty campaigner does
#     (https://github.com/DataDog/dd-source/pull/291048).
#   - From CI the AI Gateway must be reached at the ddbuild datacenter endpoint
#     `https://ai-gateway.us1.ddbuild.io` (the FAQ page mentions
#     `ai-gateway.us1.build.io`, which only resolves from buildbarn/bzl
#     contexts; on EC2 CI runners authanywhere also requires `--dc
#     us1.ddbuild.io` for its AWS-backed token getter).
#   - Internal Service Authentication tokens expire after ~4 hours: fine for a
#     single job, but refresh the token if you reuse this in long-running jobs.

ai_gateway_smoke_test:
  stage: lint
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  needs: []
  variables:
    AI_GATEWAY_DC: "us1.ddbuild.io"
    AI_GATEWAY_AUDIENCE: "rapid-ai-platform"
    # Override to test another model
    AI_GATEWAY_MODEL: "anthropic/claude-haiku-4-5-20251001"
  script:
    # Generate the internal authentication token (do NOT print it)
    - |
      AI_GATEWAY_TOKEN="$(./authanywhere --audience "${AI_GATEWAY_AUDIENCE}" --raw --dc "${AI_GATEWAY_DC}")"
      echo "Acquired AI Gateway token (${#AI_GATEWAY_TOKEN} chars) for audience '${AI_GATEWAY_AUDIENCE}' in dc '${AI_GATEWAY_DC}'"
    # Call the AI Gateway
    - |
      HTTP_CODE=$(curl -sS -o ai_gateway_response.json -w "%{http_code}" \
        -X POST "https://ai-gateway.${AI_GATEWAY_DC}/v1/chat/completions" \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer ${AI_GATEWAY_TOKEN}" \
        -H "source: datadog-agent" \
        -H "org-id: 2" \
        -d "{\"model\":\"${AI_GATEWAY_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with the single word: pong\"}],\"max_tokens\":16}")
      echo "--- AI Gateway response (HTTP ${HTTP_CODE}) ---"
      cat ai_gateway_response.json
      echo ""
      if [ "${HTTP_CODE}" != "200" ]; then
        echo "AI Gateway call failed with HTTP ${HTTP_CODE}"
        exit 1
      fi
      echo "AI Gateway smoke test succeeded"
