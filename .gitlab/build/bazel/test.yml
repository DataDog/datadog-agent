.bazel:test:
  stage: source_test
  needs:
    - job: bazel:run-go-mod-tidy
      artifacts: false
    - job: bazel:run-gazelle
      artifacts: false
  rules:
    - when: on_success

.bazel:test:reporting:
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
  variables:
    EXTERNAL_LINKS_PATH: external_links_$CI_JOB_ID.json
    BEP_FILE: $CI_PROJECT_DIR/bazel-bep.json
    RESULT_JSON: test_output.json
    GIT_DEPTH: 0 # Needed by datadog-ci to collect git metadata
  after_script:
    - dda inv -- -e bazel.process-test-results --bep-file=$BEP_FILE --junit-tar=junit-${CI_JOB_NAME}.tgz --result-json=$RESULT_JSON
    - !reference [.upload_junit_source]
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
      - $RESULT_JSON
      - test_output_unified.json
      - junit-*.tgz
      - bazel-bep.json
    reports:
      annotations:
        - $EXTERNAL_LINKS_PATH

.bazel:test:reporting:ci_links:
  - dda inv -- -e gitlab.generate-ci-visibility-links --output=$EXTERNAL_LINKS_PATH

.bazel:coverage:linux:
  extends: [.bazel:test:reporting, .bazel:test]
  script:
    - !reference [.bazel:test:reporting:ci_links]
    - bazel coverage --config=go --config=gorace --config=dd-agent-go-tests-only --jobs=$KUBERNETES_CPU_REQUEST --build_tests_only --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE //...
  after_script:
    - !reference [.bazel:test:reporting, after_script]
    - cp "$(bazel info output_path)/_coverage/_coverage_report.dat" "$CI_PROJECT_DIR/coverage-bazel-$CI_JOB_NAME_SLUG.out"
    - !reference [.upload_coverage_datadog]
  artifacts:
    paths:
      - $RESULT_JSON
      - test_output_unified.json
      - junit-*.tgz
      - bazel-bep.json
      - coverage-bazel-*.out
  variables:
    COVERAGE_FILE: coverage-bazel-*.out
    KUBERNETES_CPU_REQUEST: 16
    KUBERNETES_MEMORY_REQUEST: "64Gi"
    KUBERNETES_MEMORY_LIMIT: "64Gi"

bazel:coverage:linux-amd64:
  extends: [.bazel:runner:linux-amd64, .bazel:coverage:linux]

bazel:coverage:linux-arm64:
  extends: [.bazel:runner:linux-arm64, .bazel:coverage:linux]

.bazel:test:linux:
  extends: [.bazel:test:reporting, .bazel:test]
  script:
    - !reference [.bazel:test:reporting:ci_links]
    - bazel test --jobs=$KUBERNETES_CPU_REQUEST --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE //...

bazel:test:linux-amd64:
  extends: [.bazel:runner:linux-amd64, .bazel:test:linux]

bazel:test:linux-arm64:
  extends: [.bazel:runner:linux-arm64, .bazel:test:linux]

# One-off diagnosis job: the linux-amd64 unit-test pipeline with ALL Bazel
# action caches disabled (wrapper-injected --disk_cache and the Buildbarn
# remote cache), to determine whether the "link: open ... packages.txt: no
# such file or directory" GoLink failures reproduce without any cache
# involvement. Manual-only: expect it to be much slower than the normal job
# (zero cache hits), so it defaults to the observed-failing targets instead
# of the full //... sweep. Override NO_CACHE_TEST_TARGETS (e.g. to "//...")
# when triggering manually in the GitLab UI. A link-time pass here means the
# fork tree is fine and the failures are cache/materialization-related; a
# repro here means a deterministic fork bug.
bazel:test:linux-amd64-no-cache:
  extends: [.bazel:runner:linux-amd64, .bazel:test:linux]
  variables:
    # Targets used by the post-build diagnostics (aquery graph check,
    # transition chain). Any bazel target label(s) work.
    NO_CACHE_DIAG_TARGETS: "//test/e2e-framework/testing/utils/e2e/client:client_test //pkg/dyninst/irgen:irgen_test_bpf"
  script:
    - !reference [.bazel:test:reporting:ci_links]
    - set +e
    # --config=no-remote-cache clears the remote cache; --disk_cache= overrides
    # the wrapper's injected disk cache (user flags come after the wrapper's).
    # --sandbox_debug retains the sandbox of every failing action; the
    # execution log records every executed action's argv, inputs and outputs.
    - bazel test --config=no-remote-cache --disk_cache= --jobs=$KUBERNETES_CPU_REQUEST --keep_going --remote_download_outputs=toplevel --sandbox_debug --execution_log_json_file=$CI_PROJECT_DIR/execution-log.json --build_event_json_file=$BEP_FILE //...
    - TEST_EXIT=$?
    # --- Diagnostics: run regardless of the test outcome, all into diag/ ---
    - |
      mkdir -p diag
      OB="$(bazel info output_base 2>/dev/null)"
      {
        echo "########## D1: every packages.txt across all output trees ##########"
        find "$OB/execroot/_main/bazel-out" -path '*go_work_sdk/packages.txt' 2>/dev/null | sort | while read -r p; do
          if [ -e "$p" ]; then
            echo "EXISTS    $(stat -c%s "$p" 2>/dev/null || stat -f%z "$p") bytes  $p"
          else
            echo "DANGLING  $p"
          fi
        done
        echo
        echo "########## D2: go_work_sdk repo dirs per output tree ##########"
        find "$OB/execroot/_main/bazel-out" -type d -path '*bin/external/rules_go++go_sdk+go_work_sdk' 2>/dev/null | sort | while read -r d; do
          echo "-- $d"
          ls -la "$d" | sed -n '2,15p'
        done
        echo
        echo "########## D3: retained failing sandboxes (--sandbox_debug) ##########"
        for s in $(ls -dt "$OB"/sandbox/processwrapper-sandbox/*/ 2>/dev/null | head -8); do
          echo "-- $s"
          find "$s" -maxdepth 12 -path '*go_work_sdk*' 2>/dev/null | head -20
        done
        echo
        echo "########## D4: aquery generator/consumer check per failing target ##########"
        for t in $NO_CACHE_DIAG_TARGETS; do
          safe="$(echo "$t" | tr '/:' '__')"
          bazel aquery "deps($t)" --output=text > "diag/aq-$safe.txt" 2>/dev/null
          python3 bazel/tools/packages_txt_diagnostics.py graph-check "diag/aq-$safe.txt" "$t"
        done
        echo
        echo "########## D5: transition chain to :package_list ##########"
        for t in $NO_CACHE_DIAG_TARGETS; do
          bazel cquery --transitions=lite "somepath($t, @@rules_go++go_sdk+go_work_sdk//:package_list)" 2>&1 | head -60
        done
        echo
        echo "########## D6: execution log — packages.txt producers/consumers ##########"
        python3 bazel/tools/packages_txt_diagnostics.py execlog "$CI_PROJECT_DIR/execution-log.json"
        echo
        echo "########## D7: configuration inventory ##########"
        bazel config 2>&1 | head -40
        bazel config --output=text 2>&1 | grep -B3 -A3 orchestrion | head -60
      } 2>&1 | tee diag/diagnosis.txt
    - exit $TEST_EXIT
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
      - $RESULT_JSON
      - test_output_unified.json
      - junit-*.tgz
      - bazel-bep.json
      - diag/
      - execution-log.json
    reports:
      annotations:
        - $EXTERNAL_LINKS_PATH

.bazel:coverage:macos:
  extends: [.bazel:test:reporting, .bazel:test]
  script:
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting:ci_links]
    - bazel coverage --config=go --config=gorace --config=dd-agent-go-tests-only --build_tests_only --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE //...
  after_script:
    - !reference [.macos_cleanup_python_dependencies]
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting, after_script]
    - cp "$(bazel info output_path)/_coverage/_coverage_report.dat" "$CI_PROJECT_DIR/coverage-bazel-$CI_JOB_NAME_SLUG.out"
    - !reference [.upload_coverage_datadog]
  artifacts:
    paths:
      - $RESULT_JSON
      - test_output_unified.json
      - junit-*.tgz
      - bazel-bep.json
      - coverage-bazel-*.out
  variables:
    COVERAGE_FILE: coverage-bazel-*.out

bazel:coverage:macos-amd64:
  extends: [.bazel:runner:macos-amd64, .bazel:coverage:macos]

bazel:coverage:macos-arm64:
  extends: [.bazel:runner:macos-arm64, .bazel:coverage:macos]

.bazel:test:macos:
  extends: [.bazel:test:reporting, .bazel:test]
  script:
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting:ci_links]
    - bazel test --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE //...
  after_script:
    - !reference [.macos_cleanup_python_dependencies]
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting, after_script]

bazel:test:macos-amd64:
  extends: [.bazel:runner:macos-amd64, .bazel:test:macos]

bazel:test:macos-arm64:
  extends: [.bazel:runner:macos-arm64, .bazel:test:macos]

# Windows splits the build from the Go tests, unlike the other platforms: the
# runner has 16 CPUs, and compiling the rest of the repo alongside ~1k
# race-instrumented tests starves them enough that tests waiting on wall-clock
# time fail. rules_go 0.63.0 does not support reliable Bazel coverage on
# Windows, so tests_windows-x64 remains the Windows coverage producer. Revisit
# this when rules_go is upgraded. This job covers everything but the Go tests.
bazel:test:windows-amd64:
  extends: [.bazel:runner:windows-amd64, .bazel:test]
  variables:
    POWERSHELL_SCRIPT: >-
      bazel test --config=gorace --config=no-dd-agent-go-tests --keep_going //... --
      -//bazel/rules/dd_packaging/...
      -//packages/agent/linux/...

bazel:test:windows-amd64:go:
  extends: [.bazel:runner:windows-amd64, .bazel:test]
  variables:
    POWERSHELL_SCRIPT: >-
      bazel test --config=gorace --config=dd-agent-go-tests-only --build_tests_only --keep_going //... --
      -//bazel/rules/dd_packaging/...
      -//packages/agent/linux/...
