.bazel:test:
  stage: source_test
  needs:
    - job: bazel:run-go-mod-tidy
      artifacts: false
    - job: bazel:run-gazelle
      artifacts: false
  rules:
    - when: on_success

.bazel:test:reporting:
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
  variables:
    EXTERNAL_LINKS_PATH: external_links_$CI_JOB_ID.json
    FLAVOR: base
    BEP_FILE: $CI_PROJECT_DIR/bazel-bep-$FLAVOR.json
  after_script:
    - dda inv -- -e bazel.collect-junit --flavor=$FLAVOR --output-tgz=junit-${CI_JOB_NAME}.tgz --bep-file=$BEP_FILE || true
    - !reference [.upload_junit_source]
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
      - junit-*.tgz
      - bazel-bep-*.json
    reports:
      annotations:
        - $EXTERNAL_LINKS_PATH

.bazel:test:reporting:ci_links:
  - dda inv -- -e gitlab.generate-ci-visibility-links --output=$EXTERNAL_LINKS_PATH

bazel:test:linux-amd64:
  extends: [.bazel:test:reporting, .bazel:runner:linux-amd64, .bazel:test]
  script:
    - !reference [.bazel:test:reporting:ci_links]
    # THROWAWAY: break down the restored bazel/go/pip caches by size and
    # file count, to see what could be shrunk down (cf. Slack thread on CI
    # runner init time, 2026-08-06). Not meant to be merged.
    - |
      set -euo pipefail
      for d in .cache/bazel/*/cache .cache/go .cache/ms-go .cache/pip; do
        if [ -d "$d" ]; then
          echo "=== $d ==="
          du -sh "$d"
          du -h --max-depth=2 "$d" | sort -rh | awk 'NR<=20'
          echo "$(find "$d" -type f | wc -l) files"
        else
          echo "=== $d: absent ==="
        fi
      done
      echo "=== .cache/bazel/*/cache deep dive ==="
      for d in .cache/bazel/*/cache; do
        [ -d "$d" ] || continue
        echo "--- $d: depth-6 breakdown ---"
        du -h --max-depth=6 "$d" | sort -rh | awk 'NR<=40'
        echo "--- $d: 20 largest files ---"
        find "$d" -type f -printf '%s %p\n' | sort -rn \
          | awk 'NR<=20 {printf "%10.1fM  %s\n", $1/1048576, $2}'
        echo "--- $d: age histogram (by mtime) ---"
        find "$d" -type f -printf '%T@ %s\n' | awk -v now="$(date +%s)" '
          {
            age_days = (now - $1) / 86400
            if (age_days < 7) bucket = "  <7d"
            else if (age_days < 30) bucket = " 7-30d"
            else if (age_days < 90) bucket = "30-90d"
            else bucket = "  >90d"
            count[bucket]++
            total[bucket] += $2
          }
          END { for (b in total) printf "%-8s %8d files  %10.1fM\n", b, count[b], total[b]/1048576 }'
      done
    - bazel test --config=gorace --jobs=$KUBERNETES_CPU_REQUEST --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE //...

bazel:test:linux-arm64:
  extends: [.bazel:test:reporting, .bazel:runner:linux-arm64, .bazel:test]
  script:
    - !reference [.bazel:test:reporting:ci_links]
    - bazel test --config=gorace --jobs=$KUBERNETES_CPU_REQUEST --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE //...

bazel:test:macos-amd64:
  extends: [.bazel:test:reporting, .bazel:runner:macos-amd64, .bazel:test]
  script:
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting:ci_links]
    - bazel test --config=gorace --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE //...
  after_script:
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting, after_script]

bazel:test:macos-arm64:
  extends: [.bazel:test:reporting, .bazel:runner:macos-arm64, .bazel:test]
  script:
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting:ci_links]
    - bazel test --config=gorace --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE --execution_log_compact_file=$CI_PROJECT_DIR/bazel-exec.log //...
  after_script:
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting, after_script]
  artifacts:
    paths:
      - junit-*.tgz
      - bazel-bep-*.json
      - bazel-exec.log

# Windows splits the build from the Go tests, unlike the other platforms: the
# runner has 16 CPUs, and compiling the rest of the repo alongside ~1k
# race-instrumented tests starves them enough that tests waiting on wall-clock
# time fail. This job covers everything but the Go tests.
bazel:test:windows-amd64:
  extends: [.bazel:runner:windows-amd64, .bazel:test]
  variables:
    POWERSHELL_SCRIPT: >-
      bazel test --config=gorace --config=no-dd-agent-go-tests --keep_going //... --
      -//bazel/rules/dd_packaging/...
      -//packages/agent/linux/...

bazel:test:windows-amd64:go:
  extends: [.bazel:runner:windows-amd64, .bazel:test]
  variables:
    POWERSHELL_SCRIPT: >-
      bazel test --config=gorace --config=dd-agent-go-tests-only --build_tests_only --keep_going //... --
      -//bazel/rules/dd_packaging/...
      -//packages/agent/linux/...
