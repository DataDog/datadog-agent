.bazel:test:
  stage: source_test
  needs:
    - job: bazel:run-go-mod-tidy
      artifacts: false
    - job: bazel:run-gazelle
      artifacts: false
  rules:
    - when: on_success

.bazel:test:reporting:
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
  variables:
    EXTERNAL_LINKS_PATH: external_links_$CI_JOB_ID.json
    BEP_FILE: $CI_PROJECT_DIR/bazel-bep.json
    RESULT_JSON: test_output.json
    GIT_DEPTH: 0  # Needed by datadog-ci to collect git metadata
  after_script:
    - dda inv -- -e bazel.process-test-results --bep-file=$BEP_FILE --junit-tar=junit-${CI_JOB_NAME}.tgz --result-json=$RESULT_JSON
    - !reference [.upload_junit_source]
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
      - $RESULT_JSON
      - test_output_unified.json
      - junit-*.tgz
      - bazel-bep.json
    reports:
      annotations:
        - $EXTERNAL_LINKS_PATH

.bazel:test:reporting:ci_links:
  - dda inv -- -e gitlab.generate-ci-visibility-links --output=$EXTERNAL_LINKS_PATH

.bazel:coverage:linux:
  extends: [.bazel:test:reporting, .bazel:test]
  script:
    - !reference [.bazel:test:reporting:ci_links]
    - bazel coverage --config=go --config=gorace --config=dd-agent-go-tests-only --jobs=$KUBERNETES_CPU_REQUEST --build_tests_only --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE //...
  after_script:
    - !reference [.bazel:test:reporting, after_script]
    - cp "$(bazel info output_path)/_coverage/_coverage_report.dat" "$CI_PROJECT_DIR/coverage-bazel-$CI_JOB_NAME_SLUG.out"
    - !reference [.upload_coverage_datadog]
  artifacts:
    paths:
      - $RESULT_JSON
      - test_output_unified.json
      - junit-*.tgz
      - bazel-bep.json
      - coverage-bazel-*.out
  variables:
    COVERAGE_FILE: coverage-bazel-*.out
    KUBERNETES_CPU_REQUEST: 16
    KUBERNETES_MEMORY_REQUEST: "64Gi"
    KUBERNETES_MEMORY_LIMIT: "64Gi"

bazel:coverage:linux-amd64:
  extends: [.bazel:runner:linux-amd64, .bazel:coverage:linux]

bazel:coverage:linux-arm64:
  extends: [.bazel:runner:linux-arm64, .bazel:coverage:linux]

.bazel:test:linux:
  extends: [.bazel:test:reporting, .bazel:test]
  script:
    - !reference [.bazel:test:reporting:ci_links]
    - bazel test --jobs=$KUBERNETES_CPU_REQUEST --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE //...

bazel:test:linux-amd64:
  extends: [.bazel:runner:linux-amd64, .bazel:test:linux]

bazel:test:linux-arm64:
  extends: [.bazel:runner:linux-arm64, .bazel:test:linux]

# Deliberately manual and limited to Linux amd64 to validate whether the
# Agent can build libdd-rc's native dependencies from source. Keep native
# outputs on failures so the first CI runs provide enough evidence to refine
bazel:rc-x509-ffi:linux-amd64:
  extends: .bazel:runner:linux-amd64
  stage: source_test
  needs: []
  rules:
    - when: manual
      allow_failure: true
  variables:
    RC_X509_ARTIFACTS_DIR: $CI_PROJECT_DIR/rc-x509-artifacts
  script:
    - uname -a
    - bazel version
    - cc --version
    - ld --version
    - command -v cmake && cmake --version
    - command -v go && go version
    - command -v perl && perl --version
    - bazel cquery -c opt --output=files @libdd_rc_source//:rc_x509_ffi | tee rc-x509-declared-outputs.txt
    - bazel build -c opt --jobs=$KUBERNETES_CPU_REQUEST --verbose_failures --remote_download_outputs=all @libdd_rc_source//:rc_x509_ffi
  after_script:
    - mkdir -p "$RC_X509_ARTIFACTS_DIR"
    - mv rc-x509-declared-outputs.txt "$RC_X509_ARTIFACTS_DIR/" 2>/dev/null || true
    - |-
      output_path="$(bazel info output_path 2>/dev/null)" || true
      if [ -n "$output_path" ]; then
        find "$output_path" -type f \( -name '*rc_x509_ffi*.a' -o -name 'libaws_lc_fips*' \) -print > "$RC_X509_ARTIFACTS_DIR/native-outputs.txt" || true
      else
        : > "$RC_X509_ARTIFACTS_DIR/native-outputs.txt"
      fi
    - |-
      while IFS= read -r native_output; do
        cp "$native_output" "$RC_X509_ARTIFACTS_DIR/"
      done < "$RC_X509_ARTIFACTS_DIR/native-outputs.txt"
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
      - rc-x509-artifacts/

.bazel:coverage:macos:
  extends: [.bazel:test:reporting, .bazel:test]
  script:
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting:ci_links]
    - bazel coverage --config=go --config=gorace --config=dd-agent-go-tests-only --build_tests_only --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE //...
  after_script:
    - !reference [.macos_cleanup_python_dependencies]
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting, after_script]
    - cp "$(bazel info output_path)/_coverage/_coverage_report.dat" "$CI_PROJECT_DIR/coverage-bazel-$CI_JOB_NAME_SLUG.out"
    - !reference [.upload_coverage_datadog]
  artifacts:
    paths:
      - $RESULT_JSON
      - test_output_unified.json
      - junit-*.tgz
      - bazel-bep.json
      - coverage-bazel-*.out
  variables:
    COVERAGE_FILE: coverage-bazel-*.out

bazel:coverage:macos-amd64:
  extends: [.bazel:runner:macos-amd64, .bazel:coverage:macos]

bazel:coverage:macos-arm64:
  extends: [.bazel:runner:macos-arm64, .bazel:coverage:macos]

.bazel:test:macos:
  extends: [.bazel:test:reporting, .bazel:test]
  script:
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting:ci_links]
    - bazel test --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE //...
  after_script:
    - !reference [.macos_cleanup_python_dependencies]
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting, after_script]

bazel:test:macos-amd64:
  extends: [.bazel:runner:macos-amd64, .bazel:test:macos]

bazel:test:macos-arm64:
  extends: [.bazel:runner:macos-arm64, .bazel:test:macos]

# Windows splits the build from the Go tests, unlike the other platforms: the
# runner has 16 CPUs, and compiling the rest of the repo alongside ~1k
# race-instrumented tests starves them enough that tests waiting on wall-clock
# time fail. rules_go 0.63.0 does not support reliable Bazel coverage on
# Windows, so tests_windows-x64 remains the Windows coverage producer. Revisit
# this when rules_go is upgraded. This job covers everything but the Go tests.
bazel:test:windows-amd64:
  extends: [.bazel:runner:windows-amd64, .bazel:test]
  variables:
    POWERSHELL_SCRIPT: >-
      bazel test --config=gorace --config=no-dd-agent-go-tests --keep_going //... --
      -//bazel/rules/dd_packaging/...
      -//packages/agent/linux/...

bazel:test:windows-amd64:go:
  extends: [.bazel:runner:windows-amd64, .bazel:test]
  variables:
    POWERSHELL_SCRIPT: >-
      bazel test --config=gorace --config=dd-agent-go-tests-only --build_tests_only --keep_going //... --
      -//bazel/rules/dd_packaging/...
      -//packages/agent/linux/...
