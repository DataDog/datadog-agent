.bazel:test:
  stage: source_test
  needs:
    - job: bazel:run-go-mod-tidy
      artifacts: false
    - job: bazel:run-gazelle
      artifacts: false
  rules:
    - when: on_success

.bazel:test:reporting:
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
  variables:
    EXTERNAL_LINKS_PATH: external_links_$CI_JOB_ID.json
    BEP_FILE: $CI_PROJECT_DIR/bazel-bep.json
    RESULT_JSON: test_output.json
    GIT_DEPTH: 1000  # Needed by datadog-ci to collect git metadata
  after_script:
    - dda inv -- -e bazel.process-test-results --bep-file=$BEP_FILE --junit-tar=junit-${CI_JOB_NAME}.tgz --result-json=$RESULT_JSON
    - !reference [.upload_junit_source]
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
      - $RESULT_JSON
      - test_output_unified.json
      - junit-*.tgz
      - bazel-bep.json
    reports:
      annotations:
        - $EXTERNAL_LINKS_PATH

.bazel:test:reporting:ci_links:
  - dda inv -- -e gitlab.generate-ci-visibility-links --output=$EXTERNAL_LINKS_PATH

.bazel:coverage:linux:
  extends: [.bazel:test:reporting, .bazel:test]
  script:
    - !reference [.bazel:test:reporting:ci_links]
    - bazel coverage --config=go --config=gorace --config=dd-agent-go-tests-only --jobs=$KUBERNETES_CPU_REQUEST --build_tests_only --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE //... -- -//test/new-e2e/...
  after_script:
    - !reference [.bazel:test:reporting, after_script]
    - cp "$(bazel info output_path)/_coverage/_coverage_report.dat" "$CI_PROJECT_DIR/coverage-bazel-$CI_JOB_NAME_SLUG.out"
    - !reference [.upload_coverage_datadog]
  artifacts:
    paths:
      - $RESULT_JSON
      - test_output_unified.json
      - junit-*.tgz
      - bazel-bep.json
      - coverage-bazel-*.out
  variables:
    COVERAGE_FILE: coverage-bazel-*.out
    KUBERNETES_CPU_REQUEST: 16
    KUBERNETES_MEMORY_REQUEST: "64Gi"
    KUBERNETES_MEMORY_LIMIT: "64Gi"

bazel:coverage:linux-amd64:
  extends: [.bazel:runner:linux-amd64, .bazel:coverage:linux]

bazel:coverage:linux-arm64:
  extends: [.bazel:runner:linux-arm64, .bazel:coverage:linux]

.bazel:test:linux:
  extends: [.bazel:test:reporting, .bazel:test]
  script:
    - !reference [.bazel:test:reporting:ci_links]
    - bazel test --jobs=$KUBERNETES_CPU_REQUEST --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE //... -- -//test/new-e2e/...

bazel:test:linux-amd64:
  extends: [.bazel:runner:linux-amd64, .bazel:test:linux]

bazel:test:linux-arm64:
  extends: [.bazel:runner:linux-arm64, .bazel:test:linux]

.bazel:coverage:macos:
  extends: [.bazel:test:reporting, .bazel:test]
  script:
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting:ci_links]
    - bazel coverage --config=go --config=gorace --config=dd-agent-go-tests-only --build_tests_only --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE //... -- -//test/new-e2e/...
  after_script:
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting, after_script]
    - cp "$(bazel info output_path)/_coverage/_coverage_report.dat" "$CI_PROJECT_DIR/coverage-bazel-$CI_JOB_NAME_SLUG.out"
    - !reference [.upload_coverage_datadog]
  artifacts:
    paths:
      - $RESULT_JSON
      - test_output_unified.json
      - junit-*.tgz
      - bazel-bep.json
      - coverage-bazel-*.out
  variables:
    COVERAGE_FILE: coverage-bazel-*.out

bazel:coverage:macos-amd64:
  extends: [.bazel:runner:macos-amd64, .bazel:coverage:macos]

bazel:coverage:macos-arm64:
  extends: [.bazel:runner:macos-arm64, .bazel:coverage:macos]

.bazel:test:macos:
  extends: [.bazel:test:reporting, .bazel:test]
  script:
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting:ci_links]
    - bazel test --keep_going --remote_download_outputs=toplevel --build_event_json_file=$BEP_FILE //... -- -//test/new-e2e/...
  after_script:
    - !reference [.install_python_dependencies]
    - !reference [.bazel:test:reporting, after_script]

bazel:test:macos-amd64:
  extends: [.bazel:runner:macos-amd64, .bazel:test:macos]

bazel:test:macos-arm64:
  extends: [.bazel:runner:macos-arm64, .bazel:test:macos]

# Windows Bazel test jobs run inside docker and do not use .bazel:test:reporting
# (no dda after_script on the runner today). Collect failed test.log files from
# the bind-mounted output base so CI failures name the exact Rust/Go test.
.bazel:test:windows:collect_failed_testlogs:
  - |
    $ErrorActionPreference = 'Stop'
    $dest = Join-Path $env:CI_PROJECT_DIR $env:BAZEL_FAILED_TESTLOGS_DIR
    New-Item -ItemType Directory -Force -Path $dest | Out-Null
    $testlogsRoot = Join-Path $env:CI_PROJECT_DIR '.cache\bob\execroot\_main\bazel-out'
    if (-not (Test-Path $testlogsRoot)) {
      Write-Host "No Bazel testlogs under $testlogsRoot"
      exit 0
    }
    Get-ChildItem -Path $testlogsRoot -Recurse -Filter test.log | ForEach-Object {
      $content = Get-Content -Path $_.FullName -Raw
      if ($content -match '(?m)^test result: FAILED\.|^failures:|panicked at') {
        $label = ($_.DirectoryName -replace [regex]::Escape($testlogsRoot), '') -replace '\\', '/' -replace '^/', ''
        $outName = ($label -replace '/', '__') + '__test.log'
        Copy-Item -Path $_.FullName -Destination (Join-Path $dest $outName)
        Write-Host "Collected failed test log: $outName"
      }
    }

.bazel:test:windows:
  extends: [.bazel:test]
  variables:
    BAZEL_FAILED_TESTLOGS_DIR: bazel-failed-testlogs
  after_script:
    - !reference [.bazel:test:windows:collect_failed_testlogs]
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
      - bazel-bep.json
      - bazel-failed-testlogs/

# Windows splits the build from the Go tests, unlike the other platforms: the
# runner has 16 CPUs, and compiling the rest of the repo alongside ~1k
# race-instrumented tests starves them enough that tests waiting on wall-clock
# time fail. rules_go 0.63.0 does not support reliable Bazel coverage on
# Windows, so tests_windows-x64 remains the Windows coverage producer. Revisit
# this when rules_go is upgraded. This job covers everything but the Go tests.
bazel:test:windows-amd64:
  extends: [.bazel:runner:windows-amd64, .bazel:test:windows]
  variables:
    POWERSHELL_SCRIPT: >-
      bazel test --config=gorace --config=no-dd-agent-go-tests --keep_going
      --remote_download_outputs=toplevel --build_event_json_file=bazel-bep.json
      //... --
      -//test/new-e2e/...
      -//bazel/rules/dd_packaging/...
      -//packages/agent/linux/...

bazel:test:windows-amd64:go:
  extends: [.bazel:runner:windows-amd64, .bazel:test:windows]
  variables:
    POWERSHELL_SCRIPT: >-
      bazel test --config=gorace --config=dd-agent-go-tests-only --build_tests_only --keep_going
      --remote_download_outputs=toplevel --build_event_json_file=bazel-bep.json
      //... --
      -//test/new-e2e/...
      -//bazel/rules/dd_packaging/...
      -//packages/agent/linux/...
