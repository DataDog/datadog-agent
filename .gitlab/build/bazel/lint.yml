.bazel:lint:
  stage: lint
  after_script:
    - |-
      if [ $CI_JOB_STATUS = failed ]; then
        echo >&2 "💡 To fix the above problem, please consider applying the following remediation:"
        echo >&2 "$REMEDIATION"
      fi

bazel:mod-deps:
  extends: [ .bazel:lint, .bazel:runner:linux-amd64 ]
  script:
    # Why not `bazel mod deps --lockfile_mode=error`:
    # 1. `bazel` servers on persistent runners cache non-local repository rules, causing stale checks (#incident-46079),
    # 2. `--lockfile_mode=error` doesn't print discrepancies exhaustively, especially on rules_* lock files.
    #
    # Instead:
    # 1. use `--lockfile_mode=refresh` to forcibly re-evaluate non-local repository rules,
    # 2. use `git diff --exit-code` to still fail on any discrepancies while printing them exhaustively.
    - bazel mod deps --lockfile_mode=refresh
    - git diff --exit-code
  variables:
    REMEDIATION: "bazel mod deps"

bazel:mod-tidy:
  extends: [ .bazel:lint, .bazel:runner:linux-amd64 ]
  script:
    - bazel mod tidy --lockfile_mode=off
    - git diff --exit-code
  variables:
    REMEDIATION: "bazel mod tidy"

bazel:query-missing-manual-tags:
  extends: [ .bazel:lint, .bazel:runner:linux-amd64 ]
  script:
    - |-
      locations="$(bazel query 'kind("go_test", rdeps(//test/new-e2e/..., //test/e2e-framework/testing/e2e)) except attr(tags, manual, //test/new-e2e/...)' --output=location)"
      if [ -n "$locations" ]; then
        echo >&2 'Found missing "manual" tags in e2e test targets:'
        echo >&2 "$locations"
        exit 1
      fi
  variables:
    REMEDIATION: 'Add "manual" tags to each of the above locations'

bazel:run-buildifier-test:
  extends: [ .bazel:lint, .bazel:runner:linux-amd64 ]
  script:
    - bazel run //bazel/buildifier:test
  variables:
    REMEDIATION: "bazel run //bazel/buildifier"

bazel:run-gazelle:
  extends: [ .bazel:lint, .bazel:runner:linux-amd64 ]
  script:
    - bazel run //:gazelle -- -mode=diff
  variables:
    REMEDIATION: "bazel run //:gazelle"

bazel:run-go-mod-tidy:
  extends: [ .bazel:lint, .bazel:runner:linux-amd64 ]
  script:
    - bazel run //:go_mod_tidy_all -- -diff
  variables:
    REMEDIATION: "bazel run //:go_mod_tidy_all"
