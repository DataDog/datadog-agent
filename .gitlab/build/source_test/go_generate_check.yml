---
# check that go generate has been run in the pkg/security directory
security_go_generate_check:
  extends: .bazel:defs:cache:progressive
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  stage: source_test
  needs: ["go_deps", "go_tools_deps"]
  variables:
    KUBERNETES_CPU_REQUEST: 4
  before_script:
    - !reference [.retrieve_linux_go_deps]
    - !reference [.retrieve_linux_go_tools_deps]
  script:
    - dda inv -- -e security-agent.go-generate-check

# check that test/new-e2e/run/scenarios_import_gen.go is up to date
new_e2e_scenario_imports_check:
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  stage: source_test
  needs: ["go_deps"]
  before_script:
    - !reference [.retrieve_linux_go_deps]
  script:
    # Single source of truth: the Go generator, also used by
    # `go generate ./test/new-e2e/run/` and the validate-scenario-imports pre-commit hook.
    - go run ./tools/generate-scenario-imports/main.go -check
