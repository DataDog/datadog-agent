---
# check that the security-agent mocks are up to date; the other generated
# files are covered by the Bazel diff tests in bazel:test:*
security_go_generate_check:
  extends: .bazel:defs:cache:progressive
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  stage: source_test
  needs: ["go_deps"]
  variables:
    KUBERNETES_CPU_REQUEST: 4
  before_script:
    - !reference [.retrieve_linux_go_deps]
  script:
    - dda inv -- -e security-agent.go-generate-check
