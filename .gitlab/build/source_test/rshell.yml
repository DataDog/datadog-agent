---
.on_rshell_changes:
  - !reference [.except_disable_unit_tests]
  - !reference [.on_main_or_release_branch]
  - if: $RUN_UNIT_TESTS == "on"
  - changes:
      compare_to: $COMPARE_TO_BRANCH
      paths:
        - pkg/rshell/**/*
        - .gitlab/build/source_test/rshell.yml
        - .gitlab/build/bazel/**/*
        - .gitlab-ci.yml
        - .go-version
        - go.mod
        - go.sum
        - go.work
        - modules.yml
        - MODULE.bazel*
        - BUILD.bazel
        - REPO.bazel
        - .bazelrc
        - .bazelversion
        - bazel/**/*
        - tasks/build_tags.bzl
        - tools/ci/bazel-coverage-windows.ps1

.rshell_tests:
  rules:
    - !reference [.on_rshell_changes]
  variables:
    RSHELL_TESTS: "true"
    BAZEL_TEST_TARGETS: "//pkg/rshell/..."

rshell:test:linux-amd64:
  extends: [.bazel:runner:linux-amd64, .bazel:test:linux, .rshell_tests]

rshell:coverage:linux-amd64:
  extends: [.bazel:runner:linux-amd64, .bazel:coverage:linux, .rshell_tests]

rshell:test:linux-arm64:
  extends: [.bazel:runner:linux-arm64, .bazel:test:linux, .rshell_tests]

rshell:coverage:linux-arm64:
  extends: [.bazel:runner:linux-arm64, .bazel:coverage:linux, .rshell_tests]

rshell:test:macos-amd64:
  extends: [.bazel:runner:macos-amd64, .bazel:test:macos, .rshell_tests]

rshell:coverage:macos-amd64:
  extends: [.bazel:runner:macos-amd64, .bazel:coverage:macos, .rshell_tests]

rshell:test:macos-arm64:
  extends: [.bazel:runner:macos-arm64, .bazel:test:macos, .rshell_tests]

rshell:coverage:macos-arm64:
  extends: [.bazel:runner:macos-arm64, .bazel:coverage:macos, .rshell_tests]

rshell:test:windows-amd64:
  extends: [bazel:test:windows-amd64:go, .rshell_tests]
  variables:
    POWERSHELL_SCRIPT: >-
      bazel test --config=dd-agent-go-tests-only --build_tests_only --keep_going //pkg/rshell/...

rshell:coverage:windows-amd64:
  extends: [bazel:coverage:windows-amd64, .rshell_tests]
  variables:
    POWERSHELL_SCRIPT: >-
      & './tools/ci/bazel-coverage-windows.ps1'
      -BepFile 'bazel-bep.json'
      -ResultJson 'test_output.json'
      -JunitTar 'junit-${CI_JOB_NAME_SLUG}.tgz'
      -CoverageOut 'coverage-bazel-${CI_JOB_NAME_SLUG}.out'
      -Targets @('//pkg/rshell/...')
