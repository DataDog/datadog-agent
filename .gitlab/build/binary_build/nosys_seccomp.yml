---
# Build nosys.so (the LD_PRELOAD shim installed in the agent, cluster-agent,
# and base-image containers), instead of recompiling it from source inside
# every image's own `docker build`.
.nosys_seccomp-build_common:
  stage: binary_build
  timeout: 15m
  # Runs in the merge queue (no .except_mergequeue) on purpose: docker_build_base_image
  # and its downstream consumers (host-profiler, ot-agent standalone images) run
  # unconditionally, so this producer must be available whenever they are.
  rules:
    - when: on_success
  needs: []
  script:
    # This is desired, but the bazel toolchain needlessly adds -lpthread.
    # bazel build --platforms=//bazel/platforms:${NOSYS_SECCOMP_BAZEL_PLATFORM} //Dockerfiles/nosys-seccomp:nosys.so
    # cp -v "$(bazelisk info bazel-bin --platforms=//bazel/platforms:${NOSYS_SECCOMP_BAZEL_PLATFORM})/Dockerfiles/nosys-seccomp/nosys.so" Dockerfiles/nosys-seccomp/nosys.so
    - cd Dockerfiles/nosys-seccomp ; gcc -O2 -fPIC -shared -Wl,--version-script=nosys.sym -o nosys.so nosys.c
  artifacts:
    paths:
      - Dockerfiles/nosys-seccomp/nosys.so

nosys_seccomp-build_amd64:
  extends: [.bazel:runner:linux-amd64, .nosys_seccomp-build_common]
  variables:
    NOSYS_SECCOMP_BAZEL_PLATFORM: linux_x86_64

nosys_seccomp-build_arm64:
  extends: [.bazel:runner:linux-arm64, .nosys_seccomp-build_common]
  variables:
    NOSYS_SECCOMP_BAZEL_PLATFORM: linux_arm64
