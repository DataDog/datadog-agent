---
cluster_agent_cloudfoundry-build_amd64:
  extends: .bazel:defs:cache:progressive
  rules:
    - !reference [.except_light_pipeline]
    - when: on_success
  stage: binary_build
  timeout: 25m
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  needs: ["go_deps"]
  artifacts:
    expire_in: 2 weeks
    paths:
      - $OMNIBUS_PACKAGE_DIR
  variables:
    ARCH: amd64
    KUBERNETES_CPU_REQUEST: 4
  before_script:
    - !reference [.retrieve_linux_go_deps]
  script:
    - echo "DEBUG hostname=$(hostname)"
    - echo "DEBUG XDG_CACHE_HOME=$XDG_CACHE_HOME"
    - echo "DEBUG BAZELISK_HOME=$BAZELISK_HOME"
    - ls -la "$BAZELISK_HOME" || echo "DEBUG BAZELISK_HOME missing"
    - ls -la "$XDG_CACHE_HOME/bazelisk" || echo "DEBUG XDG_CACHE_HOME/bazelisk missing"
    - dda inv -- check-go-version
    - dda inv -- -e cluster-agent-cloudfoundry.build
    - cd $CI_PROJECT_DIR/$CLUSTER_AGENT_CLOUDFOUNDRY_BINARIES_DIR
    - strip datadog-cluster-agent-cloudfoundry
    - mkdir -p $OMNIBUS_PACKAGE_DIR
    - PACKAGE_VERSION=$(dda inv agent.version --url-safe) || exit $?
    - tar cf $OMNIBUS_PACKAGE_DIR/datadog-cluster-agent-cloudfoundry-$PACKAGE_VERSION-$ARCH.tar.xz datadog-cluster-agent-cloudfoundry
