---
build_fakeintake:
  stage: binary_build
  timeout: 15m
  rules:
    - !reference [.except_light_pipeline]
    - !reference [.except_fakeintake_off_main]
    - !reference [.on_fakeintake_changes]
  needs: []
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  script:
    - dda inv -- fakeintake.build

# Runs in the merge queue (no .except_light_pipeline) on purpose: the queue rebases each PR
# onto up-to-date main before running this, so two PRs that bumped VERSION to the same
# value will have the second one fail here and be forced to re-bump. See
# tasks/fakeintake.py:check_version_bump and test/fakeintake/AGENTS.md.
fakeintake_check_version_bump:
  stage: binary_build
  timeout: 15m
  rules:
    # Run only when fakeintake VERSION change on release branch PRs
    - if: '$COMPARE_TO_BRANCH =~ /^[0-9]+\.[0-9]+\.x$/'
      changes:
        paths:
          - test/fakeintake/version/VERSION
        compare_to: $COMPARE_TO_BRANCH
    - !reference [.except_fakeintake_off_main]
    - !reference [.on_fakeintake_changes]
  needs: []
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  variables:
    GIT_DEPTH: 0 # Full history: fakeintake.check-version-bump uses merge-base
  script:
    - dda inv -- fakeintake.check-version-bump
