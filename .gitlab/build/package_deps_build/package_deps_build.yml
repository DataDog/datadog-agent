---
# package_deps_build stage
# Contains jobs to build dependencies needed for datadog-agent packages

.generate_minimized_btfs_common:
  stage: package_deps_build
  rules:
    - when: on_success
  script:
    - |
      # RUN_ALL_BUILDS and release branches minimize every kernel again instead of reusing remote cache results
      if [[ "$RUN_ALL_BUILDS" == "true" || "$CI_COMMIT_BRANCH" =~ ^[0-9]+\.[0-9]+\.x$ ]]; then
        export BAZEL_BTF_FLAGS=--noremote_accept_cached
      fi
    - bazel test --test_output=errors ${BAZEL_BTF_FLAGS:-} //pkg/ebpf:minimized_btfs //pkg/ebpf:minimized_btfs_test
    - install -m 0644 "$(bazel info bazel-bin)/pkg/ebpf/minimized_btfs.tar.xz" $CI_PROJECT_DIR/minimized-btfs.tar.xz
  artifacts:
    expire_in: 2 weeks
    paths:
    - $CI_PROJECT_DIR/minimized-btfs.tar.xz

generate_minimized_btfs_x64:
  extends: [.bazel:runner:linux-amd64, .generate_minimized_btfs_common]

generate_minimized_btfs_arm64:
  extends: [.bazel:runner:linux-arm64, .generate_minimized_btfs_common]
