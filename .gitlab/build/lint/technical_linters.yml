.lint:
  stage: lint
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  needs: []

lint_most:
  stage: lint
  extends: [.bazel:runner:linux-amd64]
  tags: ["arch:amd64", "specific:true"]
  needs: []
  script:
    - experimental/aiuto/technical_linters.sh

lint_licenses:
  extends: [.lint, .bazel:defs:cache:progressive]
  script:
    - dda inv -- -e lint-licenses

check_modules_replace:
  extends: .lint
  needs: ["go_deps"]
  before_script:
    - !reference [.retrieve_linux_go_deps]
  script:
    - dda inv -- -e modules.check-all-replace

validate_experiment_systemd_units:
  extends: .lint
  rules: !reference [.on_installer_systemd_changes]
  script:
    - dda inv -- -e installer.generate-experiment-units --check

lint_releasenotes_rst:
  extends: .lint
  rules: !reference [.on_releasenotes_changes]
  variables:
    GIT_DEPTH: 0  # Full history: linter.rst-releasenotes --only-changed uses merge-base
  script:
    - dda inv -- -e linter.rst-releasenotes --only-changed

lint_releasenotes_unique_ids:
  extends: .lint
  rules:
    - !reference [.on_light_pipeline]
    - !reference [.on_releasenotes_changes]
  script:
    - dda inv -- -e linter.releasenote-unique-ids

lint_config_schema:
  extends: .lint
  rules:
    - !reference [.on_main]
    - changes:
        paths:
          - pkg/config/schema/**/*
          - tasks/schema/**/*
        compare_to: $COMPARE_TO_BRANCH
  script:
    - dda inv -- -e schema.lint

lint_rtloader:
  extends: .lint
  rules: !reference [.on_rtloader_changes]
  script:
    - dda inv -- -e rtloader.make --install-prefix=$CI_PROJECT_DIR/dev
    - dda inv -- -e rtloader.format --raise-if-changed
