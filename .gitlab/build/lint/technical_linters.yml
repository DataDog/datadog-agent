.lint:
  stage: lint
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  needs: []

# Apply the expanded file coverage to changes while existing broad linters
# continue to enforce their repository-wide requirements.
.lint_changed_files:
  extends: .lint
  variables:
    GIT_DEPTH: 0
  before_script:
    - git fetch origin "$COMPARE_TO_BRANCH"
    - |
      # Mainline pushes compare their endpoints; PRs compare from the merge base.
      if [ "${CI_COMMIT_BRANCH:-}" = "$COMPARE_TO_BRANCH" ]; then
        CHANGED_FILES_BASE="${CI_COMMIT_BEFORE_SHA:-HEAD^}"
        if [ "$CHANGED_FILES_BASE" = "0000000000000000000000000000000000000000" ]; then
          CHANGED_FILES_BASE=HEAD^
        fi
      else
        CHANGED_FILES_BASE=$(git merge-base FETCH_HEAD HEAD)
      fi
      export CHANGED_FILES_BASE

lint_licenses:
  extends: [.lint, .bazel:defs:cache:progressive]
  script:
    - dda inv -- -e lint-licenses

lint_rust_licenses:
  extends: [.lint, .rust_internal_registry]
  script:
    - dda inv -- -e lint-rust-licenses

lint_shell:
  extends: .lint_changed_files
  script:
    - shellcheck --version
    - shellcheck --severity=info -e SC2059 -e SC2028 ./cmd/**/*.sh ./omnibus/package-scripts/*/*
    - dda inv -- -e pre-commit.check-shellcheck --base "$CHANGED_FILES_BASE"

lint_github_actions:
  extends: .lint
  script:
    - go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
    - dda inv -- -e pre-commit.check-actionlint --all-files

lint_shell_no_set_x:
  extends: .lint
  script:
    - dda inv -- -e pre-commit.check-set-x --all-files

lint_go_format:
  extends: .lint_changed_files
  script:
    - dda inv -- -e pre-commit.check-go-fmt --base "$CHANGED_FILES_BASE"

lint_cpp_format:
  extends: .lint_changed_files
  script:
    - clang-format --version
    - dda inv -- -e pre-commit.check-clang-format --base "$CHANGED_FILES_BASE"

lint_release_json_newline:
  extends: .lint
  script:
    - dda inv -- -e pre-commit.check-release-json-newline

lint_filename:
  extends: .lint
  script:
    - dda inv -- -e linter.filenames

lint_copyrights:
  extends: .lint
  script:
    - dda inv -- -e linter.copyrights

lint_docs_links:
  extends: .lint
  script:
    - dda inv -- -e linter.docs-links

lint_e2e_internet_access:
  extends: .lint
  script:
    - dda self dep sync -f go-ast
    - dda inv -- -e linter.e2e-internet-access

lint_codeowners:
  extends: .lint
  script:
    - dda inv -- -e github.lint-codeowner

lint_components:
  extends: .lint
  script:
    - dda inv -- -e lint-components lint-fxutil-oneshot-test

lint_gopls_plugin:
  extends: .lint
  script:
    - dda inv -- -e claude.set-buildtags --check

lint_python:
  extends: .lint
  script:
    - dda inv -- -e linter.python --show-versions

lint_update_go:
  extends: .lint
  script:
    - dda inv -- -e linter.update-go

validate_modules:
  extends: .lint
  script:
    - dda inv -- -e modules.validate
    - dda inv -- -e modules.validate-used-by-otel

check_modules_replace:
  extends: .lint
  needs: ["go_deps"]
  before_script:
    - !reference [.retrieve_linux_go_deps]
  script:
    - dda inv -- -e modules.check-all-replace

validate_experiment_systemd_units:
  extends: .lint
  rules: !reference [.on_installer_systemd_changes]
  script:
    - dda inv -- -e installer.generate-experiment-units --check

lint_releasenotes_rst:
  extends: .lint
  rules: !reference [.on_releasenotes_changes]
  variables:
    GIT_DEPTH: 0  # Full history: linter.rst-releasenotes --only-changed uses merge-base
  script:
    - dda inv -- -e linter.rst-releasenotes --only-changed

lint_releasenotes_unique_ids:
  extends: .lint
  rules:
    - !reference [.on_light_pipeline]
    - !reference [.on_releasenotes_changes]
  script:
    - dda inv -- -e linter.releasenote-unique-ids

lint_releasenotes_reused_uids:
  extends: .lint
  rules: !reference [.on_releasenotes_changes]
  variables:
    GIT_DEPTH: 0  # Full history: looks for past deletions of the added notes' UIDs
  script:
    - dda inv -- -e linter.releasenote-reused-uids --only-changed

lint_config_schema:
  extends: .lint
  rules:
    - !reference [.on_main]
    - changes:
        paths:
          - pkg/config/schema/**/*
          - tasks/schema/**/*
        compare_to: $COMPARE_TO_BRANCH
  script:
    - dda inv -- -e schema.lint
