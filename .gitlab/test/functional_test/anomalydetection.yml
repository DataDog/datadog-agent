observer-ablation-driver-tests:
  stage: source_test
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  needs: []
  rules:
    - !reference [.except_mergequeue]
    - changes:
        paths:
          - tasks/anomalydetection.py
          - tasks/libs/anomalydetection/**/*
          - tasks/unit_tests/anomalydetection*.py
          - .gitlab/test/functional_test/anomalydetection.yml
        compare_to: $COMPARE_TO_BRANCH
  script:
    - dda self dep sync -f legacy-tasks -f anomalydetection
    - dda inv --feat anomalydetection invoke-unit-tests.run --directory=tasks/unit_tests --tests=anomalydetection_ablation,anomalydetection_ddeval,anomalydetection_eval

observer-ablation-ddeval:
  extends: .dd_octo_sts
  stage: functional_test
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  rules:
    - !reference [.except_mergequeue]
    - !reference [.manual]
  # A failed orchestration job may still have a live workflow. Resume explicitly from its artifacts.
  retry: 0
  needs: []
  # One job builds/publishes once, then runs sequential experiments.
  resource_group: observer-ablation-ddeval
  timeout: 7h
  variables:
    KUBERNETES_CPU_REQUEST: "4"
    KUBERNETES_MEMORY_REQUEST: "8Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
    AWS_SHARED_CREDENTIALS_FILE: "$CI_PROJECT_DIR/.aws/credentials"
    # Leave time to collect checkpoints when the script exceeds its budget.
    RUNNER_SCRIPT_TIMEOUT: 6h50m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 2m
    OBSERVER_ABLATION_DATASET: "Golden 25"
    OBSERVER_ABLATION_DATASET_VERSION: "0"
    OBSERVER_ABLATION_SCENARIO_CONCURRENCY: "6"
    OBSERVER_ABLATION_COMBOS: "10"
    OBSERVER_ABLATION_SEARCH_TRIALS: "5"
    OBSERVER_ABLATION_TUNE_TRIALS: "20"
    OBSERVER_ABLATION_SEED: "42"
    OBSERVER_ABLATION_LIMIT: "0"
    OBSERVER_ABLATION_RESUME_JOB_ID: ""
  script:
    - |
      mkdir -p "$(dirname "$AWS_SHARED_CREDENTIALS_FILE")"
      ci-identities-gitlab-job-client assume-role
    - dda self dep sync -f legacy-tasks -f anomalydetection
    - dda inv --feat anomalydetection anomalydetection.ablation-ci
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        if [ -f observer-ablation-ddeval/study.json ] && [ -f observer-ablation-ddeval/testbench.json ]; then
          echo "Job interrupted. To continue this ablation study, rerun this job with:"
          echo "OBSERVER_ABLATION_RESUME_JOB_ID=$CI_JOB_ID"
        else
          echo "No resumable ablation checkpoint was created in this job. Check the failure above."
          echo "If this was a resume attempt, retain the previous OBSERVER_ABLATION_RESUME_JOB_ID."
        fi
      fi
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - observer-ablation-ddeval/
