observer-build-upload-ddeval-testbench:
  stage: functional_test
  extends: .dd_octo_sts
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  timeout: 30m
  rules:
    - !reference [.except_mergequeue]
    - when: manual
      allow_failure: true
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  needs: []
  allow_failure: true
  interruptible: false
  variables:
    GIT_STRATEGY: clone
    KUBERNETES_CPU_REQUEST: "4"
    KUBERNETES_MEMORY_REQUEST: "8Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
    AWS_SHARED_CREDENTIALS_FILE: "$CI_PROJECT_DIR/.aws/credentials-by-job-id/$CI_JOB_ID"
    CI_IDENTITIES_CLIENT_VERSION: "v0.6.6"
    OBSERVER_ABLATION_ARTIFACT_BUCKET: "observer-log-ad-eval-artifacts-ddbuild"
  script:
    - |
      if [[ -z "${CI_IDENTITIES_GITLAB_ID_TOKEN:-}" ]]; then
        echo "CI_IDENTITIES_GITLAB_ID_TOKEN is not available to the job."
        exit 1
      fi
      ci_identity_client="$CI_PROJECT_DIR/ci-identities-gitlab-job-client"
      aws s3 cp \
        "s3://binaries-ddbuild-io-prod/ci-identities/ci-identities-gitlab-job-client/versions/${CI_IDENTITIES_CLIENT_VERSION}/ci-identities-gitlab-job-client-linux-amd64" \
        "$ci_identity_client"
      chmod +x "$ci_identity_client"
      mkdir -p "$(dirname "$AWS_SHARED_CREDENTIALS_FILE")"
      "$ci_identity_client" assume-role
    - bash tasks/anomalydetection/ddeval/publish-testbench.sh
  artifacts:
    when: always
    expire_in: 2 weeks
    reports:
      dotenv: observer-ddeval-testbench.env
    paths:
      - observer-ddeval-testbench.env
      - observer-ddeval-testbench.json

observer-ablation-ddeval:
  stage: functional_test
  extends: .dd_octo_sts
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  timeout: 6h
  rules:
    - !reference [.except_mergequeue]
    - when: manual
      allow_failure: true
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  needs: []
  allow_failure: true
  interruptible: false
  variables:
    GIT_STRATEGY: clone
    KUBERNETES_CPU_REQUEST: "4"
    KUBERNETES_MEMORY_REQUEST: "8Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
    AWS_SHARED_CREDENTIALS_FILE: "$CI_PROJECT_DIR/.aws/credentials-by-job-id/$CI_JOB_ID"
    CI_IDENTITIES_CLIENT_VERSION: "v0.6.6"
    OBSERVER_ABLATION_OUTPUT_DIR: "$CI_PROJECT_DIR/observer-ablation-ddeval"
    # Full manual ablation against the established Golden 25 dataset.
    # This is 10 component combinations × 5 search trials, followed by
    # 20 tuning trials for the winning combination.
    OBSERVER_ABLATION_N_COMBOS: "10"
    OBSERVER_ABLATION_N_TRIALS_SEARCH: "5"
    OBSERVER_ABLATION_N_TRIALS_TUNE: "20"
    OBSERVER_ABLATION_DDEVAL_DATASET: "Golden 25"
    OBSERVER_ABLATION_DDEVAL_LIMIT: "0"
    OBSERVER_ABLATION_DDEVAL_JOBS: "6"
    OBSERVER_ABLATION_DDEVAL_MAX_ATTEMPTS: "1"
    OBSERVER_ABLATION_DDEVAL_WHERE_IN: ""
    OBSERVER_ABLATION_DD_SITE: "datadoghq.com"
    OBSERVER_ABLATION_AGENT_CI_API_ENV: "prod"
    OBSERVER_ABLATION_ARTIFACT_BUCKET: "observer-log-ad-eval-artifacts-ddbuild"
  script:
    - |
      if [[ -z "${CI_IDENTITIES_GITLAB_ID_TOKEN:-}" ]]; then
        echo "CI_IDENTITIES_GITLAB_ID_TOKEN is not available to the job."
        exit 1
      fi
      ci_identity_client="$CI_PROJECT_DIR/ci-identities-gitlab-job-client"
      aws s3 cp \
        "s3://binaries-ddbuild-io-prod/ci-identities/ci-identities-gitlab-job-client/versions/${CI_IDENTITIES_CLIENT_VERSION}/ci-identities-gitlab-job-client-linux-amd64" \
        "$ci_identity_client"
      chmod +x "$ci_identity_client"
      mkdir -p "$(dirname "$AWS_SHARED_CREDENTIALS_FILE")"
      "$ci_identity_client" assume-role
    - mkdir -p "$OBSERVER_ABLATION_OUTPUT_DIR"
    - DD_API_KEY="$("$CI_PROJECT_DIR"/tools/ci/fetch_secret.sh "$AGENT_API_KEY_ORG2" token)" || exit $?; export DD_API_KEY
    - DD_APP_KEY="$("$CI_PROJECT_DIR"/tools/ci/fetch_secret.sh "$AGENT_APP_KEY_ORG2" token)" || exit $?; export DD_APP_KEY
    - export DD_SITE="$OBSERVER_ABLATION_DD_SITE"
    - dda inv agent-ci-api.hello --env "$OBSERVER_ABLATION_AGENT_CI_API_ENV"
    - python3 -m pip install optuna
    - |
      bash "$CI_PROJECT_DIR/tasks/anomalydetection/ddeval/publish-testbench.sh"
      source observer-ddeval-testbench.env

      if [[ -n "${OBSERVER_ABLATION_SCENARIOS:-}" ]]; then
        echo "OBSERVER_ABLATION_SCENARIOS is only supported for local scenario directories."
        echo "Use OBSERVER_ABLATION_DDEVAL_WHERE_IN to filter remote ddeval dataset records."
        exit 1
      fi
      experiment_config="$CI_PROJECT_DIR/observer-ddeval-experiment-config.json"
      jq \
        --arg uri "$OBSERVER_ABLATION_TESTBENCH_URI" \
        --arg sha256 "$OBSERVER_ABLATION_TESTBENCH_SHA256" \
        '.executor_config.binary_artifacts = {
          testbench: {
            uri: $uri,
            sha256: $sha256,
            filename: "anomalydetection-testbench"
          }
        }' \
        "$CI_PROJECT_DIR/tasks/anomalydetection/ddeval/observer-log-ad-experiment-config.json" \
        > "$experiment_config"
      WHERE_IN_ARG=""
      if [[ -n "$OBSERVER_ABLATION_DDEVAL_WHERE_IN" ]]; then
        WHERE_IN_ARG="--ddeval-where-in $OBSERVER_ABLATION_DDEVAL_WHERE_IN"
      fi
      dda inv --dep optuna anomalydetection.eval-pipeline \
        --eval-backend ddeval \
        --ddeval-submitter agent-ci-api \
        --ddeval-config-template "$experiment_config" \
        --n-combos "$OBSERVER_ABLATION_N_COMBOS" \
        --n-trials-search "$OBSERVER_ABLATION_N_TRIALS_SEARCH" \
        --n-trials-tune "$OBSERVER_ABLATION_N_TRIALS_TUNE" \
        --ddeval-dataset "$OBSERVER_ABLATION_DDEVAL_DATASET" \
        --ddeval-limit "$OBSERVER_ABLATION_DDEVAL_LIMIT" \
        --ddeval-jobs "$OBSERVER_ABLATION_DDEVAL_JOBS" \
        --ddeval-max-attempts "$OBSERVER_ABLATION_DDEVAL_MAX_ATTEMPTS" \
        --output-dir "$OBSERVER_ABLATION_OUTPUT_DIR" \
        --overwrite \
        $WHERE_IN_ARG
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - observer-ablation-ddeval/
