oracle:
  allow_failure: true #incident-51958
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  stage: functional_test
  needs: ["go_deps"]
  rules:
    - !reference [.except_mergequeue]
    - when: on_success
  services:
    - alias: "oracle"
      name: "registry.ddbuild.io/images/mirror/oracle:${DBMS_VERSION}"
      entrypoint: ["/bin/bash", "-c"]
      command:
        - |
          (
            while sleep 2; do
              if [ -d "$CI_PROJECT_DIR/oracle-ci-logs" ]; then
                for logfile in /tmp/oracle-startup.log "$ORACLE_BASE"/diag/rdbms/*/*/trace/alert*.log; do
                  if [ -f "$logfile" ]; then
                    target="$CI_PROJECT_DIR/oracle-ci-logs/$(basename "$logfile")"
                    cp "$logfile" "$target.tmp" && mv "$target.tmp" "$target"
                  fi
                done
              fi
            done
          ) &
          exec "$ORACLE_BASE/$RUN_FILE" > >(tee /tmp/oracle-startup.log) 2>&1
      variables:
        ORACLE_PWD: "datad0g"
  variables:
    CI_DEBUG_SERVICES: "true"
    DD_HOSTNAME: "oracle-test"
    # Configure static CPUs
    KUBERNETES_POD_ANNOTATIONS_1: "ci.ddbuild.io/enforce-static-cpus=true"
    KUBERNETES_CPU_LIMIT: "3"
    KUBERNETES_MEMORY_LIMIT: "6Gi"
    KUBERNETES_SERVICE_CPU_REQUEST: "1"
    KUBERNETES_SERVICE_MEMORY_LIMIT: "6Gi"
  parallel:
    matrix:
      - DBMS_VERSION: "21.3.0-xe"
  before_script:
    - mkdir -p oracle-ci-logs && chmod 0777 oracle-ci-logs
    - !reference [.retrieve_linux_go_deps]
  script:
    - dda inv -- oracle.test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - oracle-ci-logs/*.log
