single_machine_performance-regression_detector-merge_base_check:
  stage: functional_test
  timeout: 10m
  rules:
    - !reference [.except_coverage_pipeline]
    # On main: wait for the agent image to land in ECR before checking for baselines.
    - if: $CI_COMMIT_BRANCH == "main"
      needs:
        - job: single_machine_performance-full-amd64-a7
          artifacts: false
    # On dev branches: no needs — runs at the start of functional_test for fast feedback.
    - !reference [.on_dev_branches_with_artifact_changes]
  needs: []
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/docker_x64$CI_IMAGE_DOCKER_X64_SUFFIX:$CI_IMAGE_DOCKER_X64
  tags: ["arch:amd64", "specific:true"]
  artifacts:
    expire_in: 1 day
    paths:
      - regression_detector.env
    reports:
      dotenv: regression_detector.env  # Expose BASELINE_SHA as a CI variable for the trigger job
  variables:
    GIT_DEPTH: 0  # Ensure we can fetch full history for merge-base calculation
  script:
    # `datadog-ci` relies on `DATADOG_API_KEY` so we get that here.
    - DATADOG_API_KEY="$("$CI_PROJECT_DIR"/tools/ci/fetch_secret.sh "$AGENT_API_KEY_ORG2" token)" || exit $?; export DATADOG_API_KEY
    # Fetch origin to ensure we have latest main branch
    - git fetch origin
    # Get the base branch from release.json
    - SMP_BASE_BRANCH=$(dda inv release.get-release-json-value base_branch --no-worktree)
    # Compute four days before now as UNIX timestamp
    - FOUR_DAYS_BEFORE_NOW=$(date --date="-4 days +1 hour" "+%s")
    # Determine baseline SHA based on whether we're on the base branch or a dev branch
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$SMP_BASE_BRANCH" ]]; then
          # On the base branch, use the parent commit as the baseline
          BASELINE_SHA=$(git rev-parse "${CI_COMMIT_SHA}^")
          echo "On base branch, using parent commit ${BASELINE_SHA} as initial baseline"
      else
          # On a dev branch, compute the merge base with the base branch
          echo "Looking for merge base for branch ${SMP_BASE_BRANCH}"
          SMP_MERGE_BASE=$(git merge-base ${CI_COMMIT_SHA} origin/${SMP_BASE_BRANCH})
          echo "Merge base is ${SMP_MERGE_BASE}"
          BASELINE_SHA="${SMP_MERGE_BASE}"
      fi
    # Setup AWS credentials for single-machine-performance AWS account to check ECR images
    - AWS_NAMED_PROFILE="single-machine-performance"
    - SMP_ACCOUNT_ID=$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SMP_ACCOUNT account_id) || exit $?
    - SMP_AGENT_TEAM_ID=$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SMP_ACCOUNT agent_team_id) || exit $?
    - SMP_BOT_ID=$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SMP_ACCOUNT bot_login) || exit $?
    - SMP_BOT_KEY=$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SMP_ACCOUNT bot_token) || exit $?
    - aws configure set aws_access_key_id "$SMP_BOT_ID" --profile ${AWS_NAMED_PROFILE}
    - aws configure set aws_secret_access_key "$SMP_BOT_KEY" --profile ${AWS_NAMED_PROFILE}
    - aws configure set region us-west-2 --profile ${AWS_NAMED_PROFILE}

    # Check if image exists for the baseline SHA, walking backwards on the
    # commit graph until a container corresponding to the possible baseline is
    # found, or the possible baseline commit is too old. If the commit is too
    # old, the container corresponding to that commit has probably expired.
    #
    # We intentionally omit checking whether the baseline commit is too old
    # *before* the loop in order to provide ourselves with a break-glass option
    # in scenarios where we would like to use an old commit as a baseline (e.g.,
    # backporting bugfixes to a release branch). In such a scenario, we could
    # run CI on the release branch to generate a baseline image, even if the
    # commit is too old. However, we also only omit the commit age check once so
    # that we can still use it on predecessor commits that are usually older than
    # the current commit under test -- this check gives us a fast-fail condition so
    # we avoid wasting time checking for expired images in common cases.
    - echo "Checking if image exists for commit ${BASELINE_SHA}..."
    - |
      while [[ ! $(aws ecr describe-images --region us-west-2 --profile single-machine-performance --registry-id "${SMP_ACCOUNT_ID}" --repository-name "${SMP_AGENT_TEAM_ID}-agent" --image-ids imageTag="${BASELINE_SHA}-7-full-amd64") ]]
      do
          echo "No image exists for ${BASELINE_SHA} - checking predecessor of ${BASELINE_SHA} next"
          BASELINE_SHA=$(git rev-parse ${BASELINE_SHA}^)
          echo "Checking if commit ${BASELINE_SHA} is recent enough..."
          BASELINE_COMMIT_TIME=$(git -c log.showSignature=false show --no-patch --format=%ct ${BASELINE_SHA})
          if [[ ${BASELINE_COMMIT_TIME} -le ${FOUR_DAYS_BEFORE_NOW} ]]
          then
              echo "ERROR: Baseline commit (${BASELINE_SHA}) for this branch (${CI_COMMIT_BRANCH}) is too old for SMP. Please update your branch by merging or rebasing it onto an up-to-date ${SMP_BASE_BRANCH} branch."
              # Updating onto ${SMP_BASE_BRANCH} makes its tip this branch's new
              # merge base, so the next pipeline needs a baseline image for that
              # tip. A release branch can sit idle long enough for its tip's
              # image to age out of ECR, in which case that next pipeline fails
              # here too -- costing another image build, which takes 40-60
              # minutes once started plus unknown runner queue time. Start the
              # build now so it overlaps with the update instead of following it.
              #
              # Release branches only: a merge base with main has almost always
              # been built already by some other recent pipeline, and updating
              # onto main costs one pipeline rather than two.
              #
              # Best-effort -- a failure to trigger is reported but does not
              # change this job's outcome, which is a failure either way.
              if [[ "$SMP_BASE_BRANCH" =~ ^[0-9]+\.[0-9]+\.x$ ]]
              then
                  SMP_BASE_TIP=$(git rev-parse "origin/${SMP_BASE_BRANCH}")
                  # Trigger only on a *confirmed* miss. Throttling, expired
                  # credentials and network errors all leave `describe-images`
                  # stdout empty too, so the `[[ ! $(...) ]]` test the loop
                  # above uses cannot tell "no such image" from "could not
                  # check". Guessing wrong is cheap in that loop -- it steps
                  # back one commit -- but here it starts an ~860-job pipeline,
                  # and the two failures correlate: credentials expiring
                  # mid-loop is itself a way to reach this branch spuriously.
                  # The distinguishing information is on stderr, so capture
                  # that and discard stdout. `if VAR=$(...)` is exempt from
                  # `set -e`.
                  if SMP_ECR_ERROR=$(aws ecr describe-images --region us-west-2 --profile single-machine-performance --registry-id "${SMP_ACCOUNT_ID}" --repository-name "${SMP_AGENT_TEAM_ID}-agent" --image-ids imageTag="${SMP_BASE_TIP}-7-full-amd64" 2>&1 >/dev/null)
                  then
                      echo "A baseline image already exists for the ${SMP_BASE_BRANCH} tip (${SMP_BASE_TIP})"
                  elif [[ "${SMP_ECR_ERROR}" != *ImageNotFoundException* ]]
                  then
                      echo "WARNING: could not determine whether a baseline image exists for the ${SMP_BASE_BRANCH} tip (${SMP_BASE_TIP}), so not triggering a rebuild: ${SMP_ECR_ERROR}"
                  else
                      echo "No baseline image exists for the ${SMP_BASE_BRANCH} tip (${SMP_BASE_TIP}) - triggering a pipeline to build one now"
                      # Report the triggered pipeline's URL rather than an
                      # expected duration, which would go stale as build times
                      # and runner queue depths change.
                      #
                      # `POST /trigger/pipeline`, not `POST /pipeline`: GitLab
                      # allowlists `CI_JOB_TOKEN` for the former only, and it
                      # authenticates through a `token` body parameter rather
                      # than a header. `tasks/pipeline.py` starts child
                      # pipelines the same way, for the same reason.
                      #
                      # This call therefore cannot be reproduced verbatim outside
                      # a running job, since job tokens exist only inside one. A
                      # personal token minted with `dda inv auth.gitlab` works
                      # the other way around: it may use `POST /pipeline`, but is
                      # not a valid `token` value for the trigger endpoint, which
                      # accepts only trigger and job tokens. So the equivalent
                      # local command is the `PRIVATE-TOKEN` one printed below,
                      # aimed at a different endpoint on purpose.
                      #
                      # `CI_API_V4_URL` is https://gitlab.ddbuild.io/api/v4 and
                      # `CI_PROJECT_ID` is 4670 for this project.
                      #
                      # The trailing `|| true` on both lines keeps this
                      # best-effort. The runner runs this script under
                      # `set -eo pipefail`, where a bare `VAR=$(failing-cmd)`
                      # aborts the block -- which would skip the warning and
                      # self-service output below, the most useful thing this
                      # branch prints. `--fail` also makes curl exit nonzero on
                      # an HTTP error while emitting nothing, and `jq` exits
                      # nonzero on a non-JSON body, so the empty-string check
                      # below is what actually detects failure.
                      SMP_REBUILD_PIPELINE=$(curl --silent --show-error --fail --request POST --data "token=${CI_JOB_TOKEN}" --data "ref=${SMP_BASE_BRANCH}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/trigger/pipeline" || true)
                      SMP_REBUILD_PIPELINE_URL=$(echo "${SMP_REBUILD_PIPELINE}" | jq -r '.web_url // empty' || true)
                      if [[ -z "${SMP_REBUILD_PIPELINE_URL}" ]]
                      then
                          SMP_REBUILD_TRIGGERED="false"
                          echo "WARNING: could not trigger a pipeline on ${SMP_BASE_BRANCH} - one may need to be started manually"
                      else
                          SMP_REBUILD_TRIGGERED="true"
                          echo "Triggered ${SMP_REBUILD_PIPELINE_URL} on ${SMP_BASE_BRANCH}"
                          # Name the job that publishes the image rather than
                          # linking it. Resolving its URL means listing the
                          # pipeline's jobs, and GitLab allowlists `CI_JOB_TOKEN`
                          # for only `GET /job` out of the whole Jobs API, so that
                          # lookup cannot succeed from here whatever it is given.
                          echo "The baseline image for ${SMP_BASE_TIP} is published by the single_machine_performance-full-amd64-a7 job, listed at ${SMP_REBUILD_PIPELINE_URL}/builds"
                      fi
                      echo "NOTE: this job will keep failing until that image is published to SMP's ECR registry, so wait for it before re-running this job."
                      # Give a self-service path to starting the build. Needed
                      # when the trigger above failed, and also when a triggered
                      # pipeline dies for reasons outside this job -- CI runners
                      # are taken offline for maintenance periodically, which
                      # kills the pipelines on them.
                      #
                      # `dda inv auth.gitlab` prints feature-flag lines to stdout
                      # before the token, so the `tail -1` is load-bearing: without
                      # it those lines land in the header value and curl fails with
                      # "curl: (43) bad argument".
                      echo "To start that pipeline yourself -- if the trigger above failed, or if the"
                      echo "pipeline is cancelled, e.g. by CI runner maintenance -- either open"
                      echo "    https://gitlab.ddbuild.io/DataDog/datadog-agent/-/pipelines/new?ref=${SMP_BASE_BRANCH}"
                      echo "and click the blue \"New pipeline\" button, or run this command from a"
                      echo "datadog-agent checkout:"
                      echo "    curl --silent --show-error --fail \\"
                      echo "        --request POST \\"
                      echo "        --header \"PRIVATE-TOKEN: \$(dda inv auth.gitlab | tail -1)\" \\"
                      echo "        --data \"ref=${SMP_BASE_BRANCH}\" \\"
                      echo "        \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipeline\""
                      # Report the outcome, not the attempt -- tagging "true"
                      # unconditionally would hide the trigger's failure rate.
                      datadog-ci tag --level job --tags smp_baseline_rebuild_triggered:"${SMP_REBUILD_TRIGGERED}"
                  fi
              fi
              datadog-ci tag --level job --tags smp_merge_base_failure_reason:"branch_too_old"
              exit 1
          fi
          echo "Commit ${BASELINE_SHA} is recent enough"
          echo "Checking if image exists for commit ${BASELINE_SHA}..."
      done
    - echo "Image exists for commit ${BASELINE_SHA}"
    # Save the baseline SHA to an artifact file
    - echo "BASELINE_SHA=${BASELINE_SHA}" > regression_detector.env
    - echo "Merge-base check passed. Baseline SHA saved to artifact."

# Trigger a child pipeline for SMP regression detection.
# The parent pipeline does NOT wait for this child pipeline (no strategy: depend),
# so the main pipeline completes without blocking on the ~1h SMP run.
.trigger-single-machine-performance-regression_detector:
  stage: functional_test
  needs:
    - job: single_machine_performance-regression_detector-merge_base_check
      artifacts: true  # Passes BASELINE_SHA dotenv variable to child pipeline
    - job: single_machine_performance-full-amd64-a7
      artifacts: false  # Ensures comparison image is in ECR before child pipeline starts (dev branches)
      optional: true  # Build job may not run if triggered only via RUN_E2E_TESTS or experiments
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
    BASELINE_SHA: $BASELINE_SHA  # Forwarded from the merge_base_check dotenv artifact
    FF_KUBERNETES_HONOR_ENTRYPOINT: false
  trigger:
    include:
      - local: .gitlab/childs/smp-regression-child-pipeline.yml
    # No strategy: depend — parent pipeline does not wait for the child pipeline to finish

# This job is used to run the regression detector on dev branches. On dev branches, we allow the pipeline to continue.
trigger-single-machine-performance-regression_detector:
  extends:
    - .trigger-single-machine-performance-regression_detector
  rules:
    - !reference [.except_coverage_pipeline]
    - !reference [.on_dev_branches_with_artifact_changes]  # Run when artifact-impacting files change
  allow_failure: true

# This job is used to run the regression detector on the main branch. It remains
# linked to the parent pipeline, but the detector job is currently allowed to
# fail on main while #incident-57148 is investigated.
trigger-single-machine-performance-regression_detector-main:
  extends:
    - .trigger-single-machine-performance-regression_detector
  rules:
    - !reference [.except_coverage_pipeline]
    - !reference [.on_main]  # Run on every main commit
  trigger:
    strategy: depend
  variables:
    SMP_ALLOW_FAILURE: "true"

# SMP Experiment Selection (POC): post/refresh the checkbox comment that drives
# the agent regression_detector run. It is a flat list of selectable folders
# (each directory directly containing a `cases/`, minus quality_gates and ebpf),
# one checkbox per folder; ticking a folder runs its whole subtree. quality_gates
# is omitted because it always runs (force-included by the run job). Refreshes on
# dev-branch pipelines and whenever experiment configs change, so adding a folder
# on a branch updates the list.
#
# Rendering + the state-preserving merge are done by `smp experiments list
# --format github-comment` (the CLI owns discovery, the checkbox format, and the
# merge); this job is just the GitHub-API glue: resolve the PR, read the current
# comment, feed it to the CLI as --previous-comment, and edit the comment in
# place so ticked selections PERSIST across pipelines. The comment is read-
# modify-written directly via the GitHub API (not the pr-commenter service).
# Because it is posted with the octo-sts token, it is authored by the same bot
# as the "Gitlab CI Configuration Changes" comment (which quotes this job's YAML,
# marker included) -- so the comment is identified by the marker on the FIRST
# line of the body (startswith), not by author. The
# `single-machine-performance-regression_detector` job reads it back at run time
# with the same finder and `smp experiments parse-comment`.
smp-experiment-selection-comment:
  stage: functional_test
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/docker_x64$CI_IMAGE_DOCKER_X64_SUFFIX:$CI_IMAGE_DOCKER_X64
  tags: ["arch:amd64", "specific:true"]
  needs: []
  # Child pipelines cannot !reference .dd_octo_sts from .gitlab-ci.yml, so the
  # octo-sts id_token is declared inline (same aud as .dd_octo_sts).
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  variables:
    # Needed to fetch the smp CLI (which now renders the comment). SMP_ACCOUNT is
    # a pipeline global (also used by the merge_base_check job).
    SMP_VERSION: dev-pr4640-2299f1770 # dev build with the `smp experiments` command group (SMP PR 4640)
    BOT_LOGIN: bot_login
    BOT_TOKEN: bot_token
  rules:
    - !reference [.except_coverage_pipeline]
    - !reference [.on_dev_branches_with_artifact_changes]
    - changes:
        paths:
          - test/regression/**/*
        compare_to: main
  allow_failure: true # never block a pipeline on the convenience comment
  script:
    - |
      set +e
      MARKER="<!-- smp-experiment-selection -->"
      ROOT="test/regression"
      # --- Resolve PR + read the existing selection comment (best effort) ---
      GITHUB_TOKEN=$(dd-octo-sts token --scope DataDog/datadog-agent --policy self.gitlab.comment-pr 2>/dev/null)
      PR_NUMBER=""
      if [ -n "${GITHUB_TOKEN}" ]; then
        PR_NUMBER=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          "https://api.github.com/repos/DataDog/datadog-agent/commits/${CI_COMMIT_SHA}/pulls" \
          | jq -r '.[0].number // empty')
      fi
      if [ -z "${PR_NUMBER}" ]; then
        echo "No PR for ${CI_COMMIT_SHA}; nothing to post (dev branch without a PR)."
        exit 0
      fi
      # Our comment is the one whose body STARTS WITH the marker (the CI-config
      # diff comment only contains the marker inside a fenced code block). Grab
      # its id (to edit in place) and body (to feed the CLI merge).
      COMMENTS=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
        "https://api.github.com/repos/DataDog/datadog-agent/issues/${PR_NUMBER}/comments?per_page=100")
      COMMENT_ID=$(printf '%s' "${COMMENTS}" | jq -r --arg m "${MARKER}" 'map(select(.body | startswith($m))) | last | .id // empty')
      printf '%s' "${COMMENTS}" | jq -r --arg m "${MARKER}" 'map(select(.body | startswith($m))) | last | .body // empty' > prev_comment.md
      set -e
      # --- Fetch the smp CLI (needs the single-machine-performance AWS creds) ---
      AWS_NAMED_PROFILE="single-machine-performance"
      SMP_BOT_ID=$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SMP_ACCOUNT $BOT_LOGIN) || exit $?
      SMP_BOT_KEY=$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SMP_ACCOUNT $BOT_TOKEN) || exit $?
      aws configure set aws_access_key_id "$SMP_BOT_ID" --profile ${AWS_NAMED_PROFILE}
      aws configure set aws_secret_access_key "$SMP_BOT_KEY" --profile ${AWS_NAMED_PROFILE}
      aws configure set region us-west-2 --profile ${AWS_NAMED_PROFILE}
      aws --profile ${AWS_NAMED_PROFILE} s3 cp s3://smp-cli-releases/${SMP_VERSION}/x86_64-unknown-linux-musl/smp smp
      chmod +x smp
      # --- Codeowners-based preselection (best effort, POC) ---
      # Pre-tick a folder when THIS PR changes files owned by that folder's
      # CODEOWNERS team (e.g. the PR touches logs-pipeline code -> pre-tick
      # test/regression/logs). The intersect (changed files -> teams, folder ->
      # team, using the checked-out CODEOWNERS on both sides) lives in the
      # reusable, tested `owners.smp-preselect` task; this job just fetches the
      # PR's changed files and calls it. Depends only on the PR, never on main.
      # --default-select only affects rows that are NEW in this render, so it acts
      # as a first-appearance default the developer can still untick; the merge
      # preserves their choice thereafter. Any failure here degrades to no
      # preselection (all folders unticked) -- never blocks the comment.
      DEFAULT_SELECT=""
      set +e
      # Fetch the PR's changed files (paginated, up to GitHub's 3000-file cap).
      : > changed_files.txt
      page=1
      while :; do
        resp=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          "https://api.github.com/repos/DataDog/datadog-agent/pulls/${PR_NUMBER}/files?per_page=100&page=${page}")
        count=$(printf '%s' "${resp}" | jq 'if type=="array" then length else 0 end' 2>/dev/null || echo 0)
        printf '%s' "${resp}" | jq -r 'if type=="array" then .[].filename else empty end' 2>/dev/null >> changed_files.txt
        [ "${count:-0}" -lt 100 ] && break
        page=$((page + 1)); [ "${page}" -gt 30 ] && break
      done
      # </dev/null: dda reads stdin; without it it would swallow the block's input.
      DEFAULT_SELECT=$(dda inv owners.smp-preselect --config-dir "${ROOT}" --changed-files changed_files.txt --exclude quality_gates,ebpf </dev/null 2>/dev/null)
      set -e
      echo "Codeowners-preselected folders: ${DEFAULT_SELECT:-<none>}"
      DEFAULT_SELECT_ARG=""
      if [ -n "${DEFAULT_SELECT}" ]; then DEFAULT_SELECT_ARG="--default-select ${DEFAULT_SELECT}"; fi
      # --- Render the comment. The CLI owns discovery, the flat checkbox format,
      # and the state-preserving merge (via --previous-comment). Only pass
      # --previous-comment when a prior comment exists (else it's a fresh render).
      PREV_ARG=""
      if [ -n "${COMMENT_ID}" ]; then PREV_ARG="--previous-comment prev_comment.md"; fi
      # quality_gates always runs (force-included by the run job), so it is
      # excluded from the checklist alongside ebpf (separate metal-runner jobs).
      # --link-base makes each folder label a link to that folder on GitHub and
      # enables the experiment-name hover tooltip.
      ./smp experiments list \
        --target-config-dir "${ROOT}" \
        --exclude-path quality_gates,ebpf \
        --format github-comment \
        --link-base "https://github.com/DataDog/datadog-agent/tree/${CI_COMMIT_SHA}/test/regression" \
        ${PREV_ARG} \
        ${DEFAULT_SELECT_ARG} \
        --instructions "$(printf '%s\n\n%s' '✅ **Quality gates always run.**' 'Tick any additional suites below; selecting a folder runs its whole subtree. Re-run the single-machine-performance-regression_detector job to apply.')" \
        > comment_body.md
      cat comment_body.md
      # --- Edit in place if the comment exists, else create it ---
      PAYLOAD=$(jq -Rs '{body: .}' comment_body.md)
      if [ -n "${COMMENT_ID}" ]; then
        echo "Updating existing selection comment ${COMMENT_ID}"
        curl -s -X PATCH -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          "https://api.github.com/repos/DataDog/datadog-agent/issues/comments/${COMMENT_ID}" \
          -d "${PAYLOAD}" -o /dev/null -w "HTTP %{http_code}\n"
      else
        echo "Creating selection comment on PR #${PR_NUMBER}"
        curl -s -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          "https://api.github.com/repos/DataDog/datadog-agent/issues/${PR_NUMBER}/comments" \
          -d "${PAYLOAD}" -o /dev/null -w "HTTP %{http_code}\n"
      fi
  artifacts:
    expire_in: 1 day
    paths:
      - comment_body.md
    when: always
