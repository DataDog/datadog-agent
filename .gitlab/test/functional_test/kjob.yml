# Submit a KJob Kubernetes performance job to SMP and wait for its report.
# KJob is separate from the regression detector. See test/regression/kjob/README.md.
#
# This first version always runs on dev branches and uses the fixed images of
# the fixture, not the images of the PR. It never blocks a pipeline.
single_machine_performance-kjob:
  stage: functional_test
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/docker_x64$CI_IMAGE_DOCKER_X64_SUFFIX:$CI_IMAGE_DOCKER_X64
  tags: ["arch:amd64", "specific:true"]
  needs: []
  rules:
    - !reference [.except_coverage_pipeline]
    - !reference [.on_dev_branches]
    - when: on_success
  allow_failure: true
  # A failed replicate or bounds check is a result for the PR comment, not a CI failure.
  # Do not retry, because a retry submits the whole KJob job again.
  retry: 0
  timeout: 2h
  variables:
    # This dev build of the SMP CLI has `smp kjob report` and finds cases recursively.
    # The KJob services of SMP_TEAM_NAME must use the same report format as this CLI.
    SMP_VERSION: dev-pr4862-db3e8f21f
    SMP_TEAM_NAME: agent-beta
    AWS_NAMED_PROFILE: single-machine-performance
    # The SMP CLI submits each directory under test/regression/kjob that has an experiment.yaml file.
    KJOB_DIRECTORY: test/regression/kjob
    KJOB_REPLICATES: "10"
    KJOB_DURATION: 60s
    KJOB_COOLDOWN: 0s
    # Stop the wait loop before the job timeout, so the artifacts upload.
    KJOB_RESULT_WAIT_SECONDS: "6600"
    KJOB_RESULT_POLL_SECONDS: "60"
    # The SMP CLI renders Helm charts at submission and needs exactly this version.
    HELM_VERSION: v4.3.1
    HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
    # Do not log the access key ID of the bot, as in the regression detector.
    RUST_LOG: info,aws_config::profile::credentials=error
  artifacts:
    expire_in: 1 weeks
    when: always
    paths:
      - outputs/
  script:
    - mkdir -p outputs
    # The CI egress proxy blocks get.helm.sh. The Depot read API caches the
    # same archive in ADMS, as for tools/ci/conduit.sh.
    - curl --silent --show-error --fail --location --output /tmp/helm.tar.gz "https://depot-read-api-bzl.us1.ddbuild.io/get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
    - echo "${HELM_SHA256}  /tmp/helm.tar.gz" | sha256sum --check -
    - tar --extract --gzip --file /tmp/helm.tar.gz --directory /tmp linux-amd64/helm
    - export PATH="/tmp/linux-amd64:${PATH}"
    - helm version --template '{{.Version}}'
    - SMP_BOT_ID=$("$CI_PROJECT_DIR"/tools/ci/fetch_secret.sh "$SMP_ACCOUNT" bot_login) || exit $?
    - SMP_BOT_KEY=$("$CI_PROJECT_DIR"/tools/ci/fetch_secret.sh "$SMP_ACCOUNT" bot_token) || exit $?
    - aws configure set aws_access_key_id "$SMP_BOT_ID" --profile "${AWS_NAMED_PROFILE}"
    - aws configure set aws_secret_access_key "$SMP_BOT_KEY" --profile "${AWS_NAMED_PROFILE}"
    - aws configure set region us-west-2 --profile "${AWS_NAMED_PROFILE}"
    - aws --profile "${AWS_NAMED_PROFILE}" s3 cp --only-show-errors "s3://smp-cli-releases/${SMP_VERSION}/x86_64-unknown-linux-musl/smp" smp
    - chmod +x smp
    - SMP_KJOB_ARGS=(--replicates "${KJOB_REPLICATES}" --duration "${KJOB_DURATION}" --cooldown "${KJOB_COOLDOWN}")
    # A dry run needs no AWS access. The job saves the resolved job input as an
    # artifact. The fixture holds only dummy credentials.
    - ./smp kjob submit "${KJOB_DIRECTORY}" --dry-run "${SMP_KJOB_ARGS[@]}" > outputs/dry-run.json
    - ./smp --team-name "${SMP_TEAM_NAME}" --aws-named-profile "${AWS_NAMED_PROFILE}" kjob submit "${KJOB_DIRECTORY}" "${SMP_KJOB_ARGS[@]}" --output json | tee outputs/submit.json
    - KJOB_JOB_ID=$(jq -er '.id' outputs/submit.json)
    - echo "KJob job ID is ${KJOB_JOB_ID}"
    # `smp kjob report` exits with 0 when all replicates and checks pass, 1 when
    # a replicate or a check fails, 2 on an error, and 3 while the report is not
    # ready. It has no wait option, so poll until the exit code is not 3.
    - |
      KJOB_DEADLINE=$(( $(date +%s) + KJOB_RESULT_WAIT_SECONDS ))
      while :; do
        KJOB_RESULT_CODE=0
        ./smp --team-name "${SMP_TEAM_NAME}" --aws-named-profile "${AWS_NAMED_PROFILE}" kjob report --job-id "${KJOB_JOB_ID}" > outputs/report.v1.json || KJOB_RESULT_CODE=$?
        if [[ "${KJOB_RESULT_CODE}" != "3" ]]; then
          break
        fi
        if (( $(date +%s) >= KJOB_DEADLINE )); then
          echo "The KJob report for ${KJOB_JOB_ID} is not ready after ${KJOB_RESULT_WAIT_SECONDS} seconds."
          break
        fi
        sleep "${KJOB_RESULT_POLL_SECONDS}"
      done
      # after_script reads this file to choose the PR comment text.
      echo "${KJOB_RESULT_CODE}" > outputs/result_code
      case "${KJOB_RESULT_CODE}" in
        0) echo "All KJob replicates and checks passed." ;;
        # The PR comment reports failed replicates and bounds checks, so the CI job passes.
        1) echo "A KJob replicate or check failed. The PR comment shows the details." ;;
        # The CI job fails only when it cannot get a result.
        3) exit 1 ;;
        *) echo "smp kjob report failed with exit code ${KJOB_RESULT_CODE}."; exit "${KJOB_RESULT_CODE}" ;;
      esac
    - jq . outputs/report.v1.json
  # The after_script also runs when the script fails, so each run gets a PR comment.
  # `smp kjob report` renders the comment. Without a job ID, or when the render
  # fails, a short fixed message takes its place.
  after_script:
    - mkdir -p outputs
    - |
      # A failed submit writes {"error": …}, so take the ID only when it exists.
      KJOB_JOB_ID=$(jq -er '.id // empty' outputs/submit.json 2>/dev/null || true)
      KJOB_RESULT_CODE=$(cat outputs/result_code 2>/dev/null || true)
      case "${KJOB_RESULT_CODE}" in
        3) KJOB_NO_RESULT_REASON="the run did not finish before the time limit" ;;
        "") KJOB_NO_RESULT_REASON="the CI job stopped before the run finished" ;;
        *) KJOB_NO_RESULT_REASON="" ;;
      esac
      jq -n --arg commit "${CI_COMMIT_SHA}" --arg job_url "${CI_JOB_URL}" --arg reason "${KJOB_NO_RESULT_REASON}" \
        '{commit: $commit, job_url: $job_url} + (if $reason == "" then {} else {no_result_reason: $reason} end)' > outputs/extra.json
      if [[ -n "${KJOB_JOB_ID}" && -x ./smp ]]; then
        ./smp --team-name "${SMP_TEAM_NAME}" --aws-named-profile "${AWS_NAMED_PROFILE}" kjob report --job-id "${KJOB_JOB_ID}" --template-file test/regression/kjob/report_template.md.j2 --extra outputs/extra.json > outputs/report.md || true
      fi
      if [[ ! -s outputs/report.md ]]; then
        if [[ -n "${KJOB_JOB_ID}" ]]; then KJOB_NO_RESULT_REASON="the CI job could not read the result of the run"; else KJOB_NO_RESULT_REASON="the CI job failed before the run started"; fi
        printf '**⚠️ No result:** %s\n\n<sub><i>Commit <a href="https://github.com/DataDog/datadog-agent/commit/%s">%s</a> · <a href="%s">CI job</a></i></sub>\n' \
          "${KJOB_NO_RESULT_REASON}" "${CI_COMMIT_SHA}" "${CI_COMMIT_SHA:0:11}" "${CI_JOB_URL}" > outputs/report.md
      fi
      jq -n --arg commit "${CI_COMMIT_SHA}" --rawfile message outputs/report.md \
        '{org: "DataDog", repo: "datadog-agent", commit: $commit, header: "K8s Regression Detector Results", message: $message}' > outputs/pr_comment.json || echo "WARNING: the KJob PR comment payload could not be written"

# Post the result of the KJob job on the PR, also when the KJob job fails.
# This follows single-machine-performance-regression_detector-pr-comment in
# .gitlab/childs/smp-regression-child-pipeline.yml.
single_machine_performance-kjob-pr-comment:
  stage: functional_test
  image:
    name: "486234852809.dkr.ecr.us-east-1.amazonaws.com/pr-commenter:3-jammy"
    entrypoint: [""] # disable entrypoint script for the pr-commenter image
  tags: ["arch:amd64", "specific:true"]
  needs:
    - job: single_machine_performance-kjob
      artifacts: true
  rules:
    - !reference [.except_coverage_pipeline]
    - !reference [.on_dev_branches]
    - when: always
  variables:
    # Not using the entrypoint script for the pr-commenter image
    FF_KUBERNETES_HONOR_ENTRYPOINT: false
  allow_failure: true # a comment-service failure must not change the KJob result
  script:
    - |
      if [[ ! -s "outputs/pr_comment.json" ]]
      then
          echo "ERROR: KJob PR comment payload not found -- no PR comment posted"
          exit 1
      fi
    # The pr-commenter service updates the comment with the same header, and
    # ignores a commit that has no PR.
    - |
      set +e
      out=$(curl https://pr-commenter.us1.ddbuild.io/internal/cit/pr-comment \
          -H "$(authanywhere)" \
          -H "X-DdOrigin: curl" \
          -X PATCH \
          --data-binary @outputs/pr_comment.json)
      exitcode=$?
      set -e
      if [ -n "${out}" ]; then
        if [ $exitcode -eq 0 ]; then
          echo "$out"
        else
          echo "$out" >&2
        fi
      fi
      if [ "${out}" != "${out/invalid request: no pr found for this commit}" ]; then
        exit 0
      fi
      exit $exitcode
