.integration_tests_deb:
  stage: integration_test
  needs: ["go_deps", "go_tools_deps"]
  rules:
    - !reference [.except_light_pipeline]
    - when: on_success
  tags: ["docker-in-docker:amd64"]
  before_script:
    - !reference [.retrieve_linux_go_deps]
    - !reference [.retrieve_linux_go_tools_deps]

docker_integration_tests:
  extends: .integration_tests_deb
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  # This job is not stable yet because of rate limit issues and micro vms beta status.
  allow_failure: true
  script:
    - dda inv -- -e docker.test

trace_agent_integration_tests:
  extends: .integration_tests_deb
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/docker_x64$CI_IMAGE_DOCKER_X64_SUFFIX:$CI_IMAGE_DOCKER_X64
  timeout: 50m
  retry: 2
  script:
    - dda inv -- -e integration-tests --race --only="Trace Agent"

# Prints to the job log a report of the values the trace-agent writes to more
# than one location of the trace payloads it sends (see
# pkg/trace/testutil/dupcheck). The test is report-only: it passes whatever it
# finds and writes no artifacts.
trace_agent_dupcheck_report:
  extends: .bazel:runner:linux-amd64
  stage: integration_test
  rules:
    - !reference [.except_light_pipeline]
    # Always on main, so there is a reference report for the current code.
    - !reference [.on_main]
    # Otherwise only when the code that builds trace payloads changes.
    - changes:
        paths:
          - pkg/trace/**/*
          - pkg/obfuscate/**/*
          - pkg/proto/datadog/trace/**/*
          - pkg/proto/pbgo/trace/**/*
          - .gitlab/test/integration_test/linux.yml
        compare_to: $COMPARE_TO_BRANCH
      when: on_success
  allow_failure: true
  script:
    - dda inv -- -e test --targets=./pkg/trace/agent --test-args="-test.run=TestNoAgentIntroducedDuplicates -test.v" --bazel-args="--test_output=all"
