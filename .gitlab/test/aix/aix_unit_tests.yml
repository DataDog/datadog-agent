---
# AIX/ppc64 jobs run on a remote AIX LPAR over SSH, driven by a Linux GitLab
# runner (RFC: AIX/ppc64 datadog-agent CI, Phase 1).
#
# Neither GitHub Actions nor AWS/GitLab offer AIX/ppc64 runners, so a standard
# Linux runner orchestrates the job: it fetches the AIX host's SSH private key
# from Vault, ensures the agent source is cloned on the host at the commit
# under test, then runs job-specific scripts over SSH. The AIX host does all
# the actual work.
#
# A resource_group per VM ensures only one AIX job uses the host at a time.

.aix_remote:
  stage: source_test
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  needs: []
  # Only one job may use the AIX host at a time.
  resource_group: aix_ci_host
  timeout: 2h
  rules:
    - !reference [.except_mergequeue]
    - !reference [.manual]
  variables:
    # SSH connection details for the AIX LPAR.
    # TODO: move to Vault
    AIX_HOST: "cloud3.siteox.com"
    AIX_PORT: "42222"
    AIX_USER: "root"
    # Where the agent source is cloned on the AIX host.
    AIX_AGENT_SRC: "/opt/dd-build/datadog-agent"
    AIX_GIT_REMOTE: "https://github.com/DataDog/datadog-agent.git"
    GIT_DEPTH: 1
  before_script:
    # Fetch the AIX host SSH private key from Vault and install it for this job.
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - touch ~/.ssh/aix_ci_key && chmod 600 ~/.ssh/aix_ci_key
    - $CI_PROJECT_DIR/tools/ci/fetch_secret.sh $SITEOX_AIX_CI_RUNNER key > ~/.ssh/aix_ci_key || exit $?
    - chmod 600 ~/.ssh/aix_ci_key
    # Trust the host key
    - ssh-keyscan -p $AIX_PORT $AIX_HOST >> ~/.ssh/known_hosts 2>/dev/null
    # Ensure the agent source is cloned on the AIX host at the commit under
    # test. Reuses any existing clone (fetch + checkout) to avoid cloning from
    # scratch each run. The clone includes packaging/aix/ci/*.sh, so the host
    # has the scripts the job later runs.
    - |
      ssh -T -i ~/.ssh/aix_ci_key -p $AIX_PORT $AIX_USER@$AIX_HOST bash -s <<EOF
      set -eu
      export PATH=/opt/freeware/bin:/usr/bin:\$PATH
      if [ ! -d "$AIX_AGENT_SRC/.git" ]; then
        git clone --progress "$AIX_GIT_REMOTE" "$AIX_AGENT_SRC"
      fi
      cd "$AIX_AGENT_SRC"
      git clean -df
      git reset --hard
      git fetch --progress origin
      # The commit under test may not be reachable from origin yet (e.g. a
      # brand-new branch push); fetch the branch ref as a fallback.
      git fetch --progress origin "$CI_COMMIT_REF_NAME" || true
      git checkout "$CI_COMMIT_SHA"
      EOF
  script:
    # Setup the host (idempotent) then run the unit tests.
    # setup-host.sh is shared with devs (packaging/aix/), run-tests.sh is the
    # unit-test job's script (packaging/aix/ci/).
    # Invoke via `sh` so the job works even if the executable bit isn't set on
    # the checked-out file, and quote the remote command so $AIX_AGENT_SRC is
    # expanded on the runner (not split by the remote shell).
    - ssh -tt -i ~/.ssh/aix_ci_key -p $AIX_PORT $AIX_USER@$AIX_HOST "sh $AIX_AGENT_SRC/packaging/aix/setup-host.sh"
    - ssh -tt -i ~/.ssh/aix_ci_key -p $AIX_PORT $AIX_USER@$AIX_HOST "sh $AIX_AGENT_SRC/packaging/aix/ci/run-tests.sh"

aix_unit_tests:
  extends: .aix_remote
