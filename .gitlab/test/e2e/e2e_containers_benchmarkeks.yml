---
# e2e stage - container-integrations owned jobs
# Owned by: container-integrations

# benchmarkeks: performance non-regression test of the Agent on EKS.
#
# TestBenchmarkEKSSuite deploys a baseline and a comparison Agent (node Agent, Cluster Agent and cluster checks runner)
# on an EKS cluster and compares their resource usage over four phases, between which the two installations swap their
# images. The comparison is the Agent of the pipeline, the baseline the one of a commit of the base branch chosen like
# SMP does (see `dda inv new-e2e-tests.benchmarkeks-baseline`).
#
# The benchmark keeps an EKS cluster for its whole run, so it only runs on dev branches, and only on demand, not to add
# an EKS cluster to every pull request changing the code it measures, but for the changes of the benchmark itself:
# - every push of a branch changing the benchmark runs it automatically, even before its pull request is opened;
# - a pull request changing the code it measures gets a comment with a button to run it, from its push pipelines;
# - any other pipeline can still run it, without a comment until it is run.
# To run it, play new-e2e-containers-benchmarkeks-baseline only: the other jobs need it, so GitLab skips them until it
# is played, and then runs them after it.
#
# A single comment of the pull request follows the benchmark, which its jobs update as it progresses (see
# `dda inv new-e2e-tests.benchmarkeks-comment`): the button to run it, that it runs, then its results, every time. Only
# the jobs of the pipeline of the head commit of the pull request update it.

# Pipelines the benchmark never runs in. Shared by all the benchmark jobs, so that they always exist together.
.except_benchmarkeks_unsupported:
  - !reference [.on_dev_branches] # never on main, release branches, the merge queue or tags
  - !reference [.except_light_pipeline]
  - !reference [.except_coverage_pipeline]
  - !reference [.except_deploy]
  - !reference [.except_disable_e2e_tests]

# The benchmark itself: the pushes changing it run it automatically
.benchmarkeks_test_changes: &benchmarkeks_test_changes
  paths:
    - test/e2e-framework/components/datadog/apps/churn/**/*
    - test/e2e-framework/components/datadog/apps/kwok/**/*
    - test/e2e-framework/scenarios/aws/benchmarkeks/**/*
    - test/e2e-framework/scenarios/outputs/benchmarkeks.go
    - test/e2e-framework/testing/environments/benchmarkeks.go
    - test/e2e-framework/testing/environments/kubernetes_readiness.go
    - test/e2e-framework/testing/provisioners/aws/kubernetes/benchmarkeks/**/*
    - test/new-e2e/tests/containers/benchmark/**/*
    - test/new-e2e/tests/containers/benchmarkeks*
    - .gitlab/test/e2e/e2e_containers_benchmarkeks.yml
    - tasks/libs/testing/benchmarkeks.py
  compare_to: $COMPARE_TO_BRANCH

# The code measured by the benchmark: the pull requests changing it get a comment with a button to run the benchmark
.benchmarkeks_component_changes: &benchmarkeks_component_changes
  paths:
    - comp/core/autodiscovery/**/*
    - comp/core/tagger/**/*
    - comp/core/workloadmeta/**/*
    - pkg/clusteragent/clusterchecks/**/*
    - pkg/collector/check/**/*
    - pkg/collector/corechecks/cluster/**/*
    - pkg/collector/corechecks/containers/**/*
    - pkg/collector/runner/**/*
    - pkg/kubestatemetrics/**/*
    - pkg/util/containerd/**/*
    - pkg/util/containers/**/*
    - pkg/util/kubernetes/**/*
    - pkg/util/prometheus/**/*
  compare_to: $COMPARE_TO_BRANCH

# Automatic run of new-e2e-containers-benchmarkeks-baseline, on the changes of the benchmark itself. Only in push
# pipelines, not to run the benchmark again in a pipeline started from the UI or the API, e.g. to retry other jobs of a
# commit whose push pipeline ran it. Not only for the branches of a pull request, which GitLab can't tell apart, and as
# the first push of a branch usually comes before its pull request.
.if_benchmarkeks_automatic_run: &if_benchmarkeks_automatic_run
  if: $CI_PIPELINE_SOURCE == "push"
  changes: *benchmarkeks_test_changes

# The jobs following new-e2e-containers-benchmarkeks-baseline: needing it, directly or not, they are skipped while it
# is not played, and run after it once it is, or right away on an automatic run. Like it, they are allowed to fail.
.after_benchmarkeks_baseline:
  - when: on_success
    allow_failure: true

# Fails before provisioning anything if the baseline is unknown, the dotenv report of
# new-e2e-containers-benchmarkeks-baseline being missing when it failed while allowed to.
.benchmarkeks_check_baseline:
  - |
    if [ -z "${E2E_BENCHMARKEKS_BASELINE_AGENT_IMAGE:-}" ] || [ -z "${E2E_BENCHMARKEKS_BASELINE_CLUSTER_AGENT_IMAGE:-}" ]; then
      echo "The baseline images are unknown: new-e2e-containers-benchmarkeks-baseline did not succeed"
      exit 1
    fi

# Explains how to run the benchmark in the comment of the pull requests changing the code it measures, with a button
# linking to new-e2e-containers-benchmarkeks-baseline.
new-e2e-containers-benchmarkeks-instructions:
  stage: e2e_init
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  extends: .dd_octo_sts
  rules:
    - !reference [.except_benchmarkeks_unsupported]
    # The benchmark runs automatically (see .if_benchmarkeks_automatic_run), and new-e2e-containers-benchmarkeks-baseline
    # comments that it runs
    - <<: *if_benchmarkeks_automatic_run
      when: never
    # Only in push pipelines too: the button of a pipeline started from the UI or the API would replace the results of
    # the benchmark of the push pipeline of the same commit
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: *benchmarkeks_component_changes
      when: on_success
  needs: []
  # A comment that couldn't be posted must not block the pull request
  allow_failure: true
  interruptible: true
  before_script:
    - !reference [.setup_github_token_comment_pr]
  script:
    - dda inv -- -e new-e2e-tests.benchmarkeks-comment --state=pending

# Resolves the baseline and publishes its images to agent-qa, as qa_agent_linux and qa_dca did for the baseline
# pipeline: the images of agent-qa expire after a day, the build outputs of registry.ddbuild.io are kept for months.
# It also starts the benchmark, manually or automatically: it shows in the pull request comment that the benchmark runs.
new-e2e-containers-benchmarkeks-baseline:
  extends:
    - .docker_publish_job_definition
    - .dd_octo_sts
  stage: e2e_init
  rules:
    - !reference [.except_benchmarkeks_unsupported]
    # Like a manual run, the automatic one is allowed to fail
    - <<: *if_benchmarkeks_automatic_run
      when: on_success
      allow_failure: true
    - !reference [.manual]
  needs:
    # Only needs images of the base branch. When the button of the pull request comment links to this job, it can only
    # be played once the comment is posted, which it would otherwise overwrite.
    - job: new-e2e-containers-benchmarkeks-instructions
      optional: true
      artifacts: false
  variables:
    GIT_DEPTH: 0 # Full history: merge base and first-parent walk
    IMG_REGISTRIES: agent-qa
  script:
    # A comment that couldn't be updated must not stop the benchmark
    - !reference [.setup_github_token_comment_pr]
    - dda inv -- -e new-e2e-tests.benchmarkeks-comment --state=running || echo "The pull request comment wasn't updated"
    # The commands below don't need the GitHub token
    - unset GITHUB_TOKEN
    - dda inv -- -e new-e2e-tests.benchmarkeks-baseline --output-file=benchmarkeks_baseline.env
    - source benchmarkeks_baseline.env
    # The script of .docker_publish_job_definition, once per image
    - export IMG_SOURCES="$BENCHMARKEKS_BASELINE_AGENT_SOURCES" IMG_DESTINATIONS="$BENCHMARKEKS_BASELINE_AGENT_DESTINATION"
    - !reference [.docker_publish_job_definition, script]
    - export IMG_SOURCES="$BENCHMARKEKS_BASELINE_CLUSTER_AGENT_SOURCES" IMG_DESTINATIONS="$BENCHMARKEKS_BASELINE_CLUSTER_AGENT_DESTINATION"
    - !reference [.docker_publish_job_definition, script]
  artifacts:
    expire_in: 2 weeks
    paths:
      - benchmarkeks_baseline.env
    reports:
      # The E2E_BENCHMARKEKS_BASELINE_* variables become environment variables of the jobs needing this one
      dotenv: benchmarkeks_baseline.env

new-e2e-containers-benchmarkeks-init:
  stage: e2e_init
  extends: .new_e2e_template
  timeout: 1h 05m
  needs:
    - go_e2e_deps
    - !reference [.needs_fakeintake_publish]
    # Not to create a cluster when there is no baseline (e.g. on a branch too old), and to follow it on a manual run
    - new-e2e-containers-benchmarkeks-baseline
  rules:
    - !reference [.except_benchmarkeks_unsupported]
    - !reference [.after_benchmarkeks_baseline]
  before_script:
    - !reference [.benchmarkeks_check_baseline]
    - !reference [.new_e2e_template, before_script]
  variables:
    TARGETS: ./tests/containers
    TEAM: container-integrations
    EXTRA_PARAMS: --run TestBenchmarkEKSSuite
    E2E_INIT_ONLY: "true"
    GIT_DEPTH: 1 # Overrides .new_e2e_template: this job does not pass --impacted
    DYNAMIC_TESTS_FLAG: "" # Never skipped by the test selection
    SHOULD_RUN_IN_FLAKES_FINDER: "false"
    PRE_BUILT_BINARIES_FLAG: ""
    # Same as new-e2e-containers-eks-init.
    KUBERNETES_MEMORY_REQUEST: 24Gi
    KUBERNETES_MEMORY_LIMIT: 24Gi
  allow_failure: true
  retry: !reference [.retry_only_infra_failure, retry]

new-e2e-containers-benchmarkeks:
  extends: .new_e2e_template
  # The Agents (about 7 min), then four phases of 10 min of warm-up and 15 min of measurement, separated by three swaps
  # of the images (about 3 min each), the ingestion of the last minute, and the teardown: about 2h, with some margin.
  timeout: 2h 45m
  needs:
    - !reference [.new_e2e_template_needs_container_deploy_linux, needs]
    - job: new-e2e-containers-benchmarkeks-init
      artifacts: false
    - job: new-e2e-containers-benchmarkeks-baseline
      artifacts: true
  rules:
    - !reference [.except_benchmarkeks_unsupported]
    - !reference [.after_benchmarkeks_baseline]
  before_script:
    - !reference [.benchmarkeks_check_baseline]
    - !reference [.new_e2e_template, before_script]
  variables:
    TARGETS: ./tests/containers
    TEAM: container-integrations
    EXTRA_PARAMS: --run TestBenchmarkEKSSuite
    E2E_PRE_INITIALIZED: "true"
    # Archived with $E2E_OUTPUT_DIR by .new_e2e_template, even when a regression fails the job
    E2E_BENCHMARKEKS_REPORT_DIR: $E2E_OUTPUT_DIR/benchmarkeks-report
    GIT_DEPTH: 1 # Overrides .new_e2e_template: this job does not pass --impacted
    DYNAMIC_TESTS_FLAG: "" # Never skipped by the test selection
    SHOULD_RUN_IN_FLAKES_FINDER: "false"
  retry: !reference [.retry_only_infra_failure, retry]
  # Temporary, until the benchmark has proven reliable enough to block the merge of pull requests: a regression fails
  # this job, but not the pipeline.
  allow_failure: true

# Shows the results of the benchmark in the pull request comment, whatever they are, or that it failed, in a job of its
# own as the GitHub token only lives an hour.
new-e2e-containers-benchmarkeks-pr-comment:
  stage: e2e
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  extends: .dd_octo_sts
  rules:
    - !reference [.except_benchmarkeks_unsupported]
    # Automatic run, under the conditions of .if_benchmarkeks_automatic_run: whatever the result of the benchmark, a
    # failure being how it reports a regression, even when it was canceled, so that the comment doesn't keep saying that
    # the benchmark runs
    - <<: *if_benchmarkeks_automatic_run
      when: always
      allow_failure: true
    # Manual run: the benchmark is allowed to fail, so this job runs after it whatever its result, unless it is skipped
    # or canceled, e.g. when a build of the images of the pipeline failed, which leaves the comment saying that it runs.
    # Not `always`, which would run this job before new-e2e-containers-benchmarkeks-baseline is played.
    - !reference [.after_benchmarkeks_baseline]
  needs:
    - job: new-e2e-containers-benchmarkeks
      artifacts: true
  variables:
    # E2E_BENCHMARKEKS_REPORT_DIR of new-e2e-containers-benchmarkeks, relative to the project directory
    BENCHMARKEKS_REPORT_DIR: e2e-output/benchmarkeks-report
  before_script:
    - !reference [.setup_github_token_comment_pr]
  script:
    # The reports are missing when the benchmark failed before comparing the versions: the comment says so
    - dda inv -- -e new-e2e-tests.benchmarkeks-comment --state=done --report-dir="$BENCHMARKEKS_REPORT_DIR"
