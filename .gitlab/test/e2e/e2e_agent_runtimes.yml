---
# e2e stage - agent runtime jobs
# Owned by: agent-runtimes, fleet-remediation, agent-devx

.on_arun_or_e2e_changes:
  - !reference [.on_e2e_main_release_or_rc]
  - changes:
      paths:
        - cmd/**/*
        - pkg/**/*
        - comp/**/*
        - test/new-e2e/tests/agent-runtimes/**/*
      compare_to: $COMPARE_TO_BRANCH

new-e2e-agent-runtimes:
  extends: .new_e2e_template_needs_deb_x64
  rules:
    - !reference [.on_arun_or_e2e_changes]
    - !reference [.manual]
  variables:
    TARGETS: ./tests/agent-runtimes
    TEAM: agent-runtimes
    EXTRA_PARAMS: --skip "Windows|TestProcmgrAIODockerSuite"
    ON_NIGHTLY_FIPS: "true"

.on_procmgr_aio_or_e2e_changes:
  - !reference [.on_e2e_main_release_or_rc]
  - changes:
      paths:
        - Dockerfiles/agent/Dockerfile
        - Dockerfiles/agent/entrypoint.sh
        - Dockerfiles/agent/cont-init.d/**/*
        - Dockerfiles/agent/entrypoint.d/procmgr-all-in-one
        - Dockerfiles/agent/probe.sh
        - Dockerfiles/agent/processes.d/aio/**/*
        - pkg/procmgr/**/*
        - test/new-e2e/tests/agent-runtimes/procmgr/**/*
      compare_to: $COMPARE_TO_BRANCH

new-e2e-agent-runtimes-procmgr-aio-docker:
  extends: .new_e2e_template
  needs:
    - !reference [.needs_new_e2e_template]
    - qa_agent_linux
  rules:
    - !reference [.except_disable_e2e_tests]
    - !reference [.except_light_pipeline]
    - !reference [.on_procmgr_aio_or_e2e_changes]
    - !reference [.manual]
  variables:
    TARGETS: ./tests/agent-runtimes/procmgr
    TEAM: agent-runtimes
    EXTRA_PARAMS: --run "TestProcmgrAIODockerSuite"

new-e2e-fips-compliance-test:
  extends: .new_e2e_template
  needs:
    - !reference [.needs_new_e2e_template]
    - agent_deb-x64-a7-fips
    - qa_agent_fips_linux
    - qa_dca_fips
  rules:
    - !reference [.on_arun_or_e2e_changes]
    - !reference [.dynamic_tests] # The job will always be created on any Go code modification, tests are skipped dynamically in the job
    - !reference [.manual]
  variables:
    TARGETS: ./tests/fips-compliance
    TEAM: agent-runtimes
  parallel:
    matrix:
      - EXTRA_PARAMS: --run "TestFIPSCiphersLinuxSuite$"
      - EXTRA_PARAMS: --run "TestLinuxFIPSComplianceSuite$"
      - EXTRA_PARAMS: --run "TestFIPSCiphersClusterAgentSuite$"
