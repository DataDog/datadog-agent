new-e2e-agent-platform-install-script-macos-x64:
  extends:
    - .new_e2e_template
  before_script:
    - !reference [.new_e2e_template, before_script]
    - export E2E_MACOS_POOL_ENABLED=$(dda self feature ci-datadog-agent-e2e-macos-pools --default false)
  stage: e2e_install_packages
  needs:
    - !reference [.needs_new_e2e_template]
    - deploy_dmg_testing-a7_x64
  rules:
    - !reference [.except_disable_e2e_tests]
    - !reference [.on_deploy]
    - !reference [.manual]
  retry: !reference [.retry_only_infra_failure, retry]
  variables:
    TARGETS: ./tests/agent-platform/tests
    EXTRA_PARAMS: --run TestMacosInstallScript
    SHOULD_RUN_IN_FLAKES_FINDER: "false"


