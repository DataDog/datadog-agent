---
# CNM agent performance lab
# Owned by: cloud-network-monitoring
#
# Runs the CNM agent perf lab (ddoghq/system-probe-test-environments, k8s/cnm-perf-lab) on its driver instance in
# agent-sandbox: an EKS cluster with fixed-rate network load, system-probe CPU and eBPF cost per agent variant, then
# teardown. CI runners can't reach the cluster's private API endpoint, so the job only starts the driver, hands it the
# run over SSM through the role ddbuild-cnm-perf-lab-ci, follows it, and sends the aggregated means to Datadog. The
# driver destroys the cluster and powers itself off when the run ends. Manual for now; see `dda inv cnm-perf-lab.run`.

cnm-perf-lab:
  stage: e2e
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  rules:
    - !reference [.on_dev_branches]
    - !reference [.manual]
  needs: []
  # A full run (both tracer modes, Latin square) takes about 3 h; the driver's own limits stop it by 6 h
  timeout: 6h 30m
  interruptible: false
  # One driver: runs queue rather than overlap, and a retry would start a second multi-hour run
  resource_group: cnm-perf-lab
  retry: 0
  variables:
    CNM_PERF_LAB_MODE: smoke # or rounds
    # release: A = latest 7.x GA, B = the anchor release, C = main's nightly, each pinned to a digest at the start.
    # lab: the lab's own variant builds. CNM_PERF_LAB_REF_A, _B or _C (an image ref) overrides a release slot.
    CNM_PERF_LAB_VARIANTS: release
  before_script:
    - dda self dep sync -f legacy-tasks
    - DD_API_KEY=$($CI_PROJECT_DIR/tools/ci/fetch_secret.sh $AGENT_API_KEY_ORG2 token) || exit $?; export DD_API_KEY
  script:
    - dda inv -- -e cnm-perf-lab.run --mode "$CNM_PERF_LAB_MODE" --variants "$CNM_PERF_LAB_VARIANTS"
  after_script:
    # Only acts if the run is still going (job cancelled or timed out): the driver then cleans up on its own
    - dda inv -- -e cnm-perf-lab.cancel || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - cnm-perf-lab-results/
      - cnm-perf-lab-refs.txt
