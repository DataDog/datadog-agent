unit_tests_notify:
  stage: source_test
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/deb_x64$DATADOG_AGENT_BUILDIMAGES_SUFFIX:$DATADOG_AGENT_BUILDIMAGES
  tags: ["arch:amd64"]
  rules:
    - !reference [.except_main_or_release_branch]
    - !reference [.except_disable_unit_tests]
    - when: always
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
  script:
    - source /root/.bashrc
    # notify.unit-tests reads/posts/edits PR comments via the GitHub API. The App
    # key was fetched from SSM, which the runner instance profile can no longer
    # reach; GithubAPI prefers GITHUB_TOKEN, so mint a comment-scoped one with
    # dd-octo-sts instead.
    - export GITHUB_TOKEN=$(dd-octo-sts token --scope DataDog/datadog-agent --policy self.gitlab.comment-pr)
    - python3 -m pip install -r tasks/libs/requirements-github.txt
    - inv notify.unit-tests --pipeline-id $CI_PIPELINE_ID --pipeline-url $CI_PIPELINE_URL --branch-name $CI_COMMIT_REF_NAME
  needs:
    - tests_deb-x64-py3
    - tests_deb-arm64-py3
    - tests_rpm-x64-py3
    - tests_rpm-arm64-py3
    - tests_windows-x64
    - tests_flavor_heroku_deb-x64
  allow_failure: true
