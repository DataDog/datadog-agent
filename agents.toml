# dotagents declarations for this repo (https://github.com/getsentry/dotagents).
# Run `mise run dotagents install` to install or refresh shared agent tools.
version = 1
agents = ["claude", "codex", "cursor", "vscode", "opencode", "pi"]

[trust]
github_repos = ["ddoghq/claude-marketplace"]

[[plugins]]
name = "smp"
source = "git@github.com:ddoghq/claude-marketplace.git"
ref = "main"
path = "smp"
targets = ["claude", "codex", "cursor", "opencode", "pi"]

[[mcp]]
name = "api"
url = "https://mcp.datadoghq.com/v1/mcp?toolsets=all"

[[mcp]]
name = "ci"
url = "https://ddci-mcp.mcp.us1.ddbuild.io/internal/mcp"

[[mcp]]
name = "google-workspace"
url = "https://google-workspace-mcp-server-834963730936.us-central1.run.app/mcp"

[[mcp]]
name = "atlassian"
url = "https://mcp.atlassian.com/v1/mcp/authv2"
