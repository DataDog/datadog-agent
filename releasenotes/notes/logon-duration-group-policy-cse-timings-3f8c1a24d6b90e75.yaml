---
enhancements:
  - |
    The logon duration event on Windows now breaks each boot Group Policy pass down into
    the individual client-side extension invocations that ran during it, reporting the
    offset, duration, and outcome of each extension along with the Group Policy objects
    that fed it. The breakdown appears as a new ``group_policy_details`` block in the
    event's ``custom`` attributes, alongside the existing ``boot_timeline`` and
    ``durations``, split into ``computer`` and ``user`` arrays to match the two pass
    milestones it drills into. It is omitted when no extension invocation was measured
    end to end.

    Each invocation carries at most 32 Group Policy object references. When an extension
    applies more than that, the remainder is reported as a ``gpos_omitted`` count on the
    invocation rather than dropped silently, so a shortened list is distinguishable from
    a complete one.
