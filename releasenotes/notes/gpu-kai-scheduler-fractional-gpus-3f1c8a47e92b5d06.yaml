---
features:
  - |
    gpu: report which GPU a KAI Scheduler fractional workload is using. A pod
    asking for a fraction of a GPU does not request ``nvidia.com/gpu``, so until
    now the Agent could not tell which device it ran on. Set
    ``gpu.kai_scheduler.enabled`` to ``true`` to turn this on; it is off by
    default. Note that the reservation pod KAI creates for each shared GPU
    remains tagged on that GPU's device metrics alongside the workloads sharing
    it.
