---
features:
  - |
    Add ``logs_config.unreliable_mount`` for log files on mounts that cannot keep
    their page cache coherent or reuse file handles safely across a rotation, such
    as CIFS/SMB (for example Azure Files) on some Linux kernels. Setting
    ``logs_config.unreliable_mount.enabled`` to ``true`` turns on fingerprint-based
    rotation detection with a direct (``O_DIRECT``) fingerprint read and a longer
    rotation drain. When no ``fingerprint_config.fingerprint_strategy`` is set it
    defaults to ``line_checksum``, which detects rotation reliably on these mounts.
    Because the direct read is whole-window and uncached, ``max_bytes`` defaults to
    4096 here instead of the global 100000. ``logs_config.unreliable_mount.rotation_drain_timeout``
    (default 60 seconds) sets how long a rotated file keeps draining through its
    already-open descriptor before it is closed, used in place of ``close_timeout``.
    Consider also raising ``logs_config.file_scan_period`` so the uncached read
    happens less often. This setting only takes effect on Linux.
  - |
    Add an optional Linux file-open flag for log file fingerprint reads. File
    log sources can set ``fingerprint_config.open_flags`` to ``["direct"]`` to
    request ``O_DIRECT`` for the short-lived fingerprint descriptor;
    ``logs_config.unreliable_mount`` sets this for you with tuned defaults. Normal
    log tailing keeps its existing open mode. The flag only takes effect on
    Linux; on other platforms it is accepted and ignored so the same
    configuration stays portable. A direct read pulls the whole fingerprint
    window uncached on every scan, so when setting ``open_flags`` by hand, lower
    ``fingerprint_config.max_bytes`` and raise ``logs_config.file_scan_period``.

    If the requested flags are not usable for a file, the Agent does not
    silently fall back to a buffered fingerprint read. A new tailer is not
    started. An active tailer keeps reading its open descriptor, but rotation
    detection is unavailable until a later fingerprint succeeds. Affected
    files are listed per source under ``Fingerprint Open Flags Errors`` in
    ``agent status``, alongside a warning in the Agent log. Remove
    ``open_flags`` from the source, or scope the source so it only matches
    files that support them.
