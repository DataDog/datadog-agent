---
enhancements:
  - |
    The Datadog Distribution of the OpenTelemetry Collector (DDOT) can now send series
    metrics to Datadog using the v3 metrics intake, reducing metrics egress bandwidth.
    This is behind the ``datadog.otelagent.MetricsV3Series`` feature gate, which is off by
    default; enable it with ``--feature-gates=+datadog.otelagent.MetricsV3Series``. When
    enabled, series to recognized Datadog sites use the v3 intake, while non-Datadog,
    custom, or proxied destinations continue to use the v2 intake.
