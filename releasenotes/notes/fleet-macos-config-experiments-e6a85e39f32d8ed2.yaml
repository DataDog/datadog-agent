---
features:
  - |
    Fleet Automation can now deploy configuration changes to macOS hosts as configuration
    experiments. An experiment can be started, promoted and stopped from Fleet Automation: while
    it runs, the Agent, system-probe, Agent Data Plane and the installer daemon run with the
    experiment configuration, and stopping the experiment restores the configuration they ran
    before. An experiment is automatically reverted when one of these processes fails to start or
    exits with an error, when the Agent or the installer daemon exits at all, or when it has not
    been promoted after 50 minutes. Agent version upgrades through Fleet Automation are not yet
    supported on macOS.
