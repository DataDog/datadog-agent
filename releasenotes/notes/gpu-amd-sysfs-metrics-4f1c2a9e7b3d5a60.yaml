# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
features:
  - |
    The GPU check now reports device metrics for AMD GPUs driven by the
    ``amdgpu`` kernel driver, read from sysfs without requiring ROCm or
    ``amd-smi``: utilization (``gpu.gr_engine_active``, ``gpu.sm_active``,
    ``gpu.dram_active``), where ``gpu.sm_active`` is the GFX engine busy
    percentage because AMD exposes no passive per-compute-unit activity counter,
    memory (``gpu.memory.limit``, ``gpu.memory.free``, ``gpu.memory.utilization``),
    temperatures, power, clocks and PCIe link state, tagged with
    ``gpu_vendor:amd``. Hosts with only AMD GPUs no longer need the NVIDIA
    driver for the check to run. Set ``gpu.amd.enabled: false`` to disable
    AMD collection. AMD GPUs are also published to workload metadata, and
    device tags use the tagger when available. When KFD sysfs process data is
    available, the check reports ``gpu.process.memory.usage`` and an associated
    ``gpu.memory.limit`` with process and container tags. Allocations on compute
    partitions and secondary KFD contexts are summed onto the physical GPU.
    Process attribution requires nonzero VRAM usage; workloads using only
    system memory are not identified.
    Workload-associated memory limits are emitted at observation time rather
    than on the static device-metric reporting cadence.
    Device-only memory-limit cadence restarts when processes exit, avoiding
    backfilled limits across the active workload period.
    NVIDIA reset windows do not interrupt AMD collection. On mixed-vendor
    hosts, an AMD GPU no longer suppresses NVIDIA driver availability issues.
    Excluding all AMD GPUs does not require an NVIDIA driver.
    In Kubernetes, AMD GPU device metrics are tagged with the containers the
    AMD GPU device plugin allocated the GPU to (``amd.com/gpu`` or partition
    resources such as ``amd.com/cpx_nps4``), as reported by the kubelet
    PodResources API.
    AMD Instinct GPUs are named as in libdrm's ``amdgpu.ids`` (for example
    ``gpu_device:amd_instinct_mi350x_vf``) and tagged with the model in
    ``gpu_type`` (for example ``mi350x``). Reading KFD topology and process data
    from a container requires read/write access to each GPU partition's render
    node in its device cgroup. A container runtime configured to grant GPU
    device access can provide this without ``privileged: true`` or allocating
    a Kubernetes GPU resource to the Agent. If any KFD node is denied,
    per-process metrics are conservatively omitted for all discovered AMD
    GPUs and existing workload metadata process associations are retained
    until the topology is fully readable. Device metrics and architecture
    from readable nodes remain available.
    The AMD GPU entity in workload metadata, and the ``host-gpu`` metadata
    payload, also report the maximum compute and memory clocks and, for GPUs
    with a complete, unpartitioned KFD topology, the memory bus width.
    GPU metrics carry ``gpu_uuid``; devices with duplicate serial identifiers
    use distinct PCI-based UUIDs rather than merging their metrics.
