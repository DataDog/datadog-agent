# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
upgrade:
  - |
    On Linux, the restricted shell privileged helper is now a single systemd
    service, ``datadog-agent-rshell-privileged.service``, that starts with the
    Agent. It exits immediately unless
    ``private_action_runner.restricted_shell.privileged.enabled`` is set;
    otherwise it creates its socket and keeps running until the Agent stops.
    Changing the setting, or ``/etc/datadog-agent-rshell/policy.json``, takes
    effect when the Agent restarts; reinstalling the Agent is no longer
    required. The ``datadog-agent-rshell-privileged.socket`` unit is removed,
    and the helper socket moves to
    ``/run/datadog-agent-rshell/privileged.sock``; a
    ``private_action_runner.restricted_shell.privileged.socket`` setting that
    names the former default ``/run/datadog/rshell-privileged.sock`` is
    redirected to the new path.
fixes:
  - |
    On Linux, the restricted shell privileged helper now follows the core
    Agent. It no longer stops when the private action runner service exits,
    for example in split mode, and it no longer creates a boot-time systemd
    ordering cycle that could leave it missing after a reboot. When the
    privileged helper is enabled but cannot be reached, for example because
    the kernel lacks the Landlock support it needs or the helper is not
    running, ordinary restricted shell commands still run, so non-privileged
    automation is unaffected. Commands that request elevation fail instead of
    running unprivileged, because elevation is enforced by the helper's
    host-local policy, which the ordinary interpreter does not apply. When
    privileged mode is disabled, all restricted shell commands run through the
    ordinary interpreter and elevation is rejected.
