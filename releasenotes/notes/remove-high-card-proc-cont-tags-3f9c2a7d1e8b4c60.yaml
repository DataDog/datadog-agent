# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
upgrade:
  - |
    The ``kube_replica_set`` and ``kube_job`` tags are no longer added to
    Kubernetes pods and containers by the tagger. Their values are generated
    per rollout or per run, which made them high cardinality on every
    container metric. ``kube_deployment``, ``kube_argo_rollout`` and
    ``kube_cronjob`` are unchanged, and the owner name is still available at
    orchestrator cardinality through ``kube_ownerref_name``. Metrics produced
    by the ``kubernetes_state_core`` check, and Kubernetes events whose
    involved object is a ReplicaSet or Job, still carry these tags; Kubernetes
    events about pods no longer do.
  - |
    The ``entrypoint.workdir`` and ``entrypoint.basedir`` tracer process tags
    are no longer added as tags to processes by the tagger or to network
    connections. Their values depend on deployment paths and can be unbounded.
    Other tracer process tags such as ``entrypoint.name`` and
    ``entrypoint.type`` are unchanged.
