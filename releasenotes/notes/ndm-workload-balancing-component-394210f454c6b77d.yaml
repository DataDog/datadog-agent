# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
enhancements:
  - |
    NDM Agent Workload Balancing: added the ``comp/workloadbalancing`` component. It listens
    on the shared ``HA_AGENT`` Remote Config product for per-device workload balancing
    assignments, distinguished from HA Agent's own documents by an explicit ``type`` field.
    Disabled by default (``agent_workload_balancing.enabled``); has no effect on check
    execution until a following release wires it into the check-execution path.
