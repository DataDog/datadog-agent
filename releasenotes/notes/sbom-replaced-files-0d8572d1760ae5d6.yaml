---
fixes:
  - |
    Runtime usage enrichment credits the package of a binary or a library
    that an upgrade replaced under a process running from before
    system-probe started, which procfs names with a ``(deleted)`` suffix.
    The package read unused until the process restarted. This covers the
    processes system-probe reads from procfs at start and, with CWS
    enabled, on ruleset reloads. In a container, the package counts when
    the index of the container holds the build of its image. The package
    fields of CWS events stay empty for such a file.
