---
features:
  - |
    DDOT can serve Remote Configuration through the Datadog extension without a
    separate Datadog Agent process. Enable ``remote_config.enabled`` and configure
    an absolute, writable cache directory. The capability is disabled by default.
  - |
    DDOT can export named Dynamic Instrumentation OTLP log events to existing
    debugger intakes. Enable ``exporters.datadog.dynamic_instrumentation.enabled``.
    Delivery uses the exporter queue and remains independent of Remote Configuration.
