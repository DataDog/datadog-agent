---
security:
  - |
    On Linux, the agent no longer executes third-party Python package build code as root during
    upgrades. Wheels for restored custom integrations are downloaded and built as the ``dd-agent``
    user first and only installed afterwards (wheel installation unpacks files without running
    package code), the saved package list is validated against tampering before being used, and
    direct URL references in that list are rejected. This prevents a compromised ``dd-agent``
    account from escalating to root through the upgrade process.
