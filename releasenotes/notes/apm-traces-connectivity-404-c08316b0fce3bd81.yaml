# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
fixes:
  - |
    The connectivity diagnostics of the Agent, shown in the Agent status, the
    flare and the inventory metadata, no longer report APM traces as failing
    when the trace intake answers ``GET /_health`` with HTTP 404. The trace
    intake no longer serves that path, and still rejects an invalid API key
    with 403. Connection errors, timeouts, 403 and 5xx responses remain
    failures, as does a 404 from an ``apm_config.apm_dd_url`` that is not a
    Datadog host. Trace submission was not affected.
