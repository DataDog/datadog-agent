# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
features:
  - |
    Installer: Added a ``datadog-installer process-manager enable|disable`` command to switch
    which service manager (``dd-procmgrd`` or the native systemd/SCM services) supervises the
    Agent's extension processes after install.
fixes:
  - |
    Installer: The ``process-manager enable|disable`` switch now runs inside the installer
    daemon instead of the one-off ``datadog-installer`` CLI process, so it reliably sees the
    host's actual process manager state instead of reverting to the compiled default.
