# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
features:
  - |
    Installer: The installer daemon can now switch which service manager (``dd-procmgrd`` or the
    native systemd/SCM services) supervises the Agent's extension processes after install, via
    its internal ``datadog-installer daemon process-manager enable|disable`` entry point. The
    switch runs inside the daemon itself so it reliably sees the host's actual process manager
    state, rather than reverting to the compiled default like a one-off CLI invocation would.
