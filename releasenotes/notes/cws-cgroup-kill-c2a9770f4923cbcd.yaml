# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
enhancements:
  - |
    CWS: Kill actions scoped to a container or a cgroup now kill the whole cgroup
    in a single operation, using the cgroup v2 ``cgroup.kill`` interface available
    since Linux 5.14. The kernel handles concurrent forks and process migrations
    itself, so a forking process can no longer outrun the kill. Hosts that do not
    provide a pure cgroup v2 hierarchy, kill actions using a signal other than
    ``SIGKILL``, cgroups that have child cgroups, and cgroups that cannot be
    killed at once still fall back to signalling each process individually.
