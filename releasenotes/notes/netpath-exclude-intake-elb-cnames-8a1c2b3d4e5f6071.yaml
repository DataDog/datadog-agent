---
fixes:
  - |
    Network Path: dynamic tests no longer traceroute Datadog's own intake
    endpoints when those endpoints are CNAME'd to AWS ELB hostnames. Filtering
    now evaluates every DNS name a destination IP reverse-resolves to (instead
    of only the first), so a connection whose IP also resolves to a Datadog
    domain is excluded regardless of DNS cache ordering. Customer ``include``
    filters continue to override the defaults, so Datadog domains can still be
    re-enabled if desired. The reverse-DNS cache also now tracks CNAME
    owner-to-target relationships, so when only the shorter-lived ELB A record
    is re-resolved the destination IP is still re-associated with the original
    ``*.datadoghq.com`` name rather than being left mapped to the ELB hostname
    alone.
