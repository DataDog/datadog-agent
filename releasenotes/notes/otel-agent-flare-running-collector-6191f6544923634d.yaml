# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
security:
  - |
    ``otel-agent flare`` now scrubs credentials, such as the API key, from the
    flare archive, and only keeps the environment variables that are safe to
    share, like the core Agent flare does.
fixes:
  - |
    ``otel-agent flare`` now collects the effective configuration and the
    pprof, zpages, and health_check data of the running collector through its
    ddflare extension, like the core Agent flare does. It falls back to the
    configuration files when the collector can't be reached, and records why in
    ``otel-agent.log``.
  - |
    ``otel-agent flare`` now uploads the flare with the API key and site of the
    Datadog exporter configuration when ``DD_API_KEY`` isn't set, and keeps the
    customer configuration when it contains ``${env:...}`` or ``${...}``
    environment references.
  - |
    ``otel-agent flare`` now collects the log file of the collector, and the
    files its rotation keeps next to it, like the core Agent flare does.
  - |
    ``otel-agent flare`` now resolves the ``ENC[...]`` secrets of the Datadog
    configuration with the configured secret backend, like the core Agent flare
    does, so the flare is uploaded with the resolved API key instead of the
    ``ENC[...]`` handle.
  - |
    ``otel-agent flare`` now applies the proxy and the ``scrubber.additional_keys``
    that environment variables give, like ``otel-agent run`` does, even when
    there is no ``datadog.yaml``. Unless the collector is standalone, it also
    loads the default ``datadog.yaml`` of the Agent when ``--core-config`` is
    not given, like ``otel-agent run`` does, and it no longer stops when that
    file can't be loaded.
  - |
    When the collector can't be reached, ``otel-agent flare`` now keeps the
    ``${env:NAME}`` references of the collector configuration as they are, like
    the live flare does, instead of writing the values of the variables, which
    can be secrets that no scrubber recognizes. Its ``env-config.yaml`` only has
    the settings that come from the environment.
issues:
  - |
    ``otel-agent flare`` has these known limitations:

    - In the gateway deployment of the Datadog Helm chart, the ``ddflare`` and
      ``health_check`` extensions are not enabled, so the flare can't read the
      running collector. It falls back to the configuration files, and without
      ``--config`` it has no configuration and no ``pprof``, ``zpages``, or
      ``health_check`` data. It still has the collector log and the environment.
