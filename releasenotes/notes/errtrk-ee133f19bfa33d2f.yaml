# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
features:
  - |
    Agent error log forwarding can now be turned on and off without restarting
    the Agent, through a remote flag. The flag sets
    ``agent_telemetry.errortracking.enabled`` with the remote configuration
    source, shown by ``agent config``, and the feature follows that setting. A value set locally in the configuration file or the environment
    always takes precedence, whether true or false. When the flag is removed or
    the feature cannot start, the setting goes back to the local or default
    value. Errors logged before the flag reaches the Agent, a few seconds after
    startup, are not captured.
