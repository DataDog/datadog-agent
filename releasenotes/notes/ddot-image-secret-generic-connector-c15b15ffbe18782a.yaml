---
enhancements:
  - |
    The standalone ``otel-agent`` (DDOT) container image now includes the
    ``secret-generic-connector``, so ``ENC[]`` secret handles can be resolved
    with ``secret_backend_type`` (for example ``hashicorp.vault``,
    ``aws.secrets`` or ``k8s.secrets``) without adding the binary to the
    container yourself.
fixes:
  - |
    Fix the standalone ``otel-agent`` (DDOT) FIPS container image failing to
    start when ``secret_backend_type`` is set: the ``secret-generic-connector``
    could not enable FIPS mode, so ``ENC[]`` secret handles were not resolved.
