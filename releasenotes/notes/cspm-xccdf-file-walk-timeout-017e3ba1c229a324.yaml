---
enhancements:
  - |
    CSPM host benchmarks add the ``compliance_config.host_benchmarks.rule_timeout``
    setting, 60 seconds by default: the longest wait for an XCCDF rule before
    the rule is skipped. Raise it on hosts where the rules that walk every
    local file system, such as ``no_files_or_dirs_unowned_by_user``, take
    longer and go missing from the results.
