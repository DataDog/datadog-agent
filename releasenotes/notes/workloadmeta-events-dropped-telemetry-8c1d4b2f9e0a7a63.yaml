---
enhancements:
  - |
    Added a dedicated ``workloadmeta.events_dropped`` telemetry counter, tagged
    by ``subscriber_name``, that counts events lost when a subscriber does not
    read its channel before the send timeout. It is also collected by default in
    agent telemetry (COAT). Unlike the error status on
    ``workloadmeta.notifications_sent``, this counter isolates real event drops
    from acknowledgement timeouts, making it possible to size subscriber data
    loss such as missed Autodiscovery configurations on busy nodes.
