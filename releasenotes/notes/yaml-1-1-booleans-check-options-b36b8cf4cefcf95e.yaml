---
deprecations:
  - |
    The Agent now parses some check configuration options with a YAML 1.2
    parser, which only treats ``true`` and ``false`` as booleans. The YAML
    1.1 spellings (``yes``, ``no``, ``on``, ``off``, ``y``, ``n``) are no
    longer interpreted as booleans for the following options:
    ``is_jmx``, ``run_once``, ``no_index``, ``empty_default_hostname`` and
    ``metric_lookback.enabled``. Use ``true`` or ``false`` instead. All
    other check configuration options are unaffected by this change.
