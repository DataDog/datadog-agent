fixes:
  - |
    HA Agent: a Remote Config document on the ``HA_AGENT`` product that fails to parse and
    also carries a non-empty ``group_id`` field (reserved for an unrelated, upcoming NDM
    feature) is now silently skipped instead of being reported as an HA Agent apply error.
