---
enhancements:
  - |
    On macOS, setting ``process_manager.enabled: false`` in ``datadog.yaml`` turns the process
    manager off when the Agent is installed or upgraded. Restarting the Agent does not apply the
    change. ``DD_PROCESS_MANAGER_ENABLED=false`` passed to the install script does the same for
    that install only. The install fails and leaves the process manager off when ``datadog.yaml``
    cannot be read or parsed, or the value is not a boolean, and nothing overrides it.
