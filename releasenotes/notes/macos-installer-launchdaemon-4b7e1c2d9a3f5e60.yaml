---
enhancements:
  - |
    The macOS ``.dmg`` now also installs the Datadog installer daemon as the
    ``com.datadoghq.installer`` LaunchDaemon, and links the installer as
    ``/usr/local/bin/datadog-installer``. The daemon runs as root and keeps its
    state and logs in the root-owned ``/opt/datadog-packages/run`` and
    ``/opt/datadog-packages/logs`` directories. The macOS uninstall script
    removes it, along with ``/opt/datadog-packages``.
