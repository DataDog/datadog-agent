# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
enhancements:
  - |
    [oracle] Activity samples now report whether the sampled statement runs
    inside PL/SQL (a procedure, function or trigger), with the new
    ``in_plsql`` and ``plsql_entry_object_id`` fields, and ``top_level_sql_id``
    when ``active_session_history`` is enabled. For self-managed databases
    sampled through the ``dd_session`` view, ``in_plsql`` is only reported
    after the view is recreated with its current definition from the Datadog
    Oracle setup documentation, which adds the ``plsql_entry_object_id``
    column, and the Agent is restarted.
