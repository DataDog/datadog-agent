---
features:
  - |
    The Agent now writes a byte-exact snapshot of the configuration files it
    loaded at every start into a dedicated directory
    (``${run_path}/config-backups`` by default). Each distinct configuration
    is stored once, with an append-only log of every start, so the history
    survives restart flapping without growing without bound. The stable and
    experiment Agents share this single directory, so the history stays
    continuous across a Fleet Automation config experiment; each entry's
    manifest records whether it came from an experiment and, if so, its
    deployment ID. Use ``agent config backup list`` to see the snapshots, and
    check the ``config_backup.*`` settings to control the feature.
