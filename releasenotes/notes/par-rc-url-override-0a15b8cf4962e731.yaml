---
features:
  - |
    Private Action Runner now honors a non-empty
    ``remote_configuration.rc_dd_url`` as its API base URL, including scope
    discovery, enrollment, task traffic, and automatic connection creation.
    Custom hosts, ports, and path prefixes work in both monolithic and split
    deployments. An empty or unset override preserves existing endpoint selection.
upgrade:
  - |
    If you use ``remote_configuration.rc_dd_url`` with Private Action Runner,
    ensure the override serves PAR APIs as well as Remote Configuration APIs
    for the same organization and site. A proxy exposing only RC routes is no
    longer sufficient. The override changes routing, not the runner's logical
    site or persisted identity. PAR rejects URLs with embedded credentials,
    queries, or fragments, and requires the same explicit insecure-transport
    opt-ins as Remote Configuration.
