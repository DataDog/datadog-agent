---
enhancements:
  - |
    Add the ``inference_workload`` and ``inference_workload_component`` tags to
    Ray LLM Kubernetes pods and containers, following the Dynamo tagging pattern.
    The Cluster Agent identifies LLM RayServices from their Serve configuration
    or container templates and sends the result to node Agents through Kubernetes
    metadata streaming. The workload tag uses the RayService name. Without parent
    metadata, LLM image and serving-command signals provide a fallback, with the
    generated RayCluster suffix removed. Worker components use the worker group;
    head pods use ``head``. Custom-image detection requires RayService read access
    and metadata streaming between updated Cluster and node Agents.
