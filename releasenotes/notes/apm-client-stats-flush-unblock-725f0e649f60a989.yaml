# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
fixes:
  - |
    APM: When sending stats to Datadog is slow for a short time, the Agent
    keeps accepting the stats that tracing libraries compute and send to it.
    Before, it could reject these stats and log
    ``Error processing pb.ClientStatsPayload: context deadline exceeded``.
    If sending stays blocked for longer, the Agent drops the oldest of these
    stats after about one minute to limit its memory use, and counts them in
    the ``datadog.trace_agent.stats_client.dropped_buckets`` and
    ``datadog.trace_agent.stats_client.dropped_entries`` metrics.
