---
fixes:
  - |
    The SysV and Upstart Private Action Runner launchers now run in monolithic
    mode, including when split mode is configured, and report the selected mode
    without a warning. These launchers do not start the process manager required
    for split mode. The PAR SysV launcher also creates its PID file, polls for
    immediate startup failures, and consistently checks the executable as the
    runner user for startup, stop, and status, excluding unreaped container
    zombies. These lifecycle changes apply only to PAR, not sibling Agent
    services.
