---
features:
  - |
    Added ``runtime.procmgr_process_state``, a Cross-Org Agent Telemetry (COAT)
    gauge reporting the state **dd-procmgr** reports for each managed process.

    ``runtime.procmgr_process_running`` only distinguishes running from
    everything else, so a process that is deliberately stopped could not be
    told apart from one that is crash looping. The new gauge carries the
    reported state (``starting``, ``running``, ``crashed``, ``failed`` and so
    on) as a ``state`` tag alongside ``process``, and is only set while procmgr
    supervises the service.
