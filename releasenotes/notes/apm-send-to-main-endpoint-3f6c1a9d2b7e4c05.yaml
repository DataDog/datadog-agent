# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
enhancements:
  - |
    APM: Add ``apm_config.send_to_main_endpoint`` (``DD_APM_SEND_TO_MAIN_ENDPOINT``,
    default ``true``). When set to ``false``, the trace-agent trace and stats writers
    stop sending to the main endpoint (``api_key`` + ``apm_config.apm_dd_url``) and
    forward traces and APM stats only to ``apm_config.additional_endpoints``. The
    main endpoint's API key is still used by the other trace-agent proxies, and the
    configuration is rejected when no additional endpoint would remain. This is the
    traces/stats counterpart of ``apm_config.profiling_send_to_main_endpoint``.
