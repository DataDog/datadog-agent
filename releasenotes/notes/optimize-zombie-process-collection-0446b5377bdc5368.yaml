---
enhancements:
  - |
    Aggregate zombie processes by parent in standard process payloads when
    ``process_config.ignore_zombie_processes`` is disabled. Parent records
    include ``zombie_children_count`` and ``zombie_net_rate``, and advertise
    aggregation support through ``has_zombie_aggregation`` while individual
    zombie records continue to be emitted in standard and realtime payloads.
    When ``process_config.ignore_zombie_processes`` is enabled, zombie
    processes remain ignored and ``has_zombie_aggregation`` is false.
  - |
    Reduce process collection overhead on Linux hosts with zombie processes by avoiding procfs reads for data that is unavailable after process exit.
