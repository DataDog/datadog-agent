---
other:
  - |
    Replace the upstream PEP 441 zipapp ``gstatus`` binary (~8.2 MiB) with the
    upstream ``__main__.py`` entry point running on the agent's embedded
    Python. The zipapp bundled a full Python interpreter plus cryptography,
    PyNaCl, bcrypt, and paramiko (pulled in because the ``glustercli`` PyPI
    wheel declares paramiko as a required dependency), none of which are
    needed for local GlusterFS status collection. The replacement fetches
    the ``glustercli``, ``glusterlib``, and ``gstatus`` source from
    upstream at build time (stdlib-only for local mode) and ships the
    upstream ``__main__.py`` as the ``gstatus`` entry-point script,
    reducing the on-disk footprint by ~8 MiB with no change to the
    ``gstatus -a -o json -u g`` interface the glusterfs integration relies
    on.
