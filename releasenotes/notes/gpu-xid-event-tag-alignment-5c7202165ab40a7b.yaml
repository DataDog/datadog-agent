# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
enhancements:
  - |
    GPU: align the tags of ``gpu_xid`` events with the tags used by GPU metrics, so events can be
    joined to metrics. XID events from NVLink faults (XIDs 144-150) now include ``nvlink_port``
    (1-based, as in the NVLink metrics) in addition to ``nvlink_link_id`` (the driver's 0-based link
    number). XID 154 events now include ``recovery_action`` and ``recovery_previous_action`` using
    the same values as ``gpu.device.needs_recovery`` (``none``, ``reset``, ``reboot``, ``drain``,
    ``drain_and_reset`` or ``unknown_<n>``). The ``gpu.errors.xid`` and ``gpu.errors.xid.total``
    metrics now carry an ``xid_code`` tag, with the same value as the existing ``type`` tag, which is kept.
upgrade:
  - |
    GPU: the ``memory_location`` tag on XID 94 and 95 events now uses the values of the
    ``memory_location`` tag on GPU metrics, ``device_memory`` and ``sram``, instead of ``DRAM`` and
    ``SRAM``.
