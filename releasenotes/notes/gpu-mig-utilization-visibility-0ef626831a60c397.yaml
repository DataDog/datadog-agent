---
fixes:
  - |
    GPU Monitoring: ``gpu.gr_engine_active``, and ``gpu.sm_active`` when derived from it (the default), are
    no longer reported from GPM for MIG devices and GPUs in MIG mode when the Agent lacks the MIG config
    capability (``CAP_SYS_ADMIN`` or ``/dev/nvidia-caps/nvidia-cap1``): NVML then reports them as 0 even
    under load. They are also not reported for a MIG device or a GPU in MIG mode once NVML reports its graphics
    engine idle while at least 1% of its streaming multiprocessors are in use, which happens when other
    MIG devices of the GPU are not accessible to the Agent, until NVML reports the graphics engine busy
    again. ``gpu.sm_active`` can still
    come from the eBPF probes, and ``gpu.sm_utilization`` is reported in all cases.
  - |
    GPU Monitoring: the Agent logs a warning when processes run on a MIG device it cannot access, for
    example a MIG device created after the Agent container started, if it can list the processes of
    the GPU (MIG monitor capability). The warning is not repeated for 24 hours.
