# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
security:
  - |
    Autodiscovery no longer resolves ``%%env_*%%`` template variables that
    reference environment variables bound to Agent settings, such as
    ``DD_API_KEY`` or ``DD_CLUSTER_AGENT_AUTH_TOKEN``. This prevents configs
    from untrusted sources, like pod annotations, from reading the Agent's
    credentials. To keep resolving one of these variables, list it in
    ``ad_allowed_env_vars``.
upgrade:
  - |
    Autodiscovery check and logs configs that use ``%%env_*%%`` to reference an
    environment variable bound to an Agent setting, such as ``%%env_DD_ENV%%``
    or ``%%env_DD_API_KEY%%``, are now rejected unless the variable is listed in
    ``ad_allowed_env_vars``. When ``ad_allowed_env_vars`` is set, only the
    variables it lists are resolved, so also list any other variables your
    configs reference.
