# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
enhancements:
  - |
    The Cluster Agent now reports an agent health issue when cluster checks
    remain stranded — stuck undispatched past the unscheduled-check threshold
    with no eligible Cluster Check Runner to run them. This covers both a total
    loss of runners and a runner group losing all of its runners while other
    workers keep reporting. In that situation the affected checks are not
    executed and their metrics may be lost; the health issue makes the condition
    visible and is resolved automatically once an eligible worker is available
    for those checks again.
