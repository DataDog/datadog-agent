---
fixes:
  - |
    serverless-init no longer reports ``unknown`` for GCP metadata values it
    could not retrieve. Failed lookups, non-``200`` responses, and timed-out
    requests now leave the corresponding tag values empty.
  - |
    The ``gcr.resource_name``, ``gcrfx.resource_name``, and
    ``gcrj.resource_name`` tags are omitted when a required component
    (project, region, service, job, or function target) is unavailable,
    instead of being reported with empty path segments.
  - |
    serverless-init now fetches GCP metadata once per process and shares it
    between tagging and the serverless-init metadata payload.
