# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
features:
  - |
    Add the ``remote_queries.execute.timeout_ms`` configuration option (default
    ``300000``, i.e. 5 minutes). The Agent now enforces its own statement timeout
    for Remote Queries instead of using the backend-injected 30-second default:
    the timeout protects the queried database by capping how long the read-only
    transaction can hold its snapshot, so it is owned by the Agent configuration.
