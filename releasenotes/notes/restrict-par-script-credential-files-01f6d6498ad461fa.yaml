---
security:
  - |
    Restrict Private Action Runner Script connection credential files to approved
    directories. By default, only the packaged Private Action Runner configuration
    directory is allowed. Set
    ``private_action_runner.script.credential_file_allowed_roots`` to replace that
    default with custom directories; an explicit empty list disables Script
    credential-file access. Generic file-backed connection secrets are not affected
    by this setting.
upgrade:
  - |
    Private Action Runner Script connections whose credential file is outside the
    packaged ``private-action-runner`` configuration directory stop working after
    upgrading. Before upgrading, add the directories containing those files to
    ``private_action_runner.script.credential_file_allowed_roots``. The
    automatic Script connection is no longer created when the packaged
    ``private-action-runner`` directory is not an allowed root.
