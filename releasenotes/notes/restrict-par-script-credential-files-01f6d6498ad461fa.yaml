---
security:
  - |
    Restrict Private Action Runner Script connection credential files to approved
    directories. By default, only the packaged Private Action Runner configuration
    directory is allowed. Set
    ``private_action_runner.script.credential_file_allowed_roots`` to replace that
    default with custom directories; an explicit empty list disables Script
    credential-file access. Before upgrading, operators using custom credential-file
    locations must add their containing directories to this setting.
