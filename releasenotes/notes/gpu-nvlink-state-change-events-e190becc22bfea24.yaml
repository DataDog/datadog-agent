# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
enhancements:
  - |
    The GPU check now emits a ``gpu_nvlink_state_change`` event when an NVLink
    port of an NVIDIA GPU goes down (active to inactive) or comes back up. The
    event is tagged with ``nvlink_port`` (1-based, like the NVLink metrics),
    ``nvlink_state`` and ``nvlink_previous_state``, plus the usual GPU tags.
    Link states at check startup are not reported. Disable the events by adding
    ``nvlink_state`` to ``gpu.disabled_collectors``.
