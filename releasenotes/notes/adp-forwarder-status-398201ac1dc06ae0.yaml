---
enhancements:
  - |
    When the Agent Data Plane (ADP) is enabled, Agent status shows Core Agent Forwarder metrics
    in the existing Forwarder section and ADP Forwarder metrics separately by remote agent.
    Endpoint, HTTP-code, and storage details remain Core Agent-only. Legacy ``/debug/vars``
    paths continue to combine mapped Core Agent and ADP values for ``go_expvar`` consumers.
