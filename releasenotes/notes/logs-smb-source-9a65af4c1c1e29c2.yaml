---
features:
  - |
    Experimental: the Agent can collect logs from files on an SMB 3 share,
    such as a Windows file server, Samba or Azure Files, without mounting the
    share. Configure a log source with ``type: smb``, a ``path`` glob relative
    to the share root and an ``smb`` block with the ``host``, ``share``,
    ``username`` and ``password`` (preferably an ``ENC[]`` secret handle) to
    connect with. The Agent lists the share every ``poll_interval`` seconds
    (default 1), opens a file only to read new data, and follows rotated files
    by their server file ID. It keeps reading a rotated file until the file
    has had no new data for ``logs_config.close_timeout`` seconds (default
    60), and for at most 10 times that. File sources use the same setting as
    the maximum time spent on a rotated file; SMB sources use it as a quiet
    period, because the Agent cannot hold the rotated file open and a writer
    may still append to it. Agents do not elect a single reader per share:
    every Agent with a ``type: smb`` source lists the share and reads every
    file the source's ``path`` matches, so a DaemonSet that configures the
    source on N nodes ships each line N times. Configure the source on one
    Agent per share.
    The bytes reported missed for an SMB source are a lower bound: when a
    file is deleted, or compressed and deleted, before the Agent lists it
    again, the lines it gained since are lost without being counted. The
    Agent signs every SMB message, which authenticates the server's
    responses, and refuses guest and anonymous sessions. It does not encrypt
    the traffic itself: the log lines are encrypted only if the server
    enforces encryption or the source sets ``require_encryption: true`` in
    its ``smb`` block. It offers SMB 3 dialects only; set
    ``allow_smb2: true`` for a server that supports nothing newer (it cannot
    be combined with ``require_encryption``). Use a fully qualified host name
    or an IP address as ``host``: the Agent warns about single-label and
    ``.local`` names, which other machines on the subnet can answer for.
    To avoid locking out an Active Directory account, the Agent sends one
    logon at a time per account, and no logon with a password that the
    server refused, until the password changes or the Agent restarts; the
    source status says why it stopped and what to fix. A locked-out account
    is tried again once an hour. Only the full Agent on Linux, Windows and
    macOS, including its container image, includes the SMB log source: the IoT
    Agent, the Heroku Agent and FIPS builds of the Agent do not, and report
    ``smb`` sources as errors in the Agent status. FIPS builds leave it out
    because SMB NTLMv2 authentication, the only one supported, needs
    algorithms that are not FIPS-approved.
