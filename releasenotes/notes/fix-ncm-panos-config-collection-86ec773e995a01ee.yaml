fixes:
  - |
    Network Configuration Management (NCM) now collects the running configuration
    from Palo Alto (PAN-OS) devices. The ``pan-os`` profile runs its commands in an
    interactive SSH session (previously only the login banner was captured) and
    accepts both the XML and curly-brace output formats returned by different
    PAN-OS versions. Admin password hashes, SNMP community strings, and values
    PAN-OS stores encrypted (such as IKE pre-shared keys) are redacted in both
    formats.
