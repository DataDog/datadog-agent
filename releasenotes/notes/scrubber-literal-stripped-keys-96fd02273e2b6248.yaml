# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
upgrade:
  - |
    Entries in ``scrubber.additional_keys`` and ``flare_stripped_keys`` are now matched as literal
    key names. Regular expression syntax in these entries, such as ``.*_dsn``, is no longer
    interpreted; list each key to scrub explicitly.
fixes:
  - |
    Keys added to the scrubber through ``scrubber.additional_keys``, ``flare_stripped_keys``, or
    configuration values resolved from secrets are now matched literally. Keys containing
    regular expression characters such as ``(`` or ``.`` no longer cause the Agent to crash and
    are scrubbed as written. These keys are also matched regardless of case when scrubbing
    structured YAML and JSON data.
