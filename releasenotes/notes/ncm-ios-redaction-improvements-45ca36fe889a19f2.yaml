# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
security:
  - |
    Network Config Management: The default Cisco IOS profile now redacts
    more secrets from collected configs. ``key`` lines under ``radius server``
    and ``tacacs server`` blocks are now redacted (previously that rule never
    matched), as are RADIUS server keys, ``server-private`` keys, IKEv2
    pre-shared keys, NTP authentication keys, and passwords and secrets that are
    written without an encryption-type digit (e.g. ``enable secret <value>``).
