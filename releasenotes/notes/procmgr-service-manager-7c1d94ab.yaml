---
upgrade:
  - |
    On Linux, the Datadog process manager (``dd-procmgrd``) is now a first-class service manager
    alongside systemd, upstart and sysvinit, and it is the default when the ``dd-procmgrd`` binary
    ships with the Agent. The OpenTelemetry Collector distribution is supervised through
    ``processes.d`` and the ``datadog-agent-ddot`` systemd unit is no longer installed.

    Each service manager now installs its own self-consistent set of units, so a host runs either
    the ``dd-procmgrd`` supervision path or the per-payload systemd units, never a mix of the two.
  - |
    Set ``DD_PROCMGR_DISABLE=true`` to keep the per-payload systemd units instead of
    ``dd-procmgrd``. Persist it in ``/etc/datadog-agent/environment`` so that Fleet-driven upgrades
    honour it: the Agent installer service reads that file when it starts, and a value exported
    only in an interactive shell is not carried across a remote update.
  - |
    The Agent installer no longer reads ``DD_PROCESS_MANAGER_ENABLED``; use
    ``DD_PROCMGR_DISABLE=true`` instead. This affects Windows, where the previous variable
    controlled whether the installer wrote ``processes.d`` entries. The Agent's own
    ``process_manager.enabled`` setting is unchanged and still controls the ``dd-procmgr-service``
    Windows service.
