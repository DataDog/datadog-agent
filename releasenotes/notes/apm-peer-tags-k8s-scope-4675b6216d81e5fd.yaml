# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
enhancements:
  - |
    APM: When it runs in Kubernetes, the trace-agent adds the ``peer.k8s.cluster.uid`` and
    ``peer.k8s.namespace`` peer tags to trace stats of calls whose peer hostname has the shape of a
    cluster-local service name. The tags are the candidate cluster and namespace of the peer, for a
    best-effort lookup in the Kubernetes inventory. They assume standard cluster DNS: custom DNS policies
    or search domains, absolute names and host-network pods can resolve the same name elsewhere, and the
    Agent does not check that the service exists. The supported forms are ``<service>`` (in the namespace
    of the calling container), ``<service>.<namespace>``, ``<service>.<namespace>.svc``,
    ``<service>.<namespace>.svc.cluster.local`` and the headless service pod forms
    ``<pod>.<service>.<namespace>.svc[.cluster.local]``, with an optional port. Only the ``cluster.local``
    cluster domain is recognized; fully qualified names under other cluster domains get no tags. IP
    addresses and other names get no tags. The peer hostname is the highest precedence non-empty source of
    ``peer.hostname`` on the span (for example ``peer.hostname``, ``server.address`` or ``out.host``). This
    applies to stats computed by the Agent and by tracers. For stats computed by tracers, the namespace of a
    bare ``<service>`` name is unknown when the ``disable_cid_stats`` APM feature is enabled, and such names
    then get no tags. The cluster UID comes from ``DD_ORCHESTRATOR_CLUSTER_ID`` or the Cluster Agent; until
    it is known, no tags are added. To opt out, set ``apm_config.peer_tags_k8s_scope.enabled``
    (``DD_APM_PEER_TAGS_K8S_SCOPE_ENABLED``) to ``false``. Disabling ``apm_config.peer_tags_aggregation``
    also disables these tags.
