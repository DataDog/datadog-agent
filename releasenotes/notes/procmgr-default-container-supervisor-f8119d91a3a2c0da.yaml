# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
upgrade:
  - |
    The Linux Agent container now runs its processes under ``dd-procmgrd``
    instead of s6. If the core Agent exits, the container now exits with the
    Agent's exit code instead of 0. Only enabled processes start, and services
    under ``/etc/services.d/`` are ignored. Scripts in ``/etc/cont-init.d/``
    still run but need a shebang. A ``PATH`` set on the container no longer
    reaches the Agent processes, except ``otel-agent``. ``DD_PM_*`` variables are
    not passed to the processes, except ``DD_PM_SOCKET_PATH``. Start, exit and
    restart messages now go to the container output instead of
    ``/var/log/datadog/init.log``, and they are worded differently. To keep s6
    for this release, set the environment variable ``ENTRYPOINT=s6-all-in-one``.
    s6 will be removed in a future release.
