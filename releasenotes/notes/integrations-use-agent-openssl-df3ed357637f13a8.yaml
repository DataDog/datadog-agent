# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
enhancements:
  - |
    On Linux, Python integrations now use the Agent's OpenSSL instead of the
    copies bundled with some of their dependencies (``confluent-kafka``,
    ``aerospike``, ``cryptography`` and ``psycopg``). This makes the Linux
    packages about 7 MiB smaller.
fixes:
  - |
    On the Linux FIPS Agent, the Kafka consumer and Aerospike integrations no
    longer fail to set up TLS with "library has no ciphers": they now use the
    Agent's FIPS-configured OpenSSL. This doesn't make them FIPS verified; see
    `FIPS Verified Agent Integrations
    <https://docs.datadoghq.com/integrations/guide/fips-integrations/>`_ for
    the integrations that are.
