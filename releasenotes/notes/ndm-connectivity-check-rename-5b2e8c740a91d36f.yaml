# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
features:
  - |
    The NDM connectivity check and the NDM discovery sweep now share one
    probing implementation. The number of workers the interactive connectivity
    check may use is set with ``network_devices.connectivity_check.workers``,
    separately from ``network_devices.discovery.workers``. One unreachable
    address no longer discards the results of the addresses probed alongside it.
