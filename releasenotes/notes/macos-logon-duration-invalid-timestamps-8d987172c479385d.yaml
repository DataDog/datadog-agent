---
fixes:
  - |
    macOS logon duration events with impossible timestamps, for example when the
    clock is wrong at boot, are now titled "Boot timeline invalid". The event
    keeps the raw timestamps and durations, which can be negative.
  - |
    macOS logon duration events now wait for a logged-in user and capture the
    login window and desktop ready after an authenticated FileVault restart.
  - |
    Logon duration events on macOS and Windows now carry an ``agent_version``
    field with the version of the Agent that sent them.
