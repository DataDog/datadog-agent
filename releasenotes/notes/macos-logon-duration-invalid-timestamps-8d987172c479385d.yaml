---
fixes:
  - |
    macOS logon duration events no longer report negative or impossible durations
    when the clock is wrong at boot. Events with invalid timestamps are titled
    "Boot timeline invalid".
  - |
    macOS logon duration events now wait for a logged-in user and capture the
    login window and desktop ready after an authenticated FileVault restart.
  - |
    Logon duration events on macOS and Windows now carry ``payload_version: 1``.
