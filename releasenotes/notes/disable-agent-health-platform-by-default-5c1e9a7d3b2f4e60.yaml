# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
fixes:
  - |
    Disable the Agent Health Platform by default to avoid Autodiscovery stalls.
    Reporting Autodiscovery annotation and template errors to the Health Platform
    could block Autodiscovery for several seconds, causing workloadmeta to drop
    event bundles. This affects both the node Agent and the Cluster Agent. To turn
    the Health Platform back on, set ``health_platform.enabled: true`` in
    ``datadog.yaml`` or ``DD_HEALTH_PLATFORM_ENABLED=true``.
