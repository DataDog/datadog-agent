# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
fixes:
  - |
    The ``metric_filterlist`` and ``metric_tag_filterlist`` settings reported by
    Remote Configuration are now ordered deterministically. They were built by
    iterating over maps, so their order varied between refreshes even when the
    configuration had not changed, which made the Agent report spurious
    configuration changes. This does not affect which metrics or tags are
    filtered.
