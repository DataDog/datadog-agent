# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
upgrade:
  - |
    DDOT (Datadog Distribution of OpenTelemetry Collector): when the
    OpenTelemetry Agent runs in standalone mode (``DD_OTEL_STANDALONE=true``)
    on Kubernetes, it now collects the pods used for Kubernetes tag
    enrichment from the Kubernetes API server by default, watching only the
    pods scheduled on its own node, instead of from the kubelet. Its service
    account needs ``get``, ``list`` and ``watch`` on ``pods``, and one of the
    ``K8S_NODE_NAME``, ``DD_KUBERNETES_KUBELET_NODENAME`` or
    ``OTEL_K8S_NODE_NAME`` environment variables must hold the node name,
    which the OpenTelemetry and Datadog Helm charts and the Operator
    populate. The kubelet is no longer contacted by default for anything
    else either: without ``DD_HOSTNAME``, the hostname no longer falls back to
    the kubelet when none of these environment variables is set, and the
    cluster name, the Kubernetes distribution tag and the node annotation host
    aliases are no longer looked up from the node. ``DD_CLUSTER_NAME``, the
    cloud provider, and the ``k8s.cluster.name`` attribute of the collector's
    telemetry resource still give the cluster name. To keep the previous
    behavior, set ``use_kubelet_collector: true`` in the ``dogtel`` extension
    (``otelcollector.standalone.use_kubelet_collector`` in ``datadog.yaml``).
