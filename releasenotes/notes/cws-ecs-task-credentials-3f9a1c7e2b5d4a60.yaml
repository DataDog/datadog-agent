# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
features:
  - |
    CWS now captures the AWS credentials served by the ECS task credential
    endpoint on the ECS EC2 launch type, in addition to those served by the
    instance metadata service and the EKS Pod Identity Agent. These ``imds``
    events report ``ECS`` in the ``imds.credential_source`` field. The endpoint
    address can be changed with the new ``runtime_security_config.ecs_ipv4``
    setting, and setting it to an empty string disables the capture.
