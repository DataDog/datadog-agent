fixes:
  - |
    Fix empty remote device names on SNMP topology links discovered through CDP.
    The remote device name was read only from ``cdpCacheSysName``
    (``1.3.6.1.4.1.9.9.23.1.2.1.1.17``), which comes from CDP's optional SysName
    TLV and is not emitted by many devices. It now falls back to
    ``cdpCacheDeviceId`` (``1.3.6.1.4.1.9.9.23.1.2.1.1.6``), the mandatory
    Device-ID TLV that always carries the neighbor's identity. Links discovered
    through LLDP are unaffected.
