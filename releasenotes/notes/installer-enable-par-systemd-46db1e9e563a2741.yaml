enhancements:
  - |
    The Datadog Installer now enables the Private Action Runner when installing
    or reinstalling the Agent on Linux hosts running systemd with the process
    manager enabled, unless the runner already has an explicit enabled setting.
    FIPS installations are excluded. The runner automatically enrolls when the
    Agent's API key has the Private Action Runner capability, and Execution
    Policies control which actions users can run on enrolled Agents.

    To opt out, set ``DD_PRIVATE_ACTION_RUNNER_ENABLED=false`` when running the
    installer or set ``private_action_runner.enabled: false`` in ``datadog.yaml``.
