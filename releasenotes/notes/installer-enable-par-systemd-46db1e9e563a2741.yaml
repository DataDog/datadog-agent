enhancements:
  - |
    Agent installations and upgrades now enable the Private Action Runner by
    default on Windows and Linux hosts running systemd, when the process manager
    is enabled. This applies to the Datadog Installer, Windows MSI, and Linux
    DEB/RPM packages. Existing explicit runner settings are preserved. FIPS
    installations and platforms without process-manager support are excluded.
    The runner automatically enrolls when the Agent's API key has the Private
    Action Runner capability, and Execution Policies control which actions
    users can run on enrolled Agents.

    To opt out, set ``DD_PRIVATE_ACTION_RUNNER_ENABLED=false`` when running the
    installer (or as a Windows MSI property), or set
    ``private_action_runner.enabled: false`` in ``datadog.yaml``.
