---
fixes:
  - |
    Fix Oracle ``query_timeout`` enforcement. The timeout (default 20 seconds)
    now applies to each database operation, including result fetching and
    cleanup. With the default Go driver, the socket timeout fallback is now
    twice ``query_timeout``, and sockets are released after failed connection
    attempts. Improve recovery from timeouts, canceled operations, cursor
    exhaustion, and protocol errors.
