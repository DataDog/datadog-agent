# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
fixes:
  - |
    APM: Fix the trace writer sending requests larger than the intake accepts,
    which were rejected with ``413 Payload Too Large`` and dropped traces. This
    could happen since Agent 7.84.0 with large traces, for example traces carrying
    LLM Observability data. The writer now sends buffered traces on their own before
    a large payload, and splits large payloads by size instead of by number of traces.
