---
features:
  - |
    Health-check remediation (experimental, disabled by default): any check can
    declare a ``health_check`` block with ``remediation`` steps in its ``conf.d``
    configuration. When that check's service check goes ``CRITICAL`` the Agent runs
    the declared remediation steps through the local Private Action Runner
    (restricted shell, non-privileged), then re-checks to verify. Enable it with
    ``health_check_remediation.enabled``.
