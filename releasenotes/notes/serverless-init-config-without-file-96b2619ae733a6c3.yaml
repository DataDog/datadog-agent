---
fixes:
  - |
    serverless-init now runs all configuration steps when no ``datadog.yaml``
    file exists:

    - ``ENC[]`` values in environment variables resolve through the
      configured secret backend.
    - serverless-init removes leading and trailing whitespace from
      ``DD_API_KEY`` and ``DD_LOGS_CONFIG_API_KEY``.
    - An ``org_uuid`` setting turns on delegated authentication. DogStatsD
      metrics still need ``DD_API_KEY``.
    - ``DD_SCRUBBER_ADDITIONAL_KEYS`` and ``DD_FLARE_STRIPPED_KEYS`` add keys
      to the scrubber.
upgrade:
  - |
    When no ``datadog.yaml`` file exists, serverless-init now stops at startup
    in these cases:

    - The secret backend cannot resolve an ``ENC[]`` value.
    - ``DD_LOGS_CONFIG_USE_PODMAN_LOGS`` and
      ``DD_LOGS_CONFIG_DOCKER_PATH_OVERRIDE`` are both set.
    - ``DD_FIPS_ENABLED`` is ``true`` and ``DD_FIPS_LOCAL_ADDRESS`` is not a
      local address.

    With ``DD_FIPS_ENABLED=true``, serverless-init now sends data to the local
    FIPS proxy ports.
