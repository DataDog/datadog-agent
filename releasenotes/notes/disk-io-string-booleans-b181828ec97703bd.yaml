---
fixes:
  - |
    The ``disk`` and ``disk I/O`` checks now accept their boolean options
    (``use_mount``, ``all_partitions``, ``tag_by_filesystem``,
    ``lowercase_device_tag``) set to the string values ``"true"`` and
    ``"false"``, in addition to booleans and the YAML 1.1 spellings
    (``yes``/``no``/``on``/``off``). String values, common in JSON
    autodiscovery configurations such as container labels and Kubernetes
    annotations, were previously ignored and the option kept its default.
    If you use them, the corresponding metrics change accordingly after
    the upgrade: for example, with ``use_mount: "true"`` the ``device``
    tag now reports the mountpoint instead of the device name.
