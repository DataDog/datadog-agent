---
enhancements:
  - |
    The Versa check adds a ``client_timeout`` option (seconds, default 10) for
    Versa API requests, and an ``endpoint_overrides`` option to set
    ``max_count``, ``max_pages``, and ``timeout`` per endpoint. For example:

    .. code-block:: yaml

      endpoint_overrides:
        sla_metrics:
          timeout: 60
          max_count: 500
          max_pages: 40
