# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
features:
  - |
    Added Secret metadata collection to the Kubernetes Orchestrator. Secrets are
    collected through a metadata-only informer, so their ``data`` and ``stringData``
    values are never fetched from the API server, and the
    ``kubectl.kubernetes.io/last-applied-configuration`` annotation is removed
    before manifests are sent. The collector is disabled by default and must be
    activated explicitly by listing ``secrets`` in the ``collectors`` field of the
    orchestrator check instance configuration. It requires ``list`` and ``watch``
    permissions on ``secrets``.
