# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
features:
  - |
    Add the ``install-databricks-gpu.sh`` install script for GPU Monitoring on
    Databricks. It installs the latest Agent 7 with GPU monitoring enabled and
    the latest 0.x Datadog C tracer (dd-trace-c) for GPU traces. Set
    ``DD_AGENT_MINOR_VERSION`` to pin the Agent version and ``DD_C_TRACER_VERSION``
    to pin the C tracer version. This script does not set up Data Jobs Monitoring.
