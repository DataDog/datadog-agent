---
fixes:
  - |
    On Windows, **dd-procmgrd** now resolves a ``stdout: inherit`` or
    ``stderr: inherit`` process configuration against the standard handles it
    owned at startup, instead of reading them again at spawn time, and restores
    its standard handle slots after stopping a supervised process gracefully.
    Stopping a process gracefully attaches the supervisor to that process's
    console and detaches again, so when the supervisor has no console of its
    own the standard handle slots are not a dependable source of stdio for a
    later spawn. Pinning them at startup makes ``inherit`` resolve the same way
    for every spawn, regardless of the order commands arrive in.
