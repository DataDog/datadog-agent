---
enhancements:
  - |
    On macOS, the Datadog process manager daemon (``dd-procmgrd``) now ships as the LaunchDaemon
    ``com.datadoghq.procmgr``. The installer loads or removes that job from
    ``process_manager.enabled`` (default ``true``). The core Agent does not start or stop it at
    runtime. No Agent component is supervised by it yet on this platform.
