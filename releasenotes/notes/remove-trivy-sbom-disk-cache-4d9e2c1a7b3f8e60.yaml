---
enhancements:
  - |
    SBOM scanning keeps its cache in memory for the duration of a scan and frees
    it when the scan completes. Every scan path uses that in-memory cache, so a
    scan touches only memory.
upgrade:
  - |
    The following SBOM configuration options are removed and are ignored if set,
    because the SBOM cache lives in memory for the duration of a scan.

    - ``sbom.cache_directory``
    - ``sbom.clear_cache_on_exit``
    - ``sbom.cache.max_disk_size``
    - ``sbom.cache.clean_interval``
    - ``sbom.container_image.overlayfs_disable_cache``

    A host upgraded from an earlier version keeps the ``fanal`` directory that
    the previous cache wrote under ``sbom.cache_directory``, by default
    ``<run_path>/sbom-agent``. It is safe to delete.
  - |
    The SBOM cache telemetry metrics ``sbom.cache_disk_size``,
    ``sbom.cache_hits_total`` and ``sbom.cache_misses_total`` are removed. They
    measured the on-disk cache.
