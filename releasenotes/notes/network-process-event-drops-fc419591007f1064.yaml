---
fixes:
  - |
    Reduced the chance that CNM and USM connections from long-running
    processes are missing their container ID and process tags after
    system-probe restarts. When system-probe starts, it replays all running
    processes to the network module, and the module's event channel was
    small enough that part of this burst could be dropped. The channel is
    now larger, though a very large burst can still overflow it.
