# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
fixes:
  - |
    Distribution sketches no longer take memory in proportion to their number
    of observations. A sketch given more than 268,431,360 observations in one
    flush interval, for instance by a check histogram bucket with a very large
    count or a very low DogStatsD sample rate, used to take a bin for every
    65535 of them: a single bucket of 1.42e12 observations allocated over
    1 GiB. Past that count, the sketch now scales its bins down by powers of
    two instead. The observations of each value that fall short of a scaled
    bin unit are kept aside rather than rounded away, so that the sketch ends
    up the same however its observations were batched. Its count, sum,
    minimum, maximum and average stay exact.
