# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
enhancements:
  - |
    Fleet Automation: the installer daemon now reports whether it can reach the
    package registry as a ``fleet_registry_reachable`` tag, so a host with no
    route to the registry can be identified before a remote upgrade is
    attempted rather than after it fails. The check pings the registry's
    ``/v2/`` endpoint at most once per
    ``installer.registry_reachability_refresh_interval`` (default one hour).
