---
enhancements:
  - |
    GPU Monitoring can now tag GPU metrics with the training job they belong to. Set
    ``gpu.jobs.run`` and ``gpu.jobs.group`` with a ``key`` and a ``type`` (``label`` or
    ``annotation``) to read the run and group IDs from a pod label or annotation. The values
    are added as the ``training_job_id`` and ``training_group_id`` tags to the GPU and NCCL metrics.
