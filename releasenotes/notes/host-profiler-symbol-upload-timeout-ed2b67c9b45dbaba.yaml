# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
fixes:
  - |
    The host profiler no longer stops uploading large debug symbol files
    after 15 seconds. The time allowed for an upload now grows with the
    file size, up to a maximum of 5 minutes.
enhancements:
  - |
    You can now set the time limits for host profiler symbol uploads. In
    ``datadog.yaml``, set ``upload_timeout``, ``upload_timeout_per_mib`` and
    ``max_upload_timeout`` under ``hostprofiler.symbol_uploader.options``, for
    example ``hostprofiler.symbol_uploader.options.max_upload_timeout: 10m``.
    The ``DD_HOSTPROFILER_SYMBOL_UPLOADER_OPTIONS`` environment variable takes
    the same keys as a JSON object. In standalone mode, set the same keys under
    ``symbol_uploader`` in the profiling receiver configuration. Each value
    needs a unit, for example ``30s`` or ``10m``.
