# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
features:
  - |
    Entries of ``metric_filterlist`` (and of the deprecated
    ``statsd_metric_blocklist``) ending with ``*`` are now prefix patterns
    matching every metric name starting with the rest of the entry, so exact
    names and prefixes can be mixed in the same list. For example
    ``foo.bar.*`` drops every metric whose name starts with ``foo.bar.``, while
    ``foo.bar`` still drops only that exact name. This applies to lists read
    from the configuration file as well as to lists received from Remote
    Configuration. ``metric_filterlist_match_prefix``, which turns every entry
    of the list into a prefix, is unaffected and still supported.
upgrade:
  - |
    A ``metric_filterlist`` or ``statsd_metric_blocklist`` entry ending with
    ``*`` is now interpreted as a prefix pattern rather than as a metric name
    containing a literal trailing ``*``. Metric names ending with a literal
    ``*`` can no longer be filtered.
fixes:
  - |
    Fixed prefix entries of ``metric_filterlist`` not being applied to the
    aggregates derived from DogStatsD histograms, timings and distributions
    (for example ``.avg`` or ``.95percentile``) when the name of the aggregate
    matched the prefix but the name of the histogram itself did not.
