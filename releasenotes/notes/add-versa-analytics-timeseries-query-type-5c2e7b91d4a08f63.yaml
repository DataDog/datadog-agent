# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
features:
  - |
    Add an ``analytics_query_type`` option to the Versa integration, selecting how Versa
    Analytics metrics are queried. The default, ``tableData``, keeps the existing behavior
    of one aggregate value per entity covering the whole lookback window. Setting it to
    ``timeseries`` queries Versa for one value per time bucket instead, so short-lived
    spikes inside the lookback window are preserved rather than averaged away. The
    companion ``analytics_gap`` option sets the requested bucket size, defaulting to
    ``1MINUTE``, which Versa renders at whatever resolution the tenant is configured for.

    SLA, path QoS, circuit QoS and interface utilization metrics collected this way are
    submitted with the timestamp of their own bucket and deduplicated per tenant and
    entity, so a lookback window longer than the check interval does not double report;
    these four are validated against customer Versa responses. The newest bucket of each
    entity is held back for one collection, because Versa's buckets are wall-clock aligned
    and the current one is still accumulating.

    SDWAN link usage (``collect_link_metrics``), tunnel (``collect_tunnel_metrics``) and
    DIA (``collect_dia_metrics``) metrics are also collected per bucket when
    ``timeseries`` is set. They take their attribute tags (such as type, media, IP, ISP,
    peer IP and VPN profile) from the same query run as ``tableData``, paging up to
    ``max_pages``, joined on the entity key. They are validated with synthetic Versa
    responses; validation against a Versa environment with traffic is pending, including
    the tunnel ``tableData`` column order for ``volume-tx`` and ``volume-rx``. Link
    status, site, application and top user metrics stay on ``tableData``.

    A timeseries query falls back to its ``tableData`` result for that collection, with a
    warning giving the reason, when Versa rejects the timeseries request with an error
    response or returns a body that cannot be parsed (the warning includes the HTTP
    status and Versa's numeric error code), when its entity keys do not match the expected
    layout, when ``tableData`` rows sharing a key differ in their tags, or when no entity
    matches a ``tableData`` row or unmatched entities outnumber matched ones.
    Authentication, connection and server errors are reported as errors, as in
    ``tableData`` mode. Each fallback is counted as
    ``versa.timeseries.fallback``, tagged by ``tenant``, ``query`` and ``reason``, so it can
    be monitored. With debug logging, a fallback also logs sample series names and
    ``tableData`` keys, which contain site, circuit and IP names.
