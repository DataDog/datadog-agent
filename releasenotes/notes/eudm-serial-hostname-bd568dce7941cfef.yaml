---
upgrade:
  - |
    In ``end_user_device`` mode, macOS now uses the configured Computer Name
    instead of the network-derived hostname.
    On macOS and Windows in ``end_user_device`` mode, set
    ``hostname_use_serial: true`` to append the hardware serial number and
    help prevent duplicate hostnames (disabled by default).
    Explicit hostname overrides are preserved. Restart the Agent after
    changing this setting. Existing device history is not migrated when
    the hostname changes.
