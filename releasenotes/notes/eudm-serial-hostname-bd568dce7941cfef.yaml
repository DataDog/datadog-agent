---
upgrade:
  - |
    On macOS, devices using ``infrastructure_mode: end_user_device`` now use
    the configured Computer Name instead of the network-derived hostname.
    Windows devices use the OS hostname. On both platforms, set
    ``hostname_use_serial: true`` (or ``DD_HOSTNAME_USE_SERIAL=true``) to append
    the hardware serial number. This setting defaults to ``false``; macOS uses
    Computer Name regardless of its value. Explicit hostname overrides are
    preserved. If serial appending is enabled but the serial is unusable, the
    Agent falls back to existing hostname resolution. Restart the Agent after
    changing the setting. Hostname changes change the device identity in Datadog;
    existing device history is not migrated.
