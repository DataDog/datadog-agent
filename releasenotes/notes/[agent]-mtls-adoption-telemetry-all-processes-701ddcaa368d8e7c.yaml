# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that it
# does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
enhancements:
  - |
    The ``api_server.request_duration_seconds`` internal metric, which tags requests with the
    authentication mode used by IPC clients (``mTLS`` vs ``token``), is now emitted by the
    process agent, the security agent, and the trace agent (including the OTel agent) for
    their token-authenticated IPC endpoints, not only by the core agent. These per-process
    series are forwarded to the core agent through the remote agent registry telemetry
    provider with an additional ``emitter`` tag identifying the agent flavor. The
    system-probe token-authenticated endpoint is instrumented as well, tagged ``no_tls``
    since its unix socket server does not use TLS.
