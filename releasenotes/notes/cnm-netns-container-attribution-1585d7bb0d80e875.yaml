# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
features:
  - |
    CNM: Add ``network_config.enable_netns_container_attribution`` (disabled by default).
    When enabled, a socket that an allowlisted proxy, such as Istio ambient's ``ztunnel``,
    creates inside another pod's network namespace is attributed to the container that owns
    that namespace instead of the proxy. Only sockets on the mesh tunnel's ports are moved,
    set with ``network_config.netns_container_attribution_ports`` (default ``15008``, Istio's
    HBONE port); the proxy's other legs inside the pod duplicate the application's own sockets
    and stay on the proxy. Owners are matched by image short name, set with
    ``network_config.netns_container_attribution_owner_images`` (default ``ztunnel``).
    Helper containers are matched by Kubernetes container name and don't count as the target,
    set with ``network_config.netns_container_attribution_ignored_containers`` (default
    ``vault-agent``, ``vault-agent-init``, and ``cloud-sql-proxy``); their own sockets keep
    their container. A socket is moved only when exactly one eligible running container is in
    the namespace, so pods with several application containers stay on the proxy. The feature
    requires process event monitoring; without it, system-probe logs a warning and does nothing.
