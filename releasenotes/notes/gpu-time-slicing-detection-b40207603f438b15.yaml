---
enhancements:
  - |
    The Agent now detects NVIDIA GPUs shared by the device plugin through
    replication (time-slicing and MPS) on Kubernetes. The kubelet's
    PodResources API reports each replica allocation with a ``::<n>``
    suffixed device ID; the Agent resolves it to the shared base device
    and publishes:
    ``gpu_sharing_mode`` with the new ``time-slicing``, ``mps`` and
    ``unknown`` values (``unknown`` when the node carries no
    ``nvidia.com/gpu.sharing-strategy`` label, as GPU Feature Discovery
    writes it), ``gpu_sharing_replicas`` with the number of replicas
    registered of the shared GPU, and, on the pods and containers holding
    replicas, ``gpu_sharing_replicas_used`` with the number of replicas
    they hold (a workload can hold several, e.g. requesting two shared
    GPUs that are both replicas of one) and ``gpu_uuid`` with the base GPU
    UUID, so workloads sharing a physical GPU can be grouped together.
  - |
    Device-level GPU metrics on a GPU shared by several workloads
    (time-slicing, MPS, KAI fractions) are now emitted once per workload
    on the device, so each series is attributable to one workload, instead
    of once with all the workloads' tags, which serialized each tag into a
    single comma-joined value no tag filter could match. The value is the
    same on every series: the device is a whole. Aggregations that average
    device metrics per host now weight a shared GPU by its number of
    co-tenants; aggregate per ``gpu_uuid`` for the per-device value.
fixes:
  - |
    GPU metrics are now attributed to pods whose GPU is shared by the
    NVIDIA device plugin (time-slicing, MPS). Previously the replica
    suffix on the allocated device ID (``GPU-<uuid>::<n>``) prevented the
    Agent from matching the allocation to the physical GPU, so device
    metrics lost the workload tags of every pod holding a shared GPU.
    The match now also works when the shared GPU is exposed under a
    renamed resource (``nvidia.com/gpu.shared``), keyed off the device ID
    rather than the resource name.
