# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
enhancements:
  - |
    APM: Add five peer tags for stats aggregation that identify the resource a service calls.
    ``peer.aws.arn`` takes the resource ARN from the request (``aws.sns.topic_arn``, ``aws.topic.arn``,
    ``aws.stream.arn``, ``aws.state_machine.arn``, and the OpenTelemetry attributes ``aws.sns.topic.arn`` and
    ``aws.step_functions.state_machine.arn``). ``peer.aws.sqs.queue.url`` takes the SQS queue URL
    (``aws.queue.url`` and the OpenTelemetry attribute ``aws.sqs.queue.url``). ``peer.aws.region`` takes
    ``aws.region``, ``peer.gcp.project_id`` takes ``gcloud.project_id``, and ``peer.kafka.cluster.id`` takes
    ``messaging.kafka.cluster_id``, ``kafka.cluster_id`` and ``messaging.kafka.cluster.id``. Resource names
    repeat across accounts, regions, projects and clusters, so these tags tell same-named resources apart.
