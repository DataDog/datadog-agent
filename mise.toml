min_version = "2026.9.6"

[settings]
# Keep repository tool manifests ahead of same-named global commands.
activate_aggressive = true
# Only explicit tasks/tools drive mise here; never act on .go-version,
# .bazelversion, etc.
idiomatic_version_file = false

[tools]
# Use mise for DotSlash itself and for tools incompatible with DotSlash and their dependencies.
dotslash = { version = "0.5.9", lazy = true }
node = { version = "24.21.0", lazy = true }
"npm:@sentry/dotagents" = { version = "3.1.0", lazy = true, lazy_bins = ["dotagents"] }

[env]
_.path = ["{{config_root}}/tools/bin"]

[hooks]
# Create shims so child processes can install tools on first use.
enter = "mise reshim"
