[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datadog-gstatus"
version = "1.0.9"
description = "Vendored glustercli + gstatus status collection (no paramiko dependency)"
license = "GPL-3.0-only"
requires-python = ">=3.8"

[tool.hatch.build.targets.wheel]
# glustercli is from gluster/glustercli-python (GPLv2/LGPLv3+).
# glusterlib is from gluster/gstatus (GPLv3).
# gstatus (__main__.py, __init__.py, version.py) is from gluster/gstatus (GPLv3).
packages = ["glustercli", "glusterlib", "gstatus"]
