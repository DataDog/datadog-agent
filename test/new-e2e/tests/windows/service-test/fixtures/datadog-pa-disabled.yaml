log_level: debug

# disable logs agent
logs_enabled: false

# disable process agent
process_config:
  process_collection:
    enabled: false
  container_collection:
    enabled: false
  enabled: "disabled"
  process_discovery:
    enabled: false

# disable the GUI too: with it enabled, process-agent stays up to serve the GUI's peer-identity API, so it must be off for this "process-agent disabled" test to see the service stopped
GUI_port: -1

# enable the datadog-installer, needs an API KEY
remote_updates: true

# trace-agent is running by default
