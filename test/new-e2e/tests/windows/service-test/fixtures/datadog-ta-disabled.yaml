log_level: debug

# enable logs agent
logs_enabled: true

# enable process agent
process_config:
  # live process
  process_collection:
    enabled: true

# trace-agent is off: both IsAPMEnabled keys must be false, because apm_config.enabled
# defaults to true and would reopen the procmgr gate if left unset.
apm_config:
  enabled: false
  error_tracking_standalone:
    enabled: false

# enable the datadog-installer, needs an API KEY
remote_updates: true