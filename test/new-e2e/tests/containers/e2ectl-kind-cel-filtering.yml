# The e2ectl environment for the containers CEL filtering suite. Kept next to
# the test it serves: TestK8SCELFilteringSuiteOnLocalKind
# (local_filtering_test.go) runs the ORIGINAL k8sFilteringSuiteBase against an
# environment created from this file:
#
#   e2ectl start --config e2ectl-kind-cel-filtering.yml --name <name>
#   e2ectl install -env <name>
#   E2ECTL_ENV=<name> E2ECTL_HOME=<home> \
#     dda inv -- new-e2e-tests.run --targets=./tests/containers/ \
#     --run='^TestK8SCELFilteringSuiteOnLocalKind$' --timeout=10m
#
# Same workload topology as e2ectl-kind-legacy-filtering.yml (see its header
# for the K8sAppDefinition mapping); only the exclude mechanism differs —
# the embedded CEL fixture (fixtures/datadog-agent-cel-exclude.yml, verbatim)
# becomes agent.helm.values instead of containerExclude patterns.
schema: 1
environment:
  base: kind
  fakeintake: true
  kind:
    nodes: 0
agent:
  # Unlike the legacy config, this one needs a released version that
  # carries CEL workload filtering: the parsing landed in #41584 (Oct 2025),
  # after 7.69.0 — older images silently ignore DD_CEL_WORKLOAD_EXCLUDE and
  # the filtered-namespace exclusion fails. 7.83.0 is the same released
  # image the local binary installer pins as its runtime.
  version: 7.83.0
  values: |
    datadog:
      # The embedded CEL-exclude fixture, verbatim.
      envDict:
        DD_CEL_WORKLOAD_EXCLUDE: |-
          [
            {
              "products": [
                "global"
              ],
              "rules": {
                "containers": [
                  "container.name == \"redis\"",
                  "container.pod.namespace == \"filtered-ns\""
                ]
              }
            }
          ]
      # Installs the datadog-crds subchart (DatadogMetric CRD) — the
      # catalog nginx manifests declare a DatadogMetric.
      autoscaling:
        workload:
          enabled: true
workloads:
  # The VerticalPodAutoscaler CRD comes first: the catalog nginx manifests
  # declare a VPA.
  - app: vpa-crd
  - app: nginx
  - app: nginx
    namespace: filtered-ns
  - image: ghcr.io/datadog/redis:v0.0.7
    name: redis
    namespace: default
