extensions:
  dogtel:
    enable_tagger_server: true
    tagger_server_port: 15555
    tagger_server_addr: "0.0.0.0"
    enable_metadata_collection: true
  pprof:
  health_check:
  zpages:
    endpoint: "localhost:55679"
  ddflare:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Collects Kubernetes objects (pods) and emits them as logs. Feeds the
  # orchestrator (Kubernetes Resources) path of the datadog exporter.
  k8sobjects:
    objects:
      - name: pods
        mode: pull
        interval: 30s

exporters:
  datadog:
    metrics:
      resource_attributes_as_tags: true
    api:
      key: ${env:DD_API_KEY}
    sending_queue:
      batch:
    # Route k8sobjects logs to the orchestrator intake. Only takes effect in
    # standalone mode (DD_OTEL_STANDALONE=true). The endpoint is injected by the
    # E2E deployment so manifests are captured by fakeintake.
    orchestrator_explorer:
      enabled: true

processors:
  infraattributes:
    cardinality: 2
  # TranslateK8sObjects drops any resource missing k8s.cluster.uid / k8s.cluster.name,
  # and the stock k8sobjects receiver does not emit them, so inject them here.
  resource/k8smeta:
    attributes:
      - key: k8s.cluster.uid
        value: "dogtel-standalone-e2e"
        action: upsert
      - key: k8s.cluster.name
        value: "dogtel-standalone-e2e"
        action: upsert

connectors:
  datadog/connector:
    traces:
      compute_stats_by_span_kind: true
      compute_top_level_by_span_kind: true
      peer_tags_aggregation: true

service:
  extensions: [dogtel, pprof, health_check, zpages, ddflare]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [infraattributes]
      exporters: [datadog/connector]
    traces/send:
      receivers: [otlp]
      processors: [infraattributes]
      exporters: [datadog]
    metrics:
      receivers: [otlp, datadog/connector]
      processors: [infraattributes]
      exporters: [datadog]
    logs:
      receivers: [otlp]
      processors: [infraattributes]
      exporters: [datadog]
    logs/orchestrator:
      receivers: [k8sobjects]
      processors: [resource/k8smeta]
      exporters: [datadog]
