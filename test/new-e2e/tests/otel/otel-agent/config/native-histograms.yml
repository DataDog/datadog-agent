receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # The core Agent's telemetry includes go_gc_duration_seconds, a Prometheus summary.
  prometheus/agent-telemetry:
    config:
      scrape_configs:
        - job_name: agent-telemetry
          scrape_interval: 10s
          metrics_path: /telemetry
          static_configs:
            - targets: ["127.0.0.1:5000"]
exporters:
  datadog:
    metrics:
      resource_attributes_as_tags: true
    hostname: "otelcol-docker"
    api:
      key: ${env:DD_API_KEY}
    sending_queue:
      batch:
processors:
connectors:
  # Use datadog connector to compute stats for pre-sampled traces
  datadog/connector:
    traces:
      compute_stats_by_span_kind: true
      compute_top_level_by_span_kind: true
      peer_tags_aggregation: true
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: []
      exporters: [datadog/connector]
    traces/send:
      receivers: [otlp]
      processors: []
      exporters: [datadog]
    metrics:
      receivers: [otlp, datadog/connector, prometheus/agent-telemetry]
      processors: []
      exporters: [datadog]
    logs:
      receivers: [otlp]
      processors: []
      exporters: [datadog]
