receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
exporters:
  datadog:
    hostname: "otelcol-docker"
    api:
      key: ${env:DD_API_KEY}
    sending_queue:
      batch:
processors:
  infraattributes:
    cardinality: 2
    metrics_attributes_as_tags: true
extensions:
  pprof:
  health_check:
  zpages:
    endpoint: "localhost:55679"
  ddflare:
service:
  extensions:
    [
      pprof,
      zpages,
      health_check,
      ddflare,
    ]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [infraattributes]
      exporters: [datadog]
    # A logs pipeline is required so TestCalendarApp's log-based startup check
    # (which waits for the calendar app's logs to reach the intake) passes;
    # metrics_attributes_as_tags only affects the metrics translator.
    logs:
      receivers: [otlp]
      processors: [infraattributes]
      exporters: [datadog]
