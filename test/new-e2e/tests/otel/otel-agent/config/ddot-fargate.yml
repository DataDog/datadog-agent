extensions:
  health_check:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # No application sends OTLP data in this e2e scenario. hostmetrics keeps
  # metrics continuously flowing through the pipeline so the datadog exporter's
  # source detection (and the otel.ddot_collector.metrics.running.fargate
  # billing metric it drives) has data to classify.
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:

exporters:
  datadog:
    metrics:
      resource_attributes_as_tags: true
    api:
      key: ${env:DD_API_KEY}
    sending_queue:
      batch:

processors:
  # Stamps aws.ecs.launchtype / aws.ecs.task.arn onto the hostmetrics data so
  # the datadog exporter classifies its source as AWS ECS Fargate.
  #
  # timeout/retry are bounded here because the default retry config
  # (retry forever, uncapped) makes the processor's Start() block collector
  # startup indefinitely if the ECS Task Metadata Endpoint is briefly
  # unreachable at cold start; a bounded retry lets the pipeline start (without
  # Fargate tags for that cycle) instead of stalling.
  resourcedetection/ecs:
    detectors: [ecs]
    timeout: 5s
    retry:
      max_elapsed_time: 15s

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [datadog]
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [resourcedetection/ecs]
      exporters: [datadog]
