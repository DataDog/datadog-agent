extensions:
  dogtel:
  health_check:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  datadog:
    metrics:
      resource_attributes_as_tags: true
    api:
      key: ${env:DD_API_KEY}
    sending_queue:
      batch:

service:
  extensions: [dogtel, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [datadog]
    metrics:
      receivers: [otlp]
      exporters: [datadog]
