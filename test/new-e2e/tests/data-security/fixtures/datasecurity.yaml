# Assembled at test load: scan_data is imported from fixtures/scenarios/*.yaml
# (filename order). Each scenario file owns its subtasks and expected SDS results.
init_config:

instances:
  - min_collection_interval: 0
    task_id: e2e-datasec-postgres
    scanning_rules:
      - id: e2e-owner-pattern
        pattern: 'owner_[0-9]+'
    scan_data:
{{.ScanData}}
