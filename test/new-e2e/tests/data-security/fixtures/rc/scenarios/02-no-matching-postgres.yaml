name: no-matching-postgres
# database_host_name matches no postgres integration, so the provider cannot resolve a
# connection and rejects the task.
rc:
  task_id: ${TASK_ID}
  scanning_rules:
    - id: e2e-owner-pattern
      pattern: 'owner_[0-9]+'
  scan_data:
    - sub_task_id: ${SUB_TASK_ID}
      query: "SELECT owner FROM accounts"
      timeout_seconds: 30
      entity:
        platform: postgres
        database_cluster_name: e2e-cluster
        database_instance_name: e2e-instance
        database_host_name: unknown-host
        database: labdb
        schema: public
        table: accounts
apply_state: error
# Regexp matched against the reported apply_error.
apply_error: 'integration with host=.*unknown-host.* not found'
# Never scheduled: no SDS result.
expected: []
