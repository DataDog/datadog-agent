name: happy-path
# DATA_SECURITY_DB_SCAN_TASKS payload pushed through Remote Config. No connection: it is
# resolved from the postgres integration whose host matches database_host_name.
rc:
  task_id: ${TASK_ID}
  scanning_rules:
    - id: e2e-owner-pattern
      pattern: 'owner_[0-9]+'
  scan_data:
    - sub_task_id: ${SUB_TASK_ID}
      query: "SELECT owner FROM accounts"
      timeout_seconds: 30
      entity:
        platform: postgres
        database_cluster_name: e2e-cluster
        database_instance_name: e2e-instance
        database_host_name: localhost
        database: labdb
        schema: public
        table: accounts
# Apply state the agent reports for the config.
apply_state: acknowledged
flare:
  absent:
    - postgres_admin_pw
    - 'owner_[0-9]+'
  present:
    - '=== datasecurity check ==='
    - 'task_id: ${TASK_ID}'
    - 'sub_task_id: ${SUB_TASK_ID}'
    - 'database_instance_name: e2e-instance'
    - 'id: e2e-owner-pattern'
expected:
  - resource:
      type: postgres_table
      name: e2e-instance.labdb.public.accounts
    ruleIds:
      - e2e-owner-pattern
    scanningSource:
      agent: {}
    scanResults:
      - tableMatches:
          - ruleId: e2e-owner-pattern
            columnName: owner
            countMatchedRows: 200
            countMatches: 200
        location:
          postgresTable:
            databaseClusterName: e2e-cluster
            databaseInstanceName: e2e-instance
            databaseHostName: localhost
            databaseName: labdb
            schemaName: public
            tableName: accounts
            scannedRowCount: 200
            scannedColumns:
              - name: owner
                dataType: text
        scanMetadata:
          scanTaskMetadata:
            taskId: ${TASK_ID}
            subTaskId: ${SUB_TASK_ID}
            status: SUCCESS
