name: partial-sub-tasks
# One buildable sub task, two that are not (unknown host, unsupported platform).
rc:
  task_id: ${TASK_ID}
  scanning_rules:
    - id: e2e-owner-pattern
      pattern: 'owner_[0-9]+'
  scan_data:
    - sub_task_id: ${SUB_TASK_ID_OK}
      query: "SELECT owner FROM accounts"
      timeout_seconds: 30
      entity:
        platform: postgres
        database_cluster_name: e2e-cluster
        database_instance_name: e2e-instance
        database_host_name: localhost
        database: labdb
        schema: public
        table: accounts
    - sub_task_id: ${SUB_TASK_ID_UNKNOWN_HOST}
      query: "SELECT owner FROM accounts"
      timeout_seconds: 30
      entity:
        platform: postgres
        database_cluster_name: e2e-cluster
        database_instance_name: e2e-instance
        database_host_name: unknown-host
        database: labdb
        schema: public
        table: accounts
    - sub_task_id: ${SUB_TASK_ID_BAD_PLATFORM}
      query: "SELECT owner FROM accounts"
      timeout_seconds: 30
      entity:
        platform: mysql
        database_cluster_name: e2e-cluster
        database_instance_name: e2e-instance
        database_host_name: localhost
        database: labdb
        schema: public
        table: accounts
# Partially applied: the failed sub tasks are named in the apply error.
apply_state: error
# Quotes are escaped in the RC state dump.
apply_error: 'sub task .{1,4}${SUB_TASK_ID_UNKNOWN_HOST}.{1,4}: postgres integration with host=.*unknown-host.* not found; failed to build sub task .{1,4}${SUB_TASK_ID_BAD_PLATFORM}.{1,4}: unsupported platform .*mysql'
# Only the buildable sub task is scanned.
expected:
  - resource:
      type: postgres_table
      name: e2e-instance.labdb.public.accounts
    ruleIds:
      - e2e-owner-pattern
    scanningSource:
      agent: {}
    scanResults:
      - tableMatches:
          - ruleId: e2e-owner-pattern
            columnName: owner
            countMatchedRows: 200
            countMatches: 200
        location:
          postgresTable:
            databaseClusterName: e2e-cluster
            databaseInstanceName: e2e-instance
            databaseHostName: localhost
            databaseName: labdb
            schemaName: public
            tableName: accounts
            scannedRowCount: 200
            scannedColumns:
              - name: owner
                dataType: text
        scanMetadata:
          scanTaskMetadata:
            taskId: ${TASK_ID}
            subTaskId: ${SUB_TASK_ID_OK}
            status: SUCCESS
