name: scan
scan_data:
  - sub_task_id: e2e-accounts
    connection:
      host: localhost
      port: 5432
      dbname: labdb
      username: postgres
      password: postgres_admin_pw
    entity:
      platform: postgres
      database_cluster_name: e2e-cluster
      database_instance_name: e2e-instance
      database: labdb
      schema: public
      table: accounts
    query: "SELECT owner FROM accounts"
    timeout_seconds: 30
expected:
  - resource:
      type: postgres_table
      name: e2e-instance.labdb.public.accounts
    ruleIds:
      - e2e-owner-pattern
    scanningSource:
      agent: {}
    scanResults:
      - tableMatches:
          - ruleId: e2e-owner-pattern
            columnName: owner
            countMatchedRows: 200
            countMatches: 200
        location:
          postgresTable:
            databaseClusterName: e2e-cluster
            databaseInstanceName: e2e-instance
            databaseHostName: localhost
            databaseName: labdb
            schemaName: public
            tableName: accounts
            scannedRowCount: 200
            scannedColumns:
              - name: owner
                dataType: text
        scanMetadata:
          scanTaskMetadata:
            taskId: e2e-datasec-postgres
            subTaskId: e2e-accounts
            status: SUCCESS
