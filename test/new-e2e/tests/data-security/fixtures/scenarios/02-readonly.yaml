name: readonly
scan_data:
  - sub_task_id: readonly-insert
    connection:
      host: localhost
      port: 5432
      dbname: labdb
      username: postgres
      password: postgres_admin_pw
    entity:
      platform: postgres
      database_cluster_name: e2e-cluster
      database_instance_name: e2e-instance
      database: labdb
      schema: public
      table: accounts
    query: "INSERT INTO accounts (owner, balance) VALUES ('owner_injected', 0)"
    timeout_seconds: 30
  - sub_task_id: readonly-update
    connection:
      host: localhost
      port: 5432
      dbname: labdb
      username: postgres
      password: postgres_admin_pw
    entity:
      platform: postgres
      database_cluster_name: e2e-cluster
      database_instance_name: e2e-instance
      database: labdb
      schema: public
      table: accounts
    query: "UPDATE accounts SET owner = 'pwned'"
    timeout_seconds: 30
