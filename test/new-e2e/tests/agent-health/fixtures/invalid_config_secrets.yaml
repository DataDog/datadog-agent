secret_backend_command: /tmp/bin/secret.py
# canary: proves the startup check ran
agent_ipc:
  port: not-a-number
# settings set from secrets are validated before secrets are resolved: no issue is expected even if the resolved
# values are JSON strings for map settings, an invalid integer or an invalid boolean
kubernetes_pod_labels_as_tags: ENC[pod_labels]
network_path:
  collector:
    source_excludes: ENC[source_excludes]
jmx_thread_pool_size: ENC[pool_size]
inventories_enabled: ENC[inventories_enabled]
kubernetes_node_labels_as_tags:
  zone: ENC[zone_tag]
# a secret inside a list given to a string setting is a type issue: neither the handle nor the value can leak
hostname_file: ["ENC[hostname_file]"]
