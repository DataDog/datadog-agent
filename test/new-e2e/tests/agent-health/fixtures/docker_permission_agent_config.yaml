env: dev
private_action_runner:
  enabled: true
  actions_allowlist:
    - com.datadoghq.remoteaction.rshell.runRemediationCommand
  restricted_shell:
    privileged:
      enabled: true
health_platform:
  enabled: true
  forwarder:
    interval: 5s
logs_enabled: true
logs_config:
  container_collect_all: true
logs:
  - type: docker
    service: docker
    container_all: true
