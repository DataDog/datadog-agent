apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: models.kubeai.org
spec:
  group: kubeai.org
  names:
    kind: Model
    listKind: ModelList
    plural: models
    singular: model
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: kubeai.org/v1
kind: Model
metadata:
  name: kubeai-e2e
  namespace: default
spec:
  engine: VLLM
  env:
    API_KEY: kubeai-e2e-api-key
    HF_TOKEN: kubeai-e2e-hf-token
    MODEL_NAME: kubeai-e2e-model
  features:
    - TextGeneration
  minReplicas: 0
  resourceProfile: cpu:1
  url: hf://Qwen/Qwen2-0.5B-Instruct
