datadog:
  kubelet:
    tlsVerify: false
  orchestratorExplorer:
    customResources:
      - datadoghq.com/v1alpha1/datadogmetrics
      # Grant RBAC without adding KServe to the custom orchestrator config below.
      - serving.kserve.io/v1alpha1/llminferenceservices
agents:
  useHostNetwork: true

clusterAgent:
  enabled: true
  confd:
    orchestrator.yaml: |-
      init_config:
      instances:
        - collectors:
          - pods
          - nodes
          - deployments
          - customresourcedefinitions
          crd_collectors:
          - datadoghq.com/v1alpha1/datadogmetrics
  envDict:
    DD_ORCHESTRATOR_EXPLORER_TERMINATED_RESOURCES_ENABLED: true
    DD_ORCHESTRATOR_EXPLORER_TERMINATED_PODS_ENABLED : true
