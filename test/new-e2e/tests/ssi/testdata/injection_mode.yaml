---
agents:
  enabled: true
clusterAgent:
  admissionController:
    configMode: "hostip"
  env:
    # Disable gradual rollout so the injector resolves deterministically to the
    # plain image tag (NoOpResolver) rather than a digest.
    - name: DD_ADMISSION_CONTROLLER_AUTO_INSTRUMENTATION_GRADUAL_ROLLOUT_ENABLED
      value: "false"

datadog:
  csi:
    enabled: true
  apm:
    instrumentation:
      enabled: true
      injector:
        imageTag: "0.54.0"
      enabledNamespaces: []
      targets:
        - name: "apps"
          namespaceSelector:
            matchNames:
              - "injection-mode"
          ddTraceVersions:
            python: "v3.18.1"
