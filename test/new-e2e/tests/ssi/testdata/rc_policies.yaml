---
agents:
  enabled: false
clusterChecksRunner:
  enabled: false
clusterAgent:
  admissionController:
    configMode: "hostip"
  image:
    pullPolicy: IfNotPresent
  env:
    # Disable gradual rollout so injected images keep their human-readable tag
    # instead of being resolved to a digest.
    - name: DD_ADMISSION_CONTROLLER_AUTO_INSTRUMENTATION_GRADUAL_ROLLOUT_ENABLED
      value: "false"
    - name: DD_APM_INSTRUMENTATION_ON_DEMAND
      value: "true"
datadog:
  kubeStateMetricsCore:
    useClusterCheckRunners: false
  apm:
    instrumentation:
      enabled: true
      injector:
        imageTag: "0.52.0"
      enabledNamespaces: []
      targets:
        - name: "python-apps"
          podSelector:
            matchLabels:
              language: "python"
          namespaceSelector:
            matchLabels:
              injection: "yes"
          ddTraceVersions:
            python: "v3.18.1"
