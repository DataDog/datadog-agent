services:
  tcp-congestion-server:
    image: ghcr.io/datadog/apps-npm-tools:{APPS_VERSION}
    container_name: tcp-congestion-server
    hostname: tcp-congestion-server
    cap_add: [NET_ADMIN, SYS_ADMIN]
    sysctls:
      - net.ipv4.tcp_ecn=1
    networks:
      tcp-congestion-net:
        ipv4_address: 192.168.48.10
    command: >
      bash -c "iperf3 -s -p 5201 -D && sleep infinity"
  tcp-congestion-client:
    image: ghcr.io/datadog/apps-npm-tools:{APPS_VERSION}
    container_name: tcp-congestion-client
    hostname: tcp-congestion-client
    cap_add: [NET_ADMIN, SYS_ADMIN]
    sysctls:
      - net.ipv4.tcp_ecn=1
    networks:
      tcp-congestion-net:
        ipv4_address: 192.168.48.20
    depends_on: [tcp-congestion-server]
    command: >
      bash -c "sleep infinity"
networks:
  tcp-congestion-net:
    driver: bridge
    # Keep this subnet out of 172.16.0.0/12. The GitLab runner pods that SSH
    # into this host have VPC IPs there (172.18/172.19/172.27/172.28.x.x), and
    # a bridge whose subnet contains the runner's IP makes the host route its
    # SSH replies into the bridge, cutting the test off from the host. It must
    # also avoid the docker daemon's bip (192.168.16.0/24) and default address
    # pool (192.168.32.0/24), set in test/e2e-framework/components/docker.
    ipam:
      config:
        - subnet: 192.168.48.0/24
