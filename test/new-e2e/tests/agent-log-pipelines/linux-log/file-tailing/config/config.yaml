logs:
  - type: file
    path: '/var/log/e2e_test_logs/hello-world.log'
    service: hello
    source: custom_log
  - type: file
    path: '/var/log/e2e_test_logs/tag-filter.log'
    service: tag-filter
    source: custom_log
    tags:
      - e2e_global_drop:yes
      - e2e_source_drop:yes
      - e2e_rescued:yes
      - e2e_keep:yes
    tag_filters:
      include:
        - e2e_rescued:yes
      exclude:
        - e2e_source_drop:*
  - type: file
    path: '/var/log/e2e_test_logs/iis-w3c.log'
    service: iis-w3c
    source: iis
    auto_multi_line_detection: true
  - type: file
    path: '/var/log/e2e_test_logs/ottl.json'
    service: ottl-filtering
    source: custom_log
    log_processing_rules:
      - type: include_at_match_ottl
        name: keep_production
        pattern: 'attributes["env"] == "prod"'
      - type: exclude_at_match_ottl
        name: drop_health_checks
        pattern: 'attributes["http"]["path"] == "/health" and attributes["http"]["status"] < 400'
      - type: mask_ottl
        name: redact_password
        pattern: 'set(attributes["credentials"]["password"], "***") where HasPrefix(body, "{") and attributes["credentials"] != nil'
      - type: mask_ottl
        name: redact_raw_body
        pattern: 'replace_pattern(body, "raw-secret", "***") where HasPrefix(body, "ottl-raw-")'
