logs:
  - type: file
    path: '/var/log/e2e_test_logs/hello-world.log'
    service: hello
    source: custom_log
  - type: file
    path: '/var/log/e2e_test_logs/iis-w3c.log'
    service: iis-w3c
    source: iis
    auto_multi_line_detection: true
  - type: file
    path: '/var/log/e2e_test_logs/tag-parity.log'
    service: tag-parity
    source: nginx
    sourcecategory: web
    tags:
      - env:e2e
      - team:logs
