spring.application.name=azure-files-log-writer
logging.config=classpath:log4j2.xml

logwriter.interval-ms=${LOGWRITER_INTERVAL_MS:250}
logwriter.initial-delay-ms=${LOGWRITER_INITIAL_DELAY_MS:1000}
logwriter.target-bytes=${LOGWRITER_TARGET_BYTES:83000}
logwriter.target-bytes-sequence=${LOGWRITER_TARGET_BYTES_SEQUENCE:}
logwriter.head-pause-ms=${LOGWRITER_HEAD_PAUSE_MS:5000}
logwriter.initial-fill-runway-ms=${LOGWRITER_INITIAL_FILL_RUNWAY_MS:10000}
logwriter.max-records-per-period=${LOGWRITER_MAX_RECORDS_PER_PERIOD:2000}
