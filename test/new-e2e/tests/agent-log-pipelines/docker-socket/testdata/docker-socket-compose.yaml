---
services:

  tag-parity-docker:
    image: public.ecr.aws/docker/library/busybox:1.37.0
    container_name: tag-parity-docker
    command: ["sh", "-c", "while true; do echo tag-parity-docker; sleep 1; done"]
    depends_on:
      - agent
    labels:
      com.datadoghq.ad.logs: |
        [
          {
            "source": "nginx",
            "service": "tag-parity-docker",
            "sourcecategory": "web",
            "tags": ["env:e2e", "team:logs"]
          }
        ]

  agent:
    environment:
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: false
      # Tail through the Docker socket (container tailer). The default reads
      # the container's log file, which would exercise the file tailer.
      DD_LOGS_CONFIG_DOCKER_CONTAINER_USE_FILE: false
      DD_LOGS_CONFIG_BATCH_WAIT: 1
      DD_LOG_LEVEL: info
