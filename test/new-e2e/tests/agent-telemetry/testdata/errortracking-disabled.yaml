agent_telemetry:
  # enabled defaults to true.
  errortracking:
    # enabled is intentionally omitted (defaults to false); the short flush
    # interval makes the negative assertion meaningful if a regression
    # ever flips that default to true.
    flush_interval_seconds: 1
    bouncer_window_seconds: 0
    startup_jitter_seconds: 0
process_config:
  additional_endpoints:
    "https://127.0.0.1:1":
      - "00000000000000000000000000000000"
  process_discovery:
    enabled: false
# system-probe trigger; must live here, not in system-probe.yaml — see
# errortracking-enabled.yaml for why.
network_path:
  collector:
    filters: "not-a-valid-filter"
