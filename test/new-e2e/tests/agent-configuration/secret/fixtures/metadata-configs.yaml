datadog.yaml: |
  api_key: ENC[metadata_core]
  secret_backend_command: /tmp/fa-metadata-secrets.py
  enable_metadata_collection: true
  inventories_enabled: true
  inventories_configuration_enabled: true
  inventories_checks_configuration_enabled: true
  inventories_first_run_delay: 5
  inventories_min_interval: 10
  inventories_max_interval: 20
  remote_configuration: {enabled: false}
  logs_enabled: false
  apm_config: {enabled: false, debugger_api_key: fixture-raw-secret-value}
  process_config: {process_collection: {enabled: false}}
system-probe.yaml: |
  system_probe_config:
    enabled: true
    internal_profiling: {enabled: false, api_key: fixture-raw-secret-value}
  network_config: {enabled: true}
security-agent.yaml: |
  security_agent:
    internal_profiling: {enabled: false, api_key: 'ENC[metadata_security]'}
  compliance_config: {enabled: true, run_in_system_probe: false}
  runtime_security_config: {enabled: false}
application_monitoring.yaml: |
  api_key: fixture-raw-secret-value
conf.d/http_check.d/fa-secrets.yaml: |
  instances:
    - name: fa-secret-http
      url: http://127.0.0.1:9
      username: fixture
      password: ENC[metadata_http_shared]
      headers: {Authorization: fixture-raw-secret-value}
      timeout: 2
      min_collection_interval: 30
conf.d/http_check.d/fa-secrets-second.yaml: |
  instances:
    - name: fa-secret-http-second-file
      url: http://127.0.0.1:9
      username: fixture
      password: ENC[metadata_http_shared]
      timeout: 2
      min_collection_interval: 30
