# SMP regression experiment selection policy.
#
# Trigger buckets -> experiments, UNIONED: an experiment runs if it matches `always`, OR it is under a
# `codeowners` team that is involved in the PR, OR any applied label lists it.
#
# Entries are standard globs (`*` = one path segment, `**` = any depth) matched against experiment
# paths relative to test/regression, or an exact path, or a bare (globally-unique) experiment name.
# `codeowners` maps a team slug to the experiments that run when that team is involved; `labels` maps
# `smp/<label>` to the experiments that run when the label is applied. Every experiment must be in some
# bucket (`smp experiments resolve` fails otherwise). ebpf is excluded from this flow for now.

always:
  - quality_gates/**

codeowners:
  agent-log-pipelines:
    - logs/general/**
