# 1,000 simulated Pods on the KWOK fake Node. The spec is the same as in the SMP operator-workloadmeta fixture.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workloadmeta-scale
spec:
  replicas: 1000
  selector:
    matchLabels:
      app: workloadmeta-scale
  template:
    metadata:
      labels:
        app: workloadmeta-scale
        team: single-machine-performance
        cardinality: high
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10.1
          resources:
            requests:
              cpu: 1m
              memory: 1Mi
