apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
spec:
  global:
    credentials:
      apiKey: "00000000000000000000000000000000"
    endpoint:
      url: "{{blackhole.intake}}"
    # Send each product to a blackhole, or turn off its calls to Datadog.
    env:
      - name: DD_AGENT_TELEMETRY_ENABLED
        value: "false"
      - name: DD_PROCESS_CONFIG_PROCESS_DD_URL
        value: "{{blackhole.process}}"
      - name: DD_CONTAINER_IMAGE_LOGS_DD_URL
        value: "{{blackhole.intake}}"
      - name: DD_CONTAINER_LIFECYCLE_LOGS_DD_URL
        value: "{{blackhole.intake}}"
  features:
    remoteConfiguration:
      enabled: false
  override:
    clusterAgent:
      image:
        name: "{{overrides.cluster_agent_image}}"
      env:
        # The Cluster Agent collects Kubernetes tags for all Pods, which adds load from the activity Pods.
        - name: DD_CLUSTER_AGENT_COLLECT_KUBERNETES_TAGS
          value: "true"
    nodeAgent:
      image:
        name: "{{overrides.node_agent_image}}"
      containers:
        agent:
          env:
            # The NTP check queries public NTP servers.
            - name: DD_INTEGRATION_EXCLUDED
              value: "ntp"
