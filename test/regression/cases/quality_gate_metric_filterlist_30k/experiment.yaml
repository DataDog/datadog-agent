# Metric filterlist scaling experiment -- tier: 30k entries
# (every entry name is exactly 88 characters)
#
# Generated by generate_filterlist_cases.py. Do not hand-edit; edit the
# template + generator instead and regenerate.
#
# Purpose: hold the traffic mix and target resources IDENTICAL to every
# other tier in this scaling sweep, varying only metric_filterlist size
# (see datadog-agent/datadog.yaml). See ../../README.md for the full
# benchmark write-up.
#
# Names are padded after the index characters, so entries diverge early and the
# matcher's string comparisons terminate after a byte or two. This tier
# therefore reflects the cost of LONG NAMES (YAML parse, config RSS, interning,
# copying), not of deep string comparisons -- the padding-first arrangement was
# measured separately and made no difference.

optimization_goal: memory
erratic: false

target:
  name: datadog-agent
  # Sized for the 200 MiB/s workload in lading/lading.yaml, IDENTICAL across
  # every tier.
  #
  # Raised twice in response to crashes in real SMP runs: 1024 -> 2048 -> 4096
  # -> 8192 MiB. This is NOT a measured bound and is very likely papering over
  # the real cause:
  #
  #   * Local measurement of these exact case files peaks at ~1.0-1.2 GB, so the
  #     real target needs >6x what the harness observes. That gap is unexplained;
  #     `total_pss_bytes` covers every process in the target (core + process +
  #     trace agent, ddprof replicas), not the single PID the harness samples.
  #   * ALL tiers crash equally, including 10k. A filterlist-size-driven problem
  #     would hit 100k first. Equal failure across tiers points at the 200 MiB/s
  #     traffic (10x the original 20 MiB/s), not at metric_filterlist.
  #   * 8192 MiB is ~12x the largest allotment anywhere else in this repo
  #     (666 MiB) and may exceed what the SMP rig will schedule.
  #
  # Before raising this again: capture peak `total_pss_bytes` from a failed job,
  # and try reverting lading `bytes_per_second` to 18/1/1 (20 MiB/s). At
  # 200 MiB/s the per-tier memory signal is buried anyway (see WARNING below),
  # so the traffic increase is costing budget without buying measurement.
  #
  # CPU is unchanged: ~2,000 millicores measured, ~34% of the 6-CPU allotment.
  #
  # WARNING: at 200 MiB/s the per-tier MEMORY signal is buried -- repeat runs of
  # one tier vary ~200 MB against a ~29 MB filterlist effect. This rate is for
  # filtering-path/throughput questions; use 20 MiB/s (18/1/1) for memory. See
  # ../../README.md "At this rate the memory signal is no longer measurable".
  cpu_allotment: 6
  memory_allotment: 8192 MiB

  environment:
    DD_API_KEY: a0000001
    DD_HOSTNAME: smp-regression

  profiling_environment:
    DD_INTERNAL_PROFILING_BLOCK_PROFILE_RATE: 10000
    DD_INTERNAL_PROFILING_CPU_DURATION: 1m
    DD_INTERNAL_PROFILING_DELTA_PROFILES: true
    DD_INTERNAL_PROFILING_ENABLED: true
    DD_INTERNAL_PROFILING_ENABLE_GOROUTINE_STACKTRACES: true
    DD_INTERNAL_PROFILING_MUTEX_PROFILE_FRACTION: 10
    DD_INTERNAL_PROFILING_PERIOD: 1m
    DD_INTERNAL_PROFILING_UNIX_SOCKET: /smp-host/apm.socket
    DD_PROFILING_EXECUTION_TRACE_ENABLED: true
    DD_PROFILING_EXECUTION_TRACE_PERIOD: 1m
    DD_PROFILING_WAIT_PROFILE: true
    DD_APM_INTERNAL_PROFILING_ENABLED: true
    DD_INTERNAL_PROFILING_EXTRA_TAGS: experiment:quality_gate_metric_filterlist_30k

checks:
  - name: memory_usage
    description: "Memory usage quality gate (informational while establishing the filterlist-size baseline)."
    bounds:
      series: total_pss_bytes
      upper_bound: 8192 MiB

  - name: cpu_usage
    description: "CPU usage quality gate (informational while establishing the filterlist-size baseline)."
    bounds:
      series: avg(total_cpu_usage_millicores)
      upper_bound: 6000

report_links:
  - text: "bounds checks dashboard"
    link: "https://app.datadoghq.com/dashboard/vz3-jd5-bdi?fromUser=true&refresh_mode=paused&tpl_var_experiment%5B0%5D={{ experiment }}&tpl_var_job_id%5B0%5D={{ job_id }}&view=spans&from_ts={{ start_time_ms }}&to_ts={{ end_time_ms }}&live=false"
