# Mixed metric_filterlist scaling experiment -- tier: 10k entries
# (5,000 prefix `<name>*` entries, each with 8 exceptions, + 5,000
# exact entries).
#
# GENERATED, then copied. Source of truth is the smp-playground harness at
# experiments/regression/agent/metric_filterlist_scaling, via
# `python3 scripts/generate_filterlist_cases.py --mixed`; the case was copied
# here and renamed. Edit the harness templates and re-copy rather than
# hand-editing these files -- the generator is what enforces the properties
# this experiment depends on (see "Three properties" in its README).
#
# NOT a `quality_gate_` case. Those are the strongest performance claims made
# about the Agent (see test/regression/README.md) and are additionally synced
# into smp-playground every week. These three cases are a measurement sweep
# whose bounds have not been established, so they deliberately carry no
# `checks:` block.
#
# WHAT IT MEASURES: the cost of a metric_filterlist that is HALF PREFIX RULES,
# every one of them carrying EXCEPTIONS. This branch gave
# `pkg/util/strings.Matcher` two arms beyond the sorted `exact` one:
# `prefixes` (unconditional, testPrefixes + strings.HasPrefix) and `guarded`
# (prefixes with exceptions, searched the same way then checked against that
# entry's own exception matcher). Since every prefix entry here has exceptions,
# `prefixes` is empty and the prefix half is entirely `guarded` -- the worst
# layout for the feature. Read the three tiers against EACH OTHER: 10k vs 50k
# vs 100k differ only in rule count, because lading/lading.yaml is
# byte-identical across them.
#
# NOTE ON THE BASELINE SIDE: the Regression Detector compares this commit's
# image against the merge base of the base branch, which has neither prefix nor
# exception support and cannot even parse the object form of an entry. The
# baseline therefore filters only the exact half and does strictly less work,
# so a comparison-vs-baseline delta on these cases is "feature off vs on"
# rather than a like-for-like regression.
#
# lading drives the two arms separately, 60 MiB/s total:
#
#   background  48 MiB/s  random names, evaluated then forwarded
#   prefix_hit   4 MiB/s  ...bench.prefix.<idx><pad>.hit -> guarded arm, dropped
#                          (pays a full exception-matcher miss on every hit)
#   exact_hit    4 MiB/s  ...bench.exact.<idx><pad>      -> exact arm, dropped
#   miss         4 MiB/s  ...bench.nomatch.<idx><pad>    -> both arms, forwarded
#
# Every name ON THE WIRE is exactly 88 characters in all four namespaces, so
# hit-vs-miss differences cannot be an artefact of name length. Prefix ENTRIES
# are 84 characters for exactly that reason: prefix_hit traffic appends `.hit`,
# so a prefix-hit name is equal to no entry at all and its drop can only have
# come from the prefix arm.

optimization_goal: memory
erratic: false

target:
  name: datadog-agent
  # NOTE: exceptions add ~2 MiB (10k) to ~21 MiB (100k) of config file that the
  # Agent parses at startup and holds in the config layer, on top of the
  # per-entry exception matchers. With optimization_goal: memory that lands in
  # the signal, so a tier-over-tier memory delta is matcher cost AND config
  # cost, not matcher cost alone.
  #
  # Inherited from the smp-playground sweep, where 8192 MiB was reached by
  # three successive increases after replicates crashed at 200 MiB/s of
  # DogStatsD traffic. This sweep offers 60 MiB/s, where local measurement of
  # these same case files peaked at ~1.0-1.2 GB, so this is generous rather
  # than measured -- 2-4 GiB is very likely enough. Trim it (and cpu_allotment)
  # once the first runs report actual `total_pss_bytes`; note that every
  # enabled case in this directory currently sits at cpu 4 / <= 700 MiB.
  cpu_allotment: 6
  memory_allotment: 8192 MiB

  environment:
    DD_API_KEY: a0000001
    DD_HOSTNAME: smp-regression

  profiling_environment:
    DD_INTERNAL_PROFILING_BLOCK_PROFILE_RATE: 10000
    DD_INTERNAL_PROFILING_CPU_DURATION: 1m
    DD_INTERNAL_PROFILING_DELTA_PROFILES: true
    DD_INTERNAL_PROFILING_ENABLED: true
    DD_INTERNAL_PROFILING_ENABLE_GOROUTINE_STACKTRACES: true
    DD_INTERNAL_PROFILING_MUTEX_PROFILE_FRACTION: 10
    DD_INTERNAL_PROFILING_PERIOD: 1m
    DD_INTERNAL_PROFILING_UNIX_SOCKET: /smp-host/apm.socket
    DD_PROFILING_EXECUTION_TRACE_ENABLED: true
    DD_PROFILING_EXECUTION_TRACE_PERIOD: 1m
    DD_PROFILING_WAIT_PROFILE: true
    DD_APM_INTERNAL_PROFILING_ENABLED: true
    DD_INTERNAL_PROFILING_EXTRA_TAGS: experiment:metric_filterlist_mixed_10k
