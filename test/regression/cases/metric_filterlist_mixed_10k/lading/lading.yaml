          # Disjoint from every filterlist entry; full miss path.
          metric_names:
            - "smp.filterlist.bench.nomatch.aaaa{{a-z}}{{a-z}}xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      bytes_per_second: "1 MiB"
      maximum_prebuild_cache_size_bytes: "50 MiB"

blackhole:
  - http:
      binding_addr: "127.0.0.1:9091"
  - http:
      binding_addr: "127.0.0.1:9092"
      response_delay_millis: 75
  - http:
      binding_addr: "127.0.0.1:9093"

target_metrics:
  - prometheus: # core agent telemetry
      uri: "http://127.0.0.1:5000/telemetry"
      tags:
        sub_agent: "core"
