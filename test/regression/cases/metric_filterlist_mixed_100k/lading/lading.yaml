# match/miss differences cannot be an artefact of name length. Note that the
# hit/miss generators send far smaller messages than `background`, so their 20%
# of the byte budget is a considerably larger share of MESSAGES.
#
# Each generator carries an `id`, so `bytes_written`/`packets_sent` are
# separable per class in the capture.

