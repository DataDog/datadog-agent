# `{{a-z}}` string is sent verbatim, braces included, as a single metric name,
# and nothing is ever filtered.
#
# Use CHARACTER ranges only, never numeric ones. lading re-derives numeric
# padding from the parsed integers (`numdigits = max(len(str(start)),
# len(str(end)))` in lading_payload/src/common/strings/string_list_pool.rs),
# so `{{000000-000499}}` expands to 3-digit ".000".."{.499}" and matches nothing.
# Character ranges are fixed-width by construction.
#
# The rendered file is IDENTICAL across all three mixed tiers -- only each
# case's datadog.yaml (metric_filterlist size) differs. That is what makes the
# tiers comparable.
#
# Total offered load is 60 MiB/s (48 + 4 + 4 + 4). 200 MiB/s was tried for the
# exact-only sweep and crashed every tier through three memory_allotment
# increases, so this sweep starts where that one ended up. Measured cost of the
# older 3-generator mix was ~10.5 CPU millicores per MiB/s, so 60 MiB/s is
# ~630 mc, ~11% of the 6-CPU allotment.
#
# WARNING: at this rate the per-tier MEMORY signal is small relative to
# run-to-run variance (~200 MB observed vs a ~29 MB filterlist effect in the
# exact-only sweep). These cases are for the FILTERING PATH: throughput, CPU,
# and the filtered/forwarded split. For a memory answer, drop the generators to
# 16/1.5/1.5/1 (20 MiB/s) and re-run.
#
# Traffic mix -- four generators, so each arm of the matcher is measured
# separately instead of being averaged into one "match" number:
#
#   background (48 MiB/s, ~80% of budget): representative random DogStatsD
#     traffic, the same distribution as cases/quality_gate_metrics_logs. Names
#     are pseudo-random and do not collide with the filterlist, so this is the
#     bulk "evaluate and forward" load.
#
#   prefix_hit (4 MiB/s): names that EXTEND a `<name>*` entry
#     (`...prefix.aaaaXY<pad>.hit`) and are therefore equal to no entry at all.
#     A drop here can only have come from the prefix arm of the matcher
#     (`testPrefixes` -> `strings.HasPrefix`), which is what this sweep exists
#     to measure.
#
#   exact_hit (4 MiB/s): names equal to an exact entry, hitting the sorted
#     binary-search arm. Same rate and same shape as prefix_hit, so the two
#     paths can be compared directly.
#
#   miss (4 MiB/s): names from the disjoint smp.filterlist.bench.nomatch.*
#     namespace, never present in any filterlist and never covered by any
#     prefix entry. This is the worst case for a forwarded metric: it pays for
#     a full prefix scan AND a full exact scan before being kept.
