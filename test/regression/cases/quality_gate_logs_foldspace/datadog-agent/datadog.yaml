auth_token_file_path: /tmp/agent-auth-token

# Disable cloud detection. This stops the Agent from poking around the
# execution environment & network. This is particularly important if the target
# has network access.
cloud_provider_metadata: []

dd_url: http://127.0.0.1:9091

logs_enabled: true
logs_config:
  logs_dd_url: 127.0.0.1:9092
  logs_no_ssl: true
  force_use_http: true
  # The stateful blackhole decodes at most 4 MiB per message, below the 5 MB default.
  batch_max_content_size: 1000000
  foldspace:
    enabled: true
    # lading's datadog_stateful_logs blackhole, which serves the stream under its own method name.
    dd_url: 127.0.0.1:9094
    grpc_method: /datadog.intake.stateful.StatefulLogsService/LogsStream

process_config.process_dd_url: http://localhost:9093

telemetry.enabled: true
telemetry.checks: '*'

# Hold the Agent Data Plane pre-flight open for the whole run.
#
# The pre-flight starts ADP as a child of the Agent and stops it again after 90s. That step down
# in total RSS lands in the middle of a replicate here, so the gate ends up measuring when the
# timer fired as much as what the Agent costs. 30m is well past the ~10 minute experiment, so ADP
# is resident for every sample instead.
data_plane.preflight_mode_duration: 30m
