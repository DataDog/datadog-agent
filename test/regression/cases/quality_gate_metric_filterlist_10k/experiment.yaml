# Metric filterlist experiment -- 10,000 entries, each name exactly 88 characters
# (see datadog-agent/datadog.yaml, generated by the metric_filterlist_scaling
# harness in smp-playground).
#
# Purpose: measure what a non-trivial `metric_filterlist` costs the Agent, with
# traffic that is guaranteed to exercise both the "metric IS in the filterlist ->
# dropped" and "metric is NOT in the filterlist -> forwarded" paths on every run.
#
# Target resources and offered load are deliberately kept in line with
# cases/quality_gate_metrics_logs, which is the closest working case (same
# DogStatsD-over-UDS shape) and passes 10/10 replicates. An earlier revision of
# this case ran at 6 CPU / 8192 MiB with 60 MiB/s of traffic and crashed every
# replicate, at every filterlist size from 10k to 100k, while every other case in
# this directory passed in the same job. Those settings were never measured --
# the allotment had been raised 1024 -> 2048 -> 4096 -> 8192 MiB reactively in
# response to those crashes -- so this case now starts from the known-good
# configuration instead.
#
# The bounds below are therefore CEILINGS chosen to catch a runaway, not measured
# gates. Once a run produces numbers, tighten `memory_usage` to ~30% below the
# observed peak and reset `memory_allotment` to ~30% above that bound, matching
# the convention used by the other quality_gate cases.
optimization_goal: memory
erratic: false

target:
  name: datadog-agent
  # Same as every other active case in this directory. quality_gate_metrics_logs
  # measures 368 millicores at 20 MiB/s, so 4 CPUs is ample headroom.
  cpu_allotment: 4
  # quality_gate_metrics_logs uses 592 MiB for a measured 455 MiB at the same
  # offered load. This case adds a 940 KB config and 10k filterlist entries
  # (~16 B/entry compiled, a few MB across the config layers), so it should land
  # in the same range. 2 GiB leaves room for the load-time transient that parsing
  # a large YAML config produces, and matches the dsd_uds_* cases.
  memory_allotment: 2GiB

  environment:
    DD_API_KEY: a0000001
    DD_HOSTNAME: smp-regression

  profiling_environment:
    DD_INTERNAL_PROFILING_BLOCK_PROFILE_RATE: 10000
    DD_INTERNAL_PROFILING_CPU_DURATION: 1m
    DD_INTERNAL_PROFILING_DELTA_PROFILES: true
    DD_INTERNAL_PROFILING_ENABLED: true
    DD_INTERNAL_PROFILING_ENABLE_GOROUTINE_STACKTRACES: true
    DD_INTERNAL_PROFILING_MUTEX_PROFILE_FRACTION: 10
    DD_INTERNAL_PROFILING_PERIOD: 1m
    DD_INTERNAL_PROFILING_UNIX_SOCKET: /smp-host/apm.socket
    DD_PROFILING_EXECUTION_TRACE_ENABLED: true
    DD_PROFILING_EXECUTION_TRACE_PERIOD: 1m
    DD_PROFILING_WAIT_PROFILE: true
    DD_APM_INTERNAL_PROFILING_ENABLED: true
    DD_INTERNAL_PROFILING_EXTRA_TAGS: experiment:quality_gate_metric_filterlist_10k

checks:
  - name: memory_usage
    description: "Memory usage ceiling. Provisional: not yet measured for this case, sized ~30% below memory_allotment. Tighten once a run reports a peak."
    bounds:
      series: total_pss_bytes
      upper_bound: 1536 MiB

  - name: cpu_usage
    description: "CPU usage ceiling. Same bound as quality_gate_metrics_logs, which measures 368 millicores at this offered load."
    bounds:
      series: avg(total_cpu_usage_millicores)
      upper_bound: 2000

report_links:
  - text: "bounds checks dashboard"
    link: "https://app.datadoghq.com/dashboard/vz3-jd5-bdi?fromUser=true&refresh_mode=paused&tpl_var_experiment%5B0%5D={{ experiment }}&tpl_var_job_id%5B0%5D={{ job_id }}&view=spans&from_ts={{ start_time_ms }}&to_ts={{ end_time_ms }}&live=false"
