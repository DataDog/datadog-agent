#
#     cd experiments/regression/agent/metric_filterlist_scaling
#     python3 scripts/generate_filterlist_cases.py
#
# Shared lading workload for every metric_filterlist tier (10k..60k).
#
# REQUIRES lading >= 0.32.0 (pinned in experiments/regression/agent/
# config.yaml). Pattern expansion did not exist before 0.32.0: on 0.31.x the
# `{{a-z}}` string is sent verbatim, braces included, as a single metric name,
# and nothing is ever filtered.
#
# Use CHARACTER ranges only, never numeric ones. lading re-derives numeric
# padding from the parsed integers (`numdigits = max(len(str(start)),
# len(str(end)))` in lading_payload/src/common/strings/string_list_pool.rs),
# so `{{000000-000499}}` expands to 3-digit ".000"..".499" and matches nothing.
# Character ranges are fixed-width by construction.
#
# Total offered load is 20 MiB/s (18 + 1 + 1), matching
# cases/quality_gate_metrics_logs so this case is comparable against the
# existing metrics quality gate and runs within the same target resources.
#
# History: this was 200 MiB/s (180/10/10), then 60 MiB/s (54/3/3). Every
# replicate crashed at 60 MiB/s on a 6-CPU / 8192 MiB target, at every
# filterlist size from 10k to 100k, while every other case in this directory
# passed in the same job -- so the rate was not the only problem and the
# oversized allotment has been brought back in line too (see experiment.yaml).
# 20 MiB/s is the rate the comparable working case uses.
#
# The 90/5/5 byte split is preserved exactly, which keeps the filtered share
# intact: generator B's messages are much smaller than generator A's, so 5% of
# the byte budget is a substantially larger share of MESSAGES.
#
# Measured cost is ~10.5 CPU millicores per MiB/s, so 20 MiB/s is ~210 mc, ~5%
# of the 4-CPU allotment. Past ~370 MiB/s the agent cannot keep up at all
# (delivery falls from 95% to 69%) and the offered load stops being the number
# written here.
#
# At 20 MiB/s the 500 MiB prebuild cache for generator A is ~25 s of unique
# blocks, so traffic stays varied without raising lading-container memory.
#
# Traffic mix (kept deliberately similar to
# cases/quality_gate_metrics_logs/lading/lading.yaml so results are
# comparable against the existing metrics quality gate):
#
#   generator A (~90% of budget): representative random DogStatsD traffic,
#     same distribution as the metrics_logs quality gate. Metric names are
#     pseudo-random and, at the sizes used here, do not collide with the
#     filterlist -- this models the "background" traffic that must be
#     evaluated against the filterlist and NOT match.
#
#   generator B (~5% of the byte budget, but ~17% of MESSAGES -- match messages
#     are far smaller than generator A's, so do not read "10 of 200 MiB" as
#     "5% of samples"): guaranteed MATCH traffic. Metric names are drawn only
#     from the fixed 676-entry corpus at the head of every generated filterlist
#     tier (see scripts/gen_filterlist.py). Every name is exactly 88 characters,
#     in both namespaces. This exercises the "metric IS in metric_filterlist ->
#     dropped" path on every run.
#
#   generator C (~5% of budget): guaranteed NON-MATCH traffic from a
#     disjoint smp.filterlist.bench.nomatch.* namespace that is never present in
#     any generated filterlist. Exercises the "metric is NOT in
#     metric_filterlist -> forwarded" path with a name of *exactly* the same
#     88-character length as the match traffic (controls for the possibility
#     that match vs. non-match latency differs only because of name length; the
#     two namespace prefixes differ in length by one character, so
#     gen_filterlist.py compensates in the padding rather than leaving the
#     34-vs-35 mismatch it once had).

