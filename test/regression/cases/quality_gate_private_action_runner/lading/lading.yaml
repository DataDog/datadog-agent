generator: []

blackhole:
  # Absorb OPMS polling against the configured dd_url (see ../datadog-agent/datadog.yaml),
  # which PAR's OPMS client uses directly since it's an explicit http:// address.
  - http:
      binding_addr: "127.0.0.1:9091"

target_metrics:
  - prometheus: # private action runner telemetry
      uri: "http://127.0.0.1:5000/telemetry"
      tags:
        sub_agent: "private-action-runner"
