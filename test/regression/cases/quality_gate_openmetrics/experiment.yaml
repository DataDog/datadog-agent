# OpenMetrics scraping quality gate. Measures Agent CPU and memory overhead
# while scraping a high-volume OpenMetrics endpoint served by lading.
#
# Workload: lading serves ~8100 samples per scrape on port 9100 (4000 counters,
# 4000 gauges, 50 histograms, 50 summaries) scraped by 100 check instances
# every 15 seconds.
#
# Further documentation:
# https://datadoghq.atlassian.net/wiki/spaces/agent/pages/4294836779/Performance+Quality+Gates

optimization_goal: cpu
erratic: false

target:
  name: datadog-agent
  cpu_allotment: 4
  # Set to 30% higher than the memory_usage check upper_bound below.
  # Update both together when recalibrating.
  memory_allotment: 10GiB

  environment:
    DD_API_KEY: a0000001
    DD_HOSTNAME: smp-regression
    DD_CHECK_RUNNERS: "4"

  profiling_environment:
    DD_INTERNAL_PROFILING_BLOCK_PROFILE_RATE: 10000
    DD_INTERNAL_PROFILING_CPU_DURATION: 1m
    DD_INTERNAL_PROFILING_DELTA_PROFILES: true
    DD_INTERNAL_PROFILING_ENABLED: true
    DD_INTERNAL_PROFILING_ENABLE_GOROUTINE_STACKTRACES: true
    DD_INTERNAL_PROFILING_MUTEX_PROFILE_FRACTION: 10
    DD_INTERNAL_PROFILING_PERIOD: 1m
    DD_INTERNAL_PROFILING_UNIX_SOCKET: /smp-host/apm.socket
    DD_PROFILING_EXECUTION_TRACE_ENABLED: true
    DD_PROFILING_EXECUTION_TRACE_PERIOD: 1m
    DD_PROFILING_WAIT_PROFILE: true
    DD_APM_INTERNAL_PROFILING_ENABLED: true

    DD_INTERNAL_PROFILING_EXTRA_TAGS: experiment:quality_gate_openmetrics

checks:
  - name: cpu_usage
    description: "CPU usage quality gate. This puts a bound on the total average collector millicore usage."
    bounds:
      series: avg(total_cpu_usage_millicores)
      # TODO: calibrate from a baseline run before enforcing.
      upper_bound: 2000

  - name: memory_usage
    description: "Memory usage quality gate. This puts a bound on the total collector memory usage."
    bounds:
      series: total_pss_bytes
      # When updating this, update memory_allotment in the target section to 30% higher.
      # TODO: calibrate from a baseline run before enforcing.
      upper_bound: "300 MiB"

report_links:
  - text: "bounds checks dashboard"
    link: "https://app.datadoghq.com/dashboard/vz3-jd5-bdi?fromUser=true&refresh_mode=paused&tpl_var_experiment%5B0%5D={{ experiment }}&tpl_var_job_id%5B0%5D={{ job_id }}&view=spans&from_ts={{ start_time_ms }}&to_ts={{ end_time_ms }}&live=false"
