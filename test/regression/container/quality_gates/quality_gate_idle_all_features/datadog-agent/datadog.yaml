auth_token_file_path: /tmp/agent-auth-token

dd_url: http://127.0.0.1:9092

# Disable cloud detection. This stops the Agent from poking around the
# execution environment & network. This is particularly important if the target
# has network access.
cloud_provider_metadata: []

dogstatsd_socket: '/tmp/dsd.socket'

telemetry.enabled: true
telemetry.checks: '*'

logs_enabled: true
logs_config:
  logs_dd_url: 127.0.0.1:9091
  logs_no_ssl: true
  force_use_tcp: true

apm_config:
  enabled: true

process_config:
  process_dd_url: http://localhost:9093
  process_collection:
    enabled: true
  container_collection:
    enabled: true

network_path:
  connections_monitoring:
    enabled: true

runtime_security_config:
  ## Set to true to enable CWS
  enabled: true

cluster_checks:
  enabled: true

otlp_config:
  metrics:
    enabled: true
  traces:
    enabled: true
  logs:
    enabled: true

# Per Cloud Security Management setup documentation
# https://docs.datadoghq.com/security/cloud_security_management/setup/agent/linux/
remote_configuration:
  # SMP environment does not support remote config currently.
  enabled: false

compliance_config:
  ## Set to true to enable CIS benchmarks for Misconfigurations.
  enabled: true
  host_benchmarks:
    enabled: true

# Vulnerabilities are evaluated and scanned against your containers and hosts every hour.
sbom:
  enabled: true
  # Set to true to enable Container Vulnerability Management
  container_image:
    enabled: true
  # Set to true to enable Host Vulnerability Management
  host:
    enabled: true

container_image:
  enabled: true

# Hold the Agent Data Plane pre-flight open for the whole run.
#
# The pre-flight starts ADP as a child of the Agent and stops it again after 90s. That step down
# in total RSS lands in the middle of a replicate here, so the gate ends up measuring when the
# timer fired as much as what the Agent costs. 30m is well past the ~10 minute experiment, so ADP
# is resident for every sample instead.
data_plane.preflight_mode_duration: 30m
