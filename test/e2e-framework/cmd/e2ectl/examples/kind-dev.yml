# Example e2ectl environment: local kind cluster with a locally-built agent.
#
#   e2ectl start   --config kind-dev.yml --name mydev
#   e2ectl install --config kind-dev.yml --env mydev
#   e2ectl update  --env mydev
#   e2ectl fakeintake metrics --env mydev
#
schema: 1
environment:
  base: kind
  fakeintake: true
  kind:                 # the kind-driver-owned section
    version: "1.31.0"    # optional: full version, maps to kindest/node:v1.31.0
    # nodes: 1          # optional: extra worker nodes
agent:
  # Build from this checkout: e2ectl builds the hacky development image and
  # loads it into the cluster (nothing is pushed to gcr.io — the registry
  # prefix is only a naming convention).
  source: true
