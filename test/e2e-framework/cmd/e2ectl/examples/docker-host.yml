# Example e2ectl environment: EC2 VM with a Docker runtime (the framework's
# ec2docker scenario) and the agent installed by the official install script.
#
#   e2ectl start   --config docker-host.yml --name mydocker
#   e2ectl install --config docker-host.yml --env mydocker
#   e2ectl fakeintake metrics --env mydocker
#   e2ectl stop    --env mydocker
#
schema: 1
environment:
  base: docker-host
  fakeintake: true
  docker-host:         # the docker-host-driver-owned section (also the executor params)
    os: ubuntu-22.04-e2e
    arch: amd64
    # instance-type: t3.medium
agent:
  version: "7.83.0"    # released agent version installed by the install script
  # config: |          # optional datadog.yaml overrides
  #   log_level: debug
