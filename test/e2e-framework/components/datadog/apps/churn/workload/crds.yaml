---
# A custom resource definition whose recreations make the KSM checks rebuild their stores
# during the measurement: see doc/how-to/test/e2e/benchmarkeks/how-it-works.md.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # The API server requires <spec.names.plural>.<spec.group>.
  name: widgets.benchmark.datadoghq.com
  annotations:
    churn.datadoghq.com/lifetime: 5m
spec:
  group: benchmark.datadoghq.com
  scope: Namespaced
  names:
    kind: Widget
    plural: widgets
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
---
# Custom resources of the definition above, which the KSM checks collect (see the
# collectCrMetrics Helm values of the benchmarkeks scenario). They go away with their
# definition, and churn creates them again as their lifetime ends.
apiVersion: benchmark.datadoghq.com/v1
kind: Widget
metadata:
  name: widget-{{i}}
  namespace: workload-fake
  annotations:
    churn.datadoghq.com/instances: "5"
    churn.datadoghq.com/lifetime: 1m
spec:
  replicas: 3
