---
# Fast-churning Deployments: a constant flow of pod and ReplicaSet creations and
# deletions, i.e. watch events for the KSM stores, the Cluster Agent workloadmeta
# and the orchestrator check.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-{{i}}
  namespace: workload-fake
  labels:
    app: fake-{{i}}
  annotations:
    churn.datadoghq.com/instances: "50"
    churn.datadoghq.com/lifetime: 1m
spec:
  replicas: 10
  selector:
    matchLabels:
      app: fake-{{i}}
  template:
    metadata:
      labels:
        app: fake-{{i}}
        app.kubernetes.io/name: fake
        app.kubernetes.io/instance: fake-{{i}}
        tags.datadoghq.com/env: benchmark
        tags.datadoghq.com/service: fake-{{i}}
        tags.datadoghq.com/version: v1
    spec:
      containers:
        - image: fake
          name: fake-a
        - image: fake
          name: fake-b
        - image: fake
          name: fake-c
      nodeSelector:
        type: kwok
      tolerations:
        - key: kwok.x-k8s.io/node
          operator: Equal
          value: fake
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: fake-{{i}}
  namespace: workload-fake
  labels:
    app: fake-{{i}}
  annotations:
    churn.datadoghq.com/instances: "50"
    churn.datadoghq.com/lifetime: 2m
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: fake-{{i}}
  type: ClusterIP
---
# Steady Deployments: the bulk of the object population. KSM cost per check run
# grows with the number of metrics (pods × containers, label joins, owner tags),
# the orchestrator check skips unchanged resources, and the Cluster Agent decodes
# every pod, so the pods are "fat": several containers with env, args, probes,
# resources and volumes, and the standard labels that KSM turns into tags.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steady-{{i}}
  namespace: workload-fake
  labels:
    app: steady-{{i}}
    app.kubernetes.io/name: steady
    app.kubernetes.io/instance: steady-{{i}}
    app.kubernetes.io/managed-by: churn
  annotations:
    churn.datadoghq.com/instances: "200"
spec:
  replicas: 10
  selector:
    matchLabels:
      app: steady-{{i}}
  template:
    metadata:
      labels:
        app: steady-{{i}}
        app.kubernetes.io/name: steady
        app.kubernetes.io/instance: steady-{{i}}
        app.kubernetes.io/version: v1.2.3
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: benchmark
        app.kubernetes.io/managed-by: churn
        helm.sh/chart: steady-1.2.3
        tags.datadoghq.com/env: benchmark
        tags.datadoghq.com/service: steady-{{i}}
        tags.datadoghq.com/version: v1.2.3
      annotations:
        description: steady workload {{i}} of the benchmarkeks scenario
    spec:
      containers:
        - &container
          name: main
          image: fake
          args: ["--port=8080", "--log-level=info", "--instance=steady-{{i}}"]
          env:
            - {name: SERVICE_NAME, value: "steady-{{i}}"}
            - {name: DD_ENV, value: benchmark}
            - {name: DD_SERVICE, value: "steady-{{i}}"}
            - {name: DD_VERSION, value: v1.2.3}
            - {name: LOG_LEVEL, value: info}
            - {name: LOG_FORMAT, value: json}
            - {name: HTTP_PORT, value: "8080"}
            - {name: METRICS_PORT, value: "9090"}
            - {name: DATABASE_HOST, value: db.workload-fake.svc.cluster.local}
            - {name: DATABASE_PORT, value: "5432"}
            - {name: DATABASE_NAME, value: steady}
            - {name: CACHE_HOST, value: cache.workload-fake.svc.cluster.local}
            - {name: CACHE_PORT, value: "6379"}
            - {name: FEATURE_FLAGS, value: "alpha,beta,gamma,delta"}
            - {name: MAX_CONNECTIONS, value: "100"}
            - {name: TIMEOUT_SECONDS, value: "30"}
            - {name: RETRY_COUNT, value: "3"}
            - {name: REGION, value: us-east-1}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9090}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/steady}
            - {name: cache, mountPath: /var/cache/steady}
        - <<: *container
          name: sidecar
          args: ["--proxy", "--upstream=localhost:8080"]
          ports:
            - {name: proxy, containerPort: 8081}
        - <<: *container
          name: exporter
          args: ["--exporter", "--scrape=localhost:9090"]
          ports:
            - {name: exporter, containerPort: 9100}
      volumes:
        - name: config
          configMap: {name: steady-config}
        - name: cache
          emptyDir: {}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: type, operator: In, values: [kwok]}
      nodeSelector:
        type: kwok
      tolerations:
        - key: kwok.x-k8s.io/node
          operator: Equal
          value: fake
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: steady-{{i}}
  namespace: workload-fake
  labels:
    app: steady-{{i}}
  annotations:
    churn.datadoghq.com/instances: "200"
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: steady-{{i}}
  type: ClusterIP
---
# CronJobs: pods owned by Jobs owned by CronJobs (the KSM owner tags take the Job
# path) and job/cronjob metrics. KWOK completes Job pods right away.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-{{i}}
  namespace: workload-fake
  annotations:
    churn.datadoghq.com/instances: "30"
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      parallelism: 3
      completions: 3
      backoffLimit: 0
      activeDeadlineSeconds: 50
      template:
        metadata:
          labels:
            app: cron-{{i}}
        spec:
          restartPolicy: Never
          containers:
            - image: fake
              name: fake
          nodeSelector:
            type: kwok
          tolerations:
            - key: kwok.x-k8s.io/node
              operator: Equal
              value: fake
              effect: NoSchedule
---
