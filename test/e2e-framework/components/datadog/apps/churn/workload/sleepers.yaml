---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sleeper-{{i}}
  namespace: workload-sleepers
  labels:
    app: sleeper-{{i}}
  annotations:
    churn.datadoghq.com/instances: "10"
    churn.datadoghq.com/lifetime: 1m
spec:
  selector:
    matchLabels:
      app: sleeper-{{i}}
  template:
    metadata:
      labels:
        app: sleeper-{{i}}
      annotations:
        ad.datadoghq.com/sleeper-a.checks: |
          {
            "simple_check": {
              "instances": [
                {
                  "tags": ["foo:foo"]
                }
              ]
            }
          }
    spec:
      # Created by the churn component when the environment has image pull credentials
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - &sleeper
          name: sleeper-a
          image: DOCKERHUB_MIRROR/library/busybox:1.37.0
          command:
            - sleep
            - infinity
        - <<: *sleeper
          name: sleeper-b
        - <<: *sleeper
          name: sleeper-c
      nodeSelector:
        benchmark.datadoghq.com/role: node-agent
      tolerations:
        - key: benchmark.datadoghq.com/role
          operator: Equal
          value: node-agent
          effect: NoSchedule
        # Tolerating the variant taint with Exists (rather than a specific value) is
        # what lets this very same DaemonSet land on the node-agent pools of both
        # variants — the identical-workload premise of the benchmark.
        - key: benchmark.datadoghq.com/variant
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 1
---
# Steady DaemonSets with many containers: the kubelet check parses cadvisor and
# kubelet metrics whose volume grows with the number of containers on the node,
# and the container, containerd and cri checks go through each container. The
# containers go in these pods rather than in more pods, each of which would add
# a sandbox, a pod IP and a containerd shim. "Real pods, for the node Agents" in
# doc/how-to/test/e2e/benchmarkeks/how-it-works.md explains how many it takes
# for these checks to take a large share of the CPU usage of the node Agent.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: steady-sleeper-{{i}}
  namespace: workload-sleepers
  labels:
    app: steady-sleeper-{{i}}
  annotations:
    churn.datadoghq.com/instances: "5"
spec:
  selector:
    matchLabels:
      app: steady-sleeper-{{i}}
  template:
    metadata:
      labels:
        app: steady-sleeper-{{i}}
    spec:
      # Created by the churn component when the environment has image pull credentials
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - &sleeper
          name: sleeper-01
          image: DOCKERHUB_MIRROR/library/busybox:1.37.0
          command:
            - sleep
            - infinity
        - <<: *sleeper
          name: sleeper-02
        - <<: *sleeper
          name: sleeper-03
        - <<: *sleeper
          name: sleeper-04
        - <<: *sleeper
          name: sleeper-05
        - <<: *sleeper
          name: sleeper-06
        - <<: *sleeper
          name: sleeper-07
        - <<: *sleeper
          name: sleeper-08
        - <<: *sleeper
          name: sleeper-09
        - <<: *sleeper
          name: sleeper-10
        - <<: *sleeper
          name: sleeper-11
        - <<: *sleeper
          name: sleeper-12
        - <<: *sleeper
          name: sleeper-13
        - <<: *sleeper
          name: sleeper-14
        - <<: *sleeper
          name: sleeper-15
        - <<: *sleeper
          name: sleeper-16
        - <<: *sleeper
          name: sleeper-17
        - <<: *sleeper
          name: sleeper-18
        - <<: *sleeper
          name: sleeper-19
        - <<: *sleeper
          name: sleeper-20
        - <<: *sleeper
          name: sleeper-21
        - <<: *sleeper
          name: sleeper-22
        - <<: *sleeper
          name: sleeper-23
        - <<: *sleeper
          name: sleeper-24
        - <<: *sleeper
          name: sleeper-25
        - <<: *sleeper
          name: sleeper-26
        - <<: *sleeper
          name: sleeper-27
        - <<: *sleeper
          name: sleeper-28
        - <<: *sleeper
          name: sleeper-29
        - <<: *sleeper
          name: sleeper-30
        - <<: *sleeper
          name: sleeper-31
        - <<: *sleeper
          name: sleeper-32
      nodeSelector:
        benchmark.datadoghq.com/role: node-agent
      tolerations:
        - key: benchmark.datadoghq.com/role
          operator: Equal
          value: node-agent
          effect: NoSchedule
        - key: benchmark.datadoghq.com/variant
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 1
