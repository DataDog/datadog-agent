kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraMounts:
  - hostPath: /proc
    containerPath: /host/proc
{{- if .MountDockerSocket }}
  - hostPath: /var/run/docker.sock
    containerPath: /var/run/docker.sock
{{- end }}
{{- if .NewContainerdRegistryConfig }}
  - hostPath: ./certs.d
    containerPath: /etc/containerd/certs.d
{{- end }}
{{- range .WorkerNodes }}
- role: worker
  extraMounts:
  - hostPath: /proc
    containerPath: /host/proc
{{- if $.MountDockerSocket }}
  - hostPath: /var/run/docker.sock
    containerPath: /var/run/docker.sock
{{- end }}
{{- if $.NewContainerdRegistryConfig }}
  - hostPath: ./certs.d
    containerPath: /etc/containerd/certs.d
{{- end }}
{{- range .ExtraMounts }}
  - hostPath: {{ printf "%q" .HostPath }}
    containerPath: {{ printf "%q" .ContainerPath }}
{{- end }}
{{- if or .Labels .Taints .KubeletExtraArgs }}
  kubeadmConfigPatches:
    - |
      kind: JoinConfiguration
      nodeRegistration:
{{- if or .Labels .KubeletExtraArgs }}
        kubeletExtraArgs:
{{- if .Labels }}
          node-labels: "{{range $i, $l := .Labels}}{{if $i}},{{end}}{{$l.Key}}={{$l.Value}}{{end}}"
{{- end }}
{{- range $name, $value := .KubeletExtraArgs }}
          {{ printf "%q" $name }}: {{ printf "%q" $value }}
{{- end }}
{{- end }}
{{- if .Taints }}
        taints:
{{- range .Taints }}
          - key: "{{.Key}}"
            value: "{{.Value}}"
            effect: "{{.Effect}}"
{{- end }}
{{- end }}
{{- end }}
{{- end }} {{- /* end of range .WorkerNodes */}}
containerdConfigPatches:
  - |-
{{- if .NewContainerdRegistryConfig }}
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
{{- else }}
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
      endpoint = ["https://mirror.gcr.io", "https://registry-1.docker.io"]
{{- end }}
{{- if or .APIServerAddress .APIServerPort .KubeProxyReplacement }}
networking:
{{- if .APIServerAddress }}
  apiServerAddress: "{{ .APIServerAddress }}"
{{- end }}
{{- if .APIServerPort }}
  apiServerPort: {{ .APIServerPort }}
{{- end }}
{{- if .KubeProxyReplacement }}
  disableDefaultCNI: true
  kubeProxyMode: "none"
{{- end }}
{{- end }}
