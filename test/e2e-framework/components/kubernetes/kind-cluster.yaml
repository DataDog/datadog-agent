kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraMounts:
  - hostPath: /proc
    containerPath: /host/proc
{{- if .MountDockerSocket }}
  - hostPath: /var/run/docker.sock
    containerPath: /var/run/docker.sock
{{- end }}
{{- if .NewContainerdRegistryConfig }}
  - hostPath: ./certs.d
    containerPath: /etc/containerd/certs.d
{{- end }}
{{- range .WorkerNodes }}
- role: worker
  extraMounts:
  - hostPath: /proc
    containerPath: /host/proc
{{- if $.MountDockerSocket }}
  - hostPath: /var/run/docker.sock
    containerPath: /var/run/docker.sock
{{- end }}
{{- if $.NewContainerdRegistryConfig }}
  - hostPath: ./certs.d
    containerPath: /etc/containerd/certs.d
{{- end }}
{{- range .ExtraMounts }}
  - hostPath: {{ printf "%q" .HostPath }}
    containerPath: {{ printf "%q" .ContainerPath }}
{{- end }}
{{- if or .Labels .Taints .KubeletExtraArgs }}
  kubeadmConfigPatches:
    - |
      kind: JoinConfiguration
      nodeRegistration:
{{- if or .Labels .KubeletExtraArgs }}
        kubeletExtraArgs:
{{- if .Labels }}
          node-labels: "{{range $i, $l := .Labels}}{{if $i}},{{end}}{{$l.Key}}={{$l.Value}}{{end}}"
{{- end }}
{{- range $name, $value := .KubeletExtraArgs }}
          {{ printf "%q" $name }}: {{ printf "%q" $value }}
{{- end }}
{{- end }}
{{- if .Taints }}
        taints:
{{- range .Taints }}
          - key: "{{.Key}}"
            value: "{{.Value}}"
            effect: "{{.Effect}}"
{{- end }}
{{- end }}
{{- end }}
{{- end }} {{- /* end of range .WorkerNodes */}}
{{- /*
kube-apiserver calls webhooks on the endpoints of their service, like managed control planes
(EKS, GKE) do, rather than on its ClusterIP. kube-proxy routes a ClusterIP to a newly ready pod
about a second after Helm sees the pod ready, and the Cluster Agent admission webhook fails open,
so pods created in that window were admitted unmutated. The flag also routes aggregated APIs, such
as the Cluster Agent external metrics server, to endpoints. Without an apiVersion, kind applies the
patch to every kubeadm API version, and converts and merges the extraArgs map for v1beta4.
*/}}
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        enable-aggregator-routing: "true"
containerdConfigPatches:
  - |-
{{- if .NewContainerdRegistryConfig }}
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
{{- else }}
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
      endpoint = ["https://mirror.gcr.io", "https://registry-1.docker.io"]
{{- end }}
{{- if or .APIServerAddress .APIServerPort .KubeProxyReplacement }}
networking:
{{- if .APIServerAddress }}
  apiServerAddress: "{{ .APIServerAddress }}"
{{- end }}
{{- if .APIServerPort }}
  apiServerPort: {{ .APIServerPort }}
{{- end }}
{{- if .KubeProxyReplacement }}
  disableDefaultCNI: true
  kubeProxyMode: "none"
{{- end }}
{{- end }}
