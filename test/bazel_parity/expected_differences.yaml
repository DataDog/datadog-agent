# Accept specific differences only after review, with a non-empty reason.
# Each entry requires id, check (file or metadata), product, format, arch, item,
# and reason. File entries also require an exact normalized path and result
# (missing_in_bazel, extra_in_bazel, mismatch); mismatch entries must pin flags
# and the omnibus/bazel FileInfo values. Metadata entries pin both normalized
# omnibus and bazel values. No wildcards; unused entries are reported.
# Example metadata entry:
# - id: temporary_vendor_exception
#   check: metadata
#   product: datadog-agent
#   format: deb
#   arch: amd64
#   item: field_vendor
#   omnibus: "Datadog <package@datadoghq.com>"
#   bazel: ""
#   reason: "Explain why this difference is intentionally accepted."
# The known Vendor gap is deliberately NOT accepted by default.
differences: []
