[workspace]
resolver = "2"
members = [
    "cmd/ai_prompt_logger",
    "comp/core/log/rust",
    "pkg/collector/sharedlibrary/rustchecks/core",
    "pkg/collector/sharedlibrary/rustchecks/checks/datasecurity",
    "pkg/collector/sharedlibrary/rustchecks/checks/example",
    "pkg/discovery/module/rust",
    "pkg/privateactionrunner/par-control",
    "pkg/procmgr/rust",
    "pkg/procmgr/rust/client",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1.0.98"
aws-lc-rs = { version = ">=1, <1.18", default-features = false, features = ["non-fips"] }
cap-std = "4.0"
# Keep only the `dd-sds` feature and disable default features so we pull in just
# the necessary dependencies and avoid shipping the third-party checkers.
dd_sds = { package = "dd-sensitive-data-scanner", version = "=0.1.0-20260807-dd8be015454d", default-features = false, features = ["dd-sds"] }
caps = "0.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
elf = "0.8.0"
glob-match = "0.2"
http-body-util = "0.1"
hostname = "0.4"
hyper = "1"
hyper-util = { version = "0.1", default-features = false, features = ["http1", "server", "tokio"] }
libc = "0.2"
log = "0.4"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
protoc-gen-prost = "0.5"
protoc-gen-tonic = "0.5"
lru = { version = "0.18.0", default-features = false }
memchr = "2.7.6"
nom = "8.0"
normalize-path = "0.2"
phf = { version = "0.14", features = ["macros"] }
rawzip = "0.5.0"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12"] }
rustls-pki-types = { version = "1", default-features = false, features = ["std"] }
saluki-tls = { git = "https://github.com/DataDog/saluki", rev = "a6c1769ab1629b0040126f306726da6170fbbd77" }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
xml-rs = "1.0"
rmp-serde = "1.3"
serde = { version = "1.0.219", features = ["derive", "std"] }
serde_json = "1.0"
serde_yaml = "0.9"
datadog-agent-commons = { git = "https://github.com/DataDog/saluki", rev = "a6c1769ab1629b0040126f306726da6170fbbd77" }
dd-agent-log = { path = "comp/core/log/rust" }
dd-procmgr-client = { path = "pkg/procmgr/rust/client" }
time = { version = "0.3", features = ["formatting", "macros"] }
thiserror = "2.0.12"
tokio = "1"
tokio-stream = "0.1"
tonic = "0.14"
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
# Keep ureq HTTP-only; HTTPS clients use the explicitly configured Rustls stack.
ureq = { version = "3.0", default-features = false, features = ["json"] }
uzers = "0.12"
walkdir = "2"
saphyr-parser = "0.0.12"
yaml-rust2 = "0.12"
zip = { version = "8.0", default-features = false, features = ["deflate"] }
flate2 = "1.1"

tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
windows-registry = "0.6"
windows-sys = { version = "0.61", features = [] }

# dev-dependencies
dircpy = "0.3.19"
regex = "1"
memmap2 = "0.9"
nix = { version = "0.31", features = ["signal"] }
scopeguard = "1.2"
temp-env = "0.3"
tempfile = "3.0"

[profile.release]
lto = "fat"
opt-level = "z"
codegen-units = 1