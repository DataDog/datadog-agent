metrics:
  - path: /interfaces/interface/state/counters/in-octets
    metric: snmp.ifHCInOctets
    type: monotonic_count
    tags:
      interface: name
  - path: /interfaces/interface/state/counters/out-octets
    metric: snmp.ifHCOutOctets
    type: monotonic_count
    tags:
      interface: name
