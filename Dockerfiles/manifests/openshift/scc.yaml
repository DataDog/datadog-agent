---
# This file has been generated by `helm template datadog-agent datadog/datadog` from datadog/templates/agent-scc.yaml. Please re-run `generate.sh` rather than modifying this file manually.
kind: SecurityContextConstraints
apiVersion: security.openshift.io/v1
metadata:
  name: datadog
users:
  - system:serviceaccount:default:datadog
priority: null
# Allow host ports for dsd / trace intake
allowHostPorts: true
# Allow host PID for dogstatsd origin detection
allowHostPID: true
# Allow host network for the CRIO check to reach Prometheus through localhost
allowHostNetwork: true
# Allow hostPath for docker / process metrics
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - hostPath
  - secret
# Use the `spc_t` selinux type to access the
# docker/cri socket + proc and cgroup stats
seLinuxContext:
  type: MustRunAs
  seLinuxOptions:
    level: s0
    role: system_r
    type: spc_t
    user: system_u
# system-probe requires some specific seccomp and capabilities
seccompProfiles:
  - runtime/default
  - localhost/system-probe
allowedCapabilities:
  - SYS_ADMIN
  - SYS_RESOURCE
  - SYS_PTRACE
  - NET_ADMIN
  - NET_BROADCAST
  - NET_RAW
  - IPC_LOCK
  - CHOWN
  - AUDIT_CONTROL
  - AUDIT_READ
  - DAC_READ_SEARCH
  - MKNOD
  - SYSLOG
#
# The rest is copied from restricted SCC
#
allowHostDirVolumePlugin: true
allowHostIPC: false
allowPrivilegedContainer: false
allowedFlexVolumes: []
defaultAddCapabilities: []
fsGroup:
  type: MustRunAs
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
# If your environment restricts user access to the Docker socket or journald (for logging)
# create or use an existing group that has access and add the GID to
# the lines below (also remove the previous line, `type: RunAsAny`)
#   type: MustRunAs
#   ranges:
#   - min: <min-group-ID>
#   - max: <max-group-ID>
requiredDropCapabilities: []
---
# This file has been generated by `helm template datadog-agent datadog/datadog` from datadog/templates/cluster-agent-scc.yaml. Please re-run `generate.sh` rather than modifying this file manually.
kind: SecurityContextConstraints
apiVersion: security.openshift.io/v1
metadata:
  name: datadog-cluster-agent
users:
  - system:serviceaccount:default:datadog-cluster-agent
priority: null
# Allow host ports if hostNetwork
allowHostPorts: false
allowHostNetwork: false
# Default from restricted SCC
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostPID: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: []
defaultAddCapabilities: []
fsGroup:
  type: MustRunAs
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - KILL
  - MKNOD
  - SETUID
  - SETGID
runAsUser:
  type: MustRunAsRange
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
