description: Datadog Private Action Runner - On-Demand Executor
command: /opt/datadog-agent/embedded/bin/privateactionrunner
args:
  - run-executor
  - --cfgpath
  - /etc/datadog-agent/datadog.yaml
auto_start: false
restart: never
env:
  PATH: /opt/datadog-agent/embedded/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  HOME: -${HOME}
  DOCKER_DD_AGENT: -${DOCKER_DD_AGENT}
  DD_FLEET_POLICIES_DIR: /etc/datadog-agent/managed/datadog-agent/stable

  DD_API_KEY: -${DD_API_KEY}
  DD_SITE: -${DD_SITE}
  DD_DD_URL: -${DD_DD_URL}
  DD_HOSTNAME: -${DD_HOSTNAME}
  DD_HOSTNAME_FILE: -${DD_HOSTNAME_FILE}
  DD_LOG_LEVEL: -${DD_LOG_LEVEL}
  DD_TAGS: -${DD_TAGS}
  DD_EXTRA_TAGS: -${DD_EXTRA_TAGS}
  DD_SKIP_SSL_VALIDATION: -${DD_SKIP_SSL_VALIDATION}
  DD_MIN_TLS_VERSION: -${DD_MIN_TLS_VERSION}

  DD_REMOTE_CONFIGURATION_ENABLED: -${DD_REMOTE_CONFIGURATION_ENABLED}
  DD_REMOTE_CONFIGURATION_API_KEY: -${DD_REMOTE_CONFIGURATION_API_KEY}
  DD_REMOTE_CONFIGURATION_RC_DD_URL: -${DD_REMOTE_CONFIGURATION_RC_DD_URL}

  DD_PROXY_HTTP: -${DD_PROXY_HTTP}
  DD_PROXY_HTTPS: -${DD_PROXY_HTTPS}
  DD_PROXY_NO_PROXY: -${DD_PROXY_NO_PROXY}
  HTTP_PROXY: -${HTTP_PROXY}
  HTTPS_PROXY: -${HTTPS_PROXY}
  NO_PROXY: -${NO_PROXY}
  http_proxy: -${http_proxy}
  https_proxy: -${https_proxy}
  no_proxy: -${no_proxy}

  DD_CMD_HOST: -${DD_CMD_HOST}
  DD_CMD_PORT: -${DD_CMD_PORT}
  DD_AGENT_IPC_SOCKET_PATH: -${DD_AGENT_IPC_SOCKET_PATH}
  DD_AUTH_TOKEN_FILE_PATH: -${DD_AUTH_TOKEN_FILE_PATH}
  DD_IPC_CERT_FILE_PATH: -${DD_IPC_CERT_FILE_PATH}

  STATSD_URL: -${STATSD_URL}
  DD_BIND_HOST: -${DD_BIND_HOST}
  DD_DOGSTATSD_PORT: -${DD_DOGSTATSD_PORT}

  DD_SECRET_BACKEND_TYPE: -${DD_SECRET_BACKEND_TYPE}
  DD_SECRET_BACKEND_CONFIG: -${DD_SECRET_BACKEND_CONFIG}
  DD_MULTI_SECRET_BACKENDS: -${DD_MULTI_SECRET_BACKENDS}
  DD_SECRET_BACKEND_COMMAND: -${DD_SECRET_BACKEND_COMMAND}
  DD_SECRET_BACKEND_ARGUMENTS: -${DD_SECRET_BACKEND_ARGUMENTS}
  DD_SECRET_BACKEND_OUTPUT_MAX_SIZE: -${DD_SECRET_BACKEND_OUTPUT_MAX_SIZE}
  DD_SECRET_BACKEND_TIMEOUT: -${DD_SECRET_BACKEND_TIMEOUT}
  DD_SECRET_BACKEND_REMOVE_TRAILING_LINE_BREAK: -${DD_SECRET_BACKEND_REMOVE_TRAILING_LINE_BREAK}
  DD_SECRET_BACKEND_COMMAND_ALLOW_GROUP_EXEC_PERM: -${DD_SECRET_BACKEND_COMMAND_ALLOW_GROUP_EXEC_PERM}

  DD_PRIVATE_ACTION_RUNNER_ENABLED: -${DD_PRIVATE_ACTION_RUNNER_ENABLED}
  DD_PRIVATE_ACTION_RUNNER_EXTRA_CONFIG_PATH: -${DD_PRIVATE_ACTION_RUNNER_EXTRA_CONFIG_PATH}
  DD_PRIVATE_ACTION_RUNNER_IDENTITY_FILE_PATH: -${DD_PRIVATE_ACTION_RUNNER_IDENTITY_FILE_PATH}
  DD_PRIVATE_ACTION_RUNNER_PRIVATE_KEY: -${DD_PRIVATE_ACTION_RUNNER_PRIVATE_KEY}
  DD_PRIVATE_ACTION_RUNNER_URN: -${DD_PRIVATE_ACTION_RUNNER_URN}
  DD_PRIVATE_ACTION_RUNNER_TASK_TIMEOUT_SECONDS: -${DD_PRIVATE_ACTION_RUNNER_TASK_TIMEOUT_SECONDS}
  DD_PRIVATE_ACTION_RUNNER_IDLE_TIMEOUT_SECONDS: -${DD_PRIVATE_ACTION_RUNNER_IDLE_TIMEOUT_SECONDS}
  DD_PRIVATE_ACTION_RUNNER_LOG_FILE: -${DD_PRIVATE_ACTION_RUNNER_LOG_FILE}
  DD_PRIVATE_ACTION_RUNNER_EXECUTOR_SOCKET_PATH: -${DD_PRIVATE_ACTION_RUNNER_EXECUTOR_SOCKET_PATH}

  DD_PRIVATE_ACTION_RUNNER_ACTIONS_ALLOWLIST: -${DD_PRIVATE_ACTION_RUNNER_ACTIONS_ALLOWLIST}
  DD_PRIVATE_ACTION_RUNNER_DEFAULT_ACTIONS_ENABLED: -${DD_PRIVATE_ACTION_RUNNER_DEFAULT_ACTIONS_ENABLED}
  DD_PRIVATE_ACTION_RUNNER_AGENT_SECRET_MANAGEMENT_ENABLED: -${DD_PRIVATE_ACTION_RUNNER_AGENT_SECRET_MANAGEMENT_ENABLED}
  DD_PRIVATE_ACTION_RUNNER_HTTP_TIMEOUT_SECONDS: -${DD_PRIVATE_ACTION_RUNNER_HTTP_TIMEOUT_SECONDS}
  DD_PRIVATE_ACTION_RUNNER_HTTP_ALLOWLIST: -${DD_PRIVATE_ACTION_RUNNER_HTTP_ALLOWLIST}
  DD_PRIVATE_ACTION_RUNNER_HTTP_ALLOW_IMDS_ENDPOINT: -${DD_PRIVATE_ACTION_RUNNER_HTTP_ALLOW_IMDS_ENDPOINT}
  DD_PRIVATE_ACTION_RUNNER_RESTRICTED_SHELL_ALLOWED_PATHS: -${DD_PRIVATE_ACTION_RUNNER_RESTRICTED_SHELL_ALLOWED_PATHS}
  DD_PRIVATE_ACTION_RUNNER_RESTRICTED_SHELL_ALLOWED_COMMANDS: -${DD_PRIVATE_ACTION_RUNNER_RESTRICTED_SHELL_ALLOWED_COMMANDS}
  DD_PRIVATE_ACTION_RUNNER_RESTRICTED_SHELL_ALLOWED_SYSTEM_SERVICES: -${DD_PRIVATE_ACTION_RUNNER_RESTRICTED_SHELL_ALLOWED_SYSTEM_SERVICES}
  DD_PRIVATE_ACTION_RUNNER_RESTRICTED_SHELL_DISABLE_DETAILED_TELEMETRY: -${DD_PRIVATE_ACTION_RUNNER_RESTRICTED_SHELL_DISABLE_DETAILED_TELEMETRY}

  KUBERNETES_SERVICE_HOST: -${KUBERNETES_SERVICE_HOST}
  KUBERNETES_SERVICE_PORT: -${KUBERNETES_SERVICE_PORT}
  DD_KUBEACTIONS_ENABLED: -${DD_KUBEACTIONS_ENABLED}
stdout: inherit
stderr: inherit
