description: Datadog Private Action Runner - Control Plane
command: /opt/datadog-agent/embedded/bin/par-control
args:
  - --bootstrap-command
  - /opt/datadog-agent/embedded/bin/privateactionrunner
  - bootstrap-par-control
  - --cfgpath
  - /etc/datadog-agent/datadog.yaml
auto_start: true
# par-control drains for at most 170 seconds, including terminal publication.
stop_timeout: 180
restart: on-failure
restart_sec: 2
start_limit_interval_sec: 10
start_limit_burst: 5
env:
  PATH: /opt/datadog-agent/embedded/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  DD_FLEET_POLICIES_DIR: /etc/datadog-agent/managed/datadog-agent/stable
  DD_PRIVATE_ACTION_RUNNER_SPLIT_ENABLED: "true"
stdout: inherit
stderr: inherit
