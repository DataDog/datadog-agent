# Critical: the container exits when this process exits. Not loaded by s6/PAR (load_configs does not recurse).
description: Datadog Agent
command: /opt/datadog-agent/bin/agent/agent
args: [run]
auto_start: true
restart: never
exit_with_supervisor: true
stdout: inherit
stderr: inherit
env:
  PATH: /opt/datadog-agent/bin/agent:/opt/datadog-agent/embedded/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
