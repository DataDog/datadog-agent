# Matches the s6 otel service: otel-agent decides enablement itself (exits 0 when disabled),
# inherits the container PATH, and restarts every 2 seconds without a limit.
description: Datadog OTel Agent
command: /opt/datadog-agent/embedded/bin/otel-agent
args:
  - --config
  - /etc/datadog-agent/otel-config.yaml
auto_start: true
condition_path_exists: /opt/datadog-agent/embedded/bin/otel-agent
restart: on-failure
restart_sec: 2
restart_max_delay_sec: 2
start_limit_interval_sec: 0
stdout: inherit
stderr: inherit
