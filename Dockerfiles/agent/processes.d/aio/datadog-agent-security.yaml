# compliance_config.enabled: the container binary also runs for compliance-only (the Windows template omits it).
description: Datadog Security Agent
command: /opt/datadog-agent/embedded/bin/security-agent
args:
  - start
  - -c=/etc/datadog-agent/datadog.yaml
  - --sysprobe-config=/etc/datadog-agent/system-probe.yaml
auto_start: true
condition_path_exists: /opt/datadog-agent/embedded/bin/security-agent
condition_config_any:
  - path: /etc/datadog-agent/datadog.yaml
    keys:
      - compliance_config.enabled
  - path: /etc/datadog-agent/system-probe.yaml
    keys:
      - runtime_security_config.enabled
restart: on-failure
restart_sec: 2
start_limit_interval_sec: 10
start_limit_burst: 5
stdout: inherit
stderr: inherit
env:
  PATH: /opt/datadog-agent/bin/agent:/opt/datadog-agent/embedded/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
