description: Datadog Process Agent
command: /opt/datadog-agent/embedded/bin/process-agent
args:
  - --cfgpath=/etc/datadog-agent/datadog.yaml
auto_start: true
condition_path_exists: /opt/datadog-agent/embedded/bin/process-agent
condition_config_any:
  - path: /etc/datadog-agent/datadog.yaml
    keys:
      - process_config.enabled
      - process_config.process_collection.enabled
      - process_config.container_collection.enabled
      - process_config.process_discovery.enabled
  - path: /etc/datadog-agent/system-probe.yaml
    keys:
      - network_config.enabled
      - system_probe_config.enabled
restart: on-failure
restart_sec: 2
start_limit_interval_sec: 10
start_limit_burst: 5
stdout: inherit
stderr: inherit
env:
  PATH: /opt/datadog-agent/bin/agent:/opt/datadog-agent/embedded/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
