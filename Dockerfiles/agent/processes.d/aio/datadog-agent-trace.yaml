# Keeps trace-loader, as the s6 run script does.
description: Datadog Trace Agent
command: /opt/datadog-agent/embedded/bin/trace-loader
args:
  - /etc/datadog-agent/datadog.yaml
  - /opt/datadog-agent/embedded/bin/trace-agent
  - --config=/etc/datadog-agent/datadog.yaml
auto_start: true
condition_path_exists: /opt/datadog-agent/embedded/bin/trace-agent
condition_config_any:
  - path: /etc/datadog-agent/datadog.yaml
    keys:
      - apm_config.enabled
      - apm_config.error_tracking_standalone.enabled
restart: on-failure
restart_sec: 2
start_limit_interval_sec: 10
start_limit_burst: 5
stdout: inherit
stderr: inherit
env:
  PATH: /opt/datadog-agent/bin/agent:/opt/datadog-agent/embedded/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
