description: Datadog Private Action Runner - Control Plane
command: /opt/datadog-agent/embedded/bin/par-control
args:
  - --executor-socket
  - /opt/datadog-agent/run/par-executor.sock
  - --ipc-cert-file
  - ${DD_PM_IPC_CERT_FILE_PATH}
auto_start: true
# FIPS images omit this binary. Skip the process when it is not installed.
condition_path_exists: /opt/datadog-agent/embedded/bin/par-control
condition_config_any:
  - path: /etc/datadog-agent/datadog.yaml
    keys:
      - private_action_runner.enabled
# par-control drains for at most 170 seconds, including terminal publication.
stop_timeout: 180
restart: on-failure
restart_sec: 2
start_limit_interval_sec: 10
start_limit_burst: 5
env:
  PATH: /opt/datadog-agent/embedded/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  DD_FLEET_POLICIES_DIR: /etc/datadog-agent/managed/datadog-agent/stable
stdout: inherit
stderr: inherit
