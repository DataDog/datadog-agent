description: Datadog Agent Data Plane
command: /opt/datadog-agent/embedded/bin/agent-data-plane
args:
  - --config
  - /etc/datadog-agent/datadog.yaml
  - run
auto_start: true
condition_path_exists: /opt/datadog-agent/embedded/bin/agent-data-plane
condition_config_any:
  - path: /etc/datadog-agent/datadog.yaml
    keys:
      - data_plane.enabled
restart: on-failure
restart_sec: 2
start_limit_interval_sec: 10
start_limit_burst: 5
stdout: inherit
stderr: inherit
env:
  PATH: /opt/datadog-agent/bin/agent:/opt/datadog-agent/embedded/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
