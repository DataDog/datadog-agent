# on-failure: a disabled system-probe exits 0, which `always` would respawn forever.
# The external veto is scoped to this entry; process-agent still runs against an external probe.
description: Datadog System Probe
command: /opt/datadog-agent/embedded/bin/system-probe
args:
  - run
  - --config=/etc/datadog-agent/system-probe.yaml
auto_start: true
condition_path_exists: /opt/datadog-agent/embedded/bin/system-probe
condition_config_any:
  - path: /etc/datadog-agent/system-probe.yaml
    keys:
      - network_config.enabled
      - system_probe_config.enabled
      - runtime_security_config.enabled
  - path: /etc/datadog-agent/datadog.yaml
    keys:
      - software_inventory.enabled
condition_config_none:
  - path: /etc/datadog-agent/system-probe.yaml
    keys:
      - system_probe_config.external
restart: on-failure
restart_sec: 2
start_limit_interval_sec: 10
start_limit_burst: 5
stdout: inherit
stderr: inherit
env:
  PATH: /opt/datadog-agent/bin/agent:/opt/datadog-agent/embedded/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
