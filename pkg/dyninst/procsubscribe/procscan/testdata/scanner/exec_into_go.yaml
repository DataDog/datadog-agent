# A wrapper script that eventually execs the real service is a common way to
# start a container. Exec keeps the pid and the start time, so the only thing
# that tells us the process is no longer the one we wrote off is its executable.
#
# Two things make this work. The delay between two looks at a process that is not
# running a Go binary is capped well below the delay between two tracer metadata
# reads, because looking again is much cheaper than searching a process for
# metadata, so an exec is noticed within 20 ticks here rather than 100. And once
# the new executable is seen, the schedule starts over, so the service does not
# have to wait out the backoff the wrapper accumulated before its metadata is
# read.
- !initialize
  current_time: 100
  min_age: 10
  backoff_base: 10
  backoff_cap: 100
  non_go_backoff_cap: 20
- !create-process
  pid: 1001
  start_time: 50
  executable: {path: "/bin/sh", ino: 7, go_binary: false}
  tracer_metadata: {language: "go", service: "wrapped-service"}
# The wrapper runs long enough to reach the cap on its own schedule.
- !scan {}
- !advance-time {to: 110}
- !scan {}
- !advance-time {to: 130}
- !scan {}
- !advance-time {to: 150}
- !scan {}
# It execs the service, whose tracer has not published yet. The next look sees a
# different executable and forgets the backoff the wrapper earned, so the first
# metadata read for the service is followed by another 10 ticks later rather than
# the 100 the wrapper had worked its way up to.
- !exec-process
  pid: 1001
  executable: {path: "/app/server", ino: 9}
  metadata_available_at: 185
- !advance-time {to: 170}
- !scan {}
- !advance-time {to: 180}
- !scan {}
- !advance-time {to: 200}
- !scan {}
---
command: !initialize
  current_time: 100
  min_age: 10
  backoff_base: 10
  backoff_cap: 100
  non_go_backoff_cap: 20
---
command: !create-process
  pid: 1001
  start_time: 50
  executable: {path: "/bin/sh", ino: 7, go_binary: false}
  tracer_metadata: {language: "go", service: "wrapped-service"}
---
command: !scan {}
state:
  current_time: 100
  candidates: [{pid: 1001, start_time: 50, exe_ino: 7, attempts: 1, next_attempt: 110}]
  processes_in_procfs: [1001]
---
command: !advance-time {to: 110}
---
command: !scan {}
