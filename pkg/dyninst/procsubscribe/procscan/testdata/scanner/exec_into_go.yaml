  current_time: 110
  candidates: [{pid: 1001, start_time: 50, exe_ino: 7, attempts: 2, next_attempt: 130}]
  processes_in_procfs: [1001]
---
command: !advance-time {to: 130}
---
command: !scan {}
state:
  current_time: 130
  candidates: [{pid: 1001, start_time: 50, exe_ino: 7, attempts: 3, next_attempt: 150}]
  processes_in_procfs: [1001]
---
command: !advance-time {to: 150}
---
command: !scan {}
state:
  current_time: 150
  candidates: [{pid: 1001, start_time: 50, exe_ino: 7, attempts: 4, next_attempt: 170}]
  processes_in_procfs: [1001]
---
command: !exec-process
  pid: 1001
  executable: {path: "/app/server", ino: 9}
