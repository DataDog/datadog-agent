# Test discovering multiple processes in one scan.
- !initialize
  current_time: 0
  min_age: 10
  backoff_base: 10
  backoff_cap: 100
- !create-process
  pid: 1001
  start_time: 50
  tracer_metadata: {language: "go", service: "service-1"}
- !create-process
  pid: 1002
  start_time: 60
  tracer_metadata: {language: "go", service: "service-2"}
- !create-process
  pid: 1003
  start_time: 70
  tracer_metadata: {language: "go", service: "service-3"}
- !advance-time {to: 200}
- !scan {}
---
command: !initialize
  current_time: 0
  min_age: 10
  backoff_base: 10
  backoff_cap: 100
---
command: !create-process
  pid: 1001
  start_time: 50
  tracer_metadata: {language: "go", service: "service-1"}
---
command: !create-process
  pid: 1002
  start_time: 60
  tracer_metadata: {language: "go", service: "service-2"}
---
command: !create-process
  pid: 1003
  start_time: 70
  tracer_metadata: {language: "go", service: "service-3"}
---
command: !advance-time {to: 200}
---
command: !scan {}
new: [{pid: 1001, start_time: 50}, {pid: 1002, start_time: 60}, {pid: 1003, start_time: 70}]
state:
  current_time: 200
  live: [{pid: 1001, start_time: 50}, {pid: 1002, start_time: 60}, {pid: 1003, start_time: 70}]
  processes_in_procfs: [1001, 1002, 1003]
  metrics: {candidates_evaluated: 3, executables_analyzed: 3, discovered: 3}
