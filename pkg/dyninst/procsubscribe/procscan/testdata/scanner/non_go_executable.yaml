# The executable filter is what makes looking at every process on every scan
# affordable: a process that is not running a Go binary never costs a tracer
# metadata read, and the answer is cached per executable, so two processes
# running the same binary only cost one analysis.
#
# Such a process still backs off, because identifying its executable costs a
# readlink, an open and a stat even when the answer is already cached. It stays
# a candidate rather than being written off, because a process can exec into a
# Go binary without its pid or start time changing.
- !initialize
  current_time: 100
  min_age: 10
  backoff_base: 10
  backoff_cap: 100
- !create-process
  pid: 1001
  start_time: 50
  executable: {path: "/usr/bin/python3", ino: 7, go_binary: false}
  tracer_metadata: {language: "go", service: "not-a-go-binary"}
- !create-process
  pid: 1002
  start_time: 50
  executable: {path: "/usr/bin/python3", ino: 7, go_binary: false}
  tracer_metadata: {language: "go", service: "not-a-go-binary"}
- !scan {}
- !advance-time {to: 110}
- !scan {}
