# The executable filter is what makes looking at every process on every scan
# affordable: a process that is not running a Go binary never costs a tracer
# metadata read. Both processes here run the same binary, which is also the case
# where the per executable cache saves the second analysis; that the cache
# actually does so is checked against real binaries in
# TestSyntheticProcfsScanWork.
#
# Such a process is written off for good: identifying its executable costs a
# readlink, an open and a stat even when the answer is already cached, and that
# is the common case on a host. An exec into a Go binary keeps the pid and the
# start time and so goes unnoticed, which is accepted.
- !initialize
  current_time: 100
  min_age: 10
  backoff_base: 10
  backoff_cap: 100
- !create-process
  pid: 1001
  start_time: 50
  executable: {path: "/usr/bin/python3", ino: 7, go_binary: false}
  tracer_metadata: {language: "go", service: "not-a-go-binary"}
- !create-process
  pid: 1002
  start_time: 50
  executable: {path: "/usr/bin/python3", ino: 7, go_binary: false}
  tracer_metadata: {language: "go", service: "not-a-go-binary"}
- !scan {}
- !advance-time {to: 110}
- !scan {}
---
command: !initialize
  current_time: 100
  min_age: 10
  backoff_base: 10
  backoff_cap: 100
---
command: !create-process
  pid: 1001
  start_time: 50
  executable: {path: "/usr/bin/python3", ino: 7, go_binary: false}
  tracer_metadata: {language: "go", service: "not-a-go-binary"}
---
command: !create-process
  pid: 1002
  start_time: 50
  executable: {path: "/usr/bin/python3", ino: 7, go_binary: false}
  tracer_metadata: {language: "go", service: "not-a-go-binary"}
---
command: !scan {}
state:
  current_time: 100
  candidates: [{pid: 1001, start_time: 50, written_off: true}, {pid: 1002, start_time: 50, written_off: true}]
  processes_in_procfs: [1001, 1002]
---
command: !advance-time {to: 110}
---
command: !scan {}
state:
  current_time: 110
  candidates: [{pid: 1001, start_time: 50, written_off: true}, {pid: 1002, start_time: 50, written_off: true}]
  processes_in_procfs: [1001, 1002]
