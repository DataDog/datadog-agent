# Scans that are far apart do not cost a process any of its attempts. Every scan
# that finds a retry due performs it, so a process gets one attempt per scan no
# matter how the scans are spaced, and it is still discovered once its tracer
# publishes.
#
# This is what the window-based algorithm got wrong: a slow scan could swallow
# two of the three chances a process ever got.
- !initialize
  current_time: 100
  min_age: 10
  backoff_base: 10
  backoff_cap: 100
- !create-process
  pid: 1001
  start_time: 50
  metadata_available_at: 5000
  tracer_metadata: {language: "go", service: "slow-scans"}
- !scan {}
- !advance-time {by: 1000}
- !scan {}
- !advance-time {by: 1000}
- !scan {}
- !advance-time {by: 1000}
- !scan {}
- !advance-time {by: 1000}
- !scan {}
- !advance-time {by: 1000}
- !scan {}
