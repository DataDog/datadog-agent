# A Go binary whose tracer reports another language cannot be instrumented, so
# it backs off like a binary that is not Go at all. The answer is very unlikely
# to change, but it costs a metadata read per cap interval to keep asking, and
# no verdict this scanner reaches is worth making permanent.
- !initialize
  current_time: 0
  backoff_base: 10
  backoff_cap: 100
- !create-process
  pid: 1001
  start_time: 50
  tracer_metadata:
    language: "python"
    service: "python-service"
- !advance-time {to: 100}
- !scan {}
- !advance-time {to: 110}
- !scan {}
- !advance-time {to: 130}
- !scan {}
