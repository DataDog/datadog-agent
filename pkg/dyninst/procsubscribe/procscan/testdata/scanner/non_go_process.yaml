# A Go binary whose tracer reports another language cannot be instrumented, and
# nothing about that will change, so it is written off like a binary that is not
# Go at all.
- !initialize
  current_time: 0
  min_age: 10
  backoff_base: 10
  backoff_cap: 100
- !create-process
  pid: 1001
  start_time: 50
  tracer_metadata:
    language: "python"
    service: "python-service"
- !advance-time {to: 100}
- !scan {}
- !advance-time {to: 110}
- !scan {}
- !advance-time {to: 130}
- !scan {}
---
command: !initialize
  current_time: 0
  min_age: 10
  backoff_base: 10
  backoff_cap: 100
---
