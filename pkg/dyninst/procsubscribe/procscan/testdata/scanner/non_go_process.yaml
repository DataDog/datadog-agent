# A Go binary whose tracer reports another language cannot be instrumented, but
# it still backs off rather than being written off: the only terminal state is
# the process exiting.
- !initialize
  current_time: 0
  min_age: 10
  backoff_base: 10
  backoff_cap: 100
- !create-process
  pid: 1001
  start_time: 50
  tracer_metadata:
    language: "python"
    service: "python-service"
- !advance-time {to: 100}
- !scan {}
- !advance-time {to: 110}
- !scan {}
- !advance-time {to: 130}
- !scan {}
