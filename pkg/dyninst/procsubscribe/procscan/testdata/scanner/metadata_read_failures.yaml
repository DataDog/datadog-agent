# The two ways a tracer metadata read can fail are counted apart. A process that
# has not published yet resolves itself, while one we are not allowed to read
# never will and needs someone to look at it.
- !initialize
  current_time: 100
  min_age: 10
  backoff_base: 10
  backoff_cap: 100
- !create-process
  pid: 1001
  start_time: 50
  metadata_error: permission
  tracer_metadata: {language: "go", service: "cannot-read"}
- !create-process
  pid: 1002
  start_time: 50
  metadata_available_at: 1000000
  tracer_metadata: {language: "go", service: "not-published-yet"}
- !scan {}
- !advance-time {to: 110}
- !scan {}
---
command: !initialize
  current_time: 100
  min_age: 10
  backoff_base: 10
  backoff_cap: 100
---
command: !create-process
  pid: 1001
  start_time: 50
  metadata_error: permission
  tracer_metadata: {language: "go", service: "cannot-read"}
---
command: !create-process
  pid: 1002
  start_time: 50
  metadata_available_at: 1000000
  tracer_metadata: {language: "go", service: "not-published-yet"}
---
command: !scan {}
state:
  current_time: 100
  candidates: [{pid: 1001, start_time: 50, exe_ino: 1001, attempts: 1, next_attempt: 110}, {pid: 1002, start_time: 50, exe_ino: 1002, attempts: 1, next_attempt: 110}]
  processes_in_procfs: [1001, 1002]
  metrics: {candidates_evaluated: 2, executables_analyzed: 2, metadata_not_published: 1, metadata_unreadable: 1}
---
command: !advance-time {to: 110}
---
command: !scan {}
state:
  current_time: 110
  candidates: [{pid: 1001, start_time: 50, exe_ino: 1001, attempts: 2, next_attempt: 130}, {pid: 1002, start_time: 50, exe_ino: 1002, attempts: 2, next_attempt: 130}]
  processes_in_procfs: [1001, 1002]
  metrics: {candidates_evaluated: 4, executables_analyzed: 2, metadata_not_published: 2, metadata_unreadable: 2}
