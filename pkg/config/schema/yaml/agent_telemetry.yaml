$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/DataDog/datadog-agent/main/pkg/config/schema/yaml/agent_telemetry.yaml
node_type: section
type: object
properties:
  additional_endpoints:
    node_type: setting
    type: array
    default: []
    items:
      type: object
  batch_max_concurrent_send:
    node_type: setting
    type: integer
    default: 0
  batch_max_content_size:
    node_type: setting
    type: integer
    default: 5000000
  batch_max_size:
    node_type: setting
    type: integer
    default: 1000
  batch_wait:
    node_type: setting
    type: number
    default: 5
  compression_kind:
    node_type: setting
    type: string
    default: zstd
  compression_level:
    node_type: setting
    type: integer
    default: 1
    comment: '... and overridden by the following two lines - do not switch these
      3 lines order'
  connection_reset_interval:
    node_type: setting
    type: integer
    default: 0
  dd_url:
    node_type: setting
    type: string
    default: ''
  dev_mode_no_ssl:
    node_type: setting
    type: boolean
    default: false
    tags:
    - no-env
  dynamic_profiles:
    node_type: section
    type: object
    properties:
      cache_path:
        node_type: setting
        type: string
        default: ''
        comment: |-
          Absolute path of the on-disk dynamic profiles cache. Empty resolves to
          <run_path>/agent-telemetry-dynamic-profiles.json at runtime. A ${run_path}
          schema default cannot be used here: relative-path defaults are
          expanded against the compiled-in default run path (see
          nodetreemodel/relative_path.go), so they ignore a user-set run_path.
      enabled:
        node_type: setting
        type: boolean
        default: true
        comment: |-
          Kill switch for dynamic profiles, the remotely fetched additive
          profiles. Also gated by agent_telemetry.enabled and, through
          pkg/config/utils.IsAgentTelemetryEnabled, by fips.enabled and gov
          sites.
      poll_interval_seconds:
        node_type: setting
        type: integer
        default: 86400
      startup_jitter_seconds:
        node_type: setting
        type: integer
        default: 300
        comment: 'max random delay before the first poll; spreads fleet-wide load'
      url:
        node_type: setting
        type: string
        default: ''
        comment: 'test/staging only; empty means the built-in constant'
  enabled:
    node_type: setting
    type: boolean
    default: true
  errortracking:
    node_type: section
    type: object
    properties:
      bouncer_window_seconds:
        node_type: setting
        type: integer
        default: 900
      buffer_size:
        node_type: setting
        type: integer
        default: 2048
      enabled:
        node_type: setting
        type: boolean
        default: false
        comment: |-
          experimental error log forwarding to telemetry. Use-sites must
          additionally gate on pkg/config/utils.IsAgentTelemetryEnabled so
          gov/FIPS exclusion is inherited from the parent agent_telemetry flag.
      flush_interval_seconds:
        node_type: setting
        type: integer
        default: 60
      shutdown_drain_timeout_seconds:
        node_type: setting
        type: integer
        default: 5
      startup_jitter_seconds:
        node_type: setting
        type: integer
        default: 0
  input_chan_size:
    node_type: setting
    type: integer
    default: 100
  logs_dd_url:
    node_type: setting
    type: string
    default: ''
  logs_no_ssl:
    node_type: setting
    type: boolean
    default: false
  sender_backoff_base:
    node_type: setting
    type: number
    default: 1
  sender_backoff_factor:
    node_type: setting
    type: number
    default: 2
  sender_backoff_max:
    node_type: setting
    type: number
    default: 120
  sender_recovery_interval:
    node_type: setting
    type: integer
    default: 2
  sender_recovery_reset:
    node_type: setting
    type: boolean
    default: false
  startup_trace_sampling:
    node_type: setting
    type: integer
    default: 0
  use_compression:
    node_type: setting
    type: boolean
    default: true
  use_v2_api:
    node_type: setting
    type: boolean
    default: true
  zstd_compression_level:
    node_type: setting
    type: integer
    default: 1
