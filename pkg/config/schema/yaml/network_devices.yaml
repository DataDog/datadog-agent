$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/DataDog/datadog-agent/main/pkg/config/schema/yaml/network_devices.yaml
node_type: section
title: Network Devices Configuration
type: object
visibility: public
description: Configuration related to Network Devices Monitoring
tags:
- template_section:CoreAgent
- full-agent-only:true
properties:
  namespace:
    node_type: setting
    type: string
    default: default
    visibility: public
    description: |-
      Namespace can be used to disambiguate devices with the same IP.
      Changing namespace will cause devices being recreated in NDM app.
      It should contain less than 100 characters and should not contain any of
      `<`, `>`, `\n`, `\t`, `\r` characters.
      This field is used by NDM features (SNMP check, SNMP Traps listener, etc).
  default_scan:
    node_type: section
    type: object
    visibility: public
    description: |-
      Configuration for automatic SNMP device scanning.
      When enabled, discovered SNMP devices are automatically scanned.
    tags:
    - template_section:CoreAgent
    properties:
      enabled:
        node_type: setting
        type: boolean
        default: true
        visibility: public
        description: |-
          Enable automatic scanning of discovered SNMP devices.
          When enabled, devices discovered via autodiscovery or configured
          directly will be scanned to collect OID data.
      excluded_ips:
        node_type: setting
        type: array
        default: []
        items:
          type: string
        visibility: public
        description: |-
          List of IP addresses to exclude from automatic scanning.
          Devices with these IP addresses will be skipped during default scan.
      bulk_batch_size:
        node_type: setting
        type: integer
        default: 20
        visibility: public
        description: |-
          Starting number of values requested per GetBulk call during the automatic
          device scan. The scan adjusts this down on failures and back up on
          successes, so this is the ceiling it works toward.
      flush_every_n_oids:
        node_type: setting
        type: integer
        default: 0
        comment: Internal, undocumented knobs for tuning partial result reporting.
      flush_interval:
        node_type: setting
        type: string
        default: 0s
  autodiscovery:
    node_type: section
    type: object
    visibility: public
    description: |-
      Creates and schedules a listener to automatically discover your SNMP devices.
      Discovered devices can then be monitored with the SNMP integration by using
      the auto_conf.yaml file provided by default.
    tags:
    - template_section:CoreAgent
    properties:
      workers:
        node_type: setting
        type: integer
        default: 2
        visibility: public
        description: |-
          The number of concurrent tasks used to discover SNMP devices. Increasing this value
          discovers devices faster but at the cost of increased resource consumption.
      discovery_interval:
        node_type: setting
        type: integer
        default: 3600
        visibility: public
        description: |-
          How often to discover new SNMP devices, in seconds. Decreasing this value
          discovers devices faster (within the limit of the time taken to scan subnets)
          but at the cost of increased resource consumption.
        comment: |-
          network_devices.autodiscovery has precedence over snmp_listener config
          snmp_listener config is still here for legacy reasons
      discovery_allowed_failures:
        node_type: setting
        type: integer
        default: 3
        visibility: public
        description: |-
          The number of failed requests to a given SNMP device before removing it from the list of monitored
          devices.
          If a device shuts down, the Agent stops monitoring it after `discovery_interval * discovery_allowed_failures` seconds.
      loader:
        node_type: setting
        type: string
        default: core
        visibility: public
        description: |-
          Check loader to use. Available loaders:
          - core: (recommended) Uses new corecheck SNMP integration
          - python: Uses legacy python SNMP integration
      min_collection_interval:
        node_type: setting
        type: integer
        default: 15
        visibility: public
        description: |-
          This changes the collection interval for the check instances created
          from discovered SNMP devices.
          For more information, see:
          https://docs.datadoghq.com/developers/write_agent_check/#collection-interval
      use_device_id_as_hostname:
        node_type: setting
        type: boolean
        default: false
        visibility: public
        description: |-
          Use `device:<DEVICE_ID>` (device_id is composed of `<NAMESPACE>:<DEVICE_IP_ADDRESS>`) as `hostname`
          for metrics and service checks (meaning that metrics and services checks will have
          `host:device:<DEVICE_ID>` as tag).
          This option is needed for custom tags.
        example: 'true'
      collect_topology:
        node_type: setting
        type: boolean
        default: true
        visibility: public
        description: Enable the collection of topology (LLDP/CDP) data
      collect_vpn:
        node_type: setting
        type: boolean
        default: false
        visibility: public
        description: Enable collection of VPN tunnels and route table data
        example: 'true'
      ping:
        node_type: section
        type: object
        visibility: public
        description: |-
          Configure ICMP pings for all hosts in SNMP autodiscovery
          Devices will be pinged with these settings each time the SNMP
          check is run.

          By default, Datadog tries to use an unprivileged UDP socket to send ICMP
          pings, but some Linux systems require using a raw socket.

          If `linux.use_raw_socket` is set, you must enable the `ping` module
          of system-probe for elevated privileges. See
          system-probe.yaml.example for details.
        tags:
        - template_section:CoreAgent
        properties:
          enabled:
            node_type: setting
            type: boolean
            default: false
            visibility: public
            description: Set to true to enable ICMP ping checks for autodiscovered
              SNMP devices.
          timeout:
            node_type: setting
            type: integer
            default: 3000
            visibility: public
            description: Timeout in milliseconds
          count:
            node_type: setting
            type: integer
            default: 2
            visibility: public
            description: Number of ping packets to send per check run
          interval:
            node_type: setting
            type: integer
            default: 10
            visibility: public
            description: Time between sending pings (up to `count` packets) in
              milliseconds
          linux:
            node_type: section
            type: object
            visibility: public
            description: Linux-specific configuration
            tags:
            - template_section:CoreAgent
            properties:
              use_raw_socket:
                node_type: setting
                type: boolean
                default: false
                visibility: public
                description: |-
                  Send pings in a privileged fashion using a raw socket.
                  This may be required if your system doesn't support sending pings in an unprivileged fashion (using a UDP
                  socket).
                  If `use_raw_socket` is set to true, you MUST also enable system-probe which has elevated privileges. To
                  enable it, see system-probe.yaml.example.
                example: 'true'
      use_deduplication:
        node_type: setting
        type: boolean
        default: false
        visibility: public
        description: |-
          Deduplicate IP addresses corresponding to the same device.
          The deduplication logic is based on the sysName, sysDesc, sysObjectID and sysUptime
      oid_batch_size:
        node_type: setting
        type: integer
        default: 5
        visibility: public
        description: |-
          The number of OIDs handled by each batch for all hosts in SNMP autodiscovery.
          Applies to all configurations if not overridden.
          By default, devices dynamically tune their batch size to optimize performance (agent version v7.73+).
      timeout:
        node_type: setting
        type: integer
        default: 5
        visibility: public
        description: The number of seconds before timing out. Applies to all configurations
          if not overridden.
      retries:
        node_type: setting
        type: integer
        default: 3
        visibility: public
        description: The number of retries before failure. Applies to all configurations
          if not overridden.
      configs:
        node_type: setting
        type: array
        default: []
        items:
          type: object
        visibility: public
        description: |-
          The actual list of configurations used to discover SNMP devices in various subnets.
          Example:
          configs:
           - network_address: 10.0.0.0/24
             authentications:
               - snmp_version: 1
                 community_string: public
           - network_address: 10.0.1.0/28
             authentications:
               - community_string: public
             ignored_ip_addresses:
               - 10.0.1.0
               - 10.0.1.1
        example: |2-

            # @param network_address - string - required
            # The subnet in CIDR format to scan for SNMP devices.
            # All unignored IP addresses in the CIDR range are scanned.
            # For optimal discovery time, be sure to use the smallest network mask
            # possible as is appropriate for your network topology.
            # Ex: 10.0.1.0/24

            - network_address: <NETWORK>

              # @param ignored_ip_addresses - list of strings - optional - default: []
              # A list of IP addresses to ignore when scanning the network.

              ignored_ip_addresses:
                - <IP_ADDRESS_1>
                - <IP_ADDRESS_2>

              # @param port - integer - optional - default: 161
              # The UDP port to use when connecting to SNMP devices.

              port: 161

              # @param timeout - integer - optional - default: 5
              # The number of seconds before timing out. Applies to all authentications if not overridden.

              # timeout: 5

              # @param retries - integer - optional - default: 3
              # The number of retries before failure. Applies to all authentications if not overridden.

              # retries: 3

              # @param authentications - list of custom objects - optional
              # A list of authentication configurations to try when connecting to your SNMP devices.
              # The Agent tries each configuration until it successfully connects.
              # Example:
              # authentications:
              #   - community_string: public-1
              #   - user: myUser
              #     authKey: myAuthKey
              #   - community_string: public-2

              authentications:
                # @param snmp_version - integer - optional - default: <BEST_GUESS>
                # Set the version of the SNMP protocol. Available options are: `1`, `2` or `3`.
                # If unset, the Agent tries to guess the correct version based on other configuration
                # parameters, for example: if `user` is set, the Agent uses SNMP v3.

                - snmp_version: <VERSION>

                  # @param timeout - integer - optional - default: 5
                  # The number of seconds before timing out.

                  # timeout: 5

                  # @param retries - integer - optional - default: 3
                  # The number of retries before failure.

                  # retries: 3

                  # @param community_string - string - optional
                  # Required for SNMP v1 & v2.
                  # Enclose the community string with single quote like below (to avoid special characters being interpreted).
                  # Ex: 'public'

                  community_string: '<COMMUNITY>'

                  # @param user - string - optional
                  # The username to connect to your SNMP devices.
                  # SNMPv3 only.

                  user: <USERNAME>

                  # @param authKey - string - optional
                  # The passphrase to use with your Authentication type.
                  # SNMPv3 only.

                  authKey: <AUTHENTICATION_KEY>

                  # @param authProtocol - string - optional
                  # The authentication protocol to use when connecting to your SNMP devices.
                  # Available options are: MD5, SHA, SHA224, SHA256, SHA384, SHA512
                  # Defaults to MD5 when `authentication_key` is specified, or SHA256 in FIPS mode.
                  # SNMPv3 only.

                  authProtocol: <AUTHENTICATION_PROTOCOL>

                  # @param privKey - string - optional
                  # The passphrase to use with your privacy protocol.
                  # SNMPv3 only.

                  privKey: <PRIVACY_KEY>

                  # @param privProtocol - string - optional
                  # The privacy protocol to use when connecting to your SNMP devices.
                  # Available options are: DES, AES (128 bits), AES192, AES192C, AES256, AES256C
                  # Defaults to DES when `privacy_key` is specified, or AES in FIPS mode.
                  # SNMPv3 only.

                  privProtocol: <PRIVACY_PROTOCOL>

                  # @param context_name - string - optional
                  # The name of your context (optional SNMP v3-only parameter).

                  context_name: <CONTEXT_NAME>

              # @param tags - list of strings - optional - default: []
              # A list of tags to attach to every metric and service check of all devices discovered in the subnet.
              #
              # Learn more about tagging at https://docs.datadoghq.com/tagging

              tags:
                - <KEY_1>:<VALUE_1>
                - <KEY_2>:<VALUE_2>

              # @param ad_identifier - string - optional - default: snmp
              # A unique identifier to attach to devices from that subnetwork.
              # When configuring the SNMP integration in snmp.d/auto_conf.yaml,
              # specify the corresponding ad_identifier at the top of the file.

              ad_identifier: snmp

              # @param loader - string - optional - default: core
              # Check loader to use. Available loaders:
              # - core: (recommended) Uses new corecheck SNMP integration
              # - python: Uses legacy python SNMP integration

              loader: core

              # @param min_collection_interval - number - optional - default: 15
              # This changes the collection interval for the check instances created from
              # discovered SNMP devices. It applies to each specific config from `snmp_listener.configs`
              # and has precedence over `snmp_listener.min_collection_interval`.
              # For more information, see:
              # https://docs.datadoghq.com/developers/write_agent_check/#collection-interval

              min_collection_interval: 15

              # @param use_device_id_as_hostname - boolean - optional - default: false
              # Use `device:<DEVICE_ID>` (device_id is composed of `<NAMESPACE>:<DEVICE_IP_ADDRESS>`) as `hostname`
              # for metrics and service checks (meaning that metrics and services checks will have
              # `host:device:<DEVICE_ID>` as tag).
              # This option is needed for custom tags.

              use_device_id_as_hostname: true

              # @param oid_batch_size - integer - optional - default: 5
              # The number of OIDs handled by each batch.

              oid_batch_size: 5

              # @param interface_configs - map - optional
              # This option is used to override interface inbound/outbound speed, add interface tags, or disable monitoring for specific interfaces
              # Example:
              # interface_configs:
              #   "10.0.0.1":              # target device IP address
              #     - match_field: "name"  # (required) the field to match, can be `name` (interface name) or `index` (ifIndex)
              #       match_value: "eth0"  # (required) the value to match
              #       in_speed: 50         # (optional) inbound speed value in bits per sec, no value or 0 means no override
              #       out_speed: 25        # (optional) outbound speed value in bits per sec, no value or 0 means no override
              #       tags:                # (optional) interface level tags
              #         - "testTagKey:testTagValue"
              #         - "tagKey2:tagValue2"
              #       disabled: true         # (optional) disables monitoring for matched interfaces, default value is false

              interface_configs:
                "10.0.0.1":
                  - match_field: name
                    match_value: eth0
                    in_speed: 50
                    out_speed: 25
                  - match_field: index
                    match_value: '10'
                    in_speed: 50
                    out_speed: 25
                "10.0.0.2":
                  - match_field: name
                    match_value: eth3
                    in_speed: 50
                    out_speed: 25
                "10.0.0.3":
                  - match_field: name
                    match_value: eth4
                    tags:
                      - "monitored:true"
                      - "customKey:customValue"
                "10.0.0.4":
                  - match_field: index
                    match_value: '2'
                    disabled: true
      allowed_failures:
        node_type: setting
        type: integer
        default: 3
      collect_device_metadata:
        node_type: setting
        type: boolean
        default: true
      namespace:
        node_type: setting
        type: string
        default: default
  snmp_traps:
    node_type: section
    type: object
    visibility: public
    description: |-
      This section configures SNMP traps collection.
      Traps are forwarded as logs and can be found in the logs explorer with a source:snmp-traps query
    tags:
    - template_section:CoreAgent
    properties:
      enabled:
        node_type: setting
        type: boolean
        default: false
        visibility: public
        description: Set to true to enable collection of traps.
      port:
        node_type: setting
        type: integer
        default: 9162
        visibility: public
        description: |-
          The UDP port to use when listening for incoming trap packets.
          Because the Datadog Agent does not run as root, the port cannot be below 1024.
          However, if you run `sudo setcap 'cap_net_bind_service=+ep' /opt/datadog-agent/bin/agent/agent`,
          the Datadog Agent can listen on ports below 1024.
      community_strings:
        node_type: setting
        type: array
        default: []
        items:
          type: string
        visibility: public
        description: |-
          A list of known SNMP community strings that devices can use to send traps to the Agent.
          Traps with an unknown community string are ignored.
          Enclose the community string with single quote like below (to avoid special characters being interpreted).
          Must be non-empty.
        example: |2-

            - '<COMMUNITY_1>'
            - '<COMMUNITY_2>'
      users:
        node_type: setting
        type: array
        default: []
        items:
          additionalProperties:
            type: string
          type: object
        visibility: public
        description: |-
          List of SNMPv3 users that can be used to listen for traps.
          Each user can contain:
           * user         - string - The username used by devices when sending Traps to the Agent.
           * authKey      - string - (Optional) The passphrase to use with the given user and authProtocol
           * authProtocol - string - (Optional) The authentication protocol to use when listening for traps from this user.
                                     Available options are: MD5, SHA, SHA224, SHA256, SHA384, SHA512.
                                     Defaults to MD5 when authKey is set.
           * privKey      - string - (Optional) The passphrase to use with the given user privacy protocol.
           * privProtocol - string - (Optional) The privacy protocol to use when listening for traps from this user.
                                     Available options are: DES, AES (128 bits), AES192, AES192C, AES256, AES256C.
                                     Defaults to DES when privKey is set.
        example: |2-

            - user: <USERNAME>
              authKey: <AUTHENTICATION_KEY>
              authProtocol: <AUTHENTICATION_PROTOCOL>
              privKey: <PRIVACY_KEY>
              privProtocol: <PRIVACY_PROTOCOL>
      bind_host:
        node_type: setting
        type: string
        default: 0.0.0.0
        visibility: public
        description: |-
          The hostname to listen on for incoming trap packets.
          Binds to 0.0.0.0 by default (accepting all packets).
      stop_timeout:
        node_type: setting
        type: integer
        default: 5
        visibility: public
        description: The maximum number of seconds to wait for the trap server
          to stop when the Agent shuts down.
        comment: in seconds
      tags:
        node_type: setting
        type: array
        default: []
        items:
          type: string
        visibility: public
        description: A list of low-cardinality tags (e.g. application, team, environment)
          attached to every trap forwarded to Datadog and to every SNMP traps
          telemetry metric emitted by the Agent.
        example: |2-

            - "application:<APPLICATION_ID>"
            - "team:<TEAM_NAME>"
      forwarder:
        node_type: section
        type: object
        properties:
          additional_endpoints:
            node_type: setting
            type: array
            default: []
            items:
              type: object
          batch_max_concurrent_send:
            node_type: setting
            type: integer
            default: 0
          batch_max_content_size:
            node_type: setting
            type: integer
            default: 5000000
          batch_max_size:
            node_type: setting
            type: integer
            default: 1000
          batch_wait:
            node_type: setting
            type: number
            default: 5
          compression_kind:
            node_type: setting
            type: string
            default: zstd
          compression_level:
            node_type: setting
            type: integer
            default: 6
          connection_reset_interval:
            node_type: setting
            type: integer
            default: 0
          dd_url:
            node_type: setting
            type: string
            default: ''
          dev_mode_no_ssl:
            node_type: setting
            type: boolean
            default: false
            tags:
            - no-env
          input_chan_size:
            node_type: setting
            type: integer
            default: 100
          logs_dd_url:
            node_type: setting
            type: string
            default: ''
          logs_no_ssl:
            node_type: setting
            type: boolean
            default: false
          sender_backoff_base:
            node_type: setting
            type: number
            default: 1
          sender_backoff_factor:
            node_type: setting
            type: number
            default: 2
          sender_backoff_max:
            node_type: setting
            type: number
            default: 120
          sender_recovery_interval:
            node_type: setting
            type: integer
            default: 2
          sender_recovery_reset:
            node_type: setting
            type: boolean
            default: false
          use_compression:
            node_type: setting
            type: boolean
            default: true
          use_v2_api:
            node_type: setting
            type: boolean
            default: true
          zstd_compression_level:
            node_type: setting
            type: integer
            default: 1
  netflow:
    node_type: section
    type: object
    visibility: public
    description: This section configures NDM NetFlow (and sFlow, IPFIX) collection.
    tags:
    - template_section:CoreAgent
    properties:
      enabled:
        node_type: setting
        type: boolean
        default: false
        visibility: public
        description: Set to true to enable collection of NetFlow traffic.
      listeners:
        node_type: setting
        type: array
        default: []
        items:
          type: object
        visibility: public
        description: |-
          This section configures one or more listeners ports that will receive flow traffic.
          Each listener have the following options:
           * flow_type    - string - The flow type correspond to the incoming flow protocol.
                                     Choices are: netflow5, netflow9, ipfix, sflow5
           * port         - string - (Optional) The port used to receive incoming flow traffic.
                                     Default port differ by flow type: netflow5(2055), netflow9(2055), ipfix(4739), sflow5(6343)
           * bind_host    - string - (Optional) The hostname to listen on for incoming netflow packets.
                                     Binds to 0.0.0.0 by default (accepting all packets).
           * workers      - integer - (Optional) Number of workers to use for this listener.
                                     Defaults to 1.
           * mapping      - (Optional) List of NetflowV9/IPFIX fields to additionally collect.
                                       Defaults to None.
              * field       - integer - The Netflow field type ID to collect.
              * destination - string  - Name of the collected field, is queryable under @<destination> in Datadog.
                                       Default fields can be overridden, for example, `destination.port` overrides
                                       the default destination port collected.
              * type        - string  - The field type.
                                       Available options are: string, integer, hex.
                                       Defaults to hex.
              * endianness  - string  - (Optional) If type is integer, endianness can be set using this parameter.
                                       Available options are: big, little.
                                       Defaults to big.
        example: |2-

            - flow_type: netflow9
              port: 2055
              mapping:
                - field: 1234
                  destination: transport_rtp_ssrc
                  type: integer
            - flow_type: netflow5
              port: 2056
            - flow_type: ipfix
              port: 4739
            - flow_type: sflow5
              port: 6343
        tags:
        - no-env
      stop_timeout:
        node_type: setting
        type: integer
        default: 5
        visibility: public
        description: The maximum number of seconds to wait for the NetFlow listeners
          to stop when the Agent shuts down.
      reverse_dns_enrichment_enabled:
        node_type: setting
        type: boolean
        default: false
        visibility: public
        description: Set to true to enable reverse DNS enrichment of private source
          and destination IP addresses in NetFlow records.
      aggregator_buffer_size:
        node_type: setting
        type: integer
        default: 10000
      aggregator_flow_context_ttl:
        node_type: setting
        type: integer
        default: 0
        comment: |-
          The default behavior for this value is to copy the "aggregator_flush_interval" when absent/zero. This is to avoid
          expiring flows too early when the flush interval is increased, while still allowing to set a custom TTL when needed.
      aggregator_flush_interval:
        node_type: setting
        type: integer
        default: 300
      aggregator_port_rollup_threshold:
        node_type: setting
        type: integer
        default: 10
      aggregator_rollup_tracker_refresh_interval:
        node_type: setting
        type: integer
        default: 300
      forwarder:
        node_type: section
        type: object
        properties:
          additional_endpoints:
            node_type: setting
            type: array
            default: []
            items:
              type: object
          batch_max_concurrent_send:
            node_type: setting
            type: integer
            default: 0
          batch_max_content_size:
            node_type: setting
            type: integer
            default: 5000000
          batch_max_size:
            node_type: setting
            type: integer
            default: 1000
          batch_wait:
            node_type: setting
            type: number
            default: 5
          compression_kind:
            node_type: setting
            type: string
            default: zstd
          compression_level:
            node_type: setting
            type: integer
            default: 6
          connection_reset_interval:
            node_type: setting
            type: integer
            default: 0
          dd_url:
            node_type: setting
            type: string
            default: ''
          dev_mode_no_ssl:
            node_type: setting
            type: boolean
            default: false
            tags:
            - no-env
          input_chan_size:
            node_type: setting
            type: integer
            default: 100
          logs_dd_url:
            node_type: setting
            type: string
            default: ''
          logs_no_ssl:
            node_type: setting
            type: boolean
            default: false
          sender_backoff_base:
            node_type: setting
            type: number
            default: 1
          sender_backoff_factor:
            node_type: setting
            type: number
            default: 2
          sender_backoff_max:
            node_type: setting
            type: number
            default: 120
          sender_recovery_interval:
            node_type: setting
            type: integer
            default: 2
          sender_recovery_reset:
            node_type: setting
            type: boolean
            default: false
          use_compression:
            node_type: setting
            type: boolean
            default: true
          use_v2_api:
            node_type: setting
            type: boolean
            default: true
