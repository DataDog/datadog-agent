$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/DataDog/datadog-agent/main/pkg/config/schema/yaml/remote_queries.yaml
node_type: section
title: Remote Queries
type: object
visibility: public
description: Remote query execution by supporting loaded integration checks.
tags:
- full-agent-only:true
properties:
  enabled:
    node_type: setting
    type: boolean
    default: false
    visibility: public
    description: |-
      Enables remote queries over the authenticated local Agent IPC channel.
      The Agent derives the upload destination from its local site setting;
      remote callers cannot supply an upload URL or credentials.
      The Private Action Runner must also allow
      com.datadoghq.remoteaction.integrations.runQuery in its actions_allowlist.
  tunnel:
    node_type: section
    type: object
    description: Experimental Remote Queries over the Remote Config x509 tunnel.
    properties:
      execute_enabled:
        node_type: setting
        type: boolean
        default: false
        visibility: public
        description: |-
          Experimental, for staging validation. Set to true, together with remote_queries.enabled,
          remote_configuration.enabled, remote_configuration.x509.enabled and a positive
          remote_queries.tunnel.org_id, to register the Remote Queries Execute handler on the x509
          Remote Configuration client. Remote Config authorizes who may call Execute. The Agent
          additionally requires each request to name its own live connection (as observed from the
          handshake) and the configured org ID. If org_id is not positive, the Agent logs an error and
          registers nothing. While the handler is registered, the Agent sets the check inventory
          metadata key remote_queries.tunnel_connection_id to the current connection ID on every
          loaded check instance that serves remote queries.
      org_id:
        node_type: setting
        type: integer
        default: 0
        visibility: public
        description: |-
          The Datadog org ID that Remote Queries Execute requests over the x509 tunnel must name.
          Must be positive when remote_queries.tunnel.execute_enabled is true. Operator-configured:
          it is never taken from the request.
