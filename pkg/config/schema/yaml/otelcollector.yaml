$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/DataDog/datadog-agent/main/pkg/config/schema/yaml/otelcollector.yaml
node_type: section
type: object
properties:
  converter:
    node_type: section
    type: object
    properties:
      enabled:
        node_type: setting
        type: boolean
        default: true
      features:
        node_type: setting
        type: array
        default:
        - infraattributes
        - prometheus
        - pprof
        - zpages
        - health_check
        - ddflare
        - datadog
        - cumulativetodelta
        items:
          type: string
        env_parser: comma_and_space_separated
  enabled:
    node_type: setting
    type: boolean
    default: false
  extension_timeout:
    node_type: setting
    type: integer
    default: 0
    comment: in seconds, 0 for default value
  extension_url:
    node_type: setting
    type: string
    default: https://localhost:7777
  flare:
    node_type: section
    type: object
    properties:
      timeout:
        node_type: setting
        type: integer
        default: 60
  gateway:
    node_type: section
    type: object
    properties:
      mode:
        node_type: setting
        type: boolean
        default: false
  installation_method:
    node_type: setting
    type: string
    default: ''
  standalone:
    node_type: section
    type: object
    properties:
      node_from_env_var:
        node_type: setting
        type: string
        default: K8S_NODE_NAME,DD_KUBERNETES_KUBELET_NODENAME,OTEL_K8S_NODE_NAME
        comment: comma-separated names of the environment variables the nodefilter workloadmeta collector reads the local node's name from, the first one that is set winning; extends k8sattributesprocessor's own node_from_env_var filter config, which takes a single name
      use_kubelet_collector:
        node_type: setting
        type: boolean
        default: false
        comment: opt out of the nodefilter workloadmeta collector and fall back to kubelet in DDOT standalone mode
  submit_dummy_metadata:
    node_type: setting
    type: boolean
    default: false
    comment: dev flag - to be removed
