apiVersion: batch/v1
kind: Job
metadata:
  managedFields:
  - manager: kubectl
    operation: Apply
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: secret
  labels:
    app: name
    tags.datadoghq.com/env: prod
  name: batch-v1-jobs
  namespace: default
  resourceVersion: "1"
  uid: batch_v1_jobs
spec:
  template:
    spec:
      containers:
      - env:
        - name: PASSWORD
          value: secret
        - name: REGION
          value: us-east-1
        image: image
        name: c
