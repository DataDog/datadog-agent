apiVersion: apps/v1
kind: DaemonSet
metadata:
  managedFields:
  - manager: kubectl
    operation: Apply
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: secret
  labels:
    app: name
    tags.datadoghq.com/env: prod
  name: apps-v1-daemonsets
  namespace: default
  resourceVersion: "1"
  uid: apps_v1_daemonsets
spec:
  template:
    spec:
      containers:
      - env:
        - name: PASSWORD
          value: secret
        - name: REGION
          value: us-east-1
        image: image
        name: c
status:
  currentNumberScheduled: 0
  desiredNumberScheduled: 0
  numberMisscheduled: 0
  numberReady: 0
