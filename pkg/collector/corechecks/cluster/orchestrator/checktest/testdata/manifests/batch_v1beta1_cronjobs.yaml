apiVersion: batch/v1beta1
kind: CronJob
metadata:
  managedFields:
  - manager: kubectl
    operation: Apply
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: secret
  labels:
    app: name
    tags.datadoghq.com/env: prod
  name: batch-v1beta1-cronjobs
  namespace: default
  resourceVersion: "1"
  uid: batch_v1beta1_cronjobs
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - env:
            - name: PASSWORD
              value: secret
            - name: REGION
              value: us-east-1
            image: image
            name: c
  schedule: ""
