apiVersion: v1
kind: Pod
metadata:
  managedFields:
  - manager: kubectl
    operation: Apply
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: secret
  labels:
    app: name
    tags.datadoghq.com/env: prod
  name: v1-pods
  namespace: default
  resourceVersion: "1"
  uid: v1_pods
spec:
  containers:
  - env:
    - name: PASSWORD
      value: secret
    - name: REGION
      value: us-east-1
    image: image
    name: c
