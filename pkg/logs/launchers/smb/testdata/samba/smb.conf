# Samba configuration of the SMB log source integration tests (see Dockerfile).
[global]
   server role = standalone server
   workgroup = WORKGROUP
   security = user
   passdb backend = tdbsam
   # Refuse guest and anonymous sessions: a wrong password must fail with
   # STATUS_LOGON_FAILURE, as it does on Windows and Azure Files.
   map to guest = never
   restrict anonymous = 2
   # The SMB client of the log source requires signing; require it here too,
   # so the tests fail if the client ever stops signing.
   server signing = mandatory
   server min protocol = SMB2_10
   smb ports = 445
   disable netbios = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1

[logs]
   path = /srv/logs
   read only = no
   browseable = yes
   guest ok = no
   valid users = smbtest
   force user = smbtest
   create mask = 0644
   directory mask = 0755
