type: agent_rule
name: test_credential_access
expression: |-
  open.file.path in TEST_CREDENTIAL_PATHS && open.flags & TEST_WRITE_FLAGS > 0
description: a pattern macro, including a `**` glob, and a flags macro
osFilter: linux
tests:
  - description: writing a docker config
    data:
      type: open
      values:
        "open.file.path": "/home/user/.docker/config.json"
        "open.flags": 577
    expected: true
  - description: a `**` member, which only a glob can express
    data:
      type: open
      values:
        "open.file.path": "/etc/security/opasswd/shadow"
        "open.flags": 577
    expected: true
  - description: reading it rather than writing
    data:
      type: open
      values:
        "open.file.path": "/home/user/.docker/config.json"
        "open.flags": 0
    expected: false
