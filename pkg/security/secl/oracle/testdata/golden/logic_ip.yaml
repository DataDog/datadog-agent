cidr_variable_vs_dns_ips:
    load_errors:
        - |-
          rule `r1` error: rule syntax error: string expected: 1:21: dns.response.ips == ${vip}
                              ^
        - |-
          rule `r2` error: rule syntax error: string expected: 1:21: dns.response.ips != ${vip}
                              ^
        - |-
          rule `r3` error: rule syntax error: array of *eval.CIDRArrayEvaluator expected: 1:11: ${vip} in dns.response.ips
                    ^
        - |-
          rule `r4` error: rule syntax error: array of *eval.CIDRArrayEvaluator expected: 1:15: ${vip} not in dns.response.ips
                        ^
        - |-
          rule `r5` error: rule syntax error: string expected: 1:21: dns.response.ips == ${vip} && dns.id == 1
                              ^
    rules:
        setter:
            event_type: connect
            fields:
                - connect.addr.ip
                - connect.addr.port
            field_values:
                connect.addr.ip:
                    - ip:10.0.0.0/8
                    - ip:192.168.0.0/16
                connect.addr.port:
                    - scalar:1
    approvers:
        connect:
            approvers:
                connect.addr.port:
                    - scalar:1
            field_stats:
                connect.addr.port: 1
    discarders_report:
        connect.addr.ip: supported
        connect.addr.port: supported
    event_types:
        - connect
    field_values:
        connect.addr.ip:
            - ip:10.0.0.0/8
            - ip:192.168.0.0/16
        connect.addr.port:
            - scalar:1
    policies:
        - policy0(oracle) internal_type= type= version= replace= [r1 r2 r3 r4 r5 setter]
    rule_ids:
        - setter
    approvers_all:
        - field_stats connect.addr.port=1
    policy_rules:
        - policy0/setter accepted=true disabled=false expression="connect.addr.ip in [10.0.0.0/8, 192.168.0.0/16] && connect.addr.port == 1" tags=[] product_tags=[] every= actions=1 policy=policy0 modified_by=[] used_by=[policy0] enable_count=0
        - policy0/r1 accepted=true disabled=false expression="dns.response.ips == ${vip}" tags=[] product_tags=[] every= actions=0 policy=policy0 modified_by=[] used_by=[policy0] enable_count=0
        - policy0/r2 accepted=true disabled=false expression="dns.response.ips != ${vip}" tags=[] product_tags=[] every= actions=0 policy=policy0 modified_by=[] used_by=[policy0] enable_count=0
        - policy0/r3 accepted=true disabled=false expression="${vip} in dns.response.ips" tags=[] product_tags=[] every= actions=0 policy=policy0 modified_by=[] used_by=[policy0] enable_count=0
        - policy0/r4 accepted=true disabled=false expression="${vip} not in dns.response.ips" tags=[] product_tags=[] every= actions=0 policy=policy0 modified_by=[] used_by=[policy0] enable_count=0
        - policy0/r5 accepted=true disabled=false expression="dns.response.ips == ${vip} && dns.id == 1" tags=[] product_tags=[] every= actions=0 policy=policy0 modified_by=[] used_by=[policy0] enable_count=0
    steps:
        - result: true
          matched:
            - setter
          second_listener:
            - setter
          matching_values:
            setter:
                - connect.addr.port=1@51+17
                - =1@72+1
                - connect.addr.ip=10.1.1.1/32@0+15
                - =10.0.0.0/8@20+10
          partials:
            setter:
                connect.addr.ip: "true"
                connect.addr.port: "true"
          scoped_counts:
            process.pid: 0
          variables:
            process.pid: 0(true) own=0(true)
            vip: '[10.1.1.1/32](true)'
        - result: false
          scoped_counts:
            process.pid: 0
          variables:
            process.pid: 0(true) own=0(true)
            vip: '[10.1.1.1/32](true)'
        - result: false
          scoped_counts:
            process.pid: 0
          variables:
            process.pid: 0(true) own=0(true)
            vip: '[10.1.1.1/32](true)'
        - result: false
          scoped_counts:
            process.pid: 0
          variables:
            process.pid: 0(true) own=0(true)
            vip: '[10.1.1.1/32](true)'
        - result: false
          scoped_counts:
            process.pid: 0
          variables:
            process.pid: 0(true) own=0(true)
            vip: '[10.1.1.1/32](true)'
        - result: false
          scoped_counts:
            process.pid: 0
          variables:
            process.pid: 0(true) own=0(true)
            vip: '[10.1.1.1/32](true)'
        - result: true
          matched:
            - setter
          second_listener:
            - setter
          matching_values:
            setter:
                - connect.addr.port=1@51+17
                - =1@72+1
                - connect.addr.ip=192.168.3.4/32@0+15
                - =192.168.0.0/16@32+14
          partials:
            setter:
                connect.addr.ip: "true"
