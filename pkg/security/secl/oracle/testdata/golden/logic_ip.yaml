          scoped_counts:
            process.pid: 0
          variables:
            process.pid: 0(true) own=0(true)
            vip: '[10.1.1.1/32 192.168.3.4/32](true)'
        - result: false
          scoped_counts:
            process.pid: 0
          variables:
            process.pid: 0(true) own=0(true)
            vip: '[10.1.1.1/32 192.168.3.4/32](true)'
