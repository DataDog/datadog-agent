    steps:
        - result: true
          matched:
            - first
            - second
          second_listener:
            - second
          matching_values:
            first:
                - open.file.path="/etc/passwd"@0+14
                - ="/etc/passwd"@18+13
            second:
                - open.file.path="/etc/passwd"@0+14
                - ="/etc/passwd"@18+13
          partials:
            first:
                open.file.path: "true"
            second:
                open.file.path: "true"
                open.flags: "true"
          scoped_counts:
            process.pid: 0
          variables:
            process.pid: 0(true) own=0(true)
        - result: true
          matched:
            - second
          second_listener:
            - second
          matching_values:
            second:
                - open.flags=1@35+10
                - =1@49+1
          partials:
            first:
                open.file.path: "false"
            second:
                open.file.path: "true"
                open.flags: "true"
          scoped_counts:
            process.pid: 0
          variables:
            process.pid: 0(true) own=0(true)
        - result: true
          matched:
            - chmod_rule
          second_listener:
            - chmod_rule
          matching_values:
            chmod_rule:
                - chmod.file.path="/tmp/x"@0+15
                - ="/tmp/x"@19+8
          partials:
            chmod_rule:
                chmod.file.path: "true"
          scoped_counts:
