listener_reject_and_rule_ids:
    rules:
        chmod_rule:
            event_type: chmod
            fields:
                - chmod.file.path
            field_values:
                chmod.file.path:
                    - scalar:"/tmp/x"
        first:
            event_type: open
            fields:
                - open.file.path
            field_values:
                open.file.path:
                    - scalar:"/etc/passwd"
        second:
            event_type: open
            fields:
                - open.file.path
                - open.flags
            field_values:
                open.file.path:
                    - scalar:"/etc/passwd"
                open.flags:
                    - scalar:1
    approvers:
        chmod:
            approvers:
                chmod.file.path:
                    - scalar:"/tmp/x"
            field_stats:
                chmod.file.path: 1
        open:
            accept_mode: second
            field_stats:
                open.file.path: 1
    discarders_report:
        chmod.file.path: supported
        open.file.path: supported
        open.flags: 'invalid: first'
    event_types:
        - chmod
        - open
    field_values:
        chmod.file.path:
            - scalar:"/tmp/x"
        open.file.path:
            - scalar:"/etc/passwd"
            - scalar:"/etc/passwd"
        open.flags:
            - scalar:1
    policies:
        - policy0(oracle) internal_type= type= version= replace= [chmod_rule first second]
    rule_ids:
        - chmod_rule
        - first
        - second
    approvers_all:
        - accept_mode open=second
        - field_stats chmod.file.path=1
        - field_stats open.file.path=1
    policy_rules:
        - policy0/first accepted=true disabled=false expression="open.file.path == \"/etc/passwd\"" tags=[] product_tags=[] every= actions=0 policy=policy0 modified_by=[] used_by=[policy0] enable_count=0
        - policy0/second accepted=true disabled=false expression="open.file.path == \"/etc/passwd\" || open.flags == 1" tags=[] product_tags=[] every= actions=0 policy=policy0 modified_by=[] used_by=[policy0] enable_count=0
