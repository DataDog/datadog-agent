expression_macro_bool:
    rules:
        either:
            event_type: open
            fields:
                - open.file.path
                - open.flags
                - process.uid
        not_root:
            event_type: open
            fields:
                - open.file.path
                - open.file.path
                - open.flags
                - process.uid
            field_values:
                open.file.path:
                    - scalar:""
                    - scalar:""
        root_tmp:
            event_type: open
            fields:
                - open.file.path
                - open.file.path
                - open.flags
                - process.uid
            field_values:
                open.file.path:
                    - scalar:""
                    - scalar:""
        write_not_tmp:
            event_type: open
            fields:
                - open.file.path
                - open.flags
                - process.uid
    approvers:
        open:
            accept_mode: root_tmp
    discarders_report:
        open.file.path: supported
    event_types:
        - open
    macro_ids:
        - is_root
        - tmp_file
        - write_flag
    field_values:
        open.file.path:
            - scalar:""
            - scalar:""
    policies:
        - policy0(oracle) internal_type= type= version= replace= [either not_root root_tmp write_not_tmp]
    rule_ids:
        - either
        - not_root
        - root_tmp
        - write_not_tmp
    approvers_all:
        - accept_mode open=root_tmp
    policy_rules:
        - policy0/root_tmp accepted=true disabled=false expression="open.file.path != \"\" && is_root && tmp_file" tags=[] product_tags=[] every= actions=0 policy=policy0 modified_by=[] used_by=[policy0] enable_count=0
        - policy0/not_root accepted=true disabled=false expression="open.file.path != \"\" && !is_root" tags=[] product_tags=[] every= actions=0 policy=policy0 modified_by=[] used_by=[policy0] enable_count=0
        - policy0/write_not_tmp accepted=true disabled=false expression="write_flag && !tmp_file" tags=[] product_tags=[] every= actions=0 policy=policy0 modified_by=[] used_by=[policy0] enable_count=0
        - policy0/either accepted=true disabled=false expression="is_root || write_flag" tags=[] product_tags=[] every= actions=0 policy=policy0 modified_by=[] used_by=[policy0] enable_count=0
    steps:
        - result: true
          matched:
            - root_tmp
            - either
          second_listener:
            - root_tmp
            - either
          matching_values:
            root_tmp:
                - open.file.path="/tmp/a"@0+14
          partials:
            either:
                open.file.path: "true"
                open.flags: "true"
                process.uid: "true"
            not_root:
                open.file.path: "true"
                open.flags: "true"
                process.uid: "false"
            root_tmp:
                open.file.path: "true"
                open.flags: "true"
                process.uid: "true"
            write_not_tmp:
                open.file.path: "false"
                open.flags: "false"
                process.uid: "true"
          scoped_counts:
            process.pid: 0
          variables:
            process.pid: 1(true) own=1(true)
        - result: true
          matched:
            - not_root
          second_listener:
            - not_root
          partials:
            either:
                open.file.path: "true"
                open.flags: "true"
                process.uid: "true"
            not_root:
                open.file.path: "true"
                open.flags: "true"
                process.uid: "true"
            root_tmp:
                open.file.path: "true"
                open.flags: "true"
                process.uid: "false"
            write_not_tmp:
                open.file.path: "false"
                open.flags: "false"
                process.uid: "true"
          scoped_counts:
            process.pid: 0
          variables:
            process.pid: 20(true) own=20(true)
        - result: true
          matched:
            - not_root
            - write_not_tmp
            - either
          second_listener:
            - not_root
            - write_not_tmp
            - either
          partials:
            either:
                open.file.path: "true"
                open.flags: "true"
                process.uid: "true"
            not_root:
                open.file.path: "true"
                open.flags: "true"
                process.uid: "true"
            root_tmp:
                open.file.path: "false"
                open.flags: "true"
                process.uid: "false"
            write_not_tmp:
                open.file.path: "true"
                open.flags: "true"
                process.uid: "true"
          scoped_counts:
            process.pid: 0
          variables:
            process.pid: 20(true) own=20(true)
        - result: true
          matched:
            - not_root
            - either
          second_listener:
            - not_root
            - either
          partials:
            either:
                open.file.path: "true"
                open.flags: "true"
                process.uid: "true"
            not_root:
                open.file.path: "true"
                open.flags: "true"
                process.uid: "true"
            root_tmp:
                open.file.path: "true"
                open.flags: "true"
                process.uid: "false"
            write_not_tmp:
                open.file.path: "false"
                open.flags: "true"
                process.uid: "true"
          scoped_counts:
            process.pid: 0
          variables:
            process.pid: 20(true) own=20(true)
        - result: true
          matched:
            - write_not_tmp
            - either
          second_listener:
            - write_not_tmp
            - either
          partials:
            either:
                open.file.path: "true"
                open.flags: "true"
                process.uid: "true"
            not_root:
                open.file.path: "true"
                open.flags: "true"
                process.uid: "false"
            root_tmp:
                open.file.path: "false"
                open.flags: "true"
                process.uid: "true"
            write_not_tmp:
                open.file.path: "true"
                open.flags: "true"
                process.uid: "true"
          scoped_counts:
            process.pid: 0
          variables:
            process.pid: 1(true) own=1(true)
        - result: true
          matched:
            - not_root
          second_listener:
            - not_root
          partials:
            either:
                open.file.path: "true"
