            event_type: dns
            fields:
                - dns.question.name
            field_values:
                dns.question.name:
                    - variable:""
        q_in_var:
            event_type: dns
            fields:
                - dns.question.name
        q_not_in_var:
            event_type: dns
            fields:
                - dns.question.name
        setter:
            event_type: exec
            fields:
