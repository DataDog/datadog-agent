smoke:
    rules:
        r0:
            event_type: open
            fields:
                - open.file.path
                - process.uid
            field_values:
                open.file.path:
                    - scalar:"/etc/passwd"
                    - scalar:"/etc/shadow"
                process.uid:
                    - scalar:0
        r2:
            event_type: open
            fields:
                - open.file.path
            field_values:
                open.file.path:
                    - scalar:"/tmp/x"
        setter:
            event_type: exec
            fields:
                - exec.file.name
            field_values:
                exec.file.name:
                    - scalar:"bash"
    approvers:
        exec:
            approvers:
                exec.file.name:
                    - scalar:"bash"
            field_stats:
                exec.file.name: 1
        open:
            approvers:
                open.file.path:
                    - scalar:"/etc/passwd"
                    - scalar:"/etc/shadow"
                    - scalar:"/tmp/x"
            field_stats:
                open.file.path: 2
    discarders_report:
        exec.file.name: 'panic: runtime error: invalid memory address or nil pointer dereference'
        open.file.path: supported
        process.uid: none
    event_types:
        - exec
        - open
    macro_ids:
        - sensitive
    field_values:
        exec.file.name:
            - scalar:"bash"
        open.file.path:
            - scalar:"/etc/passwd"
            - scalar:"/etc/shadow"
            - scalar:"/tmp/x"
        process.uid:
            - scalar:0
    policies:
        - policy0(oracle) internal_type= type= version= replace= [r0 r2 setter]
    rule_ids:
        - r0
        - r2
        - setter
    approvers_all:
        - field_stats exec.file.name=1
        - field_stats open.file.path=2
    policy_rules:
        - policy0/r0 accepted=true disabled=false expression="open.file.path in sensitive && process.uid != 0" tags=[] product_tags=[] every= actions=0 policy=policy0 modified_by=[] used_by=[policy0] enable_count=0
        - policy0/setter accepted=true disabled=false expression="exec.file.name == \"bash\"" tags=[] product_tags=[] every= actions=1 policy=policy0 modified_by=[] used_by=[policy0] enable_count=0
        - policy0/r2 accepted=true disabled=false expression="open.file.path == \"/tmp/x\" && ${process.seen}" tags=[] product_tags=[] every= actions=0 policy=policy0 modified_by=[] used_by=[policy0] enable_count=0
    steps:
        - result: true
          matched:
            - r0
          second_listener:
            - r0
          matching_values:
            r0:
                - open.file.path="/etc/passwd"@0+14
          partials:
            r0:
                open.file.path: "true"
                process.uid: "true"
            r2:
                open.file.path: "false"
          scoped_counts:
            process.pid: 0
            process.seen: 0
          variables:
            process.pid: 10(true) own=10(true)
            process.seen: false(false) own=false(false)
        - result: false
          partials:
            r0:
                open.file.path: "false"
                process.uid: "true"
            r2:
                open.file.path: "true"
          scoped_counts:
            process.pid: 0
            process.seen: 0
          variables:
            process.pid: 10(true) own=10(true)
            process.seen: false(false) own=false(false)
        - result: true
          matched:
            - setter
          second_listener:
            - setter
          matching_values:
            setter:
                - exec.file.name="bash"@0+14
                - ="bash"@18+6
          partials:
            setter:
                exec.file.name: "true"
          scoped_counts:
            process.pid: 0
            process.seen: 1
          variables:
            process.pid: 10(true) own=10(true)
            process.seen: true(true) own=true(true)
        - result: true
          matched:
            - r2
          second_listener:
            - r2
          matching_values:
            r2:
                - open.file.path="/tmp/x"@0+14
                - ="/tmp/x"@18+8
          partials:
            r0:
                open.file.path: "false"
                process.uid: "true"
            r2:
                open.file.path: "true"
          scoped_counts:
            process.pid: 0
            process.seen: 1
          variables:
            process.pid: 10(true) own=10(true)
            process.seen: true(true) own=true(true)
        - result: false
          partials:
            r0:
                open.file.path: "true"
                process.uid: "false"
            r2:
                open.file.path: "false"
          scoped_counts:
            process.pid: 0
            process.seen: 1
          variables:
            process.pid: 1(true) own=1(true)
            process.seen: false(false) own=false(false)
