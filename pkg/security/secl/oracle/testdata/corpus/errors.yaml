      - 'connect.addr.ip == 2001:db8:0:0:0:0:0:1'
      - 'connect.addr.ip == ::ffff:10.0.0.1'
      - 'connect.addr.ip in [::ffff:10.0.0.0/104] && connect.addr.port == 1'
      - 'connect.addr.ip == 1:2:3:4:5:6:7:8:9'
      - 'connect.addr.ip == dead:beef::1/64'
    events:
      - {type: open, fields: {open.file.name: ok}}
      - {type: open, fields: {open.file.name: a, open.flags: 20}}
      - {type: open, fields: {open.file.name: b, open.flags: 20}}
      - {type: connect, fields: {connect.addr.ip: "::ffff:10.0.0.1", connect.addr.port: 1}}
      - {type: connect, fields: {connect.addr.ip: "::ffff:11.0.0.1", connect.addr.port: 1}}
      - {type: connect, fields: {connect.addr.ip: "10.0.0.1", connect.addr.port: 1}}

  # ---------------------------------------------------------------- macros
  - name: macro_definitions_and_errors
    macros:
      - {id: m_values, values: ["/etc/passwd", "/etc/shadow", "relative", "*glob", ""]}
      - {id: m_bool, expression: 'open.file.name == "x"'}
      - {id: m_int_array, expression: '[1, 2, 3]'}
      - {id: m_string_array, expression: '["a", "b", ~"p*", r"r[0-9]"]'}
      - {id: m_ident_array, expression: '[O_CREAT, O_TRUNC ]'}
