  - name: agent_version_macro_constraints
    agent_version: 7.60.1
    macros:
      - {id: mac_ok, values: [a, b], agent_version: '>= 7.0'}
      - {id: mac_filtered, values: [c, d], agent_version: '< 7.0'}
      - {id: mac_invalid, values: [e], agent_version: 'not a version'}
      - {id: mac_expr_ok, expression: 'open.flags == 1', agent_version: '>= 7.60'}
      - {id: mac_expr_filtered, expression: 'open.flags == 2', agent_version: '>= 7.61'}
      - {id: mac_dup, values: [old], agent_version: '< 7.50'}
      - {id: mac_dup, values: [new], agent_version: '>= 7.50'}
      - {id: bad-mac-id-filtered, values: [x], agent_version: '< 7.0'}
      - {id: mac_nover, values: [f]}
    rules:
      - 'open.file.name in mac_ok'
      - 'open.file.name in mac_filtered'
      - 'open.file.name in mac_invalid'
      - 'mac_expr_ok && open.file.name == "mexpr"'
      - 'mac_expr_filtered && open.file.name == "mexpr2"'
      - 'open.file.name in mac_dup'
      - 'open.file.name in mac_nover'
      - {id: rule_with_filtered_macro, expression: 'open.file.name in mac_filtered', agent_version: '>= 7.0'}
    events:
      - {type: open, fields: {open.file.name: a}}
      - {type: open, fields: {open.file.name: c}}
      - {type: open, fields: {open.file.name: e}}
      - {type: open, fields: {open.file.name: mexpr, open.flags: 1}}
      - {type: open, fields: {open.file.name: mexpr, open.flags: 2}}
      - {type: open, fields: {open.file.name: mexpr2, open.flags: 2}}
      - {type: open, fields: {open.file.name: old}}
      - {type: open, fields: {open.file.name: new}}
      - {type: open, fields: {open.file.name: f}}

  - name: agent_version_ignored_without_filter
    macros:
      - {id: mac_filtered, values: [c, d], agent_version: '< 7.0'}
      - {id: mac_invalid, values: [e], agent_version: 'not a version'}
    rules:
      - {id: r_filtered, expression: 'open.file.name == "rf"', agent_version: '< 7.0'}
      - {id: r_invalid, expression: 'open.file.name == "ri"', agent_version: 'not a version'}
      - 'open.file.name in mac_filtered'
      - 'open.file.name in mac_invalid'
    events:
      - {type: open, fields: {open.file.name: rf}}
      - {type: open, fields: {open.file.name: ri}}
      - {type: open, fields: {open.file.name: c}}
      - {type: open, fields: {open.file.name: e}}

  # ---------------------------------------------------------------- merge / override
  - name: rule_merge_and_override_across_policies
    rules:
      - {id: rule_a, expression: 'open.file.name == "a"'}
      - {id: rule_b, expression: 'open.file.name == "b"', disabled: true, tags: {orig: tag}}
      - {id: rule_c, expression: 'open.file.name == "c"', actions: [{set: {name: v_c, value: 1}}]}
      - {id: rule_d, expression: 'open.file.name == "d"', tags: {orig: tag}}
      - {id: rule_e, expression: 'open.file.name == "e"', actions: [{set: {name: v_e, value: 1}}]}
      - {id: rule_f, expression: 'open.file.name == "f"', disabled: true}
      - {id: rule_g, expression: 'open.file.name == "g"'}
      - {id: rule_h, expression: 'open.file.name == "h"'}
    policies:
      - |
        rules:
          - id: rule_a
            expression: 'open.file.name == "a_replaced"'
          - id: rule_b
            expression: 'open.file.name == "b_enabled"'
          - id: rule_c
            disabled: true
            expression: 'open.file.name == "c"'
          - id: rule_f
            disabled: true
            expression: 'open.file.name == "f2"'
          - id: rule_new
            expression: 'open.file.name == "new"'
          - id: rule_g
            combine: override
            expression: 'open.file.name == "g_override"'
          - id: rule_h
            combine: merge
            expression: 'open.file.name == "h_merge"'
      - |
        rules:
          - id: rule_a
            combine: override
            override_options:
              fields: [actions]
            actions:
              - set: {name: v_a, value: 1}
          - id: rule_d
            combine: override
            override_options:
              fields: [actions, every, tags, product_tags]
            every: 5m
            tags: {k: v}
            product_tags: [pt]
            actions:
              - set: {name: v_d, value: x}
          - id: rule_e
            combine: override
            override_options:
              fields: [actions]
            actions:
              - set: {name: v_e, value: 1}
              - set: {name: v_e2, value: 2}
          - id: rule_g
            combine: override
            override_options:
              fields: [all]
            actions:
              - set: {name: v_g, value: 1}
          - id: rule_h
            combine: override
            actions:
              - set: {name: v_h, value: 1}
          - id: rule_missing
            combine: override
            override_options:
              fields: [actions]
            actions:
              - set: {name: v_missing, value: 1}
          - id: rule_missing_no_expression
            combine: override
          - id: rule_f
            expression: 'open.file.name == "f3"'
          - id: rule_b
            disabled: true
            combine: override
            override_options:
              fields: [every, tags]
            tags: {x: y}
    macros:
      - {id: mm_merge, values: [m1]}
      - {id: mm_expr, expression: 'open.flags == 1'}
      - {id: mm_dup, values: [d1]}
      - {id: mm_override, values: [o1, o2]}
    events:
      - {type: open, fields: {open.file.name: a}}
      - {type: open, fields: {open.file.name: a_replaced}}
      - {type: open, fields: {open.file.name: b}}
      - {type: open, fields: {open.file.name: b_enabled}}
      - {type: open, fields: {open.file.name: c}}
      - {type: open, fields: {open.file.name: d}}
      - {type: open, fields: {open.file.name: e}}
      - {type: open, fields: {open.file.name: f}}
      - {type: open, fields: {open.file.name: f2}}
      - {type: open, fields: {open.file.name: f3}}
      - {type: open, fields: {open.file.name: g}}
      - {type: open, fields: {open.file.name: g_override}}
      - {type: open, fields: {open.file.name: h}}
      - {type: open, fields: {open.file.name: h_merge}}
      - {type: open, fields: {open.file.name: new}}

  - name: macro_merge_and_override_across_policies
    macros:
      - {id: mm_merge, values: [m1]}
      - {id: mm_expr, expression: 'open.flags == 1'}
      - {id: mm_dup, values: [d1]}
      - {id: mm_override, values: [o1, o2]}
      - {id: mm_expr_values, expression: '["x"]'}
      - {id: mm_values_expr, values: [v1]}
      - {id: mm_bogus, values: [b1]}
    rules:
      - 'open.file.name in mm_merge && open.flags == 1'
      - 'mm_expr && open.file.name == "expr"'
      - 'open.file.name in mm_dup && open.flags == 2'
      - 'open.file.name in mm_override && open.flags == 3'
      - 'open.file.name in mm_expr_values && open.flags == 4'
      - 'open.file.name in mm_values_expr && open.flags == 5'
      - 'open.file.name in mm_bogus && open.flags == 6'
      - 'open.file.name in mm_new && open.flags == 7'
    policies:
      - |
        macros:
          - id: mm_merge
            combine: merge
            values: [m2, m3]
          - id: mm_expr
            combine: merge
            expression: 'open.flags == 2'
          - id: mm_dup
            values: [d2]
          - id: mm_override
            combine: override
            values: [o3]
          - id: mm_expr_values
            combine: merge
            values: [y]
          - id: mm_values_expr
            combine: merge
            expression: '["z"]'
          - id: mm_bogus
            combine: bogus
            values: [b2]
          - id: mm_new
            combine: merge
            values: [n1]
      - |
        macros:
          - id: mm_merge
            combine: merge
            values: [m4]
          - id: mm_override
            combine: merge
            values: [o4]
          - id: mm_new
            combine: override
            values: [n2]
    events:
      - {type: open, fields: {open.file.name: m1, open.flags: 1}}
      - {type: open, fields: {open.file.name: m2, open.flags: 1}}
      - {type: open, fields: {open.file.name: m3, open.flags: 1}}
      - {type: open, fields: {open.file.name: m4, open.flags: 1}}
      - {type: open, fields: {open.file.name: m9, open.flags: 1}}
      - {type: open, fields: {open.file.name: expr, open.flags: 1}}
      - {type: open, fields: {open.file.name: d1, open.flags: 2}}
      - {type: open, fields: {open.file.name: d2, open.flags: 2}}
      - {type: open, fields: {open.file.name: o1, open.flags: 3}}
      - {type: open, fields: {open.file.name: o3, open.flags: 3}}
      - {type: open, fields: {open.file.name: o4, open.flags: 3}}
      - {type: open, fields: {open.file.name: x, open.flags: 4}}
      - {type: open, fields: {open.file.name: y, open.flags: 4}}
      - {type: open, fields: {open.file.name: v1, open.flags: 5}}
      - {type: open, fields: {open.file.name: z, open.flags: 5}}
