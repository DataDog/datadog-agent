      - {type: open, fields: {open.file.name: x, open.flags: 7}}
      - {type: open, fields: {open.file.name: y, open.flags: 8}}
      - {type: open, fields: {open.file.name: y, open.flags: 9}}
      - {type: open, fields: {open.file.name: a1, open.flags: 10}}
      - {type: open, fields: {open.file.name: a, open.flags: 11}}
      - {type: open, fields: {open.file.name: b, open.flags: 11}}
      - {type: open, fields: {open.file.name: "", open.flags: 102}}
      - {type: open, fields: {open.file.name: relative, open.flags: 102}}
