      - {id: m_primary_str, expression: '"abc"'}
      - {id: m_primary_int, expression: '42'}
      - {id: m_primary_ident, expression: 'O_CREAT'}
      - {id: m_ref, expression: 'm_bool && open.flags == 1'}
      - {id: m_ref_array, expression: 'm_string_array'}
      - {id: m_ref_not, expression: '!m_bool'}
      - {id: m_cycle_a, expression: 'm_cycle_b'}
      - {id: m_cycle_b, expression: 'm_cycle_a'}
      - {id: m_self, expression: 'm_self'}
      - {id: m_forward, expression: 'm_later && open.flags == 2'}
      - {id: m_later, expression: 'open.file.name == "later"'}
      - {id: m_both, expression: 'open.file.name == "x"', values: ["a"]}
      - {id: m_neither}
      - {id: m_bad_syntax, expression: 'open.file.name =='}
      - {id: m_bad_type, expression: 'open.flags == "a"'}
      - {id: m_unknown_field, expression: 'open.nosuch == "a"'}
      - {id: m_unknown_ident, expression: 'nosuch_macro'}
      - {id: bad-macro-id, values: ["a"]}
      - {id: m_fim, expression: 'fim.write.file.path == "/a"'}
      - {id: m_multi_event, expression: 'open.file.name == "a" && exec.file.name == "b"'}
      - {id: m_dup, values: ["first"]}
      - {id: m_dup, values: ["second"]}
      - {id: m_variable, expression: '${nosuch}'}
      - {id: m_ip, expression: '10.0.0.1'}
      - {id: m_cidr, expression: '10.0.0.0/8'}
      - {id: m_dur, expression: '5s'}
      - {id: m_regexp, expression: 'r"a.*"'}
      - {id: m_pattern, expression: '~"a*"'}
    rules:
      - 'open.file.path in m_values'
      - 'open.file.name in m_string_array && open.flags == 100'
      - 'm_ref && open.flags == 3'
      - 'open.flags in m_int_array && open.file.name == "ints"'
      - 'open.flags in m_ident_array && open.file.name == "idents"'
      - 'connect.addr.ip in m_cidr_array'
      - 'open.file.name == m_primary_str'
      - 'open.flags == m_primary_int'
      - 'open.flags == m_primary_ident && open.file.name == "pident"'
      - 'open.file.name in m_ref_array && open.flags == 101'
      - 'm_ref_not && open.flags == 4'
      - 'open.file.name in m_missing'
      - 'm_missing_bool'
      - 'm_cycle_a'
      - 'm_self && open.flags == 5'
      - 'm_forward'
      - 'm_both'
      - 'm_neither'
      - 'm_bad_syntax'
      - 'm_bad_type'
      - 'open.file.path in m_dup'
      - 'open.file.name in m_values && open.flags == 102'
      - 'm_bool || m_bool'
      - 'm_bool && m_bool && open.flags == 6'
      - 'not (m_bool) && open.flags == 7'
      - 'open.file.name in [m_primary_str]'
      - 'open.file.name == "abc" && open.flags in m_int_array && open.flags == 3'
      - 'open.file.name in m_primary_str'
      - 'open.flags in m_primary_int'
      - 'open.flags in m_bool'
      - 'm_primary_str == "abc" && open.flags == 8'
      - 'm_primary_int == 42 && open.flags == 9'
      - 'm_ip == 10.0.0.1 && connect.addr.port == 1'
      - 'connect.addr.ip == m_ip'
      - 'connect.addr.ip in m_cidr'
      - 'connect.addr.ip == m_cidr'
      - 'open.flags > m_dur'
      - 'open.file.name =~ m_regexp'
      - 'open.file.name == m_pattern'
      - 'open.file.name == m_regexp && open.flags == 10'
      - 'open.file.name =~ m_pattern && open.flags == 11'
    events:
      - {type: open, fields: {open.file.path: /etc/passwd}}
      - {type: open, fields: {open.file.path: /etc/other}}
