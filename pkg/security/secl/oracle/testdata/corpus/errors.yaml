      - {type: open, fields: {open.file.name: y, open.flags: 3}}
      - {type: open, fields: {open.file.name: y, open.flags: 4}}
      - {type: open, fields: {open.file.name: x, open.flags: 4}}
      - {type: open, fields: {open.file.name: ints, open.flags: 2}}
      - {type: open, fields: {open.file.name: ints, open.flags: 4}}
      - {type: open, fields: {open.file.name: idents, open.flags: 64}}
      - {type: open, fields: {open.file.name: idents, open.flags: 512}}
      - {type: open, fields: {open.file.name: idents, open.flags: 65}}
