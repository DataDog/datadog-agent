      - {type: connect, fields: {connect.addr.ip: 10.2.3.4, connect.addr.port: 1}}
      - {type: connect, fields: {connect.addr.ip: 192.168.1.1, connect.addr.port: 2}}
      - {type: connect, fields: {connect.addr.ip: 192.168.1.2, connect.addr.port: 2}}

  - name: macro_event_type_isolation_one_macro
    macros:
      - {id: m_exec, expression: 'exec.file.name == "e"'}
    rules:
      - 'open.file.name == "first"'
      - 'm_exec && exec.argv == "x"'
      - 'exec.file.name == "f"'
      - 'open.file.name == "second"'
    events:
      - {type: open, fields: {open.file.name: first}}
      - {type: open, fields: {open.file.name: second}}
      - {type: exec, fields: {exec.file.name: e, exec.argv: [x]}}
      - {type: exec, fields: {exec.file.name: e, exec.argv: [y]}}
      - {type: exec, fields: {exec.file.name: f}}

  - name: macro_event_type_isolation_two_macros
    macros:
      - {id: m_exec, expression: 'exec.file.name == "e"'}
      - {id: m_open, expression: 'open.file.name == "o"'}
      - {id: m_strs, values: ["s1", "s2"]}
    rules:
      - 'open.file.name == "first"'
      - 'exec.file.name == "f"'
      - 'm_open && open.flags == 1'
      - 'm_exec && m_open'
      - 'open.file.name in m_strs'
      - 'chmod.file.name in m_strs'
      - 'chmod.file.name == "c" && m_exec'
    events:
      - {type: open, fields: {open.file.name: first}}
      - {type: open, fields: {open.file.name: o, open.flags: 1}}
      - {type: open, fields: {open.file.name: s1}}
      - {type: exec, fields: {exec.file.name: e}}
      - {type: exec, fields: {exec.file.name: f}}
      - {type: chmod, fields: {chmod.file.name: s2}}

