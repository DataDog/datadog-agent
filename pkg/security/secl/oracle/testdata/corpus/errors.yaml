            expression: 'open.file.name == "group"'
          - id: group_ok
            group_id: grp_ok
            expression: 'open.file.name == "group_ok"'
          - id: no_expression
          - id: no_expression_disabled
            disabled: true
          - id: disabled_valid
            disabled: true
            expression: 'open.file.name == "disabled"'
          - id: disabled_garbage
            disabled: true
            expression: 'open.file.name == ('
          - id: garbage
            expression: 'open.file.name == ('
          - id: digits_123
            expression: 'open.file.name == "digits"'
          - id: 123
            expression: 'open.file.name == "numeric_id"'
          - id: UPPER_lower_9
            expression: 'open.file.name == "upper"'
          - id: with_metadata
            version: 1.2.3
            description: some rule
            tags: {a: b, c: d}
            product_tags: [p1, p2]
            silent: true
            priority: 5
