      - "type: policy\nreplace_policy_id: other\nrules:\n  - id: typed_rule\n    expression: 'open.file.name == \"typed\"'\n"
      - |
        unknown_top_level: 1
        rules:
          - id: unknown_field_rule
            expression: 'open.file.name == "unk"'
