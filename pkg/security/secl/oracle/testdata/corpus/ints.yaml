  # ------------------------------------------- approver NOT of integer values
  # Approvers test a value against its bitwise NOT (eval.NotOfValue), so the
  # rule must hold for the NOT computed by one implementation and not by
  # another. Each case pairs a value with the NOT of the other integer width.
  - name: int_approver_not_uint32_range
    rules:
      - open.retval == 100000 || open.retval == -100001
    events:
      - {type: open, fields: {open.retval: 100000}}
      - {type: open, fields: {open.retval: -100001}}

  - name: int_approver_not_negative_int8
    rules:
      - open.retval == -1000 || open.retval == -25
    events:
      - {type: open, fields: {open.retval: -1000}}
      - {type: open, fields: {open.retval: -25}}

  - name: int_approver_not_negative_int16
    rules:
      - open.retval == -40000 || open.retval == -25537
    events:
      - {type: open, fields: {open.retval: -40000}}
      - {type: open, fields: {open.retval: -25537}}

  - name: int_approver_not_negative_int32
    rules:
      - open.retval == -3000000000 || open.retval == -1294967297
    events:
      - {type: open, fields: {open.retval: -3000000000}}
      - {type: open, fields: {open.retval: -1294967297}}

  # ------------------------------------------- bool arrays (BoolArrayEquals)
  # Only "array == bool" reaches BoolArrayEquals: the bool array is the left

  # ------------------------------------------- bool arrays (BoolArrayEquals)
  # Only "array == bool" reaches BoolArrayEquals (the bool array is the left
  # operand); bool array literals cannot be written in a macro, so both
  # operands are fields.
  - name: bool_array_equals_fields
    rules:
      - open.flags >= 0 && (process.ancestors.args_truncated == true)
      - open.flags >= 0 && (process.ancestors.args_truncated != true)
      - open.flags >= 0 && (process.ancestors.args_truncated == false)
      - open.flags >= 0 && (process.ancestors.args_truncated == process.is_kworker)
      - open.flags >= 0 && (process.ancestors.args_truncated != process.is_kworker)
      - open.flags >= 0 && (process.ancestors.args_truncated == true && process.is_kworker)
    processes:
      kw: {pid: 6, fields: {is_kworker: true, args_truncated: true}}
      plain: {pid: 7, fields: {is_kworker: false, args_truncated: false}}
      mixed: {pid: 8, parent: plain, fields: {is_kworker: true, args_truncated: false}}
    events:
      - {type: open, process: kw, fields: {open.flags: 1}}
      - {type: open, process: plain, fields: {open.flags: 1}}
      - {type: open, process: mixed, fields: {open.flags: 1}}

  - name: bool_array_equals_type_errors
    rules:
      - open.flags >= 0 && (process.is_kworker == process.ancestors.args_truncated)
      - open.flags >= 0 && (process.ancestors.args_truncated == 1)
    events:
      - {type: open, fields: {process.pid: 1, open.flags: 1}}

  # an int array macro compared to a duration builds the both-literal
