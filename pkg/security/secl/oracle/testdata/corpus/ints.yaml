  # ------------------------------------------- int arrays from literal macros
  # A macro holding an integer array is an IntArrayEvaluator with literal
  # values, the only way to reach the array operators with a literal array
  # on the right side of a scalar comparison.
  - name: int_macro_array_field_vs_literal
    macros:
      - id: nums
        expression: "[1, 7, 20]"
    rules:
      - open.flags >= 0 && (open.flags > nums)
      - open.flags >= 0 && (open.flags >= nums)
      - open.flags >= 0 && (open.flags < nums)
      - open.flags >= 0 && (open.flags <= nums)
      - open.flags >= 0 && (open.flags == nums)
      - open.flags >= 0 && (open.flags != nums)
      - open.flags >= 0 && (nums > open.flags)
      - open.flags >= 0 && (nums >= open.flags)
      - open.flags >= 0 && (nums < open.flags)
      - open.flags >= 0 && (nums <= open.flags)
      - open.flags >= 0 && (nums == open.flags)
      - open.flags >= 0 && (nums != open.flags)
      - open.flags >= 0 && (process.pid > nums)
      - open.flags >= 0 && (process.pid <= nums)
    events:
      - {type: open, fields: {process.pid: 0, open.flags: 0}}
      - {type: open, fields: {process.pid: 1, open.flags: 1}}
      - {type: open, fields: {process.pid: 7, open.flags: 7}}
      - {type: open, fields: {process.pid: 8, open.flags: 8}}
      - {type: open, fields: {process.pid: 20, open.flags: 20}}
      - {type: open, fields: {process.pid: 21, open.flags: 21}}
      - {type: open, fields: {process.pid: 100, open.flags: 100}}

  - name: int_macro_array_literal_vs_scalar
    macros:
      - id: nums
        expression: "[1, 7, 20]"
    rules:
      - open.flags >= 0 && (5 > nums)
      - open.flags >= 0 && (5 < nums)
      - open.flags >= 0 && (5 >= nums)
      - open.flags >= 0 && (5 <= nums)
      - open.flags >= 0 && (1 == nums)
      - open.flags >= 0 && (2 != nums)
      - open.flags >= 0 && (100 > nums && process.pid == 1)
      - open.flags >= 0 && (-3 < nums && process.pid == 1)
    events:
      - {type: open, fields: {process.pid: 1, open.flags: 1}}
      - {type: open, fields: {process.pid: 2, open.flags: 2}}

  - name: int_macro_array_event_retval_errors
    macros:
      - id: nums
        expression: "[1, 7, 20]"
      - id: errnos
        expression: "[-1, -13]"
    rules:
      - event.retval > nums
      - event.retval >= nums
      - event.retval < nums
      - event.retval <= nums
      - event.retval == nums
      - event.retval > errnos
      - event.retval >= errnos
      - event.retval < errnos
      - event.retval <= errnos
      - event.retval == errnos
      - open.flags >= 0 && (event.retval in errnos)
    events:
