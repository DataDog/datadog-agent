description: --size= long form is accepted and equivalent to -s.
setup:
  files:
    - path: log.txt
      content: "hello\n"
input:
  allowed_paths: ["$DIR:rw"]
  mode: "remediation"
  script: |+
    truncate --size=0 log.txt
    wc -c < log.txt
expect:
  stdout: |+
    0
  stderr: |+
  exit_code: 0
