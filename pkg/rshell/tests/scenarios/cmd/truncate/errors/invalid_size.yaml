description: A non-numeric size argument causes exit 1 with an error message.
setup:
  files:
    - path: f.txt
      content: "data"
input:
  allowed_paths: ["$DIR:rw"]
  mode: "remediation"
  script: |+
    truncate -s notanumber f.txt
expect:
  stdout: |+
  stderr_contains: ["invalid size"]
  exit_code: 1
skip_assert_against_bash: true
