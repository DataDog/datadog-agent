# Derived from uutils test_truncate.rs::test_truncate_no_size.
description: truncate without -s fails with exit 1 and an error message.
setup:
  files:
    - path: f.txt
      content: "data"
input:
  allowed_paths: ["$DIR:rw"]
  mode: "remediation"
  script: |+
    truncate f.txt
expect:
  stdout: |+
  stderr_contains: ["--size"]
  exit_code: 1
skip_assert_against_bash: true
