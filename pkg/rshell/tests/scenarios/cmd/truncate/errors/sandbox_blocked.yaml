# Security test: truncate on a path outside AllowedPaths is rejected.
description: truncate on a path outside the sandbox fails with exit 1.
input:
  allowed_paths: ["$DIR:rw"]
  mode: "remediation"
  script: |+
    truncate -s 0 /etc/hosts
expect:
  stdout: |+
  stderr: |+
    truncate: "/etc/hosts": permission denied
  # On Windows, /etc/hosts (no drive letter) resolves inside the os.Root sandbox
  # as $DIR\etc\hosts — it's within AllowedPaths but does not exist.
  stderr_windows: |+
    truncate: "/etc/hosts": no such file or directory
  exit_code: 1
skip_assert_against_bash: true
