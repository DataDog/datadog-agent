# Security: relative-size modifier + is rejected with a hint.
description: The +N relative-size modifier is rejected with a user-facing hint.
setup:
  files:
    - path: f.txt
      content: "data"
input:
  allowed_paths: ["$DIR:rw"]
  mode: "remediation"
  script: |+
    truncate -s +10 f.txt
expect:
  stdout: |+
  stderr_contains: ["relative size operators not supported"]
  exit_code: 1
skip_assert_against_bash: true
