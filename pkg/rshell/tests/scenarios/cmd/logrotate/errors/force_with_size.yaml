# skip: rshell logrotate is a remediation-only truncation helper, not system logrotate.
skip_assert_against_bash: true
description: logrotate rejects combining --size and --force.
setup:
  files:
    - path: app.log
      content: "abcde"
input:
  allowed_paths: ["$DIR:rw"]
  mode: "remediation"
  script: |+
    logrotate --force --size 1 app.log
expect:
  stdout: |+
  stderr: |+
    logrotate: --size and --force cannot be combined
  exit_code: 1
