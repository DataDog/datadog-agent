# skip: rshell logrotate is a remediation-only truncation helper, not system logrotate.
skip_assert_against_bash: true
description: logrotate requires at least one file operand.
input:
  allowed_paths: ["$DIR:rw"]
  mode: "remediation"
  script: |+
    logrotate --force
expect:
  stdout: |+
  stderr: |+
    logrotate: missing file operand
  exit_code: 1
