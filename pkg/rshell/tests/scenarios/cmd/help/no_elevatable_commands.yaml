description: Help and help --all show an explicit notice when no commands can be elevated.
skip_assert_against_bash: true
input:
  script: |+
    help | grep -A 1 '^Elevatable commands:'
    help --all | grep -A 1 '^Elevatable commands:'
expect:
  stdout: |+
    Elevatable commands:
      (no effective elevatable commands — sudo is unavailable)
    Elevatable commands:
      (no effective elevatable commands — sudo is unavailable)
  stderr: |+
  exit_code: 0
