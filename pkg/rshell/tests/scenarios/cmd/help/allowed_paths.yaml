description: Help surfaces the configured AllowedPaths sandbox roots grouped by read-only and read-write access. Uses stdout_contains because the absolute paths resolve to the scenario tempdir.
skip_assert_against_bash: true
setup:
  files:
    - path: read-only/input.txt
      content: |+
        ro
    - path: read-write/output.txt
      content: |+
        rw
input:
  allowed_paths: ["read-only:ro", "read-write:rw"]
  script: |+
    help
expect:
  stdout_contains:
    - "Allowed paths:"
    - "Read-only:"
    - "read-only"
    - "Read-write:"
    - "read-write"
    - "(write access requires remediation mode)"
  stderr: |+
  exit_code: 0
