# skip: rshell builtin error/output format differs from the reference implementation
skip_assert_against_bash: true
description: Cat on a directory fails with "is a directory" error and exits with code 1.
setup:
  files:
    - path: mydir/placeholder.txt
      content: "placeholder"
      chmod: 0644
input:
  allowed_paths: ["$DIR"]
  script: |+
    cat mydir
expect:
  stdout: ""
  stderr_contains:
    - "cat: mydir:"
    - "is a directory"
  exit_code: 1
