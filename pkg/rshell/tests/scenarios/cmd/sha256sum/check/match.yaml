description: sha256sum --check verifies a standard checksum manifest.
setup:
  files:
    - path: config
      content: "abc"
    - path: checksums
      content: "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad  config\n"
input:
  allowed_paths: ["$DIR"]
  script: |+
    sha256sum --check checksums
expect:
  stdout: |+
    config: OK
  stderr: |+
  exit_code: 0
