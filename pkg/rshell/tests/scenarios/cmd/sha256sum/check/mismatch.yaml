description: sha256sum --check fails when a file no longer matches its manifest.
setup:
  files:
    - path: config
      content: "changed"
    - path: checksums
      content: "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad  config\n"
input:
  allowed_paths: ["$DIR"]
  script: |+
    sha256sum --check checksums
expect:
  stdout: |+
    config: FAILED
  stderr: |+
    sha256sum: WARNING: 1 computed checksum did NOT match
  exit_code: 1
