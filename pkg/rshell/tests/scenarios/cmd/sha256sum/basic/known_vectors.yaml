description: sha256sum computes standard SHA-256 vectors for regular files.
setup:
  files:
    - path: empty
      content: ""
    - path: abc
      content: "abc"
input:
  allowed_paths: ["$DIR"]
  script: |+
    sha256sum empty abc
expect:
  stdout: |+
    e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855  empty
    ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad  abc
  stderr: |+
  exit_code: 0
