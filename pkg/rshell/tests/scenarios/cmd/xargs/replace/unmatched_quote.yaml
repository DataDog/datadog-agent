description: xargs -I rejects unmatched single/double quotes in input with an error (matches GNU's "unmatched quote" diagnostic).
skip_assert_against_bash: true
input:
  script: |+
    printf "'a b\n" | xargs -I{} echo X{}X
    echo done=$?
expect:
  stdout: |+
    done=1
  stderr_contains: ["unterminated"]
  exit_code: 0
