description: xargs -I mode warns on NUL bytes and emits the token truncated at NUL; subsequent NUL-free lines are processed normally. rshell never passes NUL bytes through to the child argv (Go strings have no implicit C-string truncation), so the visible substitution differs from GNU which passes the raw bytes and relies on exec to terminate at NUL.
skip_assert_against_bash: true
input:
  script: |+
    printf 'a\0b\nc\n' | xargs -I{} echo X{}X
expect:
  stdout: |+
    XaX
    XcX
  stderr_contains: ["NUL character"]
  exit_code: 0
