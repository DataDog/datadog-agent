# -p (fill pattern) is rejected as an unknown flag.
description: "ping -p (pattern) is rejected with exit 1"
input:
  script: |+
    ping -p ff localhost
expect:
  stdout: ""
  stderr: "ping: invalid option -- 'p'\nTry 'ping --help' for more information.\n"
  exit_code: 1
skip_assert_against_bash: true
