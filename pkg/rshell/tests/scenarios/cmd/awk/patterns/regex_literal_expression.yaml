description: awk regexp literals in expressions match the current record.
setup:
  files:
    - path: input.txt
      content: |+
        bar
        foo
input:
  allowed_paths: ["$DIR"]
  script: |+
    awk '{ print (/foo/) } /foo/ == 1 { print "matched", $0 }' input.txt
    awk 'BEGIN { keys[/foo/] = "zero"; keys[8/2] = "four"; print keys[0], keys[4] }'
expect:
  stdout: |+
    0
    1
    matched foo
    zero four
  stderr: |+
  exit_code: 0
