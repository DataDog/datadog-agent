description: awk supports ordinary string and numeric-string comparison semantics.
setup:
  files:
    - path: input.txt
      content: |+
        0
        10
        123abc
        -4.5x
        abc123
input:
  allowed_paths: ["$DIR"]
  script: |+
    awk 'BEGIN { print ("10" < "2"), (x == 0), (x == ""), !"0", "123abc" + 1 } $1 { print "truthy", $1 } { print $1 + 1, ($1 == 0), ($1 < 2), ($1 < "2") }' input.txt
    awk 'BEGIN { x="007"; y="word"; print x++, x, y--, y }'
    printf '65\n' | awk -v n=65 'BEGIN { s="65"; printf "%c %c\n", n, s } { printf "%c\n", $1 }'
expect:
  stdout: |+
    1 1 1 0 124
    1 1 1 1
    truthy 10
    11 0 0 1
    truthy 123abc
    124 0 1 1
    truthy -4.5x
    -3.5 0 1 1
    truthy abc123
    1 0 0 0
    7 8 0 -1
    A 6
    A
  stderr: |+
  exit_code: 0
