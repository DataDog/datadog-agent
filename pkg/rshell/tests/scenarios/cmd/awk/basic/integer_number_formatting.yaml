description: awk formats ordinary integer-valued numbers and numeric format variables.
input:
  script: |+
    awk 'BEGIN { print 999999, 1000000, 123456789, 1000000.5; x=-0; print x }'
    awk 'BEGIN { CONVFMT="%.2f"; OFMT=1.234; print 1.6; CONVFMT=1.234; print "[" CONVFMT "]"; printf "%.3f %.3f %d %d\n", OFMT+0, CONVFMT+0, OFMT==1.234, CONVFMT==1.234 }'
    awk 'BEGIN { print sprintf("%g|%G|%#x|%#X", 1.23456789, 1.23456789, 0, 0) }'
expect:
  stdout: |+
    999999 1000000 123456789 1e+06
    0
    1.23
    [1.23]
    1.234 1.234 1 1
    1.23457|1.23457|0|0
  stderr: |+
  exit_code: 0
