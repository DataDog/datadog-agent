description: awk supports if, next, printf, and scalar string builtins.
setup:
  files:
    - path: input.txt
      content: |+
        a 1
        b 22
        skip 5
input:
  allowed_paths: ["$DIR"]
  script: |+
    awk '{ if ($1 == "skip") next; if ($2 > 9) { printf "%s:%03d:%u\n", toupper($1), $2, 42 } else printf "small:%s:%d:%d:%d:%d:%s\n", tolower($1), int($2 + .9), length, index($0, $2), index($0, ""), substr($0, 2, 2) }' input.txt
expect:
  stdout: |+
    small:a:1:3:3:1: 1
    B:022:42
  stderr: |+
  exit_code: 0
