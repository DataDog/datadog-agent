# skip: pmap is not part of GNU coreutils (it ships in procps-ng), which is
# not installed in the debian:bookworm-slim comparison image, so there is no
# real `pmap` binary to compare against.
description: pmap rejects a non-numeric PID argument
skip_assert_against_bash: true
input:
  script: |+
    pmap notapid
expect:
  stdout: |+
  stderr: |+
    pmap: invalid PID: notapid
  exit_code: 1
