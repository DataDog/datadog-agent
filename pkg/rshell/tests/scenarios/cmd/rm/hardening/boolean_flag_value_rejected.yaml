description: An explicit value on a no-argument boolean flag (--verbose=false) is rejected before any file is removed, matching GNU rm's no_argument longopt behavior.
setup:
  files:
    - path: f.txt
      content: "data"
input:
  allowed_paths: ["$DIR:rw"]
  mode: "remediation"
  script: |+
    rm --verbose=false f.txt
expect:
  stdout: |+
  stderr: |+
    rm: option '--verbose' doesn't allow an argument
    Try 'rm --help' for more information.
  exit_code: 1
