description: rm --help prints usage to stdout and exits 0.
input:
  allowed_paths: ["$DIR:rw"]
  mode: "remediation"
  script: |+
    rm --help
expect:
  stdout_contains: ["Usage: rm", "At most 10 files may be removed per invocation, and at most 100", "files in total per script run"]
  stderr: |+
  exit_code: 0
skip_assert_against_bash: true
