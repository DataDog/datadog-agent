# Security test: rm outside remediation mode is rejected before any deletion.
description: rm without remediation mode fails with "capability not available".
setup:
  files:
    - path: f.txt
      content: "data"
input:
  allowed_paths: ["$DIR"]
  script: |+
    rm f.txt
expect:
  stdout: |+
  stderr: |+
    rm: filesystem capability not available (remediation mode required)
  exit_code: 1
skip_assert_against_bash: true
