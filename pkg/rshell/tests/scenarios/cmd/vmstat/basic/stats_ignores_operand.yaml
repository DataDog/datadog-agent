description: vmstat -s ignores a trailing delay/count operand (procps still parses [delay [count]] with -s, but the stats report never samples more than once).
# skip: vmstat is not present in debian:bookworm-slim, and counters reflect
# live host state.
skip_assert_against_bash: true
# skip: vmstat is not supported on Windows (see AGENTS.md); this scenario
# requires real output, which only exists on Linux/macOS.
skip_windows: true
input:
  script: |+
    vmstat -s 1; echo "code:$?"
expect:
  stdout_contains:
    - "total memory"
    - "total swap"
    - "code:0"
  stderr: |+
  exit_code: 0
