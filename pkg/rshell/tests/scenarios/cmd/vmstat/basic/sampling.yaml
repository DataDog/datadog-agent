description: vmstat with a delay and count samples repeatedly, printing exactly count data rows.
# skip: vmstat is not present in debian:bookworm-slim, and output reflects
# live host state.
skip_assert_against_bash: true
# skip: vmstat is not supported on Windows (see AGENTS.md); this scenario
# requires real output, which only exists on Linux/macOS.
skip_windows: true
input:
  script: |+
    vmstat 1 2 | wc -l; echo "code:$?"
expect:
  stdout_contains:
    - "4"
    - "code:0"
  stderr: |+
  exit_code: 0
