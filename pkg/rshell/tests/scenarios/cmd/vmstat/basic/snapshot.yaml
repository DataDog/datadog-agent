description: vmstat with no arguments prints a two-line header and one data row.
# skip: vmstat is not present in debian:bookworm-slim (it ships in procps,
# not installed there), and output reflects live host state.
skip_assert_against_bash: true
# skip: vmstat is not supported on Windows (see AGENTS.md); this scenario
# requires real output, which only exists on Linux/macOS.
skip_windows: true
input:
  script: |+
    vmstat; echo "code:$?"
expect:
  stdout_contains:
    - "procs"
    - "memory"
    - "swap"
    - "code:0"
  stderr: |+
  exit_code: 0
