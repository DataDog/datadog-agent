description: vmstat -h prints usage information to stdout and exits with code 0.
# skip: rshell builtin help output differs from the real procps vmstat(8) utility
skip_assert_against_bash: true
input:
  script: |+
    vmstat -h
expect:
  stdout_contains:
    - "Usage: vmstat"
  stderr: |+
  exit_code: 0
