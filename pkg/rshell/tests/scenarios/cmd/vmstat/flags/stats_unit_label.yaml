description: vmstat -s -S M relabels the scaled memory/swap lines with the selected unit instead of a stale "K".
# skip: vmstat is not present in debian:bookworm-slim, and output reflects
# live host state.
skip_assert_against_bash: true
# skip: vmstat is not supported on Windows (see AGENTS.md); this scenario
# requires real output, which only exists on Linux/macOS.
skip_windows: true
input:
  script: |+
    vmstat -s -S M
expect:
  stdout_contains:
    - "M total memory"
    - "M total swap"
  stderr: |+
  exit_code: 0
