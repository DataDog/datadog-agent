# skip: lsof is not installed by default in the debian:bookworm-slim
# comparison image, and this builtin's flag set and output format are
# intentionally a narrow, custom subset of real lsof (see builtins/lsof's
# package doc comment), so there is nothing meaningful to compare against.
description: lsof --help prints usage to stdout
skip_assert_against_bash: true
input:
  script: |+
    lsof --help
expect:
  stdout_contains:
    - "Usage: lsof"
    - "-p, --pid"
    - "-c, --command"
    - "-u, --user"
    - "-a, --and"
    - "-h, --help"
  stderr: |+
  exit_code: 0
