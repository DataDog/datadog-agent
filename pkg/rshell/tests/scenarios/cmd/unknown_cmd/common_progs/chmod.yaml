# skip: rshell reports different error format than bash for unavailable commands
skip_assert_against_bash: true
description: The chmod command is not a builtin and is rejected as unknown.
input:
  script: |+
    chmod 755 file.txt
expect:
  stdout: ""
  stderr: |+
    rshell: chmod: unknown command
    Run 'help' to see available commands.
  exit_code: 127
