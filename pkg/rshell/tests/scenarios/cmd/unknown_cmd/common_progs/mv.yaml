# skip: rshell reports different error format than bash for unavailable commands
skip_assert_against_bash: true
description: The mv command is not a builtin and is rejected as unknown.
input:
  script: |+
    mv old.txt new.txt
expect:
  stdout: ""
  stderr: |+
    rshell: mv: unknown command
    Run 'help' to see available commands.
  exit_code: 127
