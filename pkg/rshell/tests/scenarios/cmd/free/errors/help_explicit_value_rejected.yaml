# skip: free is not part of GNU coreutils (it ships in procps-ng), which is
# not installed in the debian:bookworm-slim comparison image, so there is no
# real `free` binary to compare against.
description: free --help=true is rejected — --help takes no argument, matching GNU getopt no-argument semantics (df's noArgBool pattern)
skip_assert_against_bash: true
input:
  script: |+
    free --help=true
expect:
  stdout: |+
  stderr: |+
    free: option '--help' doesn't allow an argument
    Try 'free --help' for more information.
  exit_code: 1
