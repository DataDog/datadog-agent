description: '`cut -d xy --help --bogus` exits 1 with "delimiter must be a single character" rather than printing help. The delimiter length check in builtins/cut/cut.go runs BEFORE the `--help` short-circuit so the shared args-trim in builtins/builtins.go can safely honour `--help` after value-taking flags without masking the earlier validation error. Matches GNU cut.'
input:
  script: |+
    cut -d xy --help --bogus; echo "code:$?"
expect:
  stdout: |+
    code:1
  stderr: |+
    cut: the delimiter must be a single character
    Try 'cut --help' for more information.
  exit_code: 0
