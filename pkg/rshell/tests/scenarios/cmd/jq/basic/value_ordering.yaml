description: jq orders values across types and compares arrays and objects structurally.
input:
  script: |+
    jq -nc '[null<false, false<true, true<1, 1<"a", "a"<[], []<{}]'
    jq -nc '[[1,2]<[1,3], [1]<[1,2], [1,2]<[1], []<[]]'
    jq -nc '[{a:1}<{b:1}, {a:1}<{a:2}, {}<{a:1}, {a:1,b:2}=={b:2,a:1}, {z:1}<{a:1,b:2}]'
    jq -nc '[[{a:1}]<[{a:2}], {a:{b:1}}<{a:{b:2}}]'
expect:
  stdout: |+
    [true,true,true,true,true,true]
    [true,true,false,false]
    [true,true,true,true,false]
    [true,true]
  stderr: |+
  exit_code: 0
