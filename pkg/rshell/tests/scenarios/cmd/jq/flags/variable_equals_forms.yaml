description: jq rejects equals forms for --arg and --argjson.
input:
  script: |+
    if jq -nc --arg=x value '$x' >/dev/null 2>&1; then
      echo accepted
    else
      echo rejected
    fi
    if jq -nc --argjson=x 1 '$x' >/dev/null 2>&1; then
      echo accepted
    else
      echo rejected
    fi
expect:
  stdout: |+
    rejected
    rejected
  stderr: |+
  exit_code: 0
