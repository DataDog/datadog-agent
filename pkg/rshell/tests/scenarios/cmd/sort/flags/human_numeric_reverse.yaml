description: sort -rh orders SI suffixes from largest to smallest.
setup:
  files:
    - path: file.txt
      content: |+
        20K
        1.2G
        500M
        2G
input:
  allowed_paths: ["$DIR"]
  script: |+
    sort -rh file.txt
expect:
  stdout: |+
    2G
    1.2G
    500M
    20K
  stderr: |+
  exit_code: 0
