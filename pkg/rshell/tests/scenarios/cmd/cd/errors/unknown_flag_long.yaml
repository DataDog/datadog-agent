description: cd rejects an unknown long flag with exit 1 and a stderr diagnostic.
skip_assert_against_bash: true
input:
  allowed_paths: ["$DIR"]
  script: |+
    cd --no-such-flag
expect:
  stdout: ""
  stderr: |+
    cd: unrecognized option '--no-such-flag'
    Try 'cd --help' for more information.
  exit_code: 1
