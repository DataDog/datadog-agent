description: cd inside $(...) is a subshell — it does not leak to the parent.
setup:
  files:
    - path: child/leaf
      content: ""
input:
  allowed_paths: ["$DIR"]
  script: |+
    p1=$(pwd)
    sub=$(cd child; pwd)
    p2=$(pwd)
    if [ "$p1" = "$p2" ] && [ "$sub" != "$p1" ]; then echo isolated; else echo leaked; fi
expect:
  stdout: |+
    isolated
  stderr: ""
  exit_code: 0
