description: chained cd a; cd b; cd c follows the path through nested directories.
setup:
  files:
    - path: a/b/c/leaf
      content: ""
input:
  allowed_paths: ["$DIR"]
  script: |+
    cd a
    cd b
    cd c
    pwd
expect:
  stdout_contains: ["/a/b/c"]
  stdout_contains_windows: ["\\a\\b\\c"]
  stderr: ""
  exit_code: 0
