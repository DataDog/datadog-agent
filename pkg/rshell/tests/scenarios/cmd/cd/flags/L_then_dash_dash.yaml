description: cd -L -- DIRECTORY accepts -L, then -- as end-of-flags, then a positional.
setup:
  files:
    - path: child/leaf
      content: ""
input:
  allowed_paths: ["$DIR"]
  script: |+
    cd -L -- child
    pwd
expect:
  stdout_contains: ["/child"]
  stdout_contains_windows: ["\\child"]
  stderr: ""
  exit_code: 0
