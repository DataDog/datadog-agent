description: cd -L - swaps to OLDPWD honouring the lexical .. rule (which has no effect on - itself).
setup:
  files:
    - path: a/leaf
      content: ""
    - path: b/leaf
      content: ""
input:
  allowed_paths: ["$DIR"]
  script: |+
    cd a
    cd ../b
    cd -L - >/dev/null
    pwd
expect:
  stdout_contains: ["/a"]
  stdout_contains_windows: ["\\a"]
  stderr: ""
  exit_code: 0
