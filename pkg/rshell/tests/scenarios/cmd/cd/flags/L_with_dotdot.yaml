description: cd -L resolves .. lexically — a/b/.. lands in a regardless of any symlinks above.
setup:
  files:
    - path: a/b/leaf
      content: ""
input:
  allowed_paths: ["$DIR"]
  script: |+
    cd a/b
    cd -L ..
    pwd
expect:
  stdout_contains: ["/a"]
  stdout_contains_windows: ["\\a"]
  stderr: ""
  exit_code: 0
