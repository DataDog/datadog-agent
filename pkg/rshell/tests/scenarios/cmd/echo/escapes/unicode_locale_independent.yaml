description: Echo -e with non-ASCII unicode is locale-independent (intentional divergence from bash which is locale-dependent).
# skip: rshell builtin error/output format differs from the reference implementation
skip_assert_against_bash: true
input:
  script: |+
    echo -e '\u00e9'
expect:
  stdout: "é\n"
  stderr: ""
  exit_code: 0
