# skip: command-not-found error format differs from bash (no script:line prefix)
skip_assert_against_bash: true
description: Valid commands execute normally after a command-not-found error.
input:
  script: |+
    echo first
    nonexistent_cmd
    echo third
expect:
  stdout: |+
    first
    third
  stderr: |+
    rshell: nonexistent_cmd: unknown command
    Run 'help' to see available commands.
  exit_code: 0
