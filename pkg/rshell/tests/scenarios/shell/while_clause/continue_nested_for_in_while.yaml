description: continue inside a for nested in a while affects only the for; the while keeps iterating until its cond fails.
input:
  script: |+
    i=
    while [ "$i" != aa ]; do
      i="${i}a"
      for j in 1 2; do
        continue
        echo unreachable
      done
      echo "after-for $i"
    done
    echo done
expect:
  stdout: |+
    after-for a
    after-for aa
    done
  stderr: |+
  exit_code: 0
