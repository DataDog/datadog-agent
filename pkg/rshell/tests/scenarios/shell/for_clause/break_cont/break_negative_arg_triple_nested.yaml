description: Break with an out-of-range negative operand in triple nested for loops unwinds all three, not just the innermost.
input:
  script: |+
    for i in 1 2 3; do
      echo in $i
      for j in a b c; do
        echo in $i $j
        for k in + -; do
          echo in $i $j $k
          break -1
          echo out $i $j $k
        done
        echo out $i $j
      done
      echo out $i
    done
    echo done $?
expect:
  stdout: |+
    in 1
    in 1 a
    in 1 a +
    done 1
  stderr_contains:
    - "break"
    - "-1"
    - "loop count out of range"
  exit_code: 0
