description: Break with an out-of-range negative operand unwinds every enclosing loop, not just the innermost one.
input:
  script: |+
    for i in 1 2; do
      echo outer $i
      for j in 1 2; do
        echo inner $i $j
        break -1
        echo unreached $i $j
      done
      echo after-inner $i
    done
    echo done
expect:
  stdout: |+
    outer 1
    inner 1 1
    done
  stderr_contains:
    - "break"
    - "-1"
    - "loop count out of range"
  exit_code: 0
