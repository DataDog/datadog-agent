description: In remediation mode, >| overwrites a file within AllowedPaths (same as > but explicit clobber).
input:
  script: |+
    echo first > out.txt
    echo second >| out.txt
    cat out.txt
  allowed_paths: ["$DIR:rw"]
  mode: "remediation"
expect:
  stdout: |+
    second
  stderr: |+
  exit_code: 0
