# skip: allowed_commands is rshell-specific sandbox behaviour with no bash equivalent.
description: Execution continues after a blocked command (non-fatal).
skip_assert_against_bash: true
input:
  allowed_commands:
    - rshell:echo
  script: |+
    cat /dev/null
    echo after
expect:
  stdout: |+
    after
  stderr: |+
    rshell: cat: command not allowed
  exit_code: 0
