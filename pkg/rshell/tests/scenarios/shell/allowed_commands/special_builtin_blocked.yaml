# skip: allowed_commands is rshell-specific sandbox behaviour with no bash equivalent.
description: POSIX special builtins (`:`, `true`) are gated by allowed_commands like any other command; subsequent allowed commands still run.
skip_assert_against_bash: true
input:
  allowed_commands:
    - rshell:echo
  script: |+
    :
    echo after
expect:
  stdout: |+
    after
  stderr: |+
    rshell: :: command not allowed
  exit_code: 0
