# skip: allowed_commands is rshell-specific sandbox behaviour with no bash equivalent.
skip_assert_against_bash: true
description: A blocked command is rejected before its input redirect target is opened.
input:
  allowed_paths: ["$DIR"]
  allowed_commands:
    - rshell:echo
  script: |+
    cat < missing.txt
    echo after
expect:
  stdout: |+
    after
  stderr: |+
    rshell: cat: command not allowed
  exit_code: 0
