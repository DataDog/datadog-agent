description: continue inside a for nested in an until affects only the for; the until keeps iterating.
input:
  script: |+
    i=
    until [ "$i" = aa ]; do
      i="${i}a"
      for j in 1 2; do
        continue
        echo unreachable
      done
      echo "after-for $i"
    done
    echo done
expect:
  stdout: |+
    after-for a
    after-for aa
    done
  stderr: |+
  exit_code: 0
