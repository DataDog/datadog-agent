description: continue inside an else-branch jumps to the next iteration of the enclosing until.
input:
  script: |+
    i=
    until [ "$i" = aa ]; do
      i="${i}a"
      if false; then
        :
      else
        continue
      fi
      echo unreachable
    done
    echo "i=$i"
expect:
  stdout: |+
    i=aa
  stderr: |+
  exit_code: 0
