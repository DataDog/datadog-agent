description: Datadog Private Action Runner - On-Demand Executor
command: '__INSTALL_ROOT__/bin/agent/privateactionrunner.exe'
args:
  - run-executor
  - --executor-socket
  - '\\.\pipe\dd-par-executor'
  - --ipc-cert-file
  - '__ETC_ROOT__/ipc_cert.pem'
  - --cfgpath
  - '__ETC_ROOT__/datadog.yaml'
auto_start: false
condition_path_exists: '__INSTALL_ROOT__/bin/agent/privateactionrunner.exe'
restart: never
stdout: inherit
stderr: inherit
