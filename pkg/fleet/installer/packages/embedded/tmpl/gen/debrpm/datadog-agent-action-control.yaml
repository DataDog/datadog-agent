description: Datadog Private Action Runner - Control Plane
command: /opt/datadog-agent/embedded/bin/par-control
args:
  - --config
  - ${DD_CONF_DIR}/datadog.yaml
  - --config-helper
  - /opt/datadog-agent/embedded/bin/privateactionrunner
  - --enroll-command
  - /opt/datadog-agent/embedded/bin/privateactionrunner
  - rotate-identity
  - --cfgpath
  - ${DD_CONF_DIR}/datadog.yaml
auto_start: true
# par-control drains for at most 170 seconds, including terminal publication.
stop_timeout: 180
condition_path_exists: >-
  /opt/datadog-agent/embedded/bin/par-control
restart: on-failure
restart_sec: 2
start_limit_interval_sec: 10
start_limit_burst: 5
environment_file: -${DD_CONF_DIR}/environment
stdout: inherit
stderr: inherit
