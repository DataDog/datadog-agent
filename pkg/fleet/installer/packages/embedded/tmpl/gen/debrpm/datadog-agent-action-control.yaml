description: Datadog Private Action Runner - Control Plane
command: /opt/datadog-agent/embedded/bin/par-control
args:
  - --config
  - ${DD_CONF_DIR}/datadog.yaml
  - --enroll-command
  - /opt/datadog-agent/embedded/bin/privateactionrunner
  - rotate-identity
  - --cfgpath
  - ${DD_CONF_DIR}/datadog.yaml
auto_start: true
condition_path_exists: /opt/datadog-agent/embedded/bin/par-control
restart: on-failure
restart_sec: 2
start_limit_interval_sec: 10
start_limit_burst: 5
environment_file: -${DD_CONF_DIR}/environment
stdout: inherit
stderr: inherit
