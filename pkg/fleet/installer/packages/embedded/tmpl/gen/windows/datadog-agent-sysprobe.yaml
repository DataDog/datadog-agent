description: Datadog System Probe
command: '__SYSPROBE_INSTALL_ROOT__/bin/agent/system-probe.exe'
# No args, matching the ImagePath the MSI registers for datadog-system-probe. The binary
# takes the CLI path here because its parent is dd-procmgrd rather than services.exe, so
# it prepends `run` itself and resolves system-probe.yaml from the default location.
#
# The core Agent skips the datadog-system-probe SCM service whenever this file is installed
# and process_manager.enabled is set, so exactly one supervisor owns the binary, the named
# pipe and the kernel drivers.
auto_start: true
condition_path_exists: '__SYSPROBE_INSTALL_ROOT__/bin/agent/system-probe.exe'
# Transcribes the legacy SCM decision in cmd/agent/subcommands/run/dependent_services_windows.go:
# any-of over these keys, the first four from system-probe.yaml and the last from datadog.yaml.
condition_config_any:
  - path: '__SYSPROBE_ETC_ROOT__/system-probe.yaml'
    keys:
      - network_config.enabled
      - system_probe_config.enabled
      - windows_crash_detection.enabled
      - runtime_security_config.enabled
  - path: '__SYSPROBE_ETC_ROOT__/datadog.yaml'
    keys:
      - software_inventory.enabled
# An externally managed system-probe makes every term above moot: startSystemProbe returns
# ErrNotEnabled, sleeps 5 seconds and exits 0, whatever else is enabled. The veto is scoped
# to this entry because process-agent reads the same keys and has to keep running, since
# talking to that external system-probe is its job.
condition_config_none:
  - path: '__SYSPROBE_ETC_ROOT__/system-probe.yaml'
    keys:
      - system_probe_config.external
# on-failure is load-bearing, not a default. A system-probe that decides it is not enabled
# sleeps 5 seconds and exits 0; under `always` that would be a permanent respawn loop.
restart: on-failure
restart_sec: 2
start_limit_interval_sec: 10
start_limit_burst: 5
stdout: inherit
stderr: inherit
