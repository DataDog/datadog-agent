description: Datadog Security Agent
command: '__SECURITY_INSTALL_ROOT__/bin/agent/security-agent.exe'
args:
  - start
  - -c
  - '__SECURITY_ETC_ROOT__/datadog.yaml'
  - -c
  - '__SECURITY_ETC_ROOT__/security-agent.yaml'
  - --sysprobe-config
  - '__SECURITY_ETC_ROOT__/system-probe.yaml'
# Keep true with SCM suppression: false leaves no security-agent when the legacy service is skipped.
auto_start: true
condition_path_exists: '__SECURITY_INSTALL_ROOT__/bin/agent/security-agent.exe'
# cws Servicedef (sysprobeConf). Compliance-only omitted: Windows does not start SCM for that today.
condition_config_any:
  - path: '__SECURITY_ETC_ROOT__/system-probe.yaml'
    keys:
      - runtime_security_config.enabled
# on-failure: disabled security-agent exits 0; `always` would respawn.
restart: on-failure
restart_sec: 2
start_limit_interval_sec: 10
start_limit_burst: 5
stdout: inherit
stderr: inherit
