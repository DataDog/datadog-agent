description: Datadog Trace Agent
command: '__TRACE_INSTALL_ROOT__/bin/agent/trace-agent.exe'
args:
  - --config
  - '__TRACE_ETC_ROOT__/datadog.yaml'
# Keep true with SCM suppression: false leaves no trace-agent when the legacy service is skipped.
auto_start: true
condition_path_exists: '__TRACE_INSTALL_ROOT__/bin/agent/trace-agent.exe'
# Any-of matching utils.IsAPMEnabled (apm_config.enabled | error_tracking_standalone).
condition_config_any:
  - path: '__TRACE_ETC_ROOT__/datadog.yaml'
    keys:
      - apm_config.enabled
      - apm_config.error_tracking_standalone.enabled
restart: on-failure
restart_sec: 2
start_limit_interval_sec: 10
start_limit_burst: 5
stdout: inherit
stderr: inherit
