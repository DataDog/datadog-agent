syntax = "proto3";

package datadog.otlp.stats;

option go_package = "github.com/DataDog/datadog-agent/pkg/opentelemetry-mapping-go/otlp/metrics/tracestats/pb";

// OTLPIntakeStatsPayload is the stats payload emitted by OTLP metric intakes.
// This subset preserves the backend OTLPIntakeStatsPayload field numbers.
message OTLPIntakeStatsPayload {
  reserved 1;
  string host_name = 2;
  reserved 3;
  repeated StatsBucketV3 stats = 4;
  repeated string host_tags = 5;
  reserved 8, 9, 10;
  string source = 11;
  bool aggregate = 12;
  string container_id = 13;
}

message StatsBucketV3 {
  int64 start = 1;
  int64 duration = 2;
  repeated GroupedStats stats = 3;

  message GroupedStats {
    string name = 1;
    string env = 2;
    string service = 3;
    string resource = 4;
    string version = 5;
    int32 http_status_code = 6;
    bool synthetics = 7;
    repeated Tag other_tags = 8;
    bool has_hits = 9;
    bool has_errors = 10;
    bool has_duration = 11;
    uint64 hits = 12;
    uint64 errors = 13;
    uint64 duration = 14;
    uint64 top_level_hits = 15;
    reserved 22, 23, 24;
    reserved 26;
    string span_kind = 27;
    repeated string peer_tags = 28;
    Trilean is_trace_root = 30;
    string grpc_status_code = 32;
    bytes ok_sparse_sketch = 33;
    bytes error_sparse_sketch = 34;
  }
}

enum Trilean {
  NOT_SET = 0;
  TRUE = 1;
  FALSE = 2;
}

message Tag {
  string name = 1;
  string value = 2;
}

// SparseSketch is the sparse representation of an OTel explicit histogram.
message SparseSketch {
  repeated sint32 k = 1 [packed = true];
  repeated uint32 n = 2 [packed = true];
  SparseSketchBasic basic = 3;
}

message SparseSketchBasic {
  double sum = 1;
  int64 count = 3;
  double min = 4;
  double max = 5;
}
