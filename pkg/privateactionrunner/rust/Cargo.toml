[package]
name = "par-control"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Private Action Runner control plane (always-on, on-demand executor orchestration)"

[lib]
name = "par_control"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "par-control"
path = "src/bins/par-control.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["derive"] }
# Shared agent logger (same one dd-procmgrd uses), so the `log` macros actually
# emit: par-control's stdout is inherited by the process manager.
dd-agent-log.workspace = true
http-body-util.workspace = true
# OPMS client: hyper + native-tls, i.e. real HTTPS on the system OpenSSL, avoiding
# rustls/ring for cargo-deny, with OPMS trust coming from the system store.
#
# That is what the workspace `ureq` was originally configured for, but ureq cannot
# express it: its native-tls support is gated on the `native-tls` feature, which
# force-enables `native-tls-webpki-roots` (`webpki-root-certs`,
# CDLA-Permissive-2.0, rejected by cargo-deny). Selecting only
# `native-tls-no-default` pulls the native-tls *library* in but compiles out every
# native-tls code path in ureq, so any https:// request panics at runtime. Cargo
# features are additive, so the webpki roots cannot be subtracted. native-tls needs
# no bundled roots anyway — it finds the system store via openssl-probe.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
log.workspace = true
native-tls.workspace = true
# Already fully resolved/linked as a native-tls dependency (same system OpenSSL,
# no new C library); this just makes it directly importable so tls.rs can
# re-encode the IPC key's SEC1 PEM as PKCS8 before native_tls::Identity::from_pkcs8,
# which requires the PKCS8 header. See tls.rs.
openssl.workspace = true
p256 = { workspace = true, features = ["ecdsa", "pem", "pkcs8", "std"] }
prost.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "time",
  "sync",
] }
tokio-native-tls.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["transport"] }
tonic-prost.workspace = true
tower.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
