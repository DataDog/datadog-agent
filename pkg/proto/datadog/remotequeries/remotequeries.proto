syntax = "proto3";

package datadog.remotequeries;

option go_package = "pkg/proto/pbgo/core"; // golang

message RemoteQueryTarget {
    string host = 1;
    int32 port = 2;
    string dbname = 3;
    string database_instance = 4;
}

// RemoteQueryUploadLimits carries the backend-owned effective limits of the paged
// JSON result contract. The backend (its-agent) derives and injects every value; the
// Agent forwards them opaquely and the integration enforces them.
message RemoteQueryUploadLimits {
    int64 max_file_bytes = 1;
    int64 max_result_bytes = 2;
    int64 max_row_bytes = 3;
    int64 max_columns = 4;
    int64 max_schema_bytes = 5;
    int64 max_pages = 6;
    int64 timeout_ms = 7;
}

// RemoteQueryResultDelivery carries the backend-injected upload-session
// instructions for one run: the authoritative run/task identity used by every
// page envelope, the page artifact contract version, the its-agent-intake
// session handle, and the effective limits. The session is identified solely by
// upload_id and authorized by the org API/application keys plus the intake's
// org binding, so no upload credential crosses the AgentSecure boundary; the
// Agent forwards base_url to the integration check, which performs the HTTP
// upload itself, and bulk result bytes never traverse AgentSecure.
message RemoteQueryResultDelivery {
    string run_id = 1;
    string task_id = 2;
    int32 artifact_version = 3;
    string upload_id = 4;
    string base_url = 5;
    // 6 was the per-session upload token: the session is identified solely by
    // upload_id and authorized by the org API/application keys plus the intake's
    // org binding, so no upload credential crosses the AgentSecure boundary.
    reserved 6;
    // 7 was part_bytes: the direct-page contract uploads one complete bounded page
    // per request, so no public part sizing crosses the AgentSecure boundary.
    reserved 7;
    RemoteQueryUploadLimits limits = 8;
}

// RemoteQueryTraceContext carries the optional trace-continuation metadata of the
// private-action-runner trace active at the Remote Queries action boundary. It is
// observability metadata only: never signed task data and never an authorization,
// routing, or result-validation input. parent_id is the action.run span's own ID, so
// the integration's traced intake requests are its children.
message RemoteQueryTraceContext {
    uint64 trace_id = 1;
    uint64 parent_id = 2;
    int32 sampling_priority = 3;
}

// RemoteQueryExecuteRequest is the credential-free Remote Queries request. The
// result contract is fixed: the integration produces bounded JSON page files
// and uploads them directly to its-agent-intake. There is no inline result-byte
// path, no caller-provided format, and no COPY mode. include_schema controls
// the optional per-page schema emission; result_delivery is required.
// match_fingerprint is the opaque fingerprint returned by RemoteQueryResolve
// for the selected match: when non-empty, the Agent revalidates the target
// resolution before any SQL execution and fails closed with
// target_resolution_stale when the selected match no longer holds. Empty means
// no revalidation (local and direct paths keep working unchanged).
// trace_context is the optional observability metadata of the active PAR trace;
// a request without it, and a receiver that finds it absent or invalid, executes
// exactly as before.
message RemoteQueryExecuteRequest {
    string integration = 1;
    RemoteQueryTarget target = 2;
    string query = 3;
    bool include_schema = 4;
    RemoteQueryResultDelivery result_delivery = 5;
    string match_fingerprint = 6;
    RemoteQueryTraceContext trace_context = 7;
}

message RemoteQueryStreamMetadata {
    string operation = 1;
    string integration = 2;
    map<string, string> attributes = 3;
}

message RemoteQueryStreamFinal {
    string status = 1;
    // upload_receipt is the compact run receipt, set after the integration
    // finalizes the run-scoped upload session. It is the only result identity
    // and accounting that crosses the AgentSecure boundary; bulk page bytes
    // and schema stay in the uploaded page artifacts.
    RemoteQueryUploadReceipt upload_receipt = 2;
    map<string, string> attributes = 3;
    // execution_diagnostics is the optional, bounded producer timing summary the
    // integration emits beside the receipt. It is a fixed-shape aggregate: never
    // bulk bytes, never per-page arrays. The Agent validates it before forwarding
    // and drops malformed diagnostics while preserving the receipt.
    optional RemoteQueryExecutionDiagnostics execution_diagnostics = 4;
}

// RemoteQueryUploadReceipt is the compact run receipt: exactly uploadId,
// pageCount, totalRows, totalBytes. Bucket names, object paths, and checksums
// are owned by the intake control plane.
message RemoteQueryUploadReceipt {
    string upload_id = 1;
    int64 page_count = 2;
    int64 total_rows = 3;
    int64 total_bytes = 4;
}

// RemoteQueryProducerDiagnostics is the bounded, fixed-shape aggregate of
// producer (integration-side) execution timings in milliseconds. All fields
// are optional: missing means not measured, zero means the phase ran and
// completed in under 1 ms. No per-page arrays and no identifiers cross the
// AgentSecure boundary; only these fixed aggregates do.
message RemoteQueryProducerDiagnostics {
    optional int64 total_ms = 1;
    optional int64 database_setup_ms = 2;
    optional int64 database_fetch_ms = 3;
    optional int64 encode_and_page_build_ms = 4;
    optional int64 page_upload_ms = 5;
    optional int64 finalize_ms = 6;
    optional int64 other_ms = 7;
    optional int64 time_to_first_page_ms = 8;
    optional int64 page_count = 9;
    optional int64 row_count = 10;
    optional int64 byte_count = 11;
    optional int64 upload_attempt_count = 12;
    optional int64 upload_retry_count = 13;
    optional int64 page_upload_min_ms = 14;
    optional int64 page_upload_p50_ms = 15;
    optional int64 page_upload_p95_ms = 16;
    optional int64 page_upload_max_ms = 17;
}

// RemoteQueryExecutionDiagnostics wraps the optional producer diagnostics that
// cross AgentSecure on final and error stream events. The worker (its-agent)
// validates them against the verified upload receipt and assembles the full
// run record with worker-owned stages; only this bounded object crosses AP.
message RemoteQueryExecutionDiagnostics {
    optional int32 contract_version = 1;
    optional RemoteQueryProducerDiagnostics producer = 2;
}

message RemoteQueryStreamError {
    string code = 1;
    string message = 2;
    bool retryable = 3;
    map<string, string> attributes = 4;
    // execution_diagnostics mirrors the final event's optional producer timing
    // summary so a failed run keeps its honest phase breakdown; the sanitized
    // error stays authoritative for the failure itself.
    optional RemoteQueryExecutionDiagnostics execution_diagnostics = 5;
}

message RemoteQueryExecuteStreamEvent {
    uint64 sequence = 1;
    // 3 was the inline data event: bulk result bytes never traverse AgentSecure.
    reserved 3;
    oneof event {
        RemoteQueryStreamMetadata metadata = 2;
        RemoteQueryStreamFinal final = 4;
        RemoteQueryStreamError error = 5;
    }
}

message RemoteQueryExecuteChunk {
    reserved 1;
    int32 chunk_index = 2;
    bool final = 3;
    RemoteQueryExecuteStreamEvent event = 4;
}

// RemoteQueryResolveRequest is the side-effect-free target resolution request:
// it carries only the integration and target. No query, no result delivery, and
// no credentials can cross this boundary; the resolver re-runs the same
// integration matcher execute uses and answers with the structured zero/one/many
// outcome plus an opaque match fingerprint for the unique case.
message RemoteQueryResolveRequest {
    string integration = 1;
    RemoteQueryTarget target = 2;
}

// RemoteQueryResolveResponse is the structured resolution outcome. status is one
// of matched, target_not_found, ambiguous_target, or resolution_error; when
// status is matched, match_fingerprint carries the opaque versioned fingerprint
// the caller revalidates on execute. The error fields mirror the status when set
// and never carry credentials or raw integration configuration.
message RemoteQueryResolveResponse {
    string status = 1;
    string match_fingerprint = 2;
    string error_code = 3;
    string error_message = 4;
}
