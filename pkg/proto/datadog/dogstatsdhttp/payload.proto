syntax = "proto3";

package pb;

option go_package = "pkg/proto/pbgo/dogstatsdhttp";

// On the aggregation endpoint, a payload carries the intermediate series one client aggregated
// over one window: metadata is absent and metricData occurs once. The client id, window
// timestamp and duration, and sequence number are in the URL, origin metadata is in the
// x-dsd-ld and x-dsd-ed headers.
message Payload {
  reserved 1; // for compatibility with agentpayload.MetricPayload.series
  Metadata metadata = 2;
  MetricData metricData = 3;
}

message Metadata {
  repeated string tags = 1;
  repeated string resources = 2; // even number of elements, [Type, Name] pairs
}

// Field numbers 1-31 follow intake v3 and 32-63 are left to intake v3. Numbers 64-99 are
// dogstatsd http columns, 100 and up belong to the agent-internal spool format.
//
// Aggregation endpoint
//
// Every field is length-delimited (packed or bytes) and occurs at most once. Unknown fields
// are skipped.
//
// Each entry has a single point, for the window in the URL: intervals, numPoints and
// timestamps are absent. An absent per-entry ref column (nameRefs, tagsetRefs, resourcesRefs,
// sourceTypeNameRefs, originInfoRefs) means every entry refers to index zero.
//
// Entries are in primary key order: cardinality, tagset, resources, name. Each key occurs
// once, tagsets and resource sets are deduplicated. Strings compare by length, then bytewise.
// Tagsets and resource sets compare by length, then element-wise in ascending order;
// resources compare by type, then name. Cardinality compares by its value in the types column.
//
// Accepted metric types, and what each entry consumes from valsUint64, setStrs and vals (the
// column selected by valueType):
//
//   Count           vals [sum].
//   MergeableGauge  vals [value], valsUint64 [offset]. The offset of the latest measurement
//                   from the window start, in milliseconds, less than the window duration.
//   Histogram       valsUint64 [n], n >= 1, then vals [value_1, weight_1, ...,
//                   value_n, weight_n]. Values are distinct and ascending. Weights are finite
//                   and > 0, the sum of 1/sample_rate of the observations, so they can be
//                   fractional. valueType fits values and weights alike, and is never Zero.
//                   Timings are sent as histograms.
//   Set             valsUint64 [n], n >= 1, and n members in setStrs, distinct and in
//                   shortlex order. valueType is Zero.
//   Sketch          A distribution, in the agent's default DDSketch mapping (relative accuracy
//                   1/128, min value 1e-9). Laid out as below, with one key/count pair per
//                   bin. Bin keys are strictly ascending, counts are > 0 and sum to Cnt.
//
// Gauge and Rate are rejected.
message MetricData {
  // Dictionaries
  // All dictionary indexes are base-1, zero implicitly represents an empty value.
  bytes dictNameStr = 1;                // varint length + value
  bytes dictTagStr = 2;                 // varint length + value
  repeated sint64 dictTagsets = 3;      // length, delta encoded set of indexes into dictTagsStr

  bytes dictResourceStr = 4;            // varint length + value
  repeated int64 dictResourceLen = 5;   // number of elements in Type and Name arrays
  repeated sint64 dictResourceType = 6; // delta encoded set of indexes into dictResourceStr
  repeated sint64 dictResourceName = 7; // delta encoded set of indexes into dictResourceStr

  bytes dictSourceTypeName = 8;         // varint length + value
  repeated int32 dictOriginInfo = 9;    // (product, category, service) tuples

  // One entry per time series
  // type = metricType | valueType | metricFlags | tagCardinality, one nibble each
  repeated uint64 types = 10;
  repeated sint64 nameRefs = 11;        // index into dictNameStr, entire array is delta encoded
  repeated sint64 tagsetRefs = 12;      // index into dictTagsets, entire array is delta encoded
  repeated sint64 resourcesRefs = 13;   // index into dictResourceLen, entire array is delta encoded
  repeated uint64 intervals = 14;
  repeated uint64 numPoints = 15;
  repeated sint64 sourceTypeNameRefs = 23;  // index into dictSourceTypeName, entire array is delta encoded
  repeated sint64 originInfoRefs = 24;      // index into dictOriginInfo, entire array is delta encoded

  // intake v3 unit dictionary and refs, 27-29 reserved and pointFlags
  reserved 25 to 30;

  // each metric has numPoints values in this section
  repeated sint64 timestamps = 16;      // entire array delta encoded
  repeated sint64 valsSint64 = 17;      // or
  repeated float valsFloat32 = 18;      // or
  repeated double valsFloat64 = 19;     // based on valueType
  repeated uint64 valsUint64 = 31;      // independent of valueType
  repeated uint64 sketchNumBins = 20;
  repeated sint32 sketchBinKeys = 21;   // per-metric sequence is delta encoded
  repeated uint32 sketchBinCnts = 22;
  // sketch summary Sum, Min, Max are encoded as three consecutive elements in one of vals using valueType
  // sketch summary Cnt is always encoded in valSint64, following Max if they share a column
  // sketch summary Avg is reconstructed as Sum/Cnt in the intake

  bytes setStrs = 64;                   // varint length + value
}

enum metricType {
  UNUSED = 0;
  Count = 1;
  Rate = 2;
  Gauge = 3;
  Sketch = 4;
  reserved 5 to 7; // intake v3: reserved, ExplicitHistogram, ExponentialHistogram
  MergeableGauge = 8;
  Histogram = 9;
  Set = 10;
}

enum valueType {
  Zero    = 0x00;  // value is zero, not stored explicitly
  Sint64  = 0x10;  // value is stored in valsSint64
  Float32 = 0x20;  // value is stored in valsFloat32
  Float64 = 0x30;  // value is stored in valsFloat64
}

// Cardinality of the origin tags the agent attaches to the metric. Occupies the
// nibble above metricFlags, which shares its own nibble with the intake payload.
// https://docs.datadoghq.com/getting_started/tagging/assigning_tags/?tab=containerizedenvironments#tags-cardinality
enum tagCardinality {
  Unset = 0x0000;  // agent falls back to its configured dogstatsd cardinality
  None  = 0x1000;
  Low   = 0x2000;
  Orch  = 0x3000;
  High  = 0x4000;
}

enum metricFlags {
  flagNone    = 0;
  flagNoIndex = 0x100; // metric should not be indexed (equivalent to origin metric type == agent_hidden in v2)
  // 0x200 is flagHasUnit in the intake payload, keep it free here
}
