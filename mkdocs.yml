      - Linux: dev/debug/agent/linux.md
      - Windows: dev/debug/agent/windows.md
    - Memory profiling:
      - Overview: dev/debug/memory/index.md
      - Go: dev/debug/memory/go.md
      - Python: dev/debug/memory/python.md
