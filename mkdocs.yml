watch:
- .go-version

plugins:
  # Enable for bug reports
  # info: {}
  # Built-in
  search: {}
  # Extra
  glightbox: {}

markdown_extensions:
# Built-in
- zensical.extensions.macros:
    module_name: doc/.hooks/inject_variables
    on_error_fail: true
    on_undefined: strict
    # Macros are rendered before code blocks are extracted, so every delimiter must be a sequence
    # that never appears in quoted code. Jinja's defaults collide with Go composite literals,
    # GitHub Actions expressions and `attr_list` identifiers such as `{#custom-id}`.
    j2_variable_start_string: "<<<"
    j2_variable_end_string: ">>>"
    j2_block_start_string: "<<%"
    j2_block_end_string: "%>>"
    j2_comment_start_string: "<<#"
    j2_comment_end_string: "#>>"
- markdown.extensions.abbr:
- markdown.extensions.attr_list:
- markdown.extensions.footnotes:
- markdown.extensions.md_in_html:
- markdown.extensions.meta:
- markdown.extensions.tables:
- markdown.extensions.toc:
    permalink: true
# Extra
- pymdownx.arithmatex:
- pymdownx.betterem:
    smart_enable: all
- pymdownx.blocks.admonition:
    # https://squidfunk.github.io/mkdocs-material/reference/admonitions/#supported-types
    types:
    - abstract
    - bug
    - danger
    - example
    - failure
    - info
    - note
    - question
    - quote
    - success
    - tip
    - warning
- pymdownx.blocks.details:
    # Same as admonition types except prefixed by `details-`
    types:
    - name: details-abstract
      class: abstract
    - name: details-bug
      class: bug
    - name: details-danger
      class: danger
    - name: details-example
      class: example
    - name: details-failure
      class: failure
    - name: details-info
      class: info
    - name: details-note
      class: note
    - name: details-question
      class: question
    - name: details-quote
      class: quote
    - name: details-success
      class: success
    - name: details-tip
      class: tip
    - name: details-warning
      class: warning
- pymdownx.blocks.tab:
    alternate_style: true
    slugify: !!python/object/apply:pymdownx.slugs.slugify
      kwds:
        case: lower
- pymdownx.caret:
- pymdownx.critic:
- pymdownx.details:
- pymdownx.emoji:
    # Zensical's helpers support inlining icons and emoji:
    # https://zensical.org/docs/setup/extensions/python-markdown-extensions/#emoji
    emoji_index: !!python/name:zensical.extensions.emoji.twemoji
    emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    linenums_style: pymdownx-inline
    pygments_lang_class: true
- pymdownx.inlinehilite:
- pymdownx.keys:
- pymdownx.magiclink:
    repo_url_shortener: true
    repo_url_shorthand: true
    social_url_shortener: true
    social_url_shorthand: true
    normalize_issue_symbols: true
    provider: github
    user: DataDog
    repo: datadog-agent
- pymdownx.mark:
- pymdownx.progressbar:
- pymdownx.saneheaders:
- pymdownx.smartsymbols:
- pymdownx.snippets:
    check_paths: true
    base_path:
    - doc/.snippets
    # Repo root, so docs pages can embed a section of a normative in-repo file
    # (e.g. a codereview_guideline.md) rather than restating it.
    - .
    auto_append:
    - links.txt
    - abbrs.txt
- pymdownx.superfences:
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.tilde:

extra:
  navigation_roots:
  - url: arch/
    back_label: Back to main docs
    back_key: b
  - url: impl/
    back_label: Back to main docs
    back_key: b
  - url: dev/
