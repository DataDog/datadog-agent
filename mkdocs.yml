        - Use optional dependencies: impl/framework/component/how-to/optional-dependency.md
        - Add flare data: impl/framework/component/how-to/flare.md
        - Add a status provider: impl/framework/component/how-to/status.md
      - Guidelines: impl/framework/component/guideline.md
      - Reference:
        - Status providers: impl/framework/component/reference/status.md
    - Configuration schemas and settings:
