      - Annotated examples: impl/framework/config/example.md
      - Add and document settings: impl/framework/config/setting.md
      - Validate and generate output: impl/framework/config/workflow.md
      - Reference:
        - Keywords: impl/framework/config/reference/keyword.md
        - CLI commands: impl/framework/config/reference/cli.md
  - Integrations and checks:
