      - Required: dev/env/setup/required.md
      - Optional: dev/env/setup/optional.md
      - Manual: dev/env/setup/manual.md
    - Development environments:
      - Environment usage: dev/env/dev/usage.md
      - Image reference: dev/env/dev/image.md
    - Lab environments:
      - dev/env/lab/index.md
      - Kind: dev/env/lab/kind.md
  - Building:
    - Standalone agents: dev/build/standalone.md
    - Distribution packages: dev/build/package.md
