site_name: Datadog Agent
site_description: The home of Datadog Agent developer documentation
site_author: Datadog
site_url: https://datadoghq.dev/datadog-agent/
repo_name: datadog/datadog-agent
repo_url: https://github.com/DataDog/datadog-agent
edit_uri: blob/main/doc
copyright: Copyright &copy; Datadog, Inc. 2024-present

docs_dir: doc
site_dir: site
theme:
  name: material
  custom_dir: doc/.overrides
  variant: classic
  language: en
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/images/favicon.ico
  logo: assets/images/logo.svg
  icon:
    repo: fontawesome/brands/github-alt
  palette:
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: custom
    toggle:
      icon: material/weather-night
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: custom
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  features:
  - content.action.edit
  - content.code.copy
  - content.tabs.link
  - content.tooltips
  - navigation.expand
  - navigation.footer
  - navigation.indexes
  - navigation.instant
  - navigation.sections
  - navigation.tabs
  - navigation.tabs.sticky

