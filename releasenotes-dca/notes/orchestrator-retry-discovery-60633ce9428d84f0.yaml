# Each section from every release note are combined when the
# CHANGELOG-DCA.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
fixes:
  - |
    The orchestrator check now retries the Kubernetes API discovery on its next runs when it fails entirely, or
    partially for API groups the check collects, and enables the resource collectors that become available. Retries
    back off exponentially from about 20 seconds up to about 15 minutes between attempts until the discovery succeeds.
    When collector discovery is enabled, resources are collected only once the discovery has succeeded, at least
    partially.
    Previously a failed discovery could leave the check running without collecting some or all resources until it
    was rescheduled.
