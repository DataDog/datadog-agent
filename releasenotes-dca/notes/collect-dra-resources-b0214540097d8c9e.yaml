---
features:
  - |
    Add support for collecting Kubernetes Dynamic Resource Allocation (DRA)
    ``ResourceClaim`` and ``ResourceSlice`` objects into the Cluster Agent's
    workload metadata store. This is the foundation for accelerator allocation
    observability: it makes DRA device claims, allocations, and the devices
    advertised by DRA drivers available for cluster-level checks. Enable with
    ``cluster_agent.dra.enabled: true`` (disabled by default).
