---
features:
  - |
    The ``orchestrator_pod`` check supports a ``node_selector`` instance option
    to report the pods of the nodes matching the label selector, for example nodes without a node agent.
    The pods of each node are reported with the node as host.
    With ``node_selector`` the check runs in the Cluster Agent, where only the leader reports,
    or as a cluster check in cluster check runners.
    ``node_selector`` is required in the Cluster Agent and in cluster checks,
    and rejected in node agent configurations, where the check keeps reporting the pods of the local node.
