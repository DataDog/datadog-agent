# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
enhancements:
  - |
    Reduce the Cluster Agent's APM self-tracing volume by removing low-value spans.
    Per-message metadata stream spans (``sendDiff``, ``sendKeepalive``), the
    ``clusterID`` request child span, and leadership event spans
    (``leader_warmup``, ``leadership_lost``, ``leadership_change``) are no longer
    emitted; leadership transitions are logged instead. The ``check_names`` tag on
    ``cluster_checks.dispatcher.schedule`` is now deduplicated and capped at 10 names.
