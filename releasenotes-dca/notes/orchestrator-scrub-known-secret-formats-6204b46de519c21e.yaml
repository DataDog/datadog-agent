---
security:
  - |
    The orchestrator check now redacts credentials recognized by their format,
    whatever the surrounding name: JWTs, PEM and PGP private keys, tokens and API
    keys of GitHub, GitLab, Slack, npm, Anthropic, OpenAI, Stripe, SendGrid, Google,
    Hugging Face, HashiCorp Vault, Databricks, DigitalOcean, Grafana, Sentry,
    Linear, New Relic, PyPI, Shopify, Doppler, Postman, Atlassian and Azure AD,
    passwords in ``scheme://user:password@host`` URLs, and bearer tokens. This
    applies to pod and pod template environment variables, command lines, probe
    headers, and annotations, and to custom resource fields. Environment variables
    of pods and pod templates whose name ends in ``_TOKEN`` or ``_PAT`` are now
    redacted too, as they already were for custom resources.
