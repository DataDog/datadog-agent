---
security:
  - |
    The orchestrator check now redacts credentials recognized by their format
    (JWTs, GitHub, GitLab, Slack and npm tokens, and PEM private keys) in pod and
    pod template environment variables, command lines, probe headers, and
    annotations, and in custom resource fields, whatever the surrounding name.
    Environment variables of pods and pod templates whose name ends in ``_TOKEN``
    or ``_PAT`` are now redacted too, as they already were for custom resources.
