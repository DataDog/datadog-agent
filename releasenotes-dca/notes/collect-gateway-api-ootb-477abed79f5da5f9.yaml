---
enhancements:
  - |
    Orchestrator Explorer now collects Gateway API Gateway, HTTPRoute, GRPCRoute,
    TLSRoute, and ListenerSet resources by default when the resources are installed
    and the Cluster Agent has permission to list and watch them. Set
    ``orchestrator_explorer.custom_resources.ootb.gateway_api`` to ``false`` to
    disable their automatic collection.
