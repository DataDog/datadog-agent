---
features:
  - |
    On Amazon EKS, the Cluster Agent resolves the cluster's ARN, account, and Region with the
    EKS ``DescribeCluster`` API and serves them to node Agents on the new
    ``/api/v1/cluster/eks-identity`` endpoint. Node Agents attach them as the
    ``eks_cluster_arn``, ``eks_cluster_account``, and ``eks_cluster_region`` tags. The
    Cluster Agent also adds them to its own tags.

    This makes one outbound HTTPS call to the EKS API of the cluster's Region the first time the
    identity is needed, then caches the result. The call honors the standard AWS settings for
    credentials, Region, proxies, FIPS, dual-stack, and custom endpoints. The cluster name comes
    from the ``kubernetes.io/cluster/<name>`` EC2 tag of the Cluster Agent's node, or from
    ``cluster_name`` when that tag is not available. When the cluster CA mounted in the Cluster
    Agent pod can be read, the answer is used only if its certificate authority matches, so a
    stale or reused cluster name does not tag data with another cluster's ARN. When the CA
    cannot be read, only the EC2 tag name is used, without that check.

    The EC2 tag and the Region fallback are read through the instance metadata service, which a
    pod cannot reach on nodes with an IMDS hop limit of 1, such as Amazon Linux 2023 managed
    node groups by default. There, set ``cluster_name`` to the EKS cluster name, which is then
    checked against the cluster CA, and rely on ``AWS_REGION``, which EKS Pod Identity and IRSA
    inject into the pod.

    The endpoint answers 404 when the cluster is not EKS or no cluster name can be verified, and
    503 when the identity cannot be resolved. Every error answer is marked final or retryable
    for node Agents. A 503 for an identity that is not determined yet (the API server or AWS
    did not answer in time), in the Cluster Agent's first minute only, and one for a cached
    failure that expires within 5 seconds, are marked so node Agents retry them during their
    startup. Other answers are final for that startup, and node Agents pick the tags up in
    their host metadata once the identity is resolved.

    Grant ``eks:DescribeCluster`` on the cluster to the Cluster Agent's IAM role, with EKS Pod
    Identity or IAM Roles for Service Accounts (IRSA). The node instance role works only when
    the Cluster Agent pod can reach the instance metadata service. Without the permission, no
    identity tag is emitted, and the Cluster Agent logs one warning every 5 minutes.
