# Each section from every release note are combined when the
# CHANGELOG.rst is rendered. So the text needs to be worded so that
# it does not depend on any information only available in another
# section. This may mean repeating some details, but each section
# must be readable independently of the other.
#
# Each section note must be formatted as reStructuredText.
---
fixes:
  - |
    Workload autoscaling no longer counts pods in a terminal phase (``Failed``
    or ``Succeeded``, for example pods evicted under node pressure) as replicas
    of their workload. Such pods inflated ``DatadogPodAutoscaler``
    ``status.currentReplicas`` and the current replica count sent to external
    recommenders until they were deleted, which could keep the workload
    scaled to its maximum.
