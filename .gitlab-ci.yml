---
# Disposable Agent Community Forum demo pipeline.
workflow:
  name: "ddgl forum demo: $CI_COMMIT_REF_NAME"
  rules:
    - when: always

default:
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux:v145256842-2758ca30
  tags: ["arch:amd64", "specific:true"]
  retry: 0
  timeout: 3 minutes
  interruptible: true

variables:
  GIT_DEPTH: "1"
  GIT_SUBMODULE_STRATEGY: none
  DISABLE_GIT_CACHE: "true"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

stages: [retry, fix]

forum_demo:retry:
  stage: retry
  needs: []
  rules:
    - when: on_success
  script:
    - python3 .gitlab/forum-demo/flaky.py

forum_demo:fix:
  stage: fix
  needs:
    - job: forum_demo:retry
      artifacts: false
  rules:
    - when: on_success
  script:
    - python3 .gitlab/forum-demo/check_duration.py

forum_demo:optional:
  stage: retry
  needs: []
  rules:
    - when: always
  allow_failure: true
  script:
    - echo 'Intentional non-blocking demo failure.'
    - exit 1
