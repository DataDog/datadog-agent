# Minimal pipeline: single job to smoke-test calling AI Gateway from CI runners.
# See https://datadoghq.atlassian.net/wiki/spaces/AIP/pages/5402296601/AI+Gateway+FAQs#How-to-call-AI-Gateway-from-CI
#
# Notes:
# - Token for internal service authentication is generated with authanywhere
#   (https://datadoghq.atlassian.net/wiki/spaces/DEVX/pages/3733193227/Authanywhere),
#   audience `rapid-ai-platform`, like in https://github.com/DataDog/dd-source/pull/291048.
# - The gateway is reached at https://ai-gateway.us1.ddbuild.io: on EC2 CI runners
#   authanywhere requires `--dc us1.ddbuild.io` for its AWS-backed token getter.

ai_gateway_smoke_test:
  stage: test
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux:v141311605-333887d1
  tags: ["arch:amd64", "specific:true"]
  variables:
    AI_GATEWAY_DC: "us1.ddbuild.io"
    AI_GATEWAY_AUDIENCE: "rapid-ai-platform"
    AI_GATEWAY_MODEL: "anthropic/claude-haiku-4-5-20251001"
  script:
    # Install authanywhere, see
    # https://datadoghq.atlassian.net/wiki/spaces/DEVX/pages/3733193227/Authanywhere
    - |
      if [ "$(uname -m)" = "x86_64" ]; then AAA="amd64"; else AAA="arm64"; fi
      curl -sSfL -o authanywhere "https://binaries.ddbuild.io/dd-source/authanywhere/LATEST/authanywhere-linux-${AAA}"
      chmod +x authanywhere
    # Generate the internal authentication token (do NOT print it)
    - |
      AI_GATEWAY_TOKEN="$(./authanywhere --audience "${AI_GATEWAY_AUDIENCE}" --raw --dc "${AI_GATEWAY_DC}")"
      echo "Acquired AI Gateway token (${#AI_GATEWAY_TOKEN} chars) for audience '${AI_GATEWAY_AUDIENCE}' in dc '${AI_GATEWAY_DC}'"
    # Call the AI Gateway
    - |
      HTTP_CODE=$(curl -sS -o ai_gateway_response.json -w "%{http_code}" \
        -X POST "https://ai-gateway.${AI_GATEWAY_DC}/v1/chat/completions" \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer ${AI_GATEWAY_TOKEN}" \
        -H "source: datadog-agent" \
        -H "org-id: 2" \
        -d "{\"model\":\"${AI_GATEWAY_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with the single word: pong\"}],\"max_tokens\":16}")
      echo "--- AI Gateway response (HTTP ${HTTP_CODE}) ---"
      cat ai_gateway_response.json
      echo ""
      if [ "${HTTP_CODE}" != "200" ]; then
        echo "AI Gateway call failed with HTTP ${HTTP_CODE}"
        exit 1
      fi
      echo "AI Gateway smoke test succeeded"
