# Temporary CI configuration: a single job that reports the CPU quota
# available to the GitLab runner (cgroup v2 and v1).

check_cpu_quota:
  stage: test
  tags: ["arch:amd64", "specific:true"]
  variables:
    # Resource allocation for the Kubernetes executor runner
    KUBERNETES_CPU_REQUEST: "6"
    KUBERNETES_CPU_LIMIT: "6"
    KUBERNETES_MEMORY_REQUEST: "12Gi"
    KUBERNETES_MEMORY_LIMIT: "12Gi"
  script:
    - echo "=== Host CPU info ==="
    - nproc
    - grep -c ^processor /proc/cpuinfo || true
    - |
      echo "=== cgroup v2 (cpu.max: quota period) ==="
      if [ -f /sys/fs/cgroup/cpu.max ]; then
        cat /sys/fs/cgroup/cpu.max
      else
        echo "/sys/fs/cgroup/cpu.max not available"
      fi
    - |
      echo "=== cgroup v1 (cpu.cfs_quota_us / cpu.cfs_period_us) ==="
      if [ -f /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]; then
        cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us
        cat /sys/fs/cgroup/cpu/cpu.cfs_period_us
      else
        echo "/sys/fs/cgroup/cpu/cpu.cfs_quota_us not available"
      fi
    - |
      echo "=== cgroup v2 (memory.max) ==="
      if [ -f /sys/fs/cgroup/memory.max ]; then
        cat /sys/fs/cgroup/memory.max
      else
        echo "/sys/fs/cgroup/memory.max not available"
      fi
    - |
      echo "=== cgroup v1 (memory.limit_in_bytes) ==="
      if [ -f /sys/fs/cgroup/memory/memory.limit_in_bytes ]; then
        cat /sys/fs/cgroup/memory/memory.limit_in_bytes
      else
        echo "/sys/fs/cgroup/memory/memory.limit_in_bytes not available"
      fi
    - |
      echo "=== Derived CPU quota ==="
      if [ -f /sys/fs/cgroup/cpu.max ]; then
        quota=$(cut -d' ' -f1 /sys/fs/cgroup/cpu.max)
        period=$(cut -d' ' -f2 /sys/fs/cgroup/cpu.max)
        if [ "$quota" != "max" ]; then
          awk -v q="$quota" -v p="$period" 'BEGIN { printf "CPU quota: %.2f cores\n", q/p }'
        else
          echo "CPU quota: unlimited (max)"
        fi
      elif [ -f /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]; then
        quota=$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)
        period=$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)
        if [ "$quota" -gt 0 ]; then
          awk -v q="$quota" -v p="$period" 'BEGIN { printf "CPU quota: %.2f cores\n", q/p }'
        else
          echo "CPU quota: unlimited (-1)"
        fi
      else
        echo "No cgroup CPU quota files found"
      fi
