# Minimal pipeline: single job to smoke-test calling AI Gateway from CI runners.
#
# Jev (TypeSafe System One) smoke test: POST /v1/systemone with typed questions
# (noul / choice / score), see
# https://datadoghq.atlassian.net/wiki/spaces/AIP/pages/7265386822/AI+Gateway+Using+Jev+TypeSafe+System+One+models+on+AI+Gateway
#
# Notes:
# - Token for internal service authentication is generated with authanywhere
#   (https://datadoghq.atlassian.net/wiki/spaces/DEVX/pages/3733193227/Authanywhere),
#   audience `rapid-ai-platform`, like in https://github.com/DataDog/dd-source/pull/291048.
# - The gateway is reached at https://ai-gateway.us1.ddbuild.io: on EC2 CI runners
#   authanywhere requires `--dc us1.ddbuild.io` for its AWS-backed token getter.
# - `datadoginternal-experiments/openjev-vllm/Qwen3.6-35B-A3B` is only available in
#   us1.staging.dog (not the CI datacenter) and is being deprecated, so this job
#   defaults to `datadoginternal/openjev-medium`, which is served in us1.ddbuild.io.
# - Access to these models is gated by the `ai-gateway-allow-typesafe` feature flag
#   (targets provider, `source` header, org and user email): if the call returns 403
#   "TypeSafe access is not enabled for this caller", ask #ai-platform to allowlist
#   the source used below.

# E2E test selector job: uses Jev to decide which E2E tests of a suite
# should run on this PR (PR info + diff + team + test code).
# Override the suite with the JEV_SUITE variable, e.g. JEV_SUITE=installer.
jev_e2e_selector:
  stage: test
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux:v141311605-333887d1
  tags: ["arch:amd64", "specific:true"]
  # DDOCTOSTS_ID_TOKEN for dd-octo-sts, to get a read-only GitHub token
  # (same pattern as .dd_octo_sts / .setup_github_token_read on main)
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  variables:
    GIT_DEPTH: 0 # Full history: the selector uses git merge-base against the base branch
    GIT_STRATEGY: clone
    JEV_SUITE: "fleet"
    AI_GATEWAY_DC: "us1.ddbuild.io"
    AI_GATEWAY_MODEL: "datadoginternal/openjev-medium"
  script:
    - export GITHUB_TOKEN=$(dd-octo-sts token --scope DataDog/datadog-agent --policy self.gitlab.read)
    # Install authanywhere, see
    # https://datadoghq.atlassian.net/wiki/spaces/DEVX/pages/3733193227/Authanywhere
    - |
      if [ "$(uname -m)" = "x86_64" ]; then AAA="amd64"; else AAA="arm64"; fi
      curl -sSfL -o authanywhere "https://binaries.ddbuild.io/dd-source/authanywhere/LATEST/authanywhere-linux-${AAA}"
      chmod +x authanywhere
    # Let Jev decide which e2e tests of the suite should run on this PR.
    # The selector fails open (runs everything) if the AI Gateway is unreachable.
    - |
      python3 tools/jev/jev_e2e_selector.py \
        --suite "${JEV_SUITE}" \
        --base "${COMPARE_TO_BRANCH:-main}" \
        --model "${AI_GATEWAY_MODEL}" \
        --dc "${AI_GATEWAY_DC}" \
        --token-cmd "$(pwd)/authanywhere --audience rapid-ai-platform --raw --dc ${AI_GATEWAY_DC}"
  artifacts:
    when: always
    paths:
      - jev_e2e_decisions.json

ai_gateway_smoke_test:
  stage: test
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux:v141311605-333887d1
  tags: ["arch:amd64", "specific:true"]
  variables:
    AI_GATEWAY_DC: "us1.ddbuild.io"
    AI_GATEWAY_AUDIENCE: "rapid-ai-platform"
    # Models available in us1.ddbuild.io: typesafe/jev-latest (org 2 only),
    # datadoginternal/openjev-medium. The experiments model is staging-only.
    AI_GATEWAY_MODEL: "datadoginternal/openjev-medium"
  script:
    # Install authanywhere, see
    # https://datadoghq.atlassian.net/wiki/spaces/DEVX/pages/3733193227/Authanywhere
    - |
      if [ "$(uname -m)" = "x86_64" ]; then AAA="amd64"; else AAA="arm64"; fi
      curl -sSfL -o authanywhere "https://binaries.ddbuild.io/dd-source/authanywhere/LATEST/authanywhere-linux-${AAA}"
      chmod +x authanywhere
    # Generate the internal authentication token (do NOT print it)
    - |
      AI_GATEWAY_TOKEN="$(./authanywhere --audience "${AI_GATEWAY_AUDIENCE}" --raw --dc "${AI_GATEWAY_DC}")"
      echo "Acquired AI Gateway token (${#AI_GATEWAY_TOKEN} chars) for audience '${AI_GATEWAY_AUDIENCE}' in dc '${AI_GATEWAY_DC}'"
    # Call the AI Gateway System One (Jev) endpoint. Question types are
    # noul (yes/no-ish probability), choice (with criteria map) and
    # score (with ordinal criteria legend).
    - |
      cat > jev_payload.json <<EOF
      {
        "state": "The PR under review: title=Refactor auth token cache to async warmup; description=Changes the token cache from synchronous refresh to an async background warmup with a 5s TTL. Touches gateway middleware used by all internal services. CI passed but one integration test was skipped. Rolled out to staging and 3 services report intermittent 401s.",
        "model": "${AI_GATEWAY_MODEL}",
        "questions": {
          "should_revert": {"type": "noul", "instructions": "Should this PR be reverted?"},
          "failure_category": {"type": "choice",
                       "instructions": "Which failure mode best explains any revert risk?",
                       "criteria": {"correctness": "Breaks correctness or core behavior",
                                    "reliability": "Outages, errors, or flaky behavior in production",
                                    "performance": "Performance or resource regression",
                                    "process": "Skipped tests, bypassed review, or rollout hygiene",
                                    "none": "No revert-worthy issue"}},
          "revert_urgency": {"type": "score",
                    "instructions": "Rate the urgency of reverting.",
                    "criteria": ["Safe to keep and fix forward", "Revert soon unless quick fix lands", "Revert immediately"]}
        }
      }
      EOF
      HTTP_CODE=$(curl -sS -o jev_response.json -w "%{http_code}" \
        -X POST "https://ai-gateway.${AI_GATEWAY_DC}/v1/systemone" \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer ${AI_GATEWAY_TOKEN}" \
        -H "source: datadog-agent" \
        -H "org-id: 2" \
        --data @jev_payload.json)
      echo "--- AI Gateway response (HTTP ${HTTP_CODE}) ---"
      cat jev_response.json
      echo ""
      if [ "${HTTP_CODE}" != "200" ]; then
        echo "AI Gateway System One (Jev) call failed with HTTP ${HTTP_CODE}"
        exit 1
      fi
      echo "AI Gateway Jev smoke test succeeded"
