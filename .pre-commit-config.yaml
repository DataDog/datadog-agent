default_language_version:
  python: python3

default_install_hook_types:
  - pre-commit

default_stages:
  - pre-commit

repos:
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        entry: 'dda inv pre-commit.check-actionlint'
        args: []
        pass_filenames: false
        always_run: true
  - repo: local
    hooks:
      - id: protected-branches
        name: protected-branches
        entry: 'dda inv git.check-protected-branch'
        language: system
        pass_filenames: false
        always_run: true
      - id: go-fmt
        name: go-fmt
        entry: 'dda inv pre-commit.check-go-fmt'
        language: system
        pass_filenames: false
        always_run: true
      - id: shellcheck
        name: shellcheck
        entry: 'dda inv pre-commit.check-shellcheck'
        language: system
        pass_filenames: false
        always_run: true
      - id: copyright
        name: copyright
        entry: 'dda inv linter.copyrights --only-staged-files'
        language: system
        pass_filenames: false
        always_run: true
      - id: shell-check-no-set-x
        name: shell-check-no-set-x
        entry: 'dda inv pre-commit.check-set-x'
        language: system
        pass_filenames: false
        always_run: true
      - id: python-ruff
        name: python-ruff
        entry: 'dda inv linter.python --only-staged-files'
        language: system
        pass_filenames: false
        always_run: true
