default_language_version:
  python: python3
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

# pre-commit hides unstaged tracked changes during these read-only checks.
# Each entry uses the same managed Python environment and shared selectors.
repos:
  - repo: local
    hooks:
      - id: protected-branches
        name: protected-branches
        entry: python tasks/hooks.py protected-branches --hook --
        language: python
        # Match DDA's legacy-build Ruff pin in datadog-agent-dev/pyproject.toml.
        additional_dependencies: [PyYAML==6.0.3, ruff==0.3.5]
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: go-fmt
        name: go-fmt
        entry: python tasks/hooks.py go-fmt --hook --
        language: python
        # Match DDA's legacy-build Ruff pin in datadog-agent-dev/pyproject.toml.
        additional_dependencies: [PyYAML==6.0.3, ruff==0.3.5]
        always_run: true
        pass_filenames: true
        require_serial: true
      - id: shellcheck
        name: shellcheck
        entry: python tasks/hooks.py shellcheck --hook --
        language: python
        # Match DDA's legacy-build Ruff pin in datadog-agent-dev/pyproject.toml.
        additional_dependencies: [PyYAML==6.0.3, ruff==0.3.5]
        always_run: true
        pass_filenames: true
        require_serial: true
      - id: actionlint
        name: actionlint
        entry: python tasks/hooks.py actionlint --hook --
        language: python
        # Match DDA's legacy-build Ruff pin in datadog-agent-dev/pyproject.toml.
        additional_dependencies: [PyYAML==6.0.3, ruff==0.3.5]
        always_run: true
        pass_filenames: true
        require_serial: true
      - id: copyright
        name: copyright
        entry: python tasks/hooks.py copyright --hook --
        language: python
        # Match DDA's legacy-build Ruff pin in datadog-agent-dev/pyproject.toml.
        additional_dependencies: [PyYAML==6.0.3, ruff==0.3.5]
        always_run: true
        pass_filenames: true
        require_serial: true
      - id: shell-check-no-set-x
        name: shell-check-no-set-x
        entry: python tasks/hooks.py shell-check-no-set-x --hook --
        language: python
        # Match DDA's legacy-build Ruff pin in datadog-agent-dev/pyproject.toml.
        additional_dependencies: [PyYAML==6.0.3, ruff==0.3.5]
        always_run: true
        pass_filenames: true
        require_serial: true
      - id: python-ruff
        name: python-ruff
        entry: python tasks/hooks.py python-ruff --hook --
        language: python
        # Match DDA's legacy-build Ruff pin in datadog-agent-dev/pyproject.toml.
        additional_dependencies: [PyYAML==6.0.3, ruff==0.3.5]
        always_run: true
